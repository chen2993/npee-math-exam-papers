  stem:
    text: |-
      设连续函数 $y(x)$ 在 $(0,+\infty)$ 上的导数小于 $0$, 且 $y(0)=0,y(1)=e^{-1}-1$. 过曲线 $y=y(x)(x\geq0)$ 上任意一点 $P(x,y)$ 作 $y$ 轴的垂线与 $y$ 轴交于点 $A$, 曲线 $y=y(x)$ 与直线 $AP$ 以及 $y$ 轴所围成区域的面积 $S$ 等于点 $P(x,y)$ 处的切线在 $y$ 轴上的截距的相反数。
  subparts:
  - text: 求 $y(x)$ 的表达式；
  - text: 设曲线 $y=y(x)$ 与该曲线在点 $(1,y(1))$ 处的切线以及 $y$ 轴所围成的平面区域为 $D$, 求 $D$ 绕 $y$ 轴旋转一周所得旋转体的体积 $V$。
