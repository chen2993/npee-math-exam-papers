- number: 22
  section: solution
  points: 12
  stem:
    text: 某旅馆有一公共烘干机, 已知某日仅有甲、乙两客户入住, 他们会在晚 $7$ 点至晚 $11$ 点间到达该洗衣房使用烘干机, 到达时间相互独立, 且在这 $4$ 小时内各时刻到来的可能性都相等. 甲的使用时长为 $1$ 小时, 乙的使用时长为 $1.5$ 小时. 记甲的等待时长为 $Z$。
  subparts:
  - text: 求 $Z$ 的分布函数 $F_Z(z)$；
  - text: 求 $Z$ 的数学期望 $E(Z)$。
