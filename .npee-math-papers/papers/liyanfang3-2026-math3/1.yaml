    text: |-
      $f(\pi)+f'(\pi)>0,\ f(0)+f'(0)>0$
    figures: []
  - label: B
    text: |-
      $f(\pi)+f'(\pi)>0,\ f(0)+f'(0)<0$
    figures: []
  - label: C
    text: |-
      $f(\pi)+f'(\pi)<0,\ f(0)+f'(0)>0$
    figures: []
  - label: D
