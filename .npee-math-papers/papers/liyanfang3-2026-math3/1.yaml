    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设 $\sum_{n=1}^{\infty}a_n$ 为变号级数，令 $b_n=\begin{cases}a_n,&a_n\geqslant0,\\0,&a_n<0,\end{cases}\ c_n=\begin{cases}0,&a_n\geqslant0,\\-a_n,&a_n<0,\end{cases}$ 则下列命题中，正确的是：①若 $\sum_{n=1}^{\infty}a_n$ 绝对收敛，则 $\sum_{n=1}^{\infty}b_n$、$\sum_{n=1}^{\infty}c_n$ 都收敛。②若 $\sum_{n=1}^{\infty}a_n$ 条件收敛，则 $\sum_{n=1}^{\infty}b_n$、$\sum_{n=1}^{\infty}c_n$ 都发散。③若 $\sum_{n=1}^{\infty}a_n$ 绝对收敛，则 $\sum_{n=1}^{\infty}b_n$、$\sum_{n=1}^{\infty}c_n$ 必然一个收敛，一个发散。④若 $\sum_{n=1}^{\infty}a_n$ 条件收敛，则不能确定 $\sum_{n=1}^{\infty}b_n$、$\sum_{n=1}^{\infty}c_n$ 的敛散性。\ExamSelection
  choices:
  - label: A
    text: ①②
    figures: []
  - label: B
    text: ①④
    figures: []
  - label: C
    text: ②③
    figures: []
  - label: D
    text: ③④
    figures: []
