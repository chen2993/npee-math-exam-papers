    text: |-
      设函数 $f(x)$ 在 $[0,\pi]$ 上具有二阶连续导数，则下列条件中，是 $\int_0^\pi[f''(x)+f(x)]\sin x\,\mathrm{d}x>\int_0^\pi[f''(x)+f(x)]\cos x\,\mathrm{d}x$ 的充分条件的是\ExamSelection。
  choices:
