  stem:
    text: |-
      设随机变量 $X$ 的分布律为 $P\{X=k\}=\dfrac{1}{k(k+1)},\ k=1,2,\cdots$。随机变量 $Y$ 在 $X=k$ 的条件下的概率密度为 $f_{Y\mid X}(y\mid x)=\begin{cases}\dfrac{k+1}{(1+y)^{k+2}},&y>0,\\0,&\text{其他}\text{。}\end{cases}$
  subparts:
  - text: 求 $Y$ 的分布函数 $F_Y(y)$；
  - text: |-
      令 $Z=(X+1)\ln(Y+1)$，求随机变量 $Z$ 的概率密度 $f_Z(z)$ 以及数学期望 $E(Z)$。
