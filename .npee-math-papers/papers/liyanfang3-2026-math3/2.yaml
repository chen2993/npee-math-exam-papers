- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      记 $a_n=\displaystyle\sum_{k=1}^{\infty}\dfrac{1}{k^2(k+1)}+\displaystyle\sum_{k=2}^{\infty}\dfrac{1}{k^2(k+1)}+\cdots+\displaystyle\sum_{k=n}^{\infty}\dfrac{1}{k^2(k+1)}$。
  subparts:
  - text: |-
      已知 $\displaystyle\sum_{n=1}^{\infty}\dfrac1{n^2}=\dfrac{\pi^2}{6}$，求 $a_2$；
  - text: |-
      证明 $\displaystyle a_n=n\sum_{k=n+1}^{\infty}\dfrac1{k^2}$，并求 $\displaystyle\lim_{n\to\infty}a_n$。
