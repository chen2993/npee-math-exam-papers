questions:
- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)$ 在 $\mathbb{R}$ 上处处有定义，且 $f(0)=0$，则下列命题中，错误的是\ExamSelection。
  choices:
  - label: A
    text: |-
      当 $x\to 0$ 时，若 $f(x)\sim\sin^2x$，则 $f'(0)$ 存在。
    figures: []
  - label: B
    text: |-
      若 $0\leq f(x)\leq\sin^2x$ 恒成立，则 $f'(0)$ 存在。
    figures: []
  - label: C
    text: |-
      若在 $[0,+\infty)$ 上 $g(x)\leq f(x)\leq h(x)$，在 $(-\infty,0)$ 上 $h(x)\leq f(x)\leq g(x)$，且当 $x\to 0$ 时，函数 $g(x)$ 和 $h(x)$ 都是 $x$ 的同阶无穷小，则 $f(x)$ 也是 $x$ 的同阶无穷小。
    figures: []
  - label: D
    text: |-
      当 $x\to 0$ 时，若 $f'(0)$ 存在且不为 $0$，则 $f(x)$ 是 $x$ 的同阶无穷小。
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)$ 可导，且 $f'(x)>0$，$g(x)=\int_0^x f(t)\,\mathrm{d}t$。若 $g(1)=1$，$g(3)=7$，则 $g(2)$ 的值可能为\ExamSelection。
  choices:
  - label: A
    text: $2$
    figures: []
  - label: B
    text: $3$
    figures: []
  - label: C
    text: $4$
    figures: []
  - label: D
    text: $5$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)=\begin{cases}-x^3\ln x,&x>0,\\0,&x=0,\\\arctan\left(x+\dfrac{1}{x}\right)+\dfrac{\pi}{2},&x<0,\end{cases}$ 则\ExamSelection。
  choices:
  - label: A
    text: $f(x)$ 有两个极大值点，无极小值点。
    figures: []
  - label: B
    text: $f(x)$ 有一个极大值点，一个极小值点。
    figures: []
  - label: C
    text: $f(x)$ 有两个极大值点，一个极小值点。
    figures: []
  - label: D
    text: $f(x)$ 有一个极大值点，两个极小值点。
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)$ 连续，满足 $\int_0^1 f(x)\,\mathrm{d}x=0$。若 $\int_0^1 e^{1-x}f(xe^{1-x})\,\mathrm{d}x=1$，则 $\int_0^1 xe^{1-x}f(xe^{1-x})\,\mathrm{d}x=$\ExamSelection。
