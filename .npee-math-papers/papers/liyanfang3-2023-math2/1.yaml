- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      若二元函数 $f(x,y)$ 存在二阶连续偏导数，且满足 $f(x,y)=-f(y,x)$，则下列结论中，错误的是\ExamSelection。
  choices:
  - label: A
    text: $f''_{11}(x,y)=f''_{22}(x,y)$。
    figures: []
  - label: B
    text: $f''_{11}(x,y)=-f''_{22}(y,x)$。
    figures: []
  - label: C
    text: $f''_{12}(x,y)=f''_{21}(x,y)$。
    figures: []
  - label: D
    text: $f''_{12}(x,y)=-f''_{11}(y,x)$。
    figures: []
