- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      设函数 $f(x)$ 二阶可导，且 $f(0)=f'(0)=0$，$f''(0)=2$。对每个正数 $r$，令平面区域 $D_r=\{(x,y)\mid x^2+y^2\leq r^2\}$，并选取一点 $(\xi,\eta)\in D_r$，使得 $\iint_{D_r}f(x^2+y^2)\,\mathrm{d}x\mathrm{d}y=\pi r^2f(\xi^2+\eta^2)$。求 $\lim_{r\to0^+}\dfrac{\xi^2+\eta^2}{r^2}$。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      计算 $\int_0^\pi\dfrac{x}{2+\sin x}\,\mathrm{d}x$。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 为 $[0,\pi]$ 上的连续正值函数，$F(x)$ 为 $[0,\pi]$ 上的连续函数，且对 $x\in(0,\pi)$，$F(x)=\dfrac{\int_0^x(1-\cos t)f(t)\,\mathrm{d}t}{\int_0^x t^2f(t)\,\mathrm{d}t}$。求 $F(x)$ 在 $[0,\pi]$ 上的最大值。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 一阶可导，满足 $f(x)+f(\pi-x)=f'(x)+f'(\pi-x)$，$2f'(x)+3f(x)=5f(\pi-x)$。若 $f(0)=1$，求 $f(x)$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设周期函数 $f(x)=(-1)^{[x]}\left|x-\left[x+\dfrac{1}{2}\right]\right|$，其中 $[x]$，$\left[x+\dfrac{1}{2}\right]$ 分别表示不超过 $x$，$x+\dfrac{1}{2}$ 的最大整数，记 $a_n=\int_0^1\dfrac{f(nx)}{x}\,\mathrm{d}x$。证明：
  subparts:
  - text: |-
      数列 $\{a_{2n-1}\}$ 单调减少，$\{a_{2n}\}$ 单调增加；
  - text: |-
      $\lim_{n\to\infty}a_n$ 存在。
- number: 22
  section: solution
  points: 12
  stem:
    text: 已知二次型 $f(x_1,x_2,x_3)=cx_1^2-(b^2+1)x_2^2+cx_3^2+2x_1x_3$ 可通过可逆线性变换化为 $g(y_1,y_2,y_3)=(2c^2-1)y_1^2+(c^2+1)y_2^2+(c^2-2)y_3^2+2(c^2+1)y_1y_2-2(c^2-2)y_1y_3$。求可逆线性变换 $y=Px$，将二次型 $g(y_1,y_2,y_3)$ 化为规范形。
