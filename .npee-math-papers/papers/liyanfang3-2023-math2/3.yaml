    text: |-
      设函数 $f(x)$ 连续，$F(x)$ 为 $f(x)$ 的原函数，则下列命题中，错误的是\ExamSelection。
  choices:
  - label: A
    text: |-
      当 $x\to 0$ 时，若 $f(x)=o(1)$，则 $F(x)=o(x)$
    figures: []
  - label: B
    text: |-
      当 $x\to 0$ 时，若 $F(x)=o(x)$，则 $f(x)=o(1)$
    figures: []
  - label: C
    text: |-
      当 $x\to 0$ 时，若 $f(x)=o(1)$，则 $\int_0^x f(t)\,\mathrm{d}t=o(x)$
    figures: []
  - label: D
    text: |-
      当 $x\to 0$ 时，若 $\int_0^x f(t)\,\mathrm{d}t=o(x)$，则 $f(x)=o(1)$
    figures: []
