      设矩阵 $A=\begin{pmatrix}1&-1&4\\2&3&-1\\-1&1&0\end{pmatrix}$，$B$ 为 $3$ 阶正交矩阵。若存在上三角矩阵 $P$，使得 $B=AP$，则 $P$ 的对角线上各元素乘积的绝对值为\ExamBlank。
- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      设函数 $f(x)$ 满足 $f(0)=f'(0)=0$，且 $\lim_{x\to 0}\dfrac{a\sin x-\dfrac{x}{1+bx^2}}{f(x)}=1$，$\lim_{x\to 0}\dfrac{ax-\dfrac{\sin x}{1+bx^2}}{f(x)}=2$。求 $a,b$ 的值。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设曲线 $C$ 是以点 $(1,0)$ 为圆心、$1$ 为半径的上半圆周。直线 $y=ax(a>0)$，$x=2$ 与曲线 $C$ 所围成的平面图形记为 $D_1$，直线 $y=ax(a>0)$ 与曲线 $C$ 所围成的平面图形记为 $D_2$，记 $D=D_1\cup D_2$，问：$a$ 为何值时，区域 $D$ 的面积取得最小值？
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设直线 $x+\dfrac{y}{2}=1$ 与坐标轴围成的区域为 $D_1$，$\dfrac{x}{2}+y=1$ 与坐标轴围成的区域为 $D_2$，$D=D_1\cup D_2$。计算 $I=\iint_D e^{\left[-\dfrac{1}{2}|x-y|+\dfrac{3}{2}(x+y)\right]^2}(\sec^2x-\tan^2y)\,\mathrm{d}x\mathrm{d}y$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 在 $[0,e]$ 上连续，在 $(0,e)$ 上可导，且 $f(0)=0$。证明：存在 $\xi,\eta\in(0,e)$，使得 $\xi f(\xi)+(\xi^2-\xi)f'(\xi)=(e^2-e)f'(\eta)$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 在 $[0,+\infty)$ 上连续，且反常积分 $\int_0^{+\infty}f(x)\,\mathrm{d}x$ 收敛。证明：
  subparts:
  - text: |-
      反常积分 $\int_0^{+\infty}e^{-x}f(x)\,\mathrm{d}x$ 收敛；
  - text: |-
      存在 $\xi\in(0,+\infty)$，使得 $\int_0^\xi f(x)\,\mathrm{d}x=\int_0^{+\infty}e^{-x}f(x)\,\mathrm{d}x$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设矩阵 $A=\begin{pmatrix}1&1\\1&0\\0&-1\end{pmatrix}$。
  subparts:
  - text: 求所有满足 $BA=E$ 的矩阵 $B$，并求 $AB$ 的特征值；
  - text: |-
      在满足 $BA=E$ 的基础上，找到一个矩阵 $B$，使得 $AB$ 有一个特征向量为 $\beta=(1,2,3)^{\mathrm{T}}$。
