- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x,y)$ 连续，$a>0$，则 $\int_{-\dfrac{a}{\sqrt{2}}}^{\dfrac{a}{\sqrt{2}}}\mathrm{d}x\int_{|x|}^{\sqrt{a^2-x^2}}f(x,y)\,\mathrm{d}y=$\ExamSelection。
  choices:
  - label: A
    text: |-
      $2\int_0^{\dfrac{a}{\sqrt{2}}}\mathrm{d}x\int_x^{\sqrt{a^2-x^2}}f(x,y)\,\mathrm{d}y$
    figures: []
  - label: B
    text: |-
      $\int_0^{\dfrac{a}{\sqrt{2}}}\mathrm{d}x\int_{-x}^{\sqrt{a^2-x^2}}f(x,y)\,\mathrm{d}y+\int_0^{\dfrac{a}{\sqrt{2}}}\mathrm{d}x\int_x^{\sqrt{a^2-x^2}}f(x,y)\,\mathrm{d}y$
    figures: []
  - label: C
    text: |-
      $2\int_0^{\dfrac{a}{\sqrt{2}}}\mathrm{d}y\int_0^y f(x,y)\,\mathrm{d}x+2\int_{\dfrac{a}{\sqrt{2}}}^a\mathrm{d}y\int_0^{\sqrt{a^2-y^2}}f(x,y)\,\mathrm{d}x$
    figures: []
  - label: D
    text: |-
      $\int_0^{\dfrac{a}{\sqrt{2}}}\mathrm{d}y\int_{-y}^y f(x,y)\,\mathrm{d}x+\int_{\dfrac{a}{\sqrt{2}}}^a\mathrm{d}y\int_{-\sqrt{a^2-y^2}}^{\sqrt{a^2-y^2}}f(x,y)\,\mathrm{d}x$
    figures: []
