- number: 8
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 为 $n(n\geq 3)$ 阶非零矩阵，则下列命题中，正确命题的个数是\ExamSelection。① 当 $r((A^*)^*)=r(A^*)$ 时，$r(A,A^*)\ne n-1$。② 当 $r((A^*)^*)=r(A^*)$ 时，$r(A-A^*)\ne n-1$。③ 当 $r((A^*)^*)<r(A^*)$ 时，$r(A,A^*)=n$。④ 当 $r((A^*)^*)<r(A^*)$ 时，$r(A-A^*)=n$。
  choices:
  - label: A
    text: $0$
    figures: []
  - label: B
    text: $1$
    figures: []
  - label: C
    text: $2$
    figures: []
  - label: D
    text: $3$
    figures: []
- number: 9
