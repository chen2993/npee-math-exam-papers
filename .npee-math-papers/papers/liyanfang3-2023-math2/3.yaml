    text: |-
      设 $\{f_n(x)\}$ 为一列连续函数，且 $f_n(x)>e^{nx}$。对每个正整数 $n$，令 $F_n(x)=\int_0^x f_n(t)\,\mathrm{d}t$，$G_n(x)$ 为 $F_n(x)$ 的反函数。定义正数数列 $a_n=G_n\left(\dfrac{e-1}{n}\right)$，则 $\lim_{n\to\infty}a_n=$\ExamBlank。
