  stem:
    text: |-
      已知质点以恒定速率沿曲线运动时，向心加速度大小为 $\dfrac{v^2}{\rho}$，其中 $v$ 为质点的运动速率，$\rho$ 为曲率半径。设单位质点以恒定的速率 $v_0$ 沿着一个形状满足 $y=x^2$ 的光滑轨道移动，则其在点 $(0,0)$ 处受到的向心力大小为\ExamBlank。
- number: 13
  section: fill
