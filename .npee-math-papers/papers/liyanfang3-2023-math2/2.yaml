      设函数 $g(x)$ 连续，满足对任意实数 $x_1,x_2$，都有 $g(x_1+x_2)=g(x_1)g(x_2),g(1)=a$，$n$ 为正整数。证明：(I) $\int_n^{x+n}g(t)\,\mathrm{d}t=a^n\int_0^xg(t)\,\mathrm{d}t$；(II) 若 $|a|<1$，则对任意 $x\in(0,1)$，$\lim_{n\to+\infty}\int_x^{x+n}g(t)(t-[t])\,\mathrm{d}t$ 都存在，其中 $[t]$ 表示不超过 $t$ 的最大整数。
