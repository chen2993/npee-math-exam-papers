  - text: |-
      求 $\rho(x,y,z)$；
  - text: |-
      求 $A$ 的质心坐标 $(\bar{x},\bar{y},\bar{z})$。
- number: 19
  section: solution
  points: 12
  stem:
    text: 设二元函数 $f(x,y)$ 具有一阶连续偏导数，且满足 $f(0,0)=0,f'_1(0,0)=1$ 以及对于任意 $x$，都有 $f'_2(x,y)>0$。
  subparts:
  - text: |-
      设 $\varphi(x)$ 的导函数连续，当 $x>0$ 时，$\varphi(x)>0$，且满足 $\displaystyle\lim_{x\to0}\dfrac{\varphi(x)}{x}=0$，证明：对所有的 $0\leqslant\xi\leqslant\varphi(x)$，都有 $\displaystyle\lim_{x\to0^+}\dfrac{f(x,\xi)}{x}=1$。
  - text: |-
      设 $n>1$，若当 $x\to0^+$ 时，$\displaystyle\int_0^{x^n}\mathrm{d}u\int_x^{u^{1/n}}f(t,u)\,\mathrm{d}t$ 与 $1-\cos x^2$ 是同阶无穷小，求 $n$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $\{a_n\}$ 为单调增加的无界正项数列，$f(x)$ 为 $[a_1,+\infty)$ 上的单调增加正值函数，且 $\displaystyle\int_{a_1}^{+\infty}\dfrac{\mathrm{d}x}{xf(x)}<+\infty$。证明：
  subparts:
  - text: |-
      级数 $\displaystyle\sum_{n=1}^{\infty}\dfrac{a_{n+1}-a_n}{a_{n+1}f(a_{n+1})}$ 收敛；
  - text: |-
      若 $a_1=1$，则级数 $\displaystyle\sum_{n=1}^{\infty}\dfrac{\sqrt{a_n}(a_{n+1}-a_n)}{a_{n+1}(1+a_n)}$ 收敛，且其值小于 $\dfrac{\pi+1}{2}$。
- number: 21
  section: solution
