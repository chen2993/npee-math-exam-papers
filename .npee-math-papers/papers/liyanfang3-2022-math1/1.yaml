  stem:
    text: |-
      设某半球体型物体 $A$ 占据空间区域 $\Omega:0\leqslant z\leqslant\sqrt{1-x^2-y^2}$。密度函数 $\rho(x,y,z)$ 满足 $\rho(x,y,z)=4z+\dfrac{2}{\pi}\sqrt{x^2+y^2}\iiint_{\Omega}\rho(x,y,z)\,\mathrm{d}v$。
