questions:
- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      设 $\alpha_1=\sqrt{1+\tan x}-\sqrt{1+\sin x},\alpha_2=\int_0^{x^4}\dfrac{1}{\sqrt{1-t^2}}\,\mathrm{d}t,\alpha_3=\int_0^x\mathrm{d}u\int_0^{u^2}\arctan t\,\mathrm{d}t$。当 $x\to0$ 时，以上 3 个无穷小量按照从低阶到高阶的排序是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\alpha_1,\alpha_2,\alpha_3$
    figures: []
  - label: B
    text: |-
      $\alpha_1,\alpha_3,\alpha_2$
    figures: []
  - label: C
    text: |-
      $\alpha_2,\alpha_1,\alpha_3$
    figures: []
  - label: D
    text: |-
      $\alpha_3,\alpha_1,\alpha_2$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      曲线 $y=x\ln\dfrac{x}{x-1}+\ln[x(x-1)]$ 的渐近线的条数为\ExamSelection。
  choices:
  - label: A
    text: $0$
    figures: []
  - label: B
    text: $1$
    figures: []
  - label: C
    text: $2$
    figures: []
  - label: D
    text: $3$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      若 $\dfrac{\sin\xi}{\xi},\dfrac{\sin\eta}{\eta}$ 分别为 $\dfrac{\sin x}{x}$ 在 $(0,1)$ 和 $(0,a)$（$0<a<1$）上的平均值，其中 $\xi\in(0,1),\eta\in(0,a)$，则 $\xi$ 与 $\eta$ 的大小关系为\ExamSelection。
  choices:
  - label: A
    text: |-
      $\xi<\eta$
    figures: []
  - label: B
    text: |-
      $\xi=\eta$
    figures: []
  - label: C
    text: |-
      $\xi>\eta$
    figures: []
  - label: D
    text: 从已知条件无法确定
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x,y)$ 在点 $(x_0,y_0)$ 处连续，则下列命题中，正确的是\ExamSelection。
  choices:
  - label: A
    text: 若 $f(x,y)$ 在点 $(x_0,y_0)$ 处沿 $(1,0)$ 与沿 $(-1,0)$ 的方向导数均存在，则偏导数 $f'_x(x_0,y_0)$ 存在
    figures: []
  - label: B
    text: 若偏导数 $f'_x(x_0,y_0)$ 存在，则 $f(x,y)$ 在点 $(x_0,y_0)$ 处沿 $(-1,0)$ 的方向导数等于 $-f'_x(x_0,y_0)$
    figures: []
  - label: C
    text: 若偏导数 $f'_x(x_0,y_0),f'_y(x_0,y_0)$ 均存在，则 $f(x,y)$ 在点 $(x_0,y_0)$ 处沿任意方向的方向导数均存在
    figures: []
  - label: D
    text: 若 $f(x,y)$ 在点 $(x_0,y_0)$ 处沿任意方向的方向导数均存在，则 $f(x,y)$ 在点 $(x_0,y_0)$ 处的偏导数均存在
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 为 $n\times m$ 矩阵，且 $m\ne n$。若 $AA^{\mathrm{T}}=E_n$，则\ExamSelection。
  choices:
  - label: A
    text: $Ax=0$ 只有零解
    figures: []
  - label: B
    text: $Ax=b$ 必有解
    figures: []
  - label: C
    text: |-
      $A^{\mathrm{T}}x=b$ 必有解
    figures: []
  - label: D
    text: |-
      若 $m$ 维列向量组 $\beta_1,\beta_2,\cdots,\beta_s$ 线性无关，则 $A\beta_1,A\beta_2,\cdots,A\beta_s$ 必线性无关
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $n$ 阶矩阵 $A=E-k\alpha\alpha^{\mathrm{T}}$，其中 $k\ne0,\alpha\ne0$。若 $A^2=E$，则下列命题中，错误的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $n-\operatorname{tr}(A)$ 为偶数
    figures: []
  - label: B
    text: $|A|=-1$
    figures: []
  - label: C
    text: $A$ 可相似对角化
    figures: []
  - label: D
    text: $A$ 有 $n-1$ 个线性无关的属于特征值 $-1$ 的特征向量
    figures: []
- number: 7
  section: choice
  points: 5
  stem:
    text: |-
      设二次型 $f(x,y,z)=(x-y)^2+(y-z)^2+(z-x)^2$，其对应的对称矩阵为 $A$。在自然基 $e_1,e_2,e_3$ 下，二次曲面 $S$ 的曲面方程为 $f(x,y,z)=3$。该曲面方程在正交变换 $\begin{pmatrix}x\\y\\z\end{pmatrix}=Q\begin{pmatrix}u\\v\\w\end{pmatrix}$ 下化为 $\lambda_1u^2+\lambda_2v^2+\lambda_3w^2=3$，其中 $\lambda_1\geqslant\lambda_2\geqslant\lambda_3$。该变换将 $e_1,e_2,e_3$ 分别变为 $\alpha_1,\alpha_2,\alpha_3$。下列命题中，正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $(e_1,e_2,e_3)=(\alpha_1,\alpha_2,\alpha_3)Q$
    figures: []
  - label: B
    text: |-
      $S$ 为柱面，在原坐标系下，$S$ 的母线的单位方向向量坐标为 $\dfrac{1}{\sqrt{2}}(-1,1,0)^{\mathrm{T}}$
    figures: []
  - label: C
    text: |-
      $S$ 为柱面，在原坐标系下，$S$ 的母线的单位方向向量坐标为 $\dfrac{1}{\sqrt{2}}(-1,0,1)^{\mathrm{T}}$
    figures: []
  - label: D
    text: |-
      $S$ 为柱面，在原坐标系下，$S$ 的母线的单位方向向量坐标为 $\dfrac{1}{\sqrt{3}}(1,1,1)^{\mathrm{T}}$
    figures: []
