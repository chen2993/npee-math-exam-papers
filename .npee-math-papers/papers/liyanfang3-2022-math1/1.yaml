- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设总体 $X$ 服从均匀分布 $U(\theta,a)$，$a$ 为已知参数。$X_1,X_2,\cdots,X_n$ 为来自总体 $X$ 的一个简单随机样本。
  subparts:
  - text: |-
      求 $\theta$ 的矩估计量 $\hat{\theta}_1$ 与最大似然估计量 $\hat{\theta}_2$；
  - text: |-
      判断 $\hat{\theta}_1$ 与 $\hat{\theta}_2$ 的无偏性。
