- number: 9
  section: choice
  points: 5
  stem:
    text: |-
      设随机变量 $X,Y$ 独立同分布，$P\{X=0\}=p,P\{X=1\}=1-p=q,0<p<1$。令 $Z=\begin{cases}1,&X+Y\text{ 为偶数},\\0,&X+Y\text{ 为奇数}\text{。}\end{cases}$ 记 $p_0=P\{Z=0\},p_1=P\{Z=1\}$，则下列命题中，正确的是\ExamSelection。
  choices:
  - label: A
    text: 若 $X,Z$ 不独立，则 $p_0<p_1$
    figures: []
  - label: B
    text: 若 $X,Z$ 不独立，则 $p_0=p_1$
    figures: []
  - label: C
    text: 若 $X,Z$ 不独立，则 $p_0>p_1$
    figures: []
  - label: D
    text: $X,Z$ 是否独立与 $p_0,p_1$ 的大小关系无关
    figures: []
