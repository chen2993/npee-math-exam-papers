  stem:
    text: |-
      设旋转曲面 $\Sigma$ 由 $zOx$ 面上的曲线 $kx^2+z^2=4$ 绕 $z$ 轴旋转一周所得。已知点 $\left(\dfrac{1}{2},\dfrac{1}{2},c\right)$（$c>0$）位于曲面 $\Sigma$ 上，且该点处的切平面方程为 $2x+2y+cz=4$。
  subparts:
  - text: 求 $c$ 以及旋转曲面的方程。
  - text: |-
      设 $f(x,y,z)=xy+yz$，求 $f(x,y,z)$ 在曲面 $\Sigma$ 上的方向导数的最大值。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设 $\Sigma$ 为球心在原点的单位球面，$\Omega$ 为 $\Sigma$ 所围成的空间区域。函数 $f(x,y,z)$ 在 $\Omega$ 上具有 2 阶连续偏导数，且 $\dfrac{\partial^2f}{\partial x^2}+\dfrac{\partial^2f}{\partial y^2}+\dfrac{\partial^2f}{\partial z^2}=\varphi\left(\sqrt{x^2+y^2+z^2}\right)$，其中 $\varphi(r)$ 满足微分方程 $r\varphi''-2\varphi'+r\varphi=0$。已知 $\varphi(1)=e,\varphi'(1)=2e$。
  subparts:
  - text: |-
      求 $\varphi(r)$。
  - text: |-
      求 $\iint_{\Sigma}\left(x\dfrac{\partial f}{\partial x}+y\dfrac{\partial f}{\partial y}+z\dfrac{\partial f}{\partial z}\right)\,\mathrm{d}S$。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 在 $[a,b]$ 上连续，$g(x)$ 在 $[a,b]$ 上有连续导数，且 $g'(x)\ne0$。若 $\int_a^bf(x)\,\mathrm{d}x=0\text{，}\int_a^bf(x)g(x)\,\mathrm{d}x=0$，证明：至少存在两个不同的点 $\xi_1,\xi_2\in(a,b)$，使得 $f(\xi_1)=f(\xi_2)=0$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 为 $[0,1]$ 上单调减小的连续函数，且 $\int_0^1f(x)\,\mathrm{d}x=1$。记 $[x]$ 为不超过 $x$ 的最大整数。
  subparts:
  - text: |-
      设 $k$ 为整数，求 $\int_{k-1}^{k}(x-[x])\,\mathrm{d}x$。
  - text: |-
      求 $\lim_{n\to\infty}\int_0^1(nx-[nx])f(x)\,\mathrm{d}x$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      记 $n$ 元二次型 $f(x_1,x_2,\cdots,x_n)=\sum_{i=1}^{n}(x_i-\overline x)^2$，$\overline x=\dfrac{x_1+x_2+\cdots+x_n}{n}$，其对应的矩阵为 $A$。
  subparts:
  - text: 求 $r(A)$。
  - text: |-
      当 $n=3$ 时，找到一个可逆线性变换，将 $f(x_1,x_2,x_3)$ 化为标准形 $2y_1^2+\dfrac{3}{2}y_2^2$。
  - text: $f(x_1,x_2,x_3)$ 为第（Ⅱ）问中的 3 元二次型，说明 $f(x)=0$ 的解构成 3 维向量空间的一个子空间，并指出其维数。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $\xi,\eta$ 均服从 $N(0,\sigma^2)$，且 $\xi,\eta$ 相互独立，其中 $\sigma^2$ 为未知参数。令随机变量 $Z=\sqrt{\xi^2+\eta^2}$。
  subparts:
  - text: 计算 $E(Z),D(Z)$。
  - text: |-
      设 $Z_1,Z_2,\cdots,Z_n$ 为来自总体 $Z$ 的一个简单随机样本，求 $\sigma^2$ 的最大似然估计量，并检验该估计是否为无偏估计。
