- number: 17
  section: solution
  points: 10
  stem:
    text: 设 $f(x)$ 具有一阶连续导数，且 $f(0)=1,f(1)=a$。
  subparts:
  - text: |-
      求使得 $1+\dfrac{a}{\sqrt 2}-\int_0^1\sqrt{1+[f'(x)]^2}\,\mathrm{d}x$ 取得最大值的 $f(x)$ 的表达式。
  - text: |-
      将 $1+\dfrac{a}{\sqrt 2}-\int_0^1\sqrt{1+[f'(x)]^2}\,\mathrm{d}x$ 取得的最大值记为 $g(a)$，当 $a$ 为何值时，$g(a)$ 取得最大值？并求出该最大值。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      \mbox{}
  subparts:
  - text: |-
      证明：当 $x>0$ 时，$\dfrac{x}{1+x}<\ln(1+x)<x$。
  - text: |-
      设 $x_n=\left(1+\dfrac{n^2-n+1}{n^3}\right)\left(1+\dfrac{n^2-n+3}{n^3}\right)\cdots\left(1+\dfrac{n^2+n-1}{n^3}\right)$，求 $\lim_{n\to\infty}x_n$。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 $u(x,y)=\arctan\dfrac{x}{y}$，$D$ 为由 $x^2+y^2=1,x^2+y^2=4,y=x,y=-x$ 所围成区域在上半平面中的部分，$L$ 为其正向边界。
  subparts:
  - text: |-
      当 $y eq 0$ 时，计算 $\dfrac{\partial^2u}{\partial x^2}+\dfrac{\partial^2u}{\partial y^2}$；
  - text: |-
      求 $\oint_Lu(x,y)\dfrac{\partial u}{\partial n}\,\mathrm{d}s$，其中 $n$ 为 $L$ 的外法线方向。
- number: 20
  section: solution
  points: 12
  stem:
    text: 设 $u_n(x)=(x^2-1)^n$，记 $p_n(x)$ 为 $u_n(x)$ 的 $n$ 阶导数。
  subparts:
  - text: 证明 $p_n(x)$ 为 $(1-x^2)y''-2xy'+n(n+1)y=0$ 的一个解；
  - text: |-
      计算 $\sum_{k=1}^{\infty}\dfrac{p_{2k}(0)}{p''_{2k}(0)}$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $3$ 阶矩阵 $A$ 有 $3$ 个不同的特征值 $0,1,2$，$\alpha_1,\alpha_2,\alpha_3$ 分别为 $0,1,2$ 对应的一个特征向量。记 $\beta=\alpha_1+\alpha_2+\alpha_3$。
  subparts:
  - text: |-
      证明 $\beta,A\beta,A^2\beta$ 线性无关；
  - text: |-
      确定 $a,b,c$，使得矩阵 $B=\begin{pmatrix}0&0&a\\1&0&b\\0&1&c\end{pmatrix}$ 与矩阵 $A$ 相似，并求可逆矩阵 $P$，使得 $P^{-1}AP=B$，并将结果用 $A,\beta$ 表示；
  - text: 求 $B^{2022}$ 的各列元素之和。
- number: 22
  section: solution
  points: 12
  stem:
    text: 设随机变量 $X$ 服从 $(1,2)$ 上的均匀分布。在 $X=x$ 的条件下，随机变量 $Y$ 的条件分布是参数为 $x$ 的指数分布。
  subparts:
  - text: 求 $(X,Y)$ 的联合概率密度；
  - text: 求 $XY$ 的概率密度；
  - text: |-
      求 $\mathrm{Cov}(X,Y)$。
