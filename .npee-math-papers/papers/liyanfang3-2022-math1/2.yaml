- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)=\lim_{n\to\infty}\arctan\dfrac{1}{1+\sin^n x}$，则下列关于 $f(x)$ 的命题中，正确命题为\ExamSelection。 \n① $f(x)$ 是周期为 $2\pi$ 的奇函数。 \n② $f(x)$ 既有无穷多个可去间断点，又有无穷多个跳跃间断点。 \n③ $f(x)$ 的最小值小于 $\dfrac{\pi}{6}$。 \n④ $f(x)$ 的傅里叶级数收敛到一个常函数。
  choices:
  - label: A
    text: ①②
    figures: []
  - label: B
    text: ③④
    figures: []
  - label: C
    text: ①③④
    figures: []
  - label: D
    text: ②③④
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      关于反常积分 $\int_1^{+\infty}\dfrac{\mathrm{d}x}{(\ln x)^m(1+x^n)}$（$m>0,n>0$），下列命题中，正确的是\ExamSelection。
  choices:
  - label: A
    text: 若该积分发散，则必有 $0<m<1,0<n<1$。
    figures: []
  - label: B
    text: 若该积分收敛，则必有 $0<m<1,n>1$。
    figures: []
  - label: C
    text: |-
      若该积分发散，则必有 $m\geq 1,0<n<1$。
    figures: []
  - label: D
    text: |-
      若该积分收敛，则必有 $m\geq 1,n>1$。
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x,y)=|x-y|^\alpha g(x,y)$（$\alpha>0$），其中 $g(x,y)$ 在原点的某邻域内连续，则下列命题中，错误的是\ExamSelection。
  choices:
  - label: A
    text: $f(x,y)$ 在原点处连续。
    figures: []
  - label: B
    text: |-
      若 $\alpha>1$，则 $f'_x(0,0),f'_y(0,0)$ 存在。
    figures: []
  - label: C
    text: |-
      若 $\alpha>1$，则 $f(x,y)$ 在原点处可微。
    figures: []
  - label: D
    text: 若 $g(0,0)>0$，则 $f(x,y)$ 在原点处取得极小值。
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      下列命题中，正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      若正项级数 $\sum_{n=1}^{\infty}a_n$ 收敛，则 $\lim_{n\to\infty}na_n=0$。
    figures: []
  - label: B
    text: |-
      若正项级数 $\sum_{n=1}^{\infty}a_n$ 收敛，则 $\lim_{n\to\infty}n^2a_n=0$。
    figures: []
  - label: C
    text: |-
      若正项级数 $\sum_{n=1}^{\infty}a_n$ 收敛，则 $\sum_{n=1}^{\infty}\dfrac{\sqrt{a_n}}{n}$ 必收敛。
    figures: []
  - label: D
    text: |-
      若正项级数 $\sum_{n=1}^{\infty}a_n$ 收敛，则 $\sum_{n=1}^{\infty}\sqrt{\dfrac{a_n}{n}}$ 必收敛。
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      若向量组 $\alpha_1,\alpha_2,\cdots,\alpha_n$ 线性相关，其秩为 $r$，且 $\alpha_1 eq 0$，则\ExamSelection。
  choices:
  - label: A
    text: |-
      $\alpha_1$ 必能由其他向量线性表示
    figures: []
  - label: B
    text: |-
      $\alpha_1,\alpha_2,\cdots,\alpha_n$ 的极大无关组必包含 $\alpha_1$
    figures: []
  - label: C
    text: |-
      必存在 $2\leq k\leq n$，使得 $\alpha_k$ 能由 $\alpha_1,\alpha_2,\cdots,\alpha_{k-1}$ 线性表示
    figures: []
  - label: D
    text: |-
      必存在可逆矩阵 $P$，使得 $P(\alpha_1,\alpha_2,\cdots,\alpha_n)=(\beta_1,\beta_2,\cdots,\beta_n)$，且 $\beta_1,\beta_2,\cdots,\beta_r$ 恰为 $\beta_1,\beta_2,\cdots,\beta_n$ 的一个极大无关组
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $n$ 阶实矩阵 $A=(a_{ij})$ 满足 $a_{ij}+a_{ji}=0$，则下列命题中，正确命题的个数为\ExamSelection。 \n① $A$ 为可逆矩阵。 \n② $E+A$ 为可逆矩阵。 \n③ 对于任意的非零向量 $x$，均有 $x^{\mathrm T}Ax=0$。 \n④ 若 $A eq 0$，则 $A$ 不可能合同于一个非零对角矩阵。
  choices:
  - label: A
    text: $0$
    figures: []
  - label: B
    text: $1$
    figures: []
  - label: C
    text: $2$
    figures: []
  - label: D
    text: $3$
    figures: []
- number: 7
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 为 $n$ 阶实矩阵，$A eq A^{\mathrm T}$，$B=\begin{pmatrix}E&A\\A^{\mathrm T}&O\end{pmatrix}$，则\ExamSelection。
  choices:
  - label: A
    text: $B$ 的正、负惯性指数分别为 $n,0$
    figures: []
  - label: B
    text: |-
      不存在非零向量 $\alpha$，使得 $\alpha^{\mathrm T}B\alpha=0$
    figures: []
  - label: C
    text: |-
      若对任意 $y eq 0$，都有 $y^{\mathrm T}A^{\mathrm T}Ay eq 0$，则对任意 $x eq 0$，都有 $x^{\mathrm T}Bx eq 0$
    figures: []
  - label: D
    text: |-
      若非零向量 $\alpha,\beta$ 满足 $A^{\mathrm T}\alpha=\alpha,A\beta=-\beta$，则 $(\alpha^{\mathrm T},\beta^{\mathrm T})B\begin{pmatrix}\alpha\\\beta\end{pmatrix}>0$
    figures: []
- number: 8
  section: choice
  points: 5
  stem:
    text: |-
      设 $A,B$ 为两随机事件，$0<P(A)<1,0<P(B)<1$，则事件 $A$ 与事件 $B$ 相互独立的充分必要条件为\ExamSelection。
  choices:
  - label: A
    text: |-
      $P(B)=P(\overline B\mid A)$
    figures: []
  - label: B
    text: |-
      $P(A)+P(\overline B\mid A)=1$
    figures: []
  - label: C
    text: |-
      $P(\overline B\mid A)+P(B\mid\overline A)=1$
    figures: []
  - label: D
    text: |-
      $P(B\mid A)+P(B\mid\overline A)=1$
    figures: []
- number: 9
  section: choice
  points: 5
  stem:
    text: |-
      设总体 $X$ 的概率密度函数为 $f(x)$，$X_1,X_2,\cdots,X_n$ 为来自总体 $X$ 的简单随机样本。$X_{(1)}=\min\{X_1,X_2,\cdots,X_n\}$，$X_{(n)}=\max\{X_1,X_2,\cdots,X_n\}$。若常数 $c$ 满足 $\int_{-\infty}^{c}f(x)\,\mathrm{d}x=\dfrac{1}{2}$，则 $P\{X_{(1)}<c<X_{(n)}\}=$\ExamSelection。
  choices:
  - label: A
    text: |-
      $1-\dfrac{1}{2^{n-1}}$
    figures: []
  - label: B
    text: |-
      $1-\dfrac{1}{2^n}$
    figures: []
  - label: C
    text: |-
      $\dfrac{1}{2^n}$
    figures: []
  - label: D
    text: |-
      $\dfrac{1}{2^{n-1}}$
    figures: []
- number: 10
  section: choice
  points: 5
  stem:
    text: |-
      设 $X_1,X_2,\cdots,X_n$ 为来自总体 $X\sim N(\mu_1,\sigma_1^2)$（$\sigma_1>0$）的简单随机样本，$Y_1,Y_2,\cdots,Y_m$ 为来自总体 $Y\sim N(\mu_2,\sigma_2^2)$（$\sigma_2>0$）的简单随机样本，样本方差分别为 $S_1^2,S_2^2$，则下列命题中，正确的是\ExamSelection。
  choices:
  - label: A
    text: 若 $E(S_1^2)=E(S_2^2)$，则 $m=n$
    figures: []
  - label: B
    text: |-
      若 $D(S_1^2)=\dfrac{\sigma_1^4}{49},D(S_2^2)=\dfrac{\sigma_2^4}{50}$，则 $n=49,m=50$
    figures: []
  - label: C
    text: |-
      若 $\sigma_1^2=\sigma_2^2$，则 $\dfrac{\sqrt n(\overline X-\mu_1)}{S_2}\sim t(n-1)$
    figures: []
  - label: D
    text: |-
      若 $\sigma_1^2=\sigma_2^2$，则 $\dfrac{S_1^2}{S_2^2}\sim F(n-1,m-1)$
    figures: []
