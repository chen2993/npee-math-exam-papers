  stem:
    text: |-
      设函数 \(f(x)\) 在 \((-\infty, +\infty)\) 内具有二阶连续导数, 且对任意实数 \(x, y\) 满足 \(f\left(\sqrt{\dfrac{x^2+y^2}{2}}\right)=\sqrt{f(x)f(y)}\)。已知 \(f(x)\) 在 \((0, +\infty)\) 内严格单调递增。 (1) 证明：\(f\left(\dfrac{x+y}{2}\right)\le \dfrac{f(x)+f(y)}{2}\)； (2) 证明：\(f''(x)\ge 0\)； (3) 证明：\(\int_{-1}^1 f(x)\, \mathrm{d}x \le f(0)+f(1)\)。
