      设 $A$ 是 $3$ 阶矩阵，$b$ 是 $3$ 维非零列向量，则下列说法正确的是：①若 $Ax=b$ 有解，则 $\begin{pmatrix}A^{\mathrm T}\\b^{\mathrm T}\end{pmatrix}x=\begin{pmatrix}0\\1\end{pmatrix}$ 有解；②若 $Ax=b$ 有解，则 $\begin{pmatrix}A^{\mathrm T}\\b^{\mathrm T}\end{pmatrix}x=\begin{pmatrix}0\\1\end{pmatrix}$ 无解；③若 $\begin{pmatrix}A^{\mathrm T}\\b^{\mathrm T}\end{pmatrix}x=\begin{pmatrix}0\\1\end{pmatrix}$ 有解，则 $Ax=0$ 有非零解；④若 $\begin{pmatrix}A^{\mathrm T}\\b^{\mathrm T}\end{pmatrix}x=\begin{pmatrix}0\\1\end{pmatrix}$ 无解，则 $Ax=0$ 只有零解。\ExamSelection
