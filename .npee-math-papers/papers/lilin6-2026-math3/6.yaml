    text: |-
      设 $D_t=\{(x,y)\mid 0\leqslant x\leqslant2t,0\leqslant y\leqslant t,t>0\}$，$f(x,y)$ 在 $D_t$ 上有二阶连续偏导数，求 $F(t)=\displaystyle\iint_{D_t}f''_{yx}(x,y)\,\mathrm{d}x\,\mathrm{d}y$，并计算 $\displaystyle\lim_{t\to0^+}\dfrac{F(t)}{t}$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 有连续导数，$f(x)$ 不恒为零，且 $\displaystyle\int_0^1f(x)\,\mathrm{d}x=0$，记 $M=\displaystyle\max_{x\in[0,1]}|f'(x)|$。
  subparts:
  - text: |-
      证明：对 $\forall x\in[0,1]$，有 $|f(x)|\leqslant\dfrac{1}{2}M$；
  - text: |-
      设 $D=\{(x,y)\mid 0\leqslant x\leqslant1,0\leqslant y\leqslant x\}$，证明：$\left|\displaystyle\iint_Df(y)\,\mathrm{d}x\,\mathrm{d}y\right|\leqslant\dfrac{1}{8}M$。
