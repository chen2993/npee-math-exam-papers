- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设平面区域 \(D\) 由四分之一圆弧 \(x^2+y^2=1\ (x\ge 0, y\ge 0)\) 与曲线 \(x+y+xy=1\) 所围成。已知函数 $ f(x, y)=\begin{cases}x-y+1, & x+y\le 1, \\\dfrac{(x+y)^2}{x^2+y^2}, & x+y>1.\end{cases} $ 计算二重积分 \(I = \iint_D f(x, y)\, \mathrm{d}x\mathrm{d}y\)。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 \(M(x, y)\) 是曲线 \(y=f(x)\ (y>0)\) 上的任一点, 曲线在点 \(M\) 处的切线交 \(y\) 轴于点 \(P\)。若 \(|MP|=|PO|\)（其中 \(O\) 为坐标原点）, 且曲线经过点 \((4, 3)\)。 (1) 求曲线 \(y=f(x)\) 的表达式； (2) 求 \(f(x)\) 的极值。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设函数 \(f(x)\) 在 \([a, b]\) 上二阶可导, 记 \(M=\max\limits_{x\in[a, b]}|f''(x)|\)。证明：对任意 \(x\in(a, b)\), 均有 $ \left|\dfrac{f(x)-f(a)}{x-a}-\dfrac{f(b)-f(a)}{b-a}\right|\le \dfrac{M}{2}(b-x). $
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 \(3\) 阶实对称矩阵 \(\boldsymbol{A}\) 有二重特征值 \(1\), 且 \((\boldsymbol{A}-4\boldsymbol{E})\boldsymbol{\alpha}=\boldsymbol{0}\), 其中 \(\boldsymbol{\alpha}=(1, 1, 1)^{\mathrm{T}}\)。 (1) 求实对称矩阵 \(\boldsymbol{A}\)； (2) 记 \(\boldsymbol{X}=(x_1, x_2, x_3)^{\mathrm{T}}\), 利用正交变换将二次型 \(f(\boldsymbol{X})=\begin{vmatrix}\boldsymbol{A}&-\boldsymbol{X}\\\boldsymbol{X}^{\mathrm{T}}&0\end{vmatrix}\) 化为标准形。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X$ 与 $Y$ 相互独立且同服从正态分布 $N\left(\mu, \dfrac{\sigma^2}{2}\right)$（$\sigma > 0$ 未知），记 $Z = X - Y$。 (1) 设 $Z_1, Z_2, \cdots, Z_{2n}$ 是来自总体 $Z$ 的简单随机样本，求 $\sigma^2$ 的最大似然估计量 $\hat{\sigma}^2$； (2) 记 $U = \sum\limits_{i=1}^{n+1} Z_i, V = \sum\limits_{i=n}^{2n} Z_i$，求相关系数 $\rho_{UV}$。
