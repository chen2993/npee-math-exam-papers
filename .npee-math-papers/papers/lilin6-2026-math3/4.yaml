      $r_1\ge r_2\ge r_3$。
    figures: []
  - label: B
    text: |-
      $r_1\ge r_3\ge r_2$。
    figures: []
  - label: C
    text: |-
      $r_3\ge r_1=r_2$。
    figures: []
  - label: D
    text: |-
      $r_2\ge r_3=r_1$。
    figures: []
- number: 8
  section: choice
  points: 5
  stem:
    text: |-
      设 $A_1,A_2$ 和 $B$ 是随机事件，$0<P(B)<1$，且 $P[(A_1+A_2)\mid B]=P(A_1\mid B)+P(A_2\mid B)$，则\ExamSelection。
  choices:
  - label: A
    text: $P(A_1+A_2)=P(A_1)+P(A_2)$。
    figures: []
  - label: B
    text: |-
      $P(A_1+A_2)=P(A_1\mid B)+P(A_2\mid B)$。
    figures: []
  - label: C
    text: $P(A_1B+A_2B)=P(A_1B)+P(A_2B)$。
    figures: []
  - label: D
    text: |-
      $P[(A_1+A_2)\mid\overline{B}]=P(A_1\mid\overline{B})+P(A_2\mid\overline{B})$。
    figures: []
