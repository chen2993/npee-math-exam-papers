  stem:
    text: |-
      设 $A^\mathrm{T}=(\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\ldots,\boldsymbol{\alpha}_{n-1})$ 是 $n\times(n-1)$ 矩阵，$r(A^\mathrm{T})=n-1$，$\boldsymbol{\beta}_1,\boldsymbol{\beta}_2$ 是与 $\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\ldots,\boldsymbol{\alpha}_{n-1}$ 均正交的 $n$ 维列向量，$\boldsymbol{\beta}_1\ne\boldsymbol{\beta}_2$，$k$ 是任意常数，则方程组 $AX=0$ 的通解为\ExamSelection。
  choices:
