    text: |-
      $k(\boldsymbol{\beta}_1+\boldsymbol{\beta}_2)$。
    figures: []
  - label: D
    text: |-
      $k(\boldsymbol{\beta}_1-\boldsymbol{\beta}_2)$。
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $A=\begin{pmatrix}-1&1\\1&1\end{pmatrix}$，非零实列向量 $\boldsymbol{\alpha}=(a,b)^\mathrm{T}$，$X=(x_1,x_2,x_3)^\mathrm{T}$，则二次型 $f(x_1,x_2,x_3)=X^\mathrm{T}\begin{pmatrix}A+\boldsymbol{\alpha}\boldsymbol{\alpha}^\mathrm{T}&\boldsymbol{\alpha}\\\boldsymbol{\alpha}^\mathrm{T}&1\end{pmatrix}X$ 的规范形为\ExamSelection。
  choices:
  - label: A
    text: $y_1^2+y_2^2+y_3^2$。
    figures: []
  - label: B
    text: $-y_1^2-y_2^2-y_3^2$。
    figures: []
  - label: C
    text: $y_1^2+y_2^2-y_3^2$。
    figures: []
  - label: D
    text: $y_1^2-y_2^2-y_3^2$。
    figures: []
- number: 7
  section: choice
  points: 5
  stem:
    text: |-
      设 $A,B,C$ 均为 $n$ 阶实矩阵，$A^\mathrm{T}=A$，若对任意 $n$ 维非零列向量 $X$，都有 $\operatorname{tr}(ABXX^\mathrm{T})+\operatorname{tr}(XX^\mathrm{T}AB)>0$。矩阵 $\begin{pmatrix}AB&O\\B&BC\end{pmatrix}$，$\begin{pmatrix}B&A\\O&AC\end{pmatrix}$，$\begin{pmatrix}A&C\\O&AB\end{pmatrix}$ 的秩依次为 $r_1,r_2,r_3$，则\ExamSelection。
  choices:
