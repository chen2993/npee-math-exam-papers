- number: 14
  section: fill
  points: 5
  stem:
    text: |-
      设函数 $F(u,v)$ 可微，$z=z(x,y)$ 由方程 $F\left(x+\dfrac{z}{y},y+\dfrac{z}{x}\right)=0$ 确定，则 $x\dfrac{\partial z}{\partial x}+y\dfrac{\partial z}{\partial y}=\ExamBlank$。
- number: 15
  section: fill
  points: 5
  stem:
    text: |-
      已知线性方程组 $\begin{cases}ax_1+3x_2+x_3=1,\\bx_1+2x_2+x_3=2,\\x_2+2x_3=3,\\x_1+2x_2+3x_3=1\end{cases}$ 有解，其中 $a,b$ 为常数，若 $\begin{vmatrix}a&b&0&-1\\3&2&1&-2\\1&1&2&-3\\-1&-2&-3&2\end{vmatrix}=1$，则 $\begin{vmatrix}a&b&0\\3&2&1\\1&1&2\end{vmatrix}=\ExamBlank$。
- number: 16
  section: fill
  points: 5
  stem:
    text: |-
      设总体 $X$ 与总体 $Y$ 相互独立，且都服从 $N(0,\sigma^2)$（$\sigma>0$），$X_1,X_2,\ldots,X_n$ 与 $Y_1,Y_2,\ldots,Y_m$ 分别为来自总体 $X$ 与 $Y$ 的简单随机样本，若 $T=\dfrac{2\displaystyle\sum_{i=1}^{n}X_i}{\sqrt{\displaystyle\sum_{i=1}^{m}Y_i^2}}$ 服从 $t$ 分布，则 $\dfrac{n}{m}=\ExamBlank$。
- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      设 $a$（$a>-1$）为非零常数，$\lim_{x\to+\infty}\dfrac{\displaystyle\int_{1}^{x}\left[(t+a)^{1+\dfrac{1}{t}}-t^{1+\dfrac{1}{t+a}}\right]\,\mathrm{d}t}{x}=1$，求 $a$ 的值。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设 $x^2+y^2=1$（$x\ge0,y\ge0$）与 $x+y+xy=1$ 所围区域为 $D$。$f(x,y)=\begin{cases}x-y+1,&x+y\le1,\\\dfrac{(x+y)^2}{x^2+y^2},&x+y>1.\end{cases}$ 计算 $I=\iint_D f(x,y)\,\mathrm{d}x\,\mathrm{d}y$。
- number: 19
  section: solution
  points: 12
  stem:
    text: 设 $M(x,y)$ 是曲线 $y=f(x)$（$y>0$）上任意一点，曲线在点 $M$ 处的切线交 $x$ 轴于点 $P$，若 $|MP|=|PO|$，其中 $O$ 为坐标原点，且曲线过点 $(4,3)$。求 $y=f(x)$ 的表达式，以及 $f(x)$ 的极值。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 在 $[a,b]$ 上二阶可导，$M=\max_{x\in[a,b]}|f''(x)|$。证明：对任意 $x\in(a,b)$，均有 $\left|\dfrac{f(x)-f(a)}{x-a}-\dfrac{f(b)-f(a)}{b-a}\right|\le\dfrac{M}{2}(b-x)$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 3 阶实对称矩阵 $A$ 有二重特征值 1，且 $(A-4E)\boldsymbol{\alpha}=0$，其中 $E$ 是单位矩阵，$\boldsymbol{\alpha}=(1,1,1)^\mathrm{T}$。
  subparts:
  - text: 求 $A$；
  - text: |-
      记 $X=(x_1,x_2,x_3)^\mathrm{T}$，利用正交变换将二次型 $f(x_1,x_2,x_3)=\begin{vmatrix}A&-X\\X^\mathrm{T}&0\end{vmatrix}$ 化为标准形。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X$ 与 $Y$ 相互独立，且服从同一分布 $N\left(\mu,\dfrac{\sigma^2}{2}\right)$，其中 $\sigma$（$\sigma>0$）是未知参数，记 $Z=X-Y$。
  subparts:
  - text: |-
      若 $Z_1,Z_2,\ldots,Z_{2n}$（$n\ge2$）是总体 $Z$ 的简单随机样本，求 $\sigma^2$ 的最大似然估计量 $\hat{\sigma}^{2}$；
  - text: |-
      记 $U=\displaystyle\sum_{i=1}^{n+1}Z_i,V=\displaystyle\sum_{i=n}^{2n}Z_i$，利用（Ⅰ）的 $\hat{\sigma}^{2}$ 求相关系数 $\rho_{UV}$。
