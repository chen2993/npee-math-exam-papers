- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      已知连续函数 $f(x)$ 满足 $f(x+2)-f(x)=\sin x$，$\int_{0}^{2}f(x)\,\mathrm{d}x=0$，令 $I_1=\int_{1}^{3}f(x)\,\mathrm{d}x$，$I_2=\int_{2}^{4}f(x)\,\mathrm{d}x$，则\ExamSelection。
  choices:
  - label: A
