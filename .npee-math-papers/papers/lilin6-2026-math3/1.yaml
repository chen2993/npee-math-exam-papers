  stem:
    text: |-
      设 $f(x,y)$ 有一阶连续的偏导数，在点 $(1,1)$ 的某邻域内，$f(x,y)=e^{x^2+y^2-2}+o(\rho)$，其中 $\rho=\sqrt{(x-1)^2+(y-1)^2}$。又 $g(x,y)=f(e^{x-y},xy)$。
  subparts:
  - text: |-
      求 $\left.\mathrm{d}g(x,y)\right|_{(1,1)}$；
  - text: |-
      计算 $\displaystyle\lim_{t\to0}\dfrac{g(1+\sin t,1)-g(1,1-\tan t)}{t}$。
