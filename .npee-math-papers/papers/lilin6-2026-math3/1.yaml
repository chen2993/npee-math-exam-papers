- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设可导函数 \(y=f(x)\) 满足 \([x-\ln(1+x)]y\, \mathrm{d}x - x^2\, \mathrm{d}y = 0\ (x>0)\), 且 \(f(1)=4\)。 (1) 证明 \(y=f(x)\) 为上凸函数（即 \(f''(x)0\), 都有 \((1+x)^{\dfrac{1}{x}}+\left(1+\dfrac{1}{x}\right)^x \le a\ (a>0)\) 恒成立, 求 \(a\) 的最小值。
