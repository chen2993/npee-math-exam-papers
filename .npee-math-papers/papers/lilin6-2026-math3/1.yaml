  stem:
    text: |-
      设 \(f(x, y)\) 具有一阶连续偏导数, 在点 \((1, 1)\) 的某邻域内满足 \(f(x, y)=\mathrm{e}^{x^2+y^2-2}+o(\rho)\), 其中 \(\rho=\sqrt{(x-1)^2+(y-1)^2}\)。令 \(g(x, y)=f(\mathrm{e}^{x-y}, xy)\)。 (1) 求 \(\mathrm{d}g(1, 1)\)； (2) 计算极限 \(\lim\limits_{t\to0}\dfrac{g(1+t, 1+t)-g(1, 1)}{t}\)。
- number: 19
  section: solution
