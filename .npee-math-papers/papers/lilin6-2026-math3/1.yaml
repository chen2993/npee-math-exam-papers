  stem:
    text: |-
      设 \(\boldsymbol{A}=(\boldsymbol{\alpha}_1, \boldsymbol{\alpha}_2, \boldsymbol{\alpha}_3)\) 为 \(3\) 阶实矩阵, 交换 \(\boldsymbol{A}\) 的第 \(1, 2\) 行, 再交换第 \(2, 3\) 列得到矩阵 \(\boldsymbol{B}=\begin{pmatrix}0&-1&1\\1&1&1\\1&1&-1\end{pmatrix}\)。 (1) 求矩阵 \(\boldsymbol{A}\)； (2) 若 \(\boldsymbol{\beta}_1=\boldsymbol{\alpha}_1, \boldsymbol{\beta}_2=\boldsymbol{\alpha}_2-k\boldsymbol{\beta}_1, \boldsymbol{\beta}_3=\boldsymbol{\alpha}_3-l_1\boldsymbol{\beta}_1-l_2\boldsymbol{\beta}_2\) 且 \(\boldsymbol{\beta}_1, \boldsymbol{\beta}_2, \boldsymbol{\beta}_3\) 两两正交, 求 \(k, l_1, l_2\)； (3) 求正交矩阵 \(\boldsymbol{Q}\) 及上三角矩阵 \(\boldsymbol{T}\), 使得 \(\boldsymbol{A}=\boldsymbol{Q}\boldsymbol{T}\)。
- number: 22
