  subparts:
  - text: 求 $A$；
  - text: |-
      记 $\boldsymbol{\beta}_1=\boldsymbol{\alpha}_1$，$\boldsymbol{\beta}_2=\boldsymbol{\alpha}_2-k\boldsymbol{\beta}_1$，$\boldsymbol{\beta}_3=\boldsymbol{\alpha}_3-l_1\boldsymbol{\beta}_1-l_2\boldsymbol{\beta}_2$，若 $\boldsymbol{\beta}_1,\boldsymbol{\beta}_2,\boldsymbol{\beta}_3$ 两两正交，求 $k,l_1,l_2$；
  - text: 求正交矩阵 $Q$ 及上三角矩阵 $T$，使得 $A=QT$。
