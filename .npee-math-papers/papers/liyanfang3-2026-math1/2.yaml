    text: |-
      某单位举办抽奖活动，已知中奖率为 $\dfrac{1}{4}$，共有 $192$ 人参与抽奖，每人的抽奖过程相互独立。若要使得中奖人均能现场领到奖品的概率不小于 $95\%$。利用中心极限定理估计，该单位现场至少应准备\ExamBlank 份奖品。（注：标准正态分布函数值 $\Phi(1.645)=0.95$，当 $x>3.5$ 时，$\Phi(x)\approx1$。）
- number: 17
  section: solution
  points: 10
  stem:
    text: |-
