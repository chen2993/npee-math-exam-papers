    text: 无穷多个
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)$ 在 $[0,1]$ 上连续，在 $(0,1)$ 内二阶可导，$f(0)=a$，$f(1)=b$，$a\neq b$，$c\in(0,1)$。若 $f(c)=\dfrac{a+b}{2}$ 且 $f'(x)$ 单调增加，则\ExamSelection。
  choices:
  - label: A
    text: |-
      $c>\dfrac{1}{2}$
    figures: []
  - label: B
    text: |-
      $c<\dfrac{1}{2}$
    figures: []
  - label: C
    text: $f'(c)(b-a)>0$
    figures: []
  - label: D
    text: $f'(c)(b-a)<0$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设 $a_n>1$，$n=1,2,\cdots$，数列 $\{a_n\}$ 单调减少，$s_n=\sum_{i=1}^{n}a_i$，$s'_n=\prod_{i=1}^{n}(1+a_i)$，则下列说法中，正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\sum_{n=1}^{\infty}\dfrac{(-1)^n a_n}{s_n}$ 条件收敛，$\sum_{n=1}^{\infty}\dfrac{(-a_n)^n}{s'_n}$ 条件收敛
    figures: []
  - label: B
    text: |-
      $\sum_{n=1}^{\infty}\dfrac{(-1)^n a_n}{s_n}$ 条件收敛，$\sum_{n=1}^{\infty}\dfrac{(-a_n)^n}{s'_n}$ 绝对收敛
    figures: []
  - label: C
    text: |-
      $\sum_{n=1}^{\infty}\dfrac{(-1)^n a_n}{s_n}$ 绝对收敛，$\sum_{n=1}^{\infty}\dfrac{(-a_n)^n}{s'_n}$ 条件收敛
    figures: []
  - label: D
    text: |-
      $\sum_{n=1}^{\infty}\dfrac{(-1)^n a_n}{s_n}$ 绝对收敛，$\sum_{n=1}^{\infty}\dfrac{(-a_n)^n}{s'_n}$ 绝对收敛
    figures: []
