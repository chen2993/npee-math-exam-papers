  stem:
    text: |-
      设曲线 $l$ 的方程为 $f(x,y)=0$（$x\geq0$），函数 $y=y(x)$ 由方程 $f(x,y)=0$ 确定，$y(x)$ 二阶可导且 $y'(x)>0$。已知曲线 $l$ 在点 $(0,1)$ 处的切线方程为 $y=\sqrt{3}x+1$，并且该曲线上从点 $A(0,1)$ 到点 $P(x,y)$ 的曲线弧长等于点 $P(x,y)$ 处的法线在 $x$ 轴上的截距，求曲线 $l$ 满足的方程。
