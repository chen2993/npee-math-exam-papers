  stem:
    text: |-
      设 $A,B$ 为 $3$ 阶矩阵，$AB-BA=A$，存在可逆矩阵 $P=(\alpha,\beta,\gamma)$ 使得 $P^{-1}AP=\begin{pmatrix}0&1&1\\0&0&1\\0&0&0\end{pmatrix}$，且 $B\alpha\neq0$。
