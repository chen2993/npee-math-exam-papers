    text: |-
      设函数 $f(x)=\begin{cases}|x|\left[\dfrac{1}{x}\right],&x\neq 0,\\0,&x=0,\end{cases}$ 其中 $\left[\dfrac{1}{x}\right]$ 表示不超过 $\dfrac{1}{x}$ 的最大整数，则 $f(x)$ 的间断点的个数为\ExamSelection。
