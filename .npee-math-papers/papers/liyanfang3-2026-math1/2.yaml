- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设 $\alpha_1,\alpha_2,\beta_1,\beta_2$ 是 $3$ 维非零列向量，则下列说法中，正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      若存在非零向量 $\gamma$ 可由 $\alpha_1,\alpha_2$ 线性表示，也可由 $\beta_1,\beta_2$ 线性表示，则 $\alpha_1,\alpha_2$ 与 $\beta_1,\beta_2$ 等价
    figures: []
  - label: B
    text: |-
      若存在非零向量 $\gamma$ 可由 $\alpha_1,\alpha_2$ 线性表示，不可由 $\beta_1,\beta_2$ 线性表示，则 $\beta_1,\beta_2$ 可由 $\alpha_1,\alpha_2$ 线性表示
    figures: []
  - label: C
    text: |-
      若 $\alpha_1,\alpha_2$ 线性无关，$\beta_1,\beta_2$ 线性无关，则存在非零向量 $\gamma$ 既可由 $\alpha_1,\alpha_2$ 线性表示，也可由 $\beta_1,\beta_2$ 线性表示
    figures: []
  - label: D
    text: |-
      若 $\alpha_1,\alpha_2$ 线性相关，$\beta_1,\beta_2$ 线性相关，则不存在非零向量 $\gamma$ 既可由 $\alpha_1,\alpha_2$ 线性表示，也可由 $\beta_1,\beta_2$ 线性表示
    figures: []
