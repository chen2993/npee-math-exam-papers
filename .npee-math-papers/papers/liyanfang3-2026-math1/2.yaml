  - text: |-
      若 $k=-1$，求 $\operatorname{tr}(B)$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X$ 的概率密度为 $f(x;\theta)=\begin{cases}\dfrac{1}{2\sqrt{\pi(x-\theta)}}e^{-\dfrac{x-\theta}{4}},&x>\theta,\\0,&\text{其他},\end{cases}$ 其中 $\theta$ 为待估参数。$X_1,X_2,\cdots,X_n$ 是来自总体 $X$ 的简单随机样本。
  subparts:
  - text: |-
      求 $\theta$ 的矩估计量 $\hat\theta_1$；
  - text: |-
      求 $D(\hat\theta_1^2)$，并判断 $\hat\theta_1^2$ 是否为 $\theta^2$ 的无偏估计；
  - text: |-
      求 $\theta$ 的最大似然估计量 $\hat\theta_2$。
