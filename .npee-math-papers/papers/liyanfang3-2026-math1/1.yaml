    text: |-
      设 $\alpha_1,\alpha_2,\alpha_3$ 在标准基下的坐标为 $\alpha_1=(1,1,0)^{\mathsf T},\alpha_2=(2,1,0)^{\mathsf T},\alpha_3=(1,2,1)^{\mathsf T}$，从基 $\alpha_1,\alpha_2,\alpha_3$ 到 $\beta_1,\beta_2,\beta_3$ 的过渡矩阵为 $P=\begin{pmatrix}2&3&2\\0&2&1\\0&0&1\end{pmatrix}$。已知 $A$ 为 $3$ 阶矩阵，$\alpha_2-\alpha_1$ 与 $\beta_1-\alpha_2$ 是 $A$ 的两个特征向量。$A$ 满足 $r(A-2E)>1$，且 $A^3-3A=2E$。
