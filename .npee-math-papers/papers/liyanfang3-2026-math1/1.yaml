      设曲面 $\Sigma$ 的方程为 $z=\sqrt{\lvert xy\rvert}$，已知 $\Sigma$ 在点 $(0,0)$ 处沿方向 $l$ 取得最大方向导数，与 $l$ 同向的单位方向向量为 $(\cos\alpha,\sin\alpha)$。
