  - text: |-
      在第（I）问的基础上，已知 $\alpha\in\left(0,\dfrac{\pi}{2}\right)$，过原点且与 $(\cos\alpha,\sin\alpha,z(\cos\alpha,\sin\alpha))$ 同向的直线 $L$ 绕 $z$ 轴旋转一周所得旋转曲面为 $\Sigma_1$，求 $\Sigma_1$ 的方程。
