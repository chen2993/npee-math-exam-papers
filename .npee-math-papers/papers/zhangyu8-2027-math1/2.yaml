      袋中有 \(N\) 枚硬币,其中 \(\theta\) 枚是普通硬币,即掷出正面和反面的概率各为 \(\dfrac{1}{2}\) ,其余的 \(N - \theta\) 枚硬币两面都是正面. 从袋中随机取一枚硬币, 不查看它是何种硬币, 连续掷两次, 记下所得结果,然后将它放回袋中. 记 \(X\) 为将一枚硬币连续掷两次正面出现的次数. 如此重复 \(n\) 次,设记录结果中正面出现 0 次、1 次、2 次的次数分别为 \({n}_{0},{n}_{1},{n}_{2}\left( {{n}_{0} + {n}_{1} + {n}_{2} = n}\right)\) . (1)求 \(X\) 的分布律； (2)求未知参数 \(\theta\) 的最大似然估计值 \(\widehat{\theta }\)
