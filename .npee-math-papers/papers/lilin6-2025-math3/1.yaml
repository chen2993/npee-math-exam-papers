      设曲线 $xy=1$（$x>0$）上的点 $P_0(x_0,y_0)$ 使得 $x^2+2y^2$ 达到最小值，则点 $P_0$ 的坐标为\ExamBlank。
- number: 15
  section: fill
  points: 5
  stem:
    text: |-
      设 $A,B$ 均为 $n$ 阶矩阵，$|B|=1$，且 $(A-E)^{-1}=B^*-E$，其中 $B^*$ 为 $B$ 的伴随矩阵，则 $|A^{-1}+B|=$\ExamBlank。
- number: 16
  section: fill
  points: 5
  stem:
    text: |-
      设 $X_1,X_2,\cdots,X_n$ 为来自总体 $X\sim B(N,p)$（$0<p<1$）的简单随机样本，则 $p$ 的最大似然估计量 $\widehat{p}=$\ExamBlank。
- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      设 $f(x)$ 可导，且满足 $f(x)=xf(-x)+\int_0^{-x}f(t)\,\mathrm{d}t+\dfrac{1}{2}x^2$。
  subparts:
  - text: 求 $f(x)$；
  - text: 求 $f(x)$ 的单调区间与极值。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设 $D=\{(x,y)\mid(x-1)^2+(y-1)^2\leq1,x^2+y^2\leq1\}$，计算 $I=\iint_D(2x-y^2)\,\mathrm{d}x\mathrm{d}y$。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 $w=xy-z$，$z=z(x,y)$ 有二阶连续的偏导数，且满足 $\dfrac{\partial^2z}{\partial x^2}+2\dfrac{\partial^2z}{\partial x\partial y}+\dfrac{\partial^2z}{\partial y^2}=0$，作变换 $u=x+y$，$v=x-y$。
  subparts:
  - text: |-
      求 $\dfrac{\partial^2w}{\partial u^2}$；
  - text: |-
      若 $\dfrac{\partial w(0,v)}{\partial u}=v\mathrm{e}^{-v}$，$w(0,v)=\dfrac{v^2}{4}$，求 $z(x,y)$ 的表达式。
- number: 20
  section: solution
  points: 12
  stem:
    text: 设非负函数 $f(x)$ 在区间 $[0,1]$ 上有连续的二阶导数，且 $f(0)=1$，$f''(x)<0$，证明：
  subparts:
  - text: |-
      当 $x\in[0,1]$ 时，有 $\int_0^xf(t)\,\mathrm{d}t\geq\dfrac{1}{2}[xf(x)+x]$；
  - text: |-
      $\int_0^1\left(\dfrac{2}{3}-x\right)f(x)\,\mathrm{d}x\geq\dfrac{1}{6}$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设矩阵 $A=\begin{bmatrix}a&1&1\\0&a-1&0\\1&1&a\end{bmatrix}$ 不可逆，$\beta=\begin{bmatrix}b\\1\\1\end{bmatrix}$。已知方程组 $A^{\mathrm{T}}X=0$ 的解均是 $\beta^{\mathrm{T}}X=0$ 的解。
  subparts:
  - text: 求 $a,b$ 的值；
  - text: |-
      求可逆矩阵 $P$，使得 $P^{-1}AP=\Lambda$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X$ 与 $Y$ 相互独立，且均服从 $N(0,1)$，记 $U=\begin{cases}1,&X^2+Y^2>1,\\0,&X^2+Y^2\leq1,\end{cases}$ $V=\begin{cases}1,&X^2+Y^2>2,\\0,&X^2+Y^2\leq2.\end{cases}$
  subparts:
  - text: 求 $(U,V)$ 的概率分布；
  - text: |-
      求 $\rho_{UV}$。
