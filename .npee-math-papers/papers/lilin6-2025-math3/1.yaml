  section: fill
  points: 5
  stem:
    text: |-
      差分方程 $3y_t-3y_{t-1}=t\cdot3^t+1$ 的通解为\ExamBlank。
- number: 13
  section: fill
  points: 5
  stem:
    text: |-
      级数 $\sum_{n=1}^{\infty}\dfrac{1}{(2n)!}=$\ExamBlank。
- number: 14
  section: fill
  points: 5
  stem:
