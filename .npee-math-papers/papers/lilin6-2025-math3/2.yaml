- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      设 $f(x)$（$x>0$）满足 $xf'(x)-f(x)=a(1-\ln x)$，$f(1)=-1$。
  subparts:
  - text: 若 $f(x)$ 有唯一的极值，求 $a$ 的取值范围；
  - text: |-
      当 $x_1>x_2>0$ 时，有 $f(x_1)=f(x_2)=0$，证明：$x_1x_2>\mathrm{e}^2$。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x,y)$ 的全微分为 $\mathrm{d}f(x,y)=(2ax+by)\mathrm{d}x+(2by+ax)\mathrm{d}y$（$a,b$ 为常数），且 $f(0,0)=-3$，$f'_x(1,1)=3$。
  subparts:
  - text: 求 $f(x,y)$；
  - text: 求点 $(-1,-1)$ 到曲线 $f(x,y)=0$ 上的点的距离的最大值。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 $D=\{(x,y)\mid0\leqslant x\leqslant2,0\leqslant y\leqslant2\}$，计算 $I=\iint_D\max\{(x-1)^2,1-y^2\}\,\mathrm{d}x\,\mathrm{d}y$。
- number: 20
  section: solution
  points: 12
  stem:
    text: 设 $f(x)$ 在 $[-1,1]$ 上有连续的二阶导数，证明：
  subparts:
  - text: |-
      存在一点 $\xi\in[-1,1]$，使得 $\int_{-1}^{1}xf(x)\,\mathrm{d}x=\dfrac{1}{3}[2f'(\xi)+\xi f''(\xi)]$；
  - text: |-
      若 $f(x)$ 在 $(-1,1)$ 内取得极值，则存在一点 $\eta\in(-1,1)$，使得 $|2f'(\eta)+\eta f''(\eta)|\geqslant\dfrac{1}{2}|f(1)-f(-1)|$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $A$ 是 $3$ 阶矩阵，方程组 $AX=b$ 的通解为 $k_1(-1,1,0)^{\mathrm{T}}+k_2(2,0,1)^{\mathrm{T}}+(1,1,-2)^{\mathrm{T}}$，其中 $k_1,k_2$ 为任意常数，$b=(6,6,-12)^{\mathrm{T}}$。
  subparts:
  - text: 求 $A$；
  - text: |-
      若 $X=(x_1,x_2,x_3)^{\mathrm{T}}$，求 $X^{\mathrm{T}}AX=0$ 的全部解。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设二维随机变量 $(X_1,X_2)\sim N(0,0;1,1;0)$，记 $X=\max\{X_1,X_2\}$，$Y=\min\{X_1,X_2\}$，$Z=X-Y$。
  subparts:
  - text: 求 $Z$ 的概率密度 $f_Z(z)$ 和 $EZ$；
  - text: 求二维随机变量 $(X,Y)$ 的分布函数。
