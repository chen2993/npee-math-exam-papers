- number: 10
  section: choice
  points: 5
  stem:
    text: |-
      设 $X_1,X_2,X_3,X_4$ 为来自总体 $N(1,\sigma^2)$（$\sigma>0$）的简单随机样本，$\overline{X}$ 为样本均值，$S^2$ 为样本方差，则下列选项正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\dfrac{X_1-X_2}{|X_3+X_4-2|}\sim t(2)$
    figures: []
  - label: B
    text: |-
      $\dfrac{4(\overline{X}-1)^2}{\sigma^2}\sim\chi^2(2)$
    figures: []
  - label: C
    text: |-
      $\dfrac{1}{2\sigma^2}[(X_1-X_2)^2+(X_3-X_4)^2]\sim\chi^2(2)$
    figures: []
  - label: D
    text: |-
      $\dfrac{4(\overline{X}-1)^2}{S^2}\sim F(3,1)$
    figures: []
