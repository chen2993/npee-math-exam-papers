    text: |-
      $\alpha,A\alpha$ 线性相关
    figures: []
  - label: B
    text: |-
      $\alpha,A^2\alpha$ 线性相关
    figures: []
  - label: C
    text: |-
      $A\alpha,A^2\alpha$ 线性相关
    figures: []
  - label: D
