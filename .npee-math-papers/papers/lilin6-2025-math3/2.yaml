    figures: []
- number: 7
  section: choice
  points: 5
  stem:
    text: |-
      设 $A,B$ 分别为 $m\times n,n\times s$ 矩阵，且 $AB=C$，则下列选项正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      若 $\mathrm{r}(C)=m$，则 $\mathrm{r}(A)\leqslant m$
    figures: []
  - label: B
    text: |-
      若 $\mathrm{r}(C)=s$，则 $\mathrm{r}(B)\leqslant s$
    figures: []
  - label: C
    text: |-
      若 $\mathrm{r}(A)=n$，则 $\mathrm{r}(B)\leqslant\mathrm{r}(C)$
    figures: []
  - label: D
    text: |-
      若 $\mathrm{r}(A)=n$，则 $\mathrm{r}(B)=\mathrm{r}(C)$
    figures: []
- number: 8
  section: choice
  points: 5
  stem:
    text: |-
      设随机变量 $(X,Y)$ 的概率密度为 $f(x,y)=\begin{cases}ax,&0<y<x<1,\\0,&\text{其他},\end{cases}$ 若 $P\left\{X<\dfrac{1}{2},Y<b\right\}=\dfrac{1}{8}$，则下列选项正确的是\ExamSelection。
