- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 是 $3$ 阶矩阵，$3$ 维列向量 $\alpha$ 不是方程组 $A^2X=0$ 的解，$A\alpha$ 是方程组 $A^2X=0$ 的解，则正确的是\ExamSelection。
