- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      设 $\lim_{x\to+\infty}\left(\sqrt[3]{1+ax^3}+x\right)=0$，则曲线 $y=\sqrt[3]{1+ax^3}$ 有斜渐近线\ExamSelection。
  choices:
  - label: A
    text: $y=x$
    figures: []
  - label: B
    text: $y=-x$
    figures: []
  - label: C
    text: |-
      $y=\dfrac{1}{3}x$
    figures: []
  - label: D
    text: |-
      $y=-\dfrac{1}{3}x$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设常数 $a>0$，当 $x\in(1,+\infty)$ 时，$\ln x\leqslant x^a$，则 $a$ 的取值范围为\ExamSelection。
  choices:
  - label: A
    text: |-
      $(0,\mathrm{e}]$
    figures: []
  - label: B
    text: |-
      $(0,\dfrac{1}{\mathrm{e}})$
    figures: []
  - label: C
    text: |-
      $[\mathrm{e},+\infty)$
    figures: []
  - label: D
    text: |-
      $[\dfrac{1}{\mathrm{e}},+\infty)$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 在 $[0,+\infty)$ 上正值连续，$\{c_n\}$（$n=1,2,\cdots$）为正值数列，记 $a_n=\int_0^{c_n}f(x)\,\mathrm{d}x$，$b_n=\int_{c_n}^{c_{n+1}}f(x)\,\mathrm{d}x$，则正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      当 $b_n<0$ 时，$\{a_n\}$ 必发散
    figures: []
  - label: B
    text: |-
      当 $b_n<0$ 时，$\{a_n\}$ 必收敛
    figures: []
  - label: C
    text: |-
      当 $b_n>0$ 时，$\{a_n\}$ 必发散
    figures: []
  - label: D
    text: |-
      当 $b_n>0$ 时，$\{a_n\}$ 必收敛
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
