  - label: D
    text: |-
      $\displaystyle\sum_{n=1}^{\infty}\left[\ln\dfrac{1}{n}-\ln\left(\sin\dfrac{1}{n}\right)\right]$
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设 $3$ 阶矩阵 $A$ 可逆，将 $A$ 的第 $2$ 列与第 $3$ 列互换得 $B$，再将 $B$ 的第 $1$ 列乘以 $(-2)$ 加到第 $3$ 列得 $C$，且满足 $AP^{-1}=C$，则 $P=$\ExamSelection。
  choices:
  - label: A
    text: |-
      $\begin{pmatrix}1&0&2\\0&0&1\\0&1&0\end{pmatrix}$
    figures: []
