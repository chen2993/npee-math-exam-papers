- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      设 $f(x)$ 满足 $f'(x)+f(x)=e^{-x},\ f(0)=0$。
  subparts:
  - text: 求 $y=f(x)$ 的极值与拐点。
  - text: 当 $0<x_1<1<x_2$ 时，有 $f(x_1)=f(x_2)$，证明：$x_1+x_2>2$。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设 $D=\{(x,y)\mid 1\leq x^2+y^2\leq4,x\geq0,y\geq0\}$，计算 $I=\iint_D\dfrac{xy\sqrt{x^2+y^2}}{x^4+y^4}\,\mathrm{d}x\mathrm{d}y$。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)=\sum_{n=0}^{\infty}(-1)^na_nx^{2n+1}$ 满足 $f'(x)+f(x)=-2\sin x,f'(0)=2$。
  subparts:
  - text: 求 $f(x)$。
  - text: |-
      求 $a_n$ 及级数 $\sum_{n=0}^{\infty}(-1)^n\dfrac{a_n}{2^n}$ 之和。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 在 $[0,1]$ 上二阶可导，$f(0)=f(1)=0\text{，}f''(x)>0$，且 $f(x)$ 在 $[0,1]$ 上的最小值为 $m<0$。
  subparts:
  - text: |-
      证明：方程 $nf'(x)=m$（$n$ 为正整数）在 $x\in(0,1)$ 内有唯一一实根 $x_n$。
  - text: |-
      在第（I）问的基础上，证明：$\lim_{n\to\infty}x_n$ 存在，并求 $\lim_{n\to\infty}f(x_n)$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $A=\begin{pmatrix}a&0\\-1&a\\-1&0\end{pmatrix},B=\begin{pmatrix}-1&0&a\\-1&1&a\end{pmatrix}$，已知方程组 $ABX=0$ 与 $BX=0$ 同解。
  subparts:
  - text: 求 $a$ 的取值范围。
  - text: |-
      当 $AB$ 为实对称矩阵时，求正交变换 $X=QY$ 将二次型 $f(x_1,x_2,x_3)=X^{\mathrm T}ABX$ 化为标准形。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X$ 与 $Y$ 相互独立，$X\sim N(0,\sigma^2)$（$\sigma>0$），$Y$ 的分布律为 $P\{Y=-1\}=a,P\{Y=1\}=1-a$（$0<a<1$），记 $Z=XY$。
  subparts:
  - text: 求 $Z$ 的概率密度 $f_Z(z)$。
  - text: 问当 $a$ 为何值时，$X$ 与 $Z$ 不相关？
  - text: |-
      若 $Z_1,Z_2,\cdots,Z_n$ 为来自总体 $Z$ 的简单随机样本，$\overline{Z}$ 为样本均值，$S^2$ 为样本方差，记 $T=\overline{Z}^{\,2}-S^2$，求 $DT$。
