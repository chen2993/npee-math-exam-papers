- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)=\begin{cases}e^{1/x},&0<x<1,\\ax^2+b,&x\geq 1,\end{cases}$ 在 $x=1$ 处可导，则曲线 $y=f(x)$ 在点 $(1,f(1))$ 处的切线方程为\ExamSelection
  choices:
  - label: A
    text: $x+ey-2e=0$
    figures: []
  - label: B
    text: $ex+y-2e=0$
    figures: []
  - label: C
    text: $x-ey-2e=0$
    figures: []
  - label: D
    text: $ex-y-2e=0$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 在 $[0,+\infty)$ 上有连续的导数，且 $f'(x)>0$，当 $0<a<x<b$ 时，有\ExamSelection
  choices:
  - label: A
    text: |-
      $a\int_0^x f(t)\,\mathrm{d}t<x\int_0^a f(t)\,\mathrm{d}t$
    figures: []
  - label: B
    text: |-
      $b\int_0^x f(t)\,\mathrm{d}t<x\int_0^b f(t)\,\mathrm{d}t$
    figures: []
  - label: C
    text: |-
      $x\int_0^x f(t)\,\mathrm{d}t<b\int_0^b f(t)\,\mathrm{d}t$
    figures: []
  - label: D
    text: |-
      $x\int_0^x f(t)\,\mathrm{d}t>a\int_0^a f(t)\,\mathrm{d}t$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x,y)=\begin{cases}|xy|\ln(x^2+y^2),&(x,y)\ne(0,0),\\0,&(x,y)=(0,0),\end{cases}$ 则 $f(x,y)$ 在点 $(0,0)$ 处\ExamSelection
  choices:
  - label: A
    text: 连续但 $f'_x(0,0)$ 与 $f'_y(0,0)$ 不存在
    figures: []
  - label: B
    text: $f'_x(0,0)$ 与 $f'_y(0,0)$ 存在但不可微
    figures: []
  - label: C
    text: 连续但不可微
    figures: []
  - label: D
    text: 可微
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
