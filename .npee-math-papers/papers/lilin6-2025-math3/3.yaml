- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 是 $n$ 阶矩阵，$\alpha_1,\alpha_2,\cdots,\alpha_s$ 是 $n$ 维列向量，有向量组 $(\mathrm I)\alpha_1,\alpha_2,\cdots,\alpha_s$，$(\mathrm{II})A\alpha_1,A\alpha_2,\cdots,A\alpha_s$，则下列选项中正确的是\ExamSelection
  choices:
  - label: A
    text: |-
      若 $(\mathrm I)$ 线性无关，则 $(\mathrm{II})$ 线性无关
    figures: []
  - label: B
    text: |-
      若 $(\mathrm{II})$ 线性相关，则 $(\mathrm I)$ 线性相关
    figures: []
  - label: C
    text: |-
      若 $(\mathrm I)$ 线性无关，$(\mathrm{II})$ 线性相关，则 $A$ 不可逆
    figures: []
  - label: D
    text: |-
      若 $(\mathrm I)$ 线性无关，$A$ 不可逆，则 $(\mathrm{II})$ 线性相关
    figures: []
