- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设 $3\times4$ 矩阵 $A$ 的秩为 $3$，$A^{\mathrm T}=(\alpha_1,\alpha_2,\alpha_3)$，$\beta$ 是 $AX=0$ 的一个非零解向量，则正确的是\ExamSelection
  choices:
  - label: A
    text: |-
      $|A^{\mathrm T}A|\ne0$
    figures: []
  - label: B
    text: |-
      $|AA^{\mathrm T}|=0$
    figures: []
