- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      设 $u(x,y)=f(x)+g(y)$ 具有二阶连续偏导数，且满足 $\left[1+\left(\dfrac{\partial u}{\partial y}\right)^2\right]\dfrac{\partial^2u}{\partial x^2}-2\dfrac{\partial u}{\partial x}\dfrac{\partial u}{\partial y}\dfrac{\partial^2u}{\partial x\partial y}+\left[1+\left(\dfrac{\partial u}{\partial x}\right)^2\right]\dfrac{\partial^2u}{\partial y^2}=0$。又已知 $f''(x)\neq0$，求 $u=u(x,y)$ 的表达式。
- number: 18
