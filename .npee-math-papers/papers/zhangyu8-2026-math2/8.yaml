      设 $a=\int_0^1e^{-t^2}\,\mathrm{d}t$，$b=\int_0^{\dfrac{1}{2}}e^{-t^2}\,\mathrm{d}t$，求整数 $m,n$ 使得 $2\int_{-\dfrac{1}{2}}^1\left(\int_0^xe^{-y^2}\,\mathrm{d}y\right)\mathrm{d}x=ma-nb+\dfrac{1}{e}-\dfrac{1}{\sqrt[4]{e}}$。
- number: 19
  section: solution
  points: 12
  stem:
    text: 设函数 $f(x)$ 在 $x=x_0$ 的某邻域 $U$ 内存在连续的二阶导数。
  subparts:
  - text: |-
      设当 $h>0,x_0-h\in U,x_0+h\in U$，恒有 $f(x_0)<\dfrac{1}{2}[f(x_0+h)+f(x_0-h)]\quad(*)$，证明 $f''(x_0)\geqslant0$；
  - text: |-
      如果 $f''(x_0)>0$，证明必存在 $h>0,x_0-h\in U,x_0+h\in U$，使上述 $(*)$ 式成立。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)=\begin{cases}\dfrac{g(x)-y(x)}{x},&x\neq0,\\a,&x=0,\end{cases}$，其中 $g(x)$ 有连续的二阶导数，$g'(0)=g''(0)=1$，$y(x)$ 是由方程 $(*)\quad x+y=xy+1$ 确定的隐函数。若 $f(x)$ 在 $x=0$ 处连续，求 $f'(0)$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 在 $(0,+\infty)$ 内可导，对任意的 $s>0,t>0$，均有 $\int_1^{st}f(x)\,\mathrm{d}x+\ln t^s+\ln s^t=\int_1^t\left[sf(x)+\dfrac{1}{x}\right]\mathrm{d}x+\int_1^s\left[tf(x)+\dfrac{1}{x}\right]\mathrm{d}x$ 成立，且 $f(1)=2$，求 $f(x)$ 的表达式。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $A$ 为 3 阶矩阵，$\lambda_1,\lambda_2,\lambda_3$ 是 $A$ 的 3 个不同的特征值，其对应的特征向量为 $\xi_1,\xi_2,\xi_3$，$\alpha=\xi_1+\xi_2+\xi_3$，$P=(\alpha,A\alpha,A^2\alpha)$。
  subparts:
  - text: 证明 $P$ 可逆；
  - text: |-
      若 $(A^3-A)\alpha=0$，求 $|A-3E|$。
