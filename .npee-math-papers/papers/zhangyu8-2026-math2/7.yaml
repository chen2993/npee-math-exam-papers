      设非负函数 $f(x)$ 在 $[0,+\infty)$ 上连续，给出以下四个命题：\n①若 $\int_0^{+\infty}f^2(x)\,\mathrm{d}x$ 收敛，则 $\int_0^{+\infty}f(x)\,\mathrm{d}x$ 收敛；\n②若 $\int_0^{+\infty}f(x)\,\mathrm{d}x$ 收敛，则 $\int_0^{+\infty}f^2(x)\,\mathrm{d}x$ 收敛；\n③若 $\lim_{x\to+\infty}x^2f(x)$ 存在，则 $\int_0^{+\infty}f(x)\,\mathrm{d}x$ 收敛；\n④若 $\int_0^{+\infty}f(x)\,\mathrm{d}x$ 收敛，则 $\lim_{x\to+\infty}x^2f(x)$ 存在。\n其中，真命题的个数为\ExamSelection。
  choices:
  - label: A
    text: $1$
    figures: []
  - label: B
    text: $2$
    figures: []
  - label: C
    text: $3$
    figures: []
