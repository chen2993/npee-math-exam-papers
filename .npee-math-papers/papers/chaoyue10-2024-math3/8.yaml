      已知随机变量 $(X,Y)$ 的密度函数为 $f(x,y)=\begin{cases}\dfrac{1-|1-x|}{2x},&|y|<x<2,\\0,&\text{其他},\end{cases}$ 随机变量 $Z$ 分布律为 $\mathrm{P}(Z=-1)=\mathrm{P}(Z=1)=\dfrac{1}{2}$，且 $Z$ 与 $(X,Y)$ 相互独立。
