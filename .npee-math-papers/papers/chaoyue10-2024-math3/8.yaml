    text: |-
      设曲线 $L:y=\cos x$，$L_1$ 与 $L_2$ 分别为 $L$ 上点 $(-\dfrac{\pi}{2},0)$ 与 $(\dfrac{\pi}{2},0)$ 处的切线，若函数 $f(x,y)$ 在 $L,L_1$ 与 $L_2$ 所围闭区域 $D$ 上连续，则下列等式成立的有 ① $\iint_D f(x,y)\,\mathrm{d}\sigma=\int_{-\pi/2}^{\pi/2}\mathrm{d}x\int_{\cos x}^{\pi/2}f(x,y)\,\mathrm{d}y$；② $\iint_D f(x,y)\,\mathrm{d}\sigma=\int_0^{\pi/2}\mathrm{d}y\int_{y-\pi/2}^{\pi/2-y}f(x,y)\,\mathrm{d}x$；③ $\iint_D f(x,y)\,\mathrm{d}\sigma=2\int_0^1\mathrm{d}y\int_{\arccos y}^{\pi/2-y}f(x,y)\,\mathrm{d}x+\int_1^{\pi/2}\mathrm{d}y\int_{y-\pi/2}^{\pi/2-y}f(x,y)\,\mathrm{d}x$；④ $\iint_D f(x,y)\,\mathrm{d}\sigma=\int_{-\pi/2}^0\mathrm{d}x\int_{\cos x}^{\pi/2+x}f(x,y)\,\mathrm{d}y+\int_0^{\pi/2}\mathrm{d}x\int_{\cos x}^{\pi/2-x}f(x,y)\,\mathrm{d}y$。正确的个数是\ExamSelection。
  choices:
