- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $y=y(x)$ 在点 $x=0$ 附近由方程 $2x-\int_0^y e^{-t^2}\,\mathrm{d}t=xy$ 所确定，且 $y(x)=\lambda_1x+\lambda_2x^2+o(x^2)$（$x\to0$），则 $(\lambda_1,\lambda_2)=$\ExamSelection。
  choices:
  - label: A
    text: $(2,2)$
    figures: []
  - label: B
    text: $(2,-2)$
    figures: []
  - label: C
    text: $(2,4)$
    figures: []
  - label: D
    text: $(2,-4)$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x,y)=\begin{cases}\dfrac{xy}{(x^2+y^2)^p},&x^2+y^2\ne0,\\0,&x^2+y^2=0,\end{cases}\quad g(x,y)=\begin{cases}\dfrac{1}{(xy)^q}\sin xy,&xy\ne0,\\0,&xy=0,\end{cases}$，$f(x,y)$ 和 $g(x,y)$ 在 $(0,0)$ 点连续的一个充分条件为\ExamSelection。
  choices:
  - label: A
    text: $p<1,q<1$
    figures: []
  - label: B
    text: $p<1,q>1$
    figures: []
  - label: C
    text: $p>1,q<1$
    figures: []
  - label: D
    text: $p>1,q>1$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
