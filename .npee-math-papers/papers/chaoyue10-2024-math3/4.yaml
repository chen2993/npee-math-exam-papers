- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X$ 与 $Y$ 相互独立，$X$ 在 $[0,2]$ 上服从均匀分布，$Y\sim E(1)$，令随机变量 $Z=\begin{cases}Y,&X\le1,\\X,&X>1.\end{cases}$，求：
  subparts:
  - text: $Z$ 的概率密度；
  - text: |-
      $\operatorname{Cov}(X,Z)$。
