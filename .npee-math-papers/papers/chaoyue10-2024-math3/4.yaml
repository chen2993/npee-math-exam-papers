- number: 19
  section: solution
  points: 12
  stem:
    text: 已知曲线 $y=f(x)$（$x>0$）是微分方程 $2y''+y'-y=(4-6x)e^{-x}$ 的一条积分曲线，此曲线通过原点，且在原点的切线斜率为 0，试求：
  subparts:
  - text: 曲线 $y=f(x)$ 到 $x$ 轴的最大距离；
  - text: |-
      计算 $\int_0^{+\infty}f(x)\,\mathrm{d}x$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      （Ⅰ）设 $f(x)$ 在区间 $[0,1]$ 上具有连续导数，且 $f(0)=0$，证明级数 $\sum_{n=1}^{\infty}\int_0^{\frac1n}f(x)\,\mathrm{d}x$ 绝对收敛；（Ⅱ）判别级数 $\sum_{n=1}^{\infty}\left[\dfrac1n-\ln\left(\sin\dfrac1n+\cos\dfrac1n\right)\right]$ 的收敛性，若收敛，则进一步判断条件收敛还是绝对收敛。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $A,B$ 均为 3 阶方阵，其中 $A$ 为实对称矩阵，$A=(a_{ij})_{3\times3},a_{11}=2$，$B=\begin{pmatrix}1&0&-1\\-1&0&1\\0&2&0\end{pmatrix}$，且满足 $(A-E)B=O$。
  subparts:
  - text: 求矩阵 $A$；
  - text: |-
