  stem:
    text: |-
      设 $A$ 为 $3$ 阶矩阵，$\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\boldsymbol{\alpha}_3$ 为 $3$ 维列向量，已知 $A\boldsymbol{\alpha}_1=\boldsymbol{\alpha}_2,A^2\boldsymbol{\alpha}_1=\boldsymbol{\alpha}_3,A^3\boldsymbol{\alpha}_1=0,\boldsymbol{\alpha}_3\ne 0$，
  subparts:
  - text: |-
      证明：对任意常数 $k$，向量组 $k\boldsymbol{\alpha}_1+\boldsymbol{\alpha}_2,-\boldsymbol{\alpha}_2+\boldsymbol{\alpha}_3,\boldsymbol{\alpha}_1-k\boldsymbol{\alpha}_3$ 线性无关；
  - text: 求 $A$ 所有特征值与特征向量，问 $A$ 能否相似于一个对角阵？说明理由；
  - text: |-
