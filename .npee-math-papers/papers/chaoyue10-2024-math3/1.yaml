- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $Y\sim N(0,1)$，在给定 $Y=y$（$-\infty<y<+\infty$）的条件下随机变量 $X\sim N(\dfrac{y}{2},\dfrac{3}{4})$，记 $U=X+2Y,V=\dfrac{5}{2}X-2Y$，求：
  subparts:
  - text: $(X,Y)$ 的概率密度 $f(x,y)$；
  - text: |-
      协方差 $\mathrm{Cov}(U,V)$；
  - text: 判断 $U$ 和 $V$ 的独立性，并说明理由。
