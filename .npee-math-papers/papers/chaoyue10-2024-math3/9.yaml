- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设总体 $X$ 的密度函数为 $f(x)=\begin{cases}\alpha\beta x^{\alpha-1}e^{-\beta x^\alpha},&x>0,\\0,&x\leq0,\end{cases}\quad\alpha,\beta>0$。（Ⅰ）若 $\alpha=2$ 已知，求未知参数 $\beta$ 的矩估计量 $\hat\beta_M$；（Ⅱ）若 $\alpha$ 已知，求未知参数 $\beta$ 的极大似然估计量 $\hat\beta_L$；（Ⅲ）求 $\mathrm E(X_1^\alpha\hat\beta_L)$。
