  stem:
    text: |-
      当 $x>0$ 时，求极限 $\lim\limits_{\substack{x\to0\\y\to0}}\dfrac{x^2+y^2}{\sqrt{x^2+y^2}+x}$。
  subparts:
  - text: |-
      求极限 $\lim_{\substack{x\to0\\y\to0}}\dfrac{x^2+y^2}{\sqrt{x^2+y^2}+x}$。
  - text: |-
      计算二重积分 $I=\iint_D\dfrac{x^2+y^2}{\sqrt{x^2+y^2}+x}\,\mathrm{d}\sigma$，其中 $D$ 是由 $x=\sqrt{y-y^2}$，$y=\sqrt{1-x^2}$ 以及 $x$ 轴所围位于第一象限区域。
- number: 21
