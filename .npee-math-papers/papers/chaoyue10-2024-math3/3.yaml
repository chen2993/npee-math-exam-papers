  - text: |-
      若 $\boldsymbol{\gamma}=(1,0,4)^{\mathrm{T}}$，求 $A^{2024}\boldsymbol{\gamma}$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X_1,X_2,X_3,X_4$ 相互独立，$X_1$ 与 $X_2$ 同分布且 $X_1\sim E(1)$，$X_3$ 与 $X_4$ 同分布且 $X_3\sim\begin{pmatrix}-1&1\\\dfrac{1}{2}&\dfrac{1}{2}\end{pmatrix}$，记 $Y=\min\{X_1,X_2\}+\max\{X_3,X_4\}$。
  subparts:
  - text: 求 $Y$ 的分布函数 $F_Y(y)$ 及概率密度 $f_Y(y)$；
  - text: |-
      求 $\mathrm{E}Y$ 和 $\mathrm{D}Y$。
