- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 是在 $(-\infty,+\infty)$ 内以 $T$ 为周期的连续函数，以下命题中正确的个数为\ExamSelection。① 若 $\int_0^T f(x)\,\mathrm{d}x=0$，则 $\int_0^x f(t)\,\mathrm{d}t$ 是以 $T$ 为周期的函数；② 若 $f(x)$ 是奇函数，则 $\int_0^x f(t)\,\mathrm{d}t$ 是以 $T$ 为周期的函数；③ 若 $\int_0^{+\infty}f(x)\,\mathrm{d}x$ 收敛，则 $\int_0^x f(t)\,\mathrm{d}t$ 是以 $T$ 为周期的函数；④ 函数 $F(x)=\int_0^x[f(t)-f(-t)]\,\mathrm{d}t$ 是以 $T$ 为周期的函数。
  choices:
  - label: A
    text: $1$
    figures: []
  - label: B
    text: $2$
    figures: []
  - label: C
    text: $3$
    figures: []
  - label: D
    text: $4$
    figures: []
- number: 3
