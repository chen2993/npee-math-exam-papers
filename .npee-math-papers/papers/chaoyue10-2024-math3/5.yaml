- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)$ 在点 $x=0$ 的某邻域内有二阶导数，且 $f'(x)=f''(x)=0$，则\ExamSelection。
  choices:
  - label: A
    text: 点 $x=0$ 一定不是 $f(x)$ 的极值点
    figures: []
  - label: B
    text: |-
      若 $\lim_{x\to 0}\dfrac{f''(x)}{|x|}=1$，则点 $x=0$ 是 $f(x)$ 的极大值点
    figures: []
  - label: C
    text: |-
      若 $\lim_{x\to 0}\dfrac{f''(x)}{|x|}=1$，则 $(0,f(0))$ 为 $f(x)$ 的拐点
    figures: []
  - label: D
    text: |-
      若 $\lim_{x\to 0}\dfrac{f''(x)}{\sin x}=1$，则 $(0,f(0))$ 为 $f(x)$ 的拐点
    figures: []
