  stem:
    text: |-
      设曲线 $y=y(x)\,(x\geq 0)$ 是第一象限的一条凸曲线，曲线上点 $(0,1)$ 处的切线方程为 $y=x+1$，且其上任一点 $P(x,y)$ 处的切线和 $y$ 轴以及曲线 $y(x)$ 围成图形的面积恒等于 $\int_0^x t^2[y(t)+1]\,\mathrm{d}t$。求该曲线的方程。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设 $\mathrm{d}F(x,y)=2(x-y)\,\mathrm{d}x-2(x+1)\,\mathrm{d}y$，且 $F(0,0)=4$。设 $x_1=4$，$n\geq 1$ 时，$x_n,x_{n+1}$ 满足 $F(x_n,x_{n+1})=0$，证明数列 $\{x_n\}$ 收敛，并求极限 $\lim_{n\to\infty}x_n$。
