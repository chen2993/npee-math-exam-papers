- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设二维随机变量 $(X,Y)$ 的概率密度为 $f(x,y)=\begin{cases}\dfrac{2}{\theta^2}e^{-\dfrac{x+y}{\theta}},&0<x<y,\\0,&\text{其他，}\end{cases}$，其中 $\theta>0$，记 $Z=Y-X$。
  subparts:
  - text: |-
      求概率 $P\{Z<1\mid Y>1\}$；
  - text: 求 $Z$ 的概率密度 $f_Z(z)$；
  - text: |-
      若 $\theta$ 未知，设 $Z_1,Z_2,\cdots,Z_n$ 为来自总体 $Z$ 的简单随机样本，求 $\theta$ 的最大似然估计量 $\hat{\theta}$。
