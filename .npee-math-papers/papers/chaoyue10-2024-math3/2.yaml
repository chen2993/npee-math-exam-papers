  stem:
    text: |-
      设 $x>0$，$0<\alpha<1$，$0<\beta<1$，证明：（I）函数 $f(x)=\dfrac{\ln(1+\alpha x)}{\ln(1+x)}$ 单调递增；（II）$(1+\alpha x)(1+\beta x)\geq(1+x)^{\alpha+\beta}$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      （I）设 $\mathrm{d}f(x,y)=\dfrac{y(1+y^2)\,\mathrm{d}x+x\,\mathrm{d}y}{\sqrt{(1+y^2)^3}}$，且 $f(0,0)=0$，求 $f(x,y)$；（II）计算二重积分 $I=\iint_Df(x,y)\,\mathrm{d}\sigma$，其中区域 $D$ 由 $y=\sqrt{x}$，$y=2\sqrt{x}$ 和 $x=1$ 所围成。
