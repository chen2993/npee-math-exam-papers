    text: |-
      设 \(f(x)\) 在 \([-1,1]\) 上有连续的二阶导数. (I) 证明：存在 \(\xi\in[-1,1]\)，使得 \(\int_{-1}^{1}xf(x)\mathrm{d}x=\dfrac{1}{3}[2f'(\xi)+\xi f''(\xi)]\)； (II) 证明：若 \(f(x)\) 在 \((-1,1)\) 内取得极值，则存在一点 \(\eta\in(-1,1)\)，使得 \(|2f'(\eta)+\eta f''(\eta)|\geq\dfrac{1}{2}|f(1)-f(-1)|\)
- number: 22
