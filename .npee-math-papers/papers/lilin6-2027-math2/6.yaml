  stem:
    text: |-
      设 \(A=\begin{pmatrix}0&1&0\\1&0&2\\1&-1&2\end{pmatrix}\). (I) 求 3 阶可逆矩阵 \(P\) 与 \(Q\)，使得 \(PAQ=\begin{pmatrix}1&0&0\\0&1&0\\0&0&0\end{pmatrix}\)； (II) 在第 (I) 问的基础上，若记 \(B=(QP)^{-1}\)，且 \(A=BC\)，求一个可逆矩阵 \(T\) 及对角矩阵 \(\Lambda\)，使得 \(T^{-1}(C+E)^2T=\Lambda\)
