  - text: |-
      在第（II）问的基础上，若 $\boldsymbol{X}=(x_1,x_2,x_3)^{\mathrm{T}}$ 满足 $\mathrm{tr}\left[\boldsymbol{A}(\boldsymbol{C}\boldsymbol{X})(\boldsymbol{C}\boldsymbol{X})^{\mathrm{T}}\right]=0$，求 $\boldsymbol{X}$.
