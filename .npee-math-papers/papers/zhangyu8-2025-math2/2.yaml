  stem:
    text: |-
      设二次型 $f(x_1,x_2)=x_1^2-4x_1x_2+4x_2^2$，$g(x_1,x_2)$ 的二次型矩阵为 $\mathbf{B}=\begin{pmatrix}1&-1\\-1&2\end{pmatrix}$。
  subparts:
  - text: |-
      是否存在可逆矩阵 $\mathbf{D}$，使 $\mathbf{B}=\mathbf{D}^{\mathrm{T}}\mathbf{D}$？若存在，求出矩阵 $\mathbf{D}$，若不存在，请说明理由；
  - text: |-
      求 $\displaystyle\max_{\mathbf{x}\neq0}\dfrac{f(\mathbf{x})}{g(\mathbf{x})}$，其中 $\mathbf{x}=\begin{pmatrix}x_1\\x_2\end{pmatrix}$。
