- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $x=x(y)$ 满足 $y=\int\dfrac{4y^3}{4-y^6}\,\mathrm{d}x$，$L$ 为曲线 $x=x(y)\,(-2\leq y\leq-1)$，且 $x(-1)=-\dfrac{9}{16}$，记 $L$ 的长度为 $s$。
  subparts:
  - text: 求 $s$
  - text: 求 $x$ 的最大值
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设曲线 $L_1:x^2+y^2=2y$ 内切于曲线 $L_2:\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$，求 $a,b$ 的值，使 $L_2$ 所围面积最小。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设平面区域 $D=\{(x,y)\mid x^2+y^2\leq1,\,|y|\leq|x|\}$，计算 $\iint_D\dfrac{\sqrt{x^2y^2}}{\sqrt{x^2+y^2}+x^2-y^2}\,\mathrm{d}\sigma$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 是 $[0,1]$ 上的连续函数，$\int_0^1f(x)\,\mathrm{d}x=0$，$\int_0^1xf(x)\,\mathrm{d}x=1$。记 $M=\max_{x\in[0,1]}\{|f(x)|\}$。证明：
  subparts:
  - text: |-
      $\left|\int_0^1\left(x-\dfrac{1}{2}\right)f(x)\,\mathrm{d}x\right|\leq\dfrac{M}{4}$
  - text: $M>4$
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $\boldsymbol{\alpha}_1=\begin{pmatrix}1-a\\a\\a+1\end{pmatrix}$，$\boldsymbol{\alpha}_2=\begin{pmatrix}1\\1\\a+1\end{pmatrix}$，$\boldsymbol{\alpha}_3=\begin{pmatrix}1\\0\\1\end{pmatrix}$，$\boldsymbol{\beta}=\begin{pmatrix}0\\1\\2(a-1)\end{pmatrix}$，$\boldsymbol{\gamma}=k_1\boldsymbol{\alpha}_1+k_2\boldsymbol{\alpha}_2+k_3\boldsymbol{\alpha}_3$。若 $\boldsymbol{\beta}$ 不能由 $\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\boldsymbol{\alpha}_3$ 线性表示，且 $\boldsymbol{\beta}^{\mathrm{T}}\boldsymbol{\alpha}_i=\boldsymbol{\gamma}^{\mathrm{T}}\boldsymbol{\alpha}_i$，$i=1,2$，求：
  subparts:
  - text: $a$ 的值
  - text: |-
      $\boldsymbol{\gamma}$
