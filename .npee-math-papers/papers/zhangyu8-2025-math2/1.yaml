      设 $z=z(x,y)$ 二阶偏导数连续，且 $\begin{cases}u=x+ay,\\v=x+by\end{cases}(a<b)$ 可将方程 $3\dfrac{\partial^2z}{\partial x^2}-4\dfrac{\partial^2z}{\partial x\partial y}+\dfrac{\partial^2z}{\partial y^2}=0$ 化简为 $\dfrac{\partial^2z}{\partial u\partial v}=0$，$z(x,0)=\sin x,z'_y(x,0)=0$。
