- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      已知函数 $f(x),g(x)$ 分别满足 $f'(x)=2\sqrt{f(x)}$，$f(0)=1$；$g'(x)=\dfrac{g(x)}{x-2}+\dfrac{x-2}{x}$，$g(1)=0$。求曲线 $f(x)+g(y)=0$ 所围图形绕直线 $x=-1$ 旋转一周所成旋转体体积。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 $\dfrac{\partial f}{\partial x}=(x^2+y^2-4x+4)\mathrm{e}^x$，$\dfrac{\partial f}{\partial y}=2y\mathrm{e}^x$，$f(0,0)=0$，求：
  subparts:
  - text: $f(x,y)$ 的表达式；
  - text: $f(x,y)$ 的极值。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设平面区域 $D=\left\{(x,y)\mid |x|\leq y,x^2+y^2\leq\sqrt{x^2+y^2}+\dfrac{y}{2}\right\}$，计算 $\iint_D\dfrac{x+y}{\sqrt{x^2+y^2}}\,\mathrm{d}x\,\mathrm{d}y$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 在 $[0,1]$ 上有一阶连续导数，$M=\max_{0\leq x\leq1}|f(x)|$，$f(0)=f(1)=0$，证明：
  subparts:
  - text: |-
      $\left[\int_0^x f'(t)\,\mathrm{d}t\right]^2\leq x\int_0^x[f'(t)]^2\,\mathrm{d}t$，$x\in[0,1]$；
  - text: |-
      $\sqrt{\int_0^1[f'(t)]^2\,\mathrm{d}t}\geq2M$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $\boldsymbol{\alpha}=\dfrac{1}{2}(1,1,1,1)^{\mathrm{T}}$，且 $\mathbf{A}=\mathbf{E}_4-2\boldsymbol{\alpha}\boldsymbol{\alpha}^{\mathrm{T}}$。
  subparts:
  - text: |-
      求正交矩阵 $\mathbf{Q}$ 和对角矩阵 $\boldsymbol{\Lambda}$，使得 $\mathbf{Q}^{\mathrm{T}}\mathbf{A}\mathbf{Q}=\boldsymbol{\Lambda}$；
  - text: |-
      $f(\mathbf{x})=\mathbf{x}^{\mathrm{T}}\mathbf{A}\mathbf{x}$（$\mathbf{x}\in\mathbf{R}^4$）是否有最大值和最小值，说明理由。
