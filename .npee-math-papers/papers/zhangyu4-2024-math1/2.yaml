      已知函数 $f(x,y)$ 二阶偏导数连续，任给 $x,y$，均有 $f(x+1,y)=f(x,y),f(x,y+1)=f(x,y)$，且 $\displaystyle\iint_D\{[f_x'(x,y)]^2+[f_y'(x,y)]^2\}\,\mathrm{d}\sigma=a$，其中 $D=\{(x,y)\mid-1\leq x\leq1,-1\leq y\leq1\}$。
