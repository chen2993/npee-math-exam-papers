- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设连续型总体 $X$ 的分布函数为 $F(x;\theta)=\begin{cases}1-e^{-x/\theta},&x\geq0,\\0,&\text{其他，}\end{cases}$，其中 $\theta(\theta>0)$ 为未知参数，$X_1,X_2,\cdots,X_n$ 为来自总体 $X$ 的简单随机样本。
  subparts:
  - text: |-
      求 $\theta$ 的最大似然估计量；
  - text: |-
      若假设检验：$H_0:\theta=1,H_1:\theta=2$，从总体中抽取简单随机样本 $X_1,X_2$，拒绝域为 $W=\{X_1+X_2\leq1\}$，求犯第一类错误的概率。
