    text: |-
      设函数 $f(x)$ 在 $(0,+\infty)$ 上可导，给出下列命题：\textcircled{1}若曲线 $y=f(x)$ 有水平渐近线 $y=1$，则 $\lim_{x\to+\infty}f'(x)=0$；\textcircled{2}若曲线 $y=f(x)$ 有斜渐近线 $y=x$，则 $\lim_{x\to+\infty}f'(x)=1$；\textcircled{3}若 $\lim_{x\to+\infty}\dfrac{f(x)}{x}=1$，则曲线 $y=f(x)$ 的斜渐近线斜率为 $1$；\textcircled{4}若曲线 $y=f(x)$ 的斜渐近线斜率为 $1$，则 $\lim_{x\to+\infty}\dfrac{f(x)}{x}=1$。正确命题的个数为\ExamSelection
