- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $X_1,X_2,\cdots,X_n$ 是来自总体 $X$ 的简单随机样本，记 $T=\min\{X_1,X_2,\cdots,X_n\}$. 若 $T$ 的分布函数为 $F(t)=\begin{cases}1-e^{-\dfrac{n(t-\mu)}{\theta}},&t\geqslant\mu,\\0,&t<\mu.\end{cases}$ 其中 $\mu,\theta$ 为未知参数，$\theta>0$.
  subparts:
  - text: 求 $X$ 的概率密度；
  - text: |-
      求 $\mu,\theta$ 的最大似然估计量 $\hat{\mu},\hat{\theta}$；
  - text: |-
      求 $E(\hat{\theta})$.
