      设函数 $y(x)\ (x\geq0)$ 二阶可导，且 $y'(x)>0,y(0)=1$，其反函数为 $z(x)$. 过曲线 $y=y(x)$ 上任意一点 $Q(x,y(x))$ 作该曲线的法线及 $x$ 轴的垂线，上述两直线与 $x$ 轴所围成的三角形的面积记为 $S_1$，区间 $[1,y(x)]$ 上以 $y=z(x)$ 为曲边的曲边梯形面积记为 $S_2$. 若 $S_1=y^2(x)(S_2+1)$ 恒成立，求曲线 $y=y(x)$ 的方程.
