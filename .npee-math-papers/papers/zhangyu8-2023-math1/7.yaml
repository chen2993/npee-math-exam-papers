- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设平面区域 $D=\{(x,y)\mid0\leqslant x\leqslant2,0\leqslant y\leqslant2\}$。
  subparts:
  - text: |-
      求 $I=\displaystyle \iint_D|xy-1|\,\mathrm{d}x\,\mathrm{d}y$；
  - text: |-
      设 $f(x,y)$ 在 $D$ 上连续，且 $\displaystyle \iint_Df(x,y)\,\mathrm{d}x\,\mathrm{d}y=0$，$\displaystyle \iint_Dxyf(x,y)\,\mathrm{d}x\,\mathrm{d}y=1$。证明：$\exists(\xi,\eta)\in D$，使 $|f(\xi,\eta)|\geqslant\dfrac{1}{I}$。
