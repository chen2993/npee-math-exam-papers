    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      关于函数 $f(x,y)=\begin{cases}y\sin\dfrac{1}{x^2+y^2},&x^2+y^2\neq0,\\0,&x^2+y^2=0,\end{cases}$ 给出下列结论：① $f(x,y)$ 在点 $(0,0)$ 处连续；② $\left.\dfrac{\partial f}{\partial x}\right|_{(0,0)}=0$；③ $\left.\dfrac{\partial f}{\partial y}\right|_{(0,0)}=0$；④ $f(x,y)$ 在点 $(0,0)$ 处可微。其中正确的个数为\ExamSelection。
  choices:
  - label: A
    text: '1'
    figures: []
  - label: B
    text: '2'
    figures: []
  - label: C
    text: '3'
    figures: []
  - label: D
    text: '4'
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设 $a,b,c,R(R>0)$ 均为常数，$\Omega=\{(x,y,z)\mid x^2+y^2+z^2\leq R^2\}$，则三重积分 $I=\iiint_{\Omega}[(2a+b)x^2+(b-2c)y^2+(c-2b)z^2+(c-2a)xy]\,\mathrm{d}V$ 的值\ExamSelection。
  choices:
  - label: A
