      二维随机变量 $(X,Y)$ 的概率密度为 $f(x,y)=\begin{cases}2,&0\leq x\leq1,\ 0\leq y\leq1-x,\\0,&\text{其他},\end{cases}$，令 $Z=\begin{cases}0,&X+Y\leq\dfrac12,\\X+Y,&X+Y>\dfrac12.\end{cases}$
  subparts:
  - text: |-
      求 $(X,Y)$ 的分布函数 $F(x,y)$ 在点 $\left(\dfrac12,1\right)$ 处的值。
  - text: |-
      求 $Z$ 的分布函数 $F_Z(z)$，由此求 $P\{Z=0\}$，并问 $Z$ 是否是连续型随机变量？
  - text: |-
      记 $U=\max\{X,Y\}$，$V=\min\{X,Y\}$，求 $E(U+V)$。
