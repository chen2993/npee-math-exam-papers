  stem:
    text: |-
      设函数 $f(x)$ 在 $(-\infty,+\infty)$ 内有定义，分别在 $(-\infty,0)$ 和 $(0,+\infty)$ 内具有一阶连续的导数，点 $x=0$ 为 $f(x)$ 的可去间断点，则必有\ExamSelection。
  choices:
  - label: A
    text: 点 $x=0$ 是 $f'(x)$ 的可去间断点
    figures: []
  - label: B
    text: 点 $x=0$ 不是 $f'(x)$ 的可去间断点
    figures: []
  - label: C
    text: |-
      $\int_0^x f(t)\,\mathrm{d}t$ 在点 $x=0$ 处不可导
    figures: []
  - label: D
    text: |2-
       $\int_0^x f(t)\,\mathrm{d}t$ 在点 $x=0$ 处可导
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $p(x),q(x)$ 为连续函数且 $q(x)\leq 0$，若 $y=f(x)$ 为微分方程 $y''+p(x)y'+q(x)y=0$ 的解，则函数 $y=f(x)$\ExamSelection。
