  stem:
    text: |-
      设函数 $f(u)$ 在 $(0,+\infty)$ 内可导，$z=xf\left(\dfrac{y}{x}\right)+y$ 满足关系式 $x\dfrac{\partial z}{\partial x}-y\dfrac{\partial z}{\partial y}=2z$，且 $f(1)=1$，求曲线 $y=f(x)$ 的渐近线。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      已知点 $A(1,0,0)$ 与点 $B(1,1,1)$，$\Sigma$ 是由线段 $AB$ 绕 $z$ 轴旋转一周而成的旋转曲面，$\Sigma$ 取外侧，函数 $f(u)$ 具有连续导数，计算曲面积分 $I=\iint_{\Sigma}[xf(xy)+x^2]\,\mathrm{d}y\,\mathrm{d}z-[yf(xy)+2y]\,\mathrm{d}z\,\mathrm{d}x+(z+1)^2\,\mathrm{d}x\,\mathrm{d}y$。
- number: 20
