  stem:
    text: 设函数 $f(x)$ 在 $[a,b]$ 上连续。
  subparts:
  - text: |-
      证明存在 $\xi\in(a,b)$，使得 $\displaystyle\int_a^\xi f(x)\,\mathrm{d}x=(b-\xi)f(\xi)$。
  - text: |-
      如果 $f(x)$ 在 $(a,b)$ 内取得最大值和最小值，证明存在 $\eta\in(a,b)$，使得 $\displaystyle\int_a^\eta f(x)\,\mathrm{d}x=(\eta-a)f(\eta)$。
