- number: 22
  section: solution
  points: 12
  stem:
    text: 设随机变量 $X,Y$ 相互独立，均服从 $N(0,1)$。
  subparts:
  - text: 问 $(2X+Y,X-2Y)$ 是否服从二维正态分布？$2X+Y$ 与 $X-2Y$ 是否相互独立？
  - text: |-
      问 $\dfrac{2X+Y}{|X-2Y|}$ 服从何种分布？并说明理由。
  - text: |-
      求 $P\left\{\left|\dfrac{2X+Y}{X-2Y}\right|\leq1\right\}$。
