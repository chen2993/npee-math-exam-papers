- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设二元函数 $z=z(x,y)$ 的全微分为 $\mathrm{d}z=(2xy^3+a\mathrm e^y\sin x)\,\mathrm{d}x+(bx^2y^2+\mathrm e^y\cos x)\,\mathrm{d}y$，且 $z(0,0)=1$。
  subparts:
  - text: 求 $z=z(x,y)$ 的表达式。
  - text: |-
      求 $z(x,y)$ 在点 $\left(\dfrac\pi4,0\right)$ 处沿各个方向的方向导数的最大值。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      计算曲线积分 $I=\displaystyle\oint_\Gamma(x+2y+4)\,\mathrm{d}x+(4x-2y)\,\mathrm{d}y+(3x+z)\,\mathrm{d}z$，其中 $\Gamma$ 为平面 $z=x$ 上面积为 $1$ 的有限单连通小块平面片 $\Sigma$ 的边界曲线，从 $z$ 轴正向向原点看，$\Gamma$ 为逆时针方向。
- number: 20
  section: solution
  points: 12
