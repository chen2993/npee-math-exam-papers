- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设空间曲线 $\Gamma$ 为圆周 $\begin{cases}x^2+y^2+z^2=1,\\y+z=0\end{cases}$ 上从点 $(-1,0,0)$ 经过点 $\left(0,-\dfrac{\sqrt2}{2},\dfrac{\sqrt2}{2}\right)$ 到点 $(1,0,0)$ 的有向曲线段。
  subparts:
  - text: |-
      若 $P=P(x,y,z),Q=Q(x,y,z),R=R(x,y,z)$ 为 $\Gamma$ 上的连续函数，将 $\displaystyle\int_\Gamma P\,\mathrm{d}x+Q\,\mathrm{d}y+R\,\mathrm{d}z$ 转化为对弧长的曲线积分。
  - text: |-
      利用（1）中的结论，计算 $\displaystyle I=\int_\Gamma z\,\mathrm{d}x+(x+\cos x)\,\mathrm{d}y+\mathrm e^{y^2}\,\mathrm{d}z$。
- number: 20
  section: solution
  points: 12
  stem:
    text: 设 $x>0$。
  subparts:
  - text: |-
      证明：$(x+1)^3-x^3=3[x+\theta(x)]^2$，其中 $0<\theta(x)<1$。
  - text: |-
      证明（1）中的 $\theta(x)$ 是 $x(0<x<1)$ 的减函数。
  - text: |-
      当 $0<x<1$ 时，证明（1）中的 $\theta(x)$ 满足 $\dfrac12<\theta(x)<\dfrac1{\sqrt3}$。
