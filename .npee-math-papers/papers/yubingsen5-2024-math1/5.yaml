  stem:
    text: |-
      设随机变量 $X$ 在区间 $(-1,1)$ 内取值，且 $P\{X=0\}=\dfrac13$，当事件 $\{X\in(-1,0)\cup(0,1)\}$ 发生时，$X$ 在 $(-1,0)\cup(0,1)$ 内的任一子区间上取值的条件概率与该子区间的长度成正比。
  subparts:
  - text: 求 $X$ 的分布函数 $F(x)$。
  - text: 令 $Y=F(X)$，求 $Y$ 的分布函数 $F_Y(y)$。
