      设 $A$ 是 $3$ 阶矩阵，$\alpha_1=(1,2,-2)^{\mathrm{T}}$，$\alpha_2=(2,1,-1)^{\mathrm{T}}$，$\alpha_3=(1,1,k)^{\mathrm{T}}$ 是非齐次线性方程组 $AX=b$ 的解向量，则\ExamSelection。
  choices:
