  stem:
    text: |-
      设 $f(x)$ 在 $[0,+\infty)$ 上正值连续，$\{c_n\}$（$n=1,2,\cdots$）为正值数列，记 $a_n=\int_0^{c_n}f(x)\,\mathrm{d}x$，$b_n=\int_{c_n}^{c_{n+1}}f(x)\,\mathrm{d}x$，则正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      当 $b_n<0$ 时，$\{a_n\}$ 必发散
    figures: []
  - label: B
    text: |-
      当 $b_n<0$ 时，$\{a_n\}$ 必收敛
    figures: []
  - label: C
    text: |-
      当 $b_n>0$ 时，$\{a_n\}$ 必发散
    figures: []
  - label: D
    text: |-
      当 $b_n>0$ 时，$\{a_n\}$ 必收敛
    figures: []
