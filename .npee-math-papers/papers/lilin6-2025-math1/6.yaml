    text: |-
      设 $f(x)$ 在 $[0,1]$ 上可导，$f(x)>0$，$f'(x)<0$，$F(x)=\int_0^x f(t)\,\mathrm{d}t$，则在 $x\in(0,1)$ 内，有\ExamSelection。
