- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设可微函数 $f(x,y)$ 在点 $P(x,y)$ 处沿 $l_1=(-1,0)$ 与 $l_2=(0,-1)$ 的方向导数分别为 $x^2-y$ 与 $1-x$，且 $f(1,1)=-\dfrac{1}{3}$。
  subparts:
  - text: 求 $f(x,y)$；
  - text: |-
      求 $f(x,y)$ 在 $D=\{(x,y)\mid 0\leq y\leq7-x,0\leq x\leq7\}$ 上的最大值。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设平面曲线 $L$ 为 $|\ln x|+|\ln y|=1$，取逆时针方向，计算 $I=\oint_L\dfrac{-y\,\mathrm{d}x+x\,\mathrm{d}y}{|\ln x|+|\ln y|}$。
- number: 20
  section: solution
  points: 12
  stem:
    text: 设 $f(x)$ 在 $[-1,1]$ 上有连续的二阶导数，证明：
  subparts:
  - text: |-
      存在一点 $\xi\in[-1,1]$，使得 $\int_{-1}^1xf(x)\,\mathrm{d}x=\dfrac{1}{3}[2f'(\xi)+\xi f''(\xi)]$；
  - text: |-
      若 $f(x)$ 在 $(-1,1)$ 内取得极值，则存在一点 $\eta\in(-1,1)$，使得 $|2f'(\eta)+\eta f''(\eta)|\geq\dfrac{1}{2}|f(1)-f(-1)|$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $\alpha$ 为 $3$ 维非零实列向量，$E$ 为 $3$ 阶单位矩阵，$A=E-\dfrac{k}{\alpha^{\mathrm{T}}\alpha}\alpha\alpha^{\mathrm{T}}$，$\lambda=-2$ 是 $A$ 的特征值。
  subparts:
  - text: 计算 $A^2+A$，并求 $k$ 的值；
  - text: |-
      对于（I）中的 $k$ 值，若 $\alpha=(k,k,k)^{\mathrm{T}}$，求正交变换 $X=QY$，将二次型 $f(x_1,x_2,x_3)=X^{\mathrm{T}}AX$ 化为标准形。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设二维随机变量 $(X,Y)$ 的概率密度为 $f(x,y)=\begin{cases}2e^{-(x+y)},&0<x<y,\\0,&\text{其他}\text{。}\end{cases}$
  subparts:
  - text: 求 $(X,Y)$ 的联合分布函数 $F(x,y)$；
  - text: |-
      求 $P\left(X+Y>1\mid X<\dfrac{1}{2}\right)$；
  - text: 求 $E(Y-X)$。
