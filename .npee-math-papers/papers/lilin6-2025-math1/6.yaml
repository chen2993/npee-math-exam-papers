- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $A,B$ 分别为 $m\times n,n\times s$ 矩阵，且 $AB=C$，则正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      若 $r(C)=m$，则 $r(A)\leq m$
    figures: []
  - label: B
    text: |-
      若 $r(C)=s$，则 $r(B)\leq s$
    figures: []
