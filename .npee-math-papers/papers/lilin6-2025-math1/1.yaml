- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X$ 与 $Y$ 相互独立，$X\sim N(0,\sigma^2)$（$\sigma>0$），$Y$ 的分布律为 $P\{Y=-1\}=a$，$P\{Y=1\}=1-a$（$0<a<1$），记 $Z=XY$。
  subparts:
  - text: 求 $Z$ 的概率密度 $f_Z(z)$；
  - text: 当 $a$ 为何值时，$X$ 与 $Z$ 不相关；
  - text: |-
      若 $Z_1,Z_2,\cdots,Z_n$ 为来自总体 $Z$ 的简单随机样本，$\overline{Z}$ 为样本均值，$S^2$ 为样本方差，记 $T=\overline{Z}^2-S^2$，求 $DT$。
