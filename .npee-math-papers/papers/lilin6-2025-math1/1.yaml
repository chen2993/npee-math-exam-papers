- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设曲面 $\Sigma:z=x^2+y^2$（$z\leq1$）与平面 $z=1$ 所围均匀立体为 $V$，$M$ 为 $\Sigma$ 上一动点，曲面 $\Sigma$ 在点 $M$ 的切平面与 $V$ 的质心距离最近时，点 $M$ 的轨迹方程记为 $L$。
  subparts:
  - text: 求 $V$ 的质心坐标；
  - text: |-
      求曲线 $L$，并计算 $I=\oint_Lx\,\mathrm{d}y-y\,\mathrm{d}x+z\,\mathrm{d}z$，从 $Oz$ 轴的正向往负向看去，$L$ 取逆时针方向。
