- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x_1,x_2,x_3)=X^{\mathrm T}AX=2x_1^2+ax_2^2+ax_3^2-4x_2x_3$（$A^{\mathrm T}=A$）是正定二次型，且 $A$ 有二重特征值，$A'$ 是 $A$ 的伴随矩阵。
  subparts:
  - text: |-
      求 $a$ 的值，并求正交变换 $X=QY$，将二次型 $X^{\mathrm T}(A+A')X$ 化为标准形；
  - text: |-
      求可逆矩阵 $P$，使得 $A=P^{\mathrm T}P$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设二维随机变量 $(X,Y)$ 的概率密度为 $f(x,y)=\dfrac{1}{2\pi\sigma^2}e^{-\dfrac{x^2+y^2}{2\sigma^2}}$，$(x,y)\in\mathbb R^2,\sigma>0$。记 $Z=X^2+Y^2$。
  subparts:
  - text: 求 $Z$ 的概率密度 $f_Z(z)$ 及 $EZ$；
  - text: |-
      若 $Z_1,Z_2,\cdots,Z_n$ 为来自总体 $Z$ 的简单随机样本，求 $\sigma^2$ 的最大似然估计量 $\widehat{\sigma^2}$。
