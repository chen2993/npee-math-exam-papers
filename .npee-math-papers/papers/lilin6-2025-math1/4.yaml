      在第（Ⅱ）问的基础上，若 $\theta(0<\theta<\dfrac{1}{2})$ 为未知参数，利用总体 $Z$ 的如下样本值：$-2,0,0,0,2,2$，求 $\theta$ 的矩估计和最大似然估计。
