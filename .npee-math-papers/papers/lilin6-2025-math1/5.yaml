- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设球面 $x^2+y^2+z^2=4x\ (z\geq0)$ 的方向朝上，$L$ 为该球面与柱面 $x^2+y^2=2x$ 的交线，$L$ 的方向与 $L$ 所围曲面的方向符合右手法则。计算 $I=\oint_L(y^2+z^2)\,\mathrm{d}x+(z^2+x^2)\,\mathrm{d}y+(x^2+y^2)\,\mathrm{d}z$。
- number: 21
