  - text: 求 $y=f(x)$ 的极值与拐点；
  - text: 当 $0<x_1<1<x_2$ 时，有 $f(x_1)=f(x_2)$，证明：$x_1+x_2>2$。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设 $D_t=\{(x,y)\mid0\leq x\leq t,0\leq y\leq x,t>0\}$，$f''(x)$ 连续，且 $f''(0)=1$，$I(t)=\iint_{D_t}\sqrt{(t-x)(t-y)}f''(y)\,\mathrm{d}x\,\mathrm{d}y$，求 $\lim_{t\to0^+}\dfrac{I(t)}{t^3}$。
- number: 19
