- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X$ 与 $Y$ 相互独立，$X$ 服从参数为 $\lambda\ (\lambda>0)$ 的指数分布，$Y$ 的概率分布为 $P\{Y=-1\}=\dfrac{1}{3}$，$P\{Y=1\}=\dfrac{2}{3}$。记 $Z=XY$。
  subparts:
  - text: 求 $Z$ 的概率密度 $f_Z(z)$；
  - text: |-
      求 $\operatorname{Cov}(X,Z)$；
  - text: |-
      若 $Z_1,Z_2,\cdots,Z_n$ 为总体 $Z$ 的简单随机样本，求 $\lambda$ 的矩估计量 $\hat\lambda$。
