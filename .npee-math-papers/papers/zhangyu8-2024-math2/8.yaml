  points: 5
  stem:
    text: |-
      当 $x\to 0$ 时，以下无穷小中，阶数最高的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\displaystyle\int_0^{\sin x}(1+t)^{\dfrac{2}{t}}\,\mathrm{d}t$
    figures: []
  - label: B
    text: |-
      $\displaystyle\int_0^{\ln(1+x^2)}\sqrt{\cos^3 t}\,\mathrm{d}t$
    figures: []
  - label: C
    text: |-
      $\displaystyle\int_0^x(e^{\cos t}-e^{\sin t})\,\mathrm{d}t$
    figures: []
  - label: D
    text: |-
      $\displaystyle\int_0^{x-\tan x}\arctan t\,\mathrm{d}t$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $f_n(x)=x^{n-1}e^{\dfrac{1}{x}},\ n=1,2,\cdots,\ x\ne 0$，则 $f_n^{(n)}(x)=$\ExamSelection。
  choices:
  - label: A
    text: |-
      $\dfrac{1}{x^n}e^{\dfrac{1}{x}}$
    figures: []
  - label: B
    text: |-
      $\dfrac{(-1)^n}{x^n}e^{\dfrac{1}{x}}$
    figures: []
  - label: C
    text: |-
      $\dfrac{1}{x^{n+1}}e^{\dfrac{1}{x}}$
    figures: []
  - label: D
    text: |-
      $\dfrac{(-1)^n}{x^{n+1}}e^{\dfrac{1}{x}}$
    figures: []
- number: 3
