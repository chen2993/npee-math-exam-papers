- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      已知 $a_n=\displaystyle\int_0^1t^n|\ln t|\,\mathrm{d}t,\ n=1,2,\cdots$，计算 $\displaystyle\lim_{n\to\infty}(n^2a_n)^n$。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $u=xz+ay^3\ (z\geq 0)$，且 $x^2+y^2+z^2=1$。
  subparts:
  - text: |-
      当 $a=\dfrac{1}{3}$ 时，求 $u$ 的最大值；
  - text: 当 $a=t$（$t$ 为变量）时，$u$ 是否有最大值，若有，求出最大值，若没有，说明理由。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      计算二重积分 $\displaystyle\iint_D\left|x^2+y^2-\sqrt{2}(x+y)\right|\,\mathrm{d}x\,\mathrm{d}y$，其中 $D=\{(x,y)\mid x^2+y^2\leq 4\}$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $a_n=\displaystyle\int_0^{+\infty}xn^{-\dfrac{x}{n}}\,\mathrm{d}x,\ n=2,3,\cdots$，求 $\{a_n\}$ 的最小值。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      已知函数 $y=y(x)$ 满足 $x(\ln x-1)y'(x)+(3-\ln x^2)y(x)=0,\ x>e$，且 $y(e^2)=\dfrac{e^4}{2}$，求 $y=y(x)$ 的最小值。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      已知 $3$ 维列向量 $\xi$ 不是 $A^2x=0$ 的解，$A\xi$ 是 $A^2x=0$ 的解。记 $P=(\xi,A\xi,A^2\xi)$。
  subparts:
  - text: 证明 $P$ 可逆；
  - text: $A$ 能否相似对角化？若能，求出一个与之相似的对角矩阵，若不能，请说明理由。
