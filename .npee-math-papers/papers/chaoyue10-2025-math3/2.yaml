- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设 $I_k=\displaystyle\iint_{D_k}(xy^2e^{-x^2}+x^2\sin(x^2+y^2))\,\mathrm{d}\sigma,k=1,2,3$，其中 $D_1:x^2+y^2\leq\dfrac{\pi}{2}$，$D_2:x^2+y^2\leq\pi$，$D_3:x^2+y^2\leq2\pi$，则 $I_1,I_2,I_3$ 三者的大小关系为\ExamSelection。
  choices:
  - label: A
    text: |-
      $I_1\leq I_2\leq I_3$
    figures: []
  - label: B
    text: |-
      $I_3\leq I_2\leq I_1$
    figures: []
  - label: C
    text: |-
      $I_1\leq I_3\leq I_2$
    figures: []
  - label: D
    text: |-
      $I_3\leq I_1\leq I_2$
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设 $y=f(x)$ 是微分方程 $y'-P(x)y=\dfrac{1}{2}e^x-1$ 满足 $y(0)=1$ 的解，其中 $P(x)=\displaystyle\int_0^1|x-t|\,\mathrm{d}t$，则有\ExamSelection。
  choices:
  - label: A
    text: 在点 $x=0$ 处 $f(x)$ 取极大值
    figures: []
  - label: B
    text: 在点 $x=0$ 处 $f(x)$ 取极小值
    figures: []
  - label: C
    text: $(0,f(0))$ 为曲线 $y=f(x)$ 的拐点
    figures: []
  - label: D
    text: 点 $x=0$ 不是 $f(x)$ 的极值点，点 $(0,f(0))$ 也不是曲线 $y=f(x)$ 的拐点
    figures: []
