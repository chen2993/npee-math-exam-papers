  stem:
    text: |-
      设 $A$ 是 $4\times 3$ 矩阵，$A$ 的列向量组线性无关，则下列结论中：① $A^{\mathrm{T}}x=0$ 有非零解；② 对任意 $3$ 维列向量 $\beta$，$A^{\mathrm{T}}x=\beta$ 有无穷多解；③ $A^{\mathrm{T}}Ax=0$ 只有零解；④ 对 $4\times 3$ 矩阵 $B$ 和 $C$，若 $AB=AC$，则 $B=C$。正确的个数为\ExamSelection。
  choices:
  - label: A
    text: $1$
    figures: []
  - label: B
    text: $2$
    figures: []
  - label: C
    text: $3$
    figures: []
  - label: D
    text: $4$
    figures: []
