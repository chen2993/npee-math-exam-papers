  stem:
    text: |-
      当 $x\to 0$ 时，下列无穷小量中阶数最高的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\displaystyle\int_{x^2}^{x^3}\sqrt{1-\sqrt{\cos t}}\,\mathrm{d}t$
