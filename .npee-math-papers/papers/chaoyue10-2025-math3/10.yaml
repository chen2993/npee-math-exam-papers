      $\displaystyle\int_{\sin x}^{2x}\sin^2t\,\mathrm{d}t$
    figures: []
  - label: C
    text: |-
      $\displaystyle\int_x^{\sin x}(e^{t^2}-1)\,\mathrm{d}t$
    figures: []
  - label: D
    text: |-
      $\displaystyle\int_0^{1-\cos x}\ln(1+\sqrt{t})\,\mathrm{d}t$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(u,v)$ 为可微函数，$z=z(x,y)$ 是由方程 $f(u,v)=0$，$u=x^2-yz$，$v=y^2-xz$ 确定的二元函数，且 $yf'_1+xf'_2\ne 0$，则 $\dfrac{y}{x}\dfrac{\partial z}{\partial x}+\dfrac{x}{y}\dfrac{\partial z}{\partial y}=$\ExamSelection。
  choices:
  - label: A
    text: $0$
    figures: []
  - label: B
    text: |-
      $2-\dfrac{z(x^2f'_1+y^2f'_2)}{xy(yf'_1+xf'_2)}$
    figures: []
  - label: C
    text: $f'_1-f'_2$
    figures: []
  - label: D
    text: $f'_1+f'_2$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设数列 $u_n=\begin{cases}1,&n=k^2,\\\dfrac{1}{n^2},&n\in\mathbb{Z}^+,\ n\ne k^2,\end{cases}\ k=1,2,\cdots$，则下列结论正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\displaystyle\sum_{n=1}^{\infty}u_n$ 收敛，$\displaystyle\sum_{n=1}^{\infty}\dfrac{u_n}{1+nu_n}$ 也收敛
    figures: []
  - label: B
    text: |-
      $\displaystyle\sum_{n=1}^{\infty}u_n$ 发散，$\displaystyle\sum_{n=1}^{\infty}\dfrac{u_n}{1+nu_n}$ 收敛
    figures: []
  - label: C
    text: |-
      $\displaystyle\sum_{n=1}^{\infty}u_n$ 收敛，$\displaystyle\sum_{n=1}^{\infty}\dfrac{u_n}{1+nu_n}$ 发散
    figures: []
  - label: D
    text: |-
      $\displaystyle\sum_{n=1}^{\infty}u_n$ 发散，$\displaystyle\sum_{n=1}^{\infty}\dfrac{u_n}{1+nu_n}$ 也发散
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 在点 $x=1$ 处二阶可导，且 $f(1)\ne 0$，若 $\displaystyle\lim_{x\to 0}\left(\dfrac{f(\cos x)}{f(1)}\right)^{\dfrac{1}{x^4}}=e$，则下列说法错误的是\ExamSelection。
  choices:
  - label: A
    text: $f'(1)=0$
    figures: []
