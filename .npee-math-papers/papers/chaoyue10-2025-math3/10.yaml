- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 在 $[0,1]$ 上二阶可导，满足 $\displaystyle\lim_{x\to 0^+}\dfrac{f(x)-f(1)}{x^2}=2$。证明：
  subparts:
  - text: |-
      存在 $\xi\in(0,1)$，有 $f''(\xi)=0$；
  - text: |-
      存在 $\eta\in(0,1)$，使得 $f'(\eta)=\dfrac{f(\eta)-f(0)}{\eta}$。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      求 $f(x,y)=\dfrac{4}{3}x^2+y^2+\dfrac{4}{3}x$ 在 $D:x^2+\dfrac{3}{4}y^2\leq 1$ 上的最大值和最小值。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $D=\{(x,y)\mid 0\leq x\leq\sqrt{\pi},\ 0\leq y\leq\sqrt{\pi}\}$，记 $I_1=\displaystyle\iint_D\sin(\max\{x^2,y^2\})\,\mathrm{d}x\mathrm{d}y$，$I_2=\displaystyle\iint_D\sin(\min\{x^2,y^2\})\,\mathrm{d}x\mathrm{d}y$，证明 $I_2<I_1$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设二次型 $f(x_1,x_2,x_3)$ 的矩阵为 $A$，满足 $|A-2E|=0$ 且 $AB=0$，其中 $B=\begin{pmatrix}-1&-1&1\\1&0&1\\0&1&-2\end{pmatrix}$。用正交变换化该二次形为标准形，求出该正交变换和矩阵 $A$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X$ 在 $(0,\pi)$ 上服从均匀分布，$Y$ 的分布律为 $P\{Y=i\}=\dfrac{|i|}{2}$，$i=-1,1$，且 $X$ 和 $Y$ 相互独立，记 $U=\sin X$，$V=Y+U$。
  subparts:
  - text: 求 $U$ 的概率密度函数 $f_U(u)$；
  - text: 求 $V$ 的概率密度函数 $f_V(v)$；
  - text: |-
      求协方差 $\operatorname{Cov}(U,V)$。
