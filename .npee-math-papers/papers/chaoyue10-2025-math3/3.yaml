- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      当 $x\to 0^+$ 时，下列式子正确的个数为\ExamSelection。① $\dfrac{1}{\ln x}\sim\dfrac{1}{\ln\sin x}$；② $\int_0^x t^2\,\mathrm{d}t\sim\int_0^x\sin^2t\,\mathrm{d}t$；③ $(1+\sin x)^x-1\sim(1+x)^{\sin x}-1$。
  choices:
  - label: A
    text: '0'
    figures: []
  - label: B
    text: '1'
    figures: []
  - label: C
    text: '2'
    figures: []
  - label: D
    text: '3'
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      级数 $\sum_{n=1}^{\infty}\ln\left(1+\sin\dfrac{1}{n^\alpha}\right)$ 收敛，级数 $\sum_{n=1}^{\infty}n^{\alpha-1}\ln\cos\dfrac{1}{n}$ 也收敛，则参数 $\alpha$ 的取值范围\ExamSelection。
  choices:
  - label: A
    text: |-
      $\alpha<1$
    figures: []
  - label: B
    text: |-
      $1<\alpha<2$
    figures: []
  - label: C
    text: |-
      $2<\alpha<3$
    figures: []
  - label: D
    text: |-
      $3<\alpha$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设 $f,\varphi$ 具有一阶连续偏导数，且 $\varphi_z'(x,y,z)\ne0$，已知 $P_0(x_0,y_0,z_0)$ 是函数 $u=f(x,y,z)$ 在条件 $\varphi(x,y,z)=0$ 下的一个极值点，则下列选项正确的是\ExamSelection。
  choices:
  - label: A
    text: 若 $f_x'(x_0,y_0,z_0)=0$，则 $f_z'(x_0,y_0,z_0)=0$
    figures: []
  - label: B
    text: 若 $f_y'(x_0,y_0,z_0)=0$，则 $f_z'(x_0,y_0,z_0)=0$
    figures: []
  - label: C
    text: 若 $f_z'(x_0,y_0,z_0)=0$，则 $f_x'(x_0,y_0,z_0)=0$ 且 $f_y'(x_0,y_0,z_0)=0$
    figures: []
  - label: D
    text: |-
      若 $f_z'(x_0,y_0,z_0)\ne0$，则 $f_x'(x_0,y_0,z_0)\ne0$ 且 $f_y'(x_0,y_0,z_0)\ne0$
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 在 $(0,+\infty)$ 内二阶可导，则下列说法正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      若 $f(x)$ 在 $(0,+\infty)$ 内有界，则 $\lim_{x\to+\infty}f'(x)=0$
    figures: []
  - label: B
    text: |-
      若 $f(x)$ 和 $f'(x)$ 在 $(0,+\infty)$ 内均有界，则 $\lim_{x\to+\infty}f''(x)=0$
    figures: []
  - label: C
    text: |-
      若 $f'(x)$ 在 $(0,+\infty)$ 内有界，则 $f(x)$ 在 $(0,+\infty)$ 内一定有界
    figures: []
  - label: D
    text: |-
      若 $f(x),f''(x)$ 在 $(0,+\infty)$ 内有界，则 $f'(x)$ 在 $(0,+\infty)$ 内一定有界
    figures: []
