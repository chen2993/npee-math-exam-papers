  stem:
    text: |-
      设 $f_{xy}''(x,y)=2$，且 $f_x'(x,0)=2x-4,f(0,y)=-y^2$。（Ⅰ）求 $f(x,y)$；（Ⅱ）求函数 $f(x,y)$ 在区域 $D=\{(x,y)\mid x+y\leq4,y\geq0,x\geq0\}$ 上的最大值和最小值。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      计算二重积分 $I=\iint_D\dfrac{x^3y+x}{\sqrt{x^2+y^2}}\,\mathrm{d}\sigma$，其中区域 $D=\{(x,y)\mid |x|+|y|\geq1,x^2+y^2\leq1,x\geq0\}$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 在 $[-1,1]$ 上连续，在点 $x=0$ 处可导且 $f'(0)\ne0$。（Ⅰ）证明对任意 $x\in[0,1]$，存在 $\theta\in(0,1)$，使得 $\int_0^xf(t)\,\mathrm{d}t+\int_0^{-x}f(t)\,\mathrm{d}t=x[f(\theta x)-f(-\theta x)]$；（Ⅱ）求极限 $\lim_{x\to0^+}\theta$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $A$ 为 2 阶实矩阵，且 $A^2+E=O$。证明：（Ⅰ）$A^{\mathsf T}\ne A$；（Ⅱ）令 $P=(\alpha,A\alpha)$，$\alpha$ 为任意 2 维非零列向量，证明 $P$ 可逆；（Ⅲ）$A$ 与矩阵 $B=\begin{pmatrix}0&-1\\1&0\end{pmatrix}$ 相似。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $X$ 的概率密度为 $f(x)=\begin{cases}\dfrac{1}{4},&|x|\leq1,\\\dfrac{1}{8},&1<|x|\leq3,\\0,&\text{其他},\end{cases}$，令 $Y=g(X)=\begin{cases}X^2,&X<1,\\X^2-1,&X\geq1,\end{cases}$，求：（Ⅰ）$P\{-1<Y<2\mid X<1\}$；（Ⅱ）$Y$ 的分布函数 $F_Y(y)$。
