  stem:
    text: |-
      设非负函数 $y=y(x)(x>0)$ 的导函数 $y'=\varphi(x)$ 是方程 $x\varphi'(x)-\varphi(x)+2=0$ 的解，且 $y(0)=0$。若曲线 $y=y(x)$ 与直线 $x=1$ 及 $y=0$ 围成的平面区域 $D$ 的面积为 $2$，求 $D$ 绕 $y$ 轴旋转一周形成的旋转体的体积。
- number: 18
  section: solution
