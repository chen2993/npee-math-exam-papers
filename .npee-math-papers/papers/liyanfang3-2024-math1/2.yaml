  - label: D
    text: $f(x)$ 有无穷间断点。
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设曲线 $y=f(x)$ 由 $\begin{cases}x=3t-2|t|,\\y=|t|\cos\dfrac{1}{t}\end{cases}$ 确定，则该曲线的渐近线的条数为\ExamSelection。
  choices:
  - label: A
