  stem:
    text: |-
      设 $f(x)$ 是周期为 $2\pi$ 的周期函数，且当 $x\in(-\pi,\pi)$ 时，$f(x)=x\sin x$。若 $f(x)=\dfrac{a_0}{2}+\sum_{n=1}^{\infty}a_n\cos nx$，则 $\sum_{n=2}^{\infty}a_n=\ExamBlank$。
- number: 14
  section: fill
  points: 5
