questions:
- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      已知 $a_n=\dfrac{(-1)^{\left[\cos 2n\right]}}{n}$，其中 $n$ 为正整数，$\left[\cos 2n\right]$ 表示不超过 $\cos 2n$ 的最大整数，则数列 $\{a_n\}$\ExamSelection。
  choices:
  - label: A
    text: |-
      有最大值 $\dfrac{1}{2}$，有最小值 $-1$。
    figures: []
  - label: B
    text: |-
      有最大值 $1$，有最小值 $-\dfrac{1}{3}$。
    figures: []
  - label: C
    text: |-
      有最大值 $1$，有最小值 $-\dfrac{1}{2}$。
    figures: []
  - label: D
    text: |-
      有最大值 $\dfrac{1}{3}$，有最小值 $-1$。
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $0<a<1$，$I_1=\int_0^1\dfrac{e^{ax}-1}{e^x-1}\,\mathrm{d}x$，$I_2=\int_0^1\dfrac{\sqrt{ax}+1}{\sqrt{x}+1}\,\mathrm{d}x$，则\ExamSelection。
  choices:
  - label: A
    text: $I_1<a<I_2$。
    figures: []
  - label: B
    text: $I_2<a<I_1$。
    figures: []
  - label: C
    text: $a<I_1<I_2$。
    figures: []
  - label: D
    text: $I_1<I_2<a$。
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设正值函数 $f(x,y,z)$ 与 $g(x,y,z)$ 在点 $(0,0,0)$ 处的各个偏导数均存在且连续，$f(0,0,0)=g(0,0,0)=1$，$f(x,y,z)$ 在点 $(0,0,0)$ 处沿方向 $\boldsymbol{n}$ 的方向导数 $\left.\dfrac{\partial f}{\partial \boldsymbol{n}}\right|_{(0,0,0)}=1$，$g(x,y,z)$ 在点 $(0,0,0)$ 处沿方向 $\boldsymbol{n}$ 的方向导数 $\left.\dfrac{\partial g}{\partial \boldsymbol{n}}\right|_{(0,0,0)}=2$，则 $\left.\dfrac{\partial}{\partial \boldsymbol{n}}\left(\dfrac{1}{f}+\dfrac{1}{g}\right)\right|_{(0,0,0)}=$\ExamSelection。
  choices:
  - label: A
    text: $1$。
    figures: []
  - label: B
    text: $3$。
    figures: []
  - label: C
    text: $-1$。
    figures: []
  - label: D
    text: $-3$。
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)$ 在 $(0,+\infty)$ 内可导，则下列命题中，正确的个数是\ExamSelection。\n① 若 $\lim_{x\to0^+}f(x)=\infty$，则 $\lim_{x\to0^+}f'(x)=\infty$。\n② 若 $\lim_{x\to0^+}f'(x)=\infty$，则 $\lim_{x\to0^+}f(x)=\infty$。\n③ 若 $\lim_{x\to+\infty}f(x)$ 存在且有限，则 $\lim_{x\to+\infty}f'(x)$ 存在且有限。\n④ 若 $\lim_{x\to+\infty}f'(x)$ 存在且有限，则 $\lim_{x\to+\infty}f(x)$ 存在且有限。
  choices:
  - label: A
    text: $0$。
    figures: []
  - label: B
    text: $1$。
    figures: []
  - label: C
    text: $2$。
    figures: []
  - label: D
    text: $3$。
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      若矩阵 $A$ 可经初等行变换化为 $B$，则\ExamSelection。
  choices:
  - label: A
    text: 方程组 $Ax=0$ 与 $BB^{T}x=0$ 同解。
    figures: []
  - label: B
    text: 方程组 $Bx=0$ 与 $AA^{T}x=0$ 同解。
    figures: []
  - label: C
    text: 方程组 $A^{T}Ax=0$ 与 $B^{T}Bx=0$ 同解。
    figures: []
  - label: D
    text: 方程组 $AA^{T}x=0$ 与 $BB^{T}x=0$ 同解。
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $A,B$ 为 $n$（$n\geq2$）阶矩阵，则下列说法中，错误的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\begin{pmatrix}A&O\\O&B\end{pmatrix}$ 与 $\begin{pmatrix}B&O\\O&A\end{pmatrix}$ 相似。
    figures: []
  - label: B
    text: |-
      $\begin{pmatrix}O&A\\B&O\end{pmatrix}$ 与 $\begin{pmatrix}O&B\\A&O\end{pmatrix}$ 相似。
    figures: []
  - label: C
    text: |-
      $\begin{pmatrix}A&O\\O&B\end{pmatrix}$ 与 $\begin{pmatrix}O&A\\B&O\end{pmatrix}$ 相似。
    figures: []
  - label: D
    text: |-
      $\begin{pmatrix}A&O\\O&B\end{pmatrix}$ 与 $\begin{pmatrix}A&B-A\\O&B\end{pmatrix}$ 相似。
    figures: []
- number: 7
  section: choice
  points: 5
  stem:
    text: |-
      设二次型 $f(x_1,x_2,x_3)=x_1^2+x_3^2-2x_1x_2+2ax_1x_3+2a^2x_2x_3$，则二次曲面 $f(x_1,x_2,x_3)=1$ 在可逆线性变换下不可能化为\ExamSelection。
  choices:
  - label: A
    text: 单叶双曲面。
    figures: []
  - label: B
    text: 双叶双曲面。
    figures: []
  - label: C
    text: 椭圆柱面。
    figures: []
  - label: D
    text: 双曲柱面。
    figures: []
- number: 8
  section: choice
  points: 5
  stem:
    text: |-
      设 $A,B$ 为两个随机事件，$0<P(A)=p<1$，$0<P(B)=q<1$，则下列结论中，错误的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $P(A\mid B)\leq\dfrac{p}{q}$。
    figures: []
  - label: B
    text: |-
      $P(\overline{A}\mid B)\leq\dfrac{p}{q}$。
    figures: []
  - label: C
    text: |-
      $P(A\mid B)\geq1+\dfrac{p-1}{q}$。
    figures: []
  - label: D
    text: |-
      $P(\overline{A}\mid B)\geq1-\dfrac{p}{q}$。
    figures: []
- number: 9
  section: choice
  points: 5
  stem:
    text: |-
      设随机变量 $X$ 服从正态分布 $N(0,1)$，$Y$ 服从正态分布 $N(1,4)$，对给定的 $\alpha(0<\alpha<1)$，数 $u_\alpha$ 满足 $P\left\{Y>u_\alpha\right\}=\alpha$。若 $P\left\{\left|X\right|<x\right\}=\alpha$，则 $x$ 等于\ExamSelection。
  choices:
  - label: A
    text: |-
      $u_{\dfrac{\alpha}{2}}$。
    figures: []
  - label: B
    text: |-
      $u_{\dfrac{1-\alpha}{2}}$。
    figures: []
  - label: C
    text: |-
      $\dfrac{1}{2}\left(u_{\dfrac{\alpha}{2}}-1\right)$。
    figures: []
  - label: D
    text: |-
      $\dfrac{1}{2}\left(u_{\dfrac{1-\alpha}{2}}-1\right)$。
    figures: []
- number: 10
  section: choice
  points: 5
  stem:
