    text: |-
      设曲线积分 $\int_L f'(x)\,\mathrm{d}y-4y f(x)\,\mathrm{d}x$ 与路径无关，其中 $f(x)$ 具有二阶连续导数，并且 $\lim_{x\to0}\dfrac{f(x)-1}{x^2}$ 存在，则 $f(x)=\ExamBlank$。
- number: 15
  section: fill
  points: 5
  stem:
    text: |-
      设 $A=(a_{ij})$ 为 3 阶非零矩阵，$A^*$ 为其伴随矩阵，$A_{ij}$ 为 $a_{ij}$ 的代数余子式。若 $a_{ij}+A_{ji}=1$（$i,j=1,2,3$），则 $\left|A^2-(A^*)^2\right|=\ExamBlank$。
- number: 16
  section: fill
  points: 5
  stem:
    text: |-
      记半圆盘 $x^2+y^2\leq4\ (y\geq0)$ 中到 $x$ 轴的距离不超过 $\sqrt{2}$ 的点所构成的区域为 $D$。向区域 $D$ 中随机投掷一点，以该点为圆心，该点到 $x$ 轴的距离为半径作圆 $C$。记圆 $C$ 的面积为 $S$，则 $E(S)=\ExamBlank$。
- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      设曲线 $\sqrt{x}+\sqrt{y}=a$ 过点 $(1,1)$。
  subparts:
  - text: 求该曲线在点 $(1,1)$ 处的切线方程；
  - text: 求该曲线的弧长 $s$。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $z(x,y)$ 满足 $\mathrm{d}z=e^{ax}(xy+y+2y^2)\,\mathrm{d}x+e^{ax}(2by+x)\,\mathrm{d}y$，且 $z(0,0)=0$。
  subparts:
  - text: 求 $a,b$；
  - text: 求 $z(x,y)$ 的极值。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 $L$ 为 $Oyz$ 面上的一条曲线，其方程为 $z=\sqrt{4y-y^2-3}$，记 $L$ 绕 $y$ 轴旋转一周所得曲面为 $\Sigma$。
  subparts:
  - text: |-
      求 $\Sigma$ 的方程；
  - text: |-
      计算曲面积分 $I=\iint_{\Sigma}(x^2+\sin xz)\,\mathrm{d}y\,\mathrm{d}z+(2y^2+3\cos xy)\,\mathrm{d}z\,\mathrm{d}x+3z(1+x\sin xy)\,\mathrm{d}x\,\mathrm{d}y$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设定义在 $[-\pi,\pi]$ 上的函数 $f_n(x)=\int_0^x(\left|t-1\right|-\left|t\right|)\sin^{2n}t\,\mathrm{d}t$。
  subparts:
  - text: 求 $f_n(x)$ 的最大值点；
  - text: |-
      记 $\max_{-\pi\leq x\leq\pi}f_n(x)=a_n$，证明：$\sum_{n=0}^{\infty}a_n$ 收敛，且级数和小于 $\dfrac{3}{2}\ln 3-2\ln 2$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      已知矩阵 $A=\begin{pmatrix}3&-2&1\\8&-5&2\\-2&1&a\end{pmatrix}$ 只有一个线性无关的特征向量。
  subparts:
  - text: 求 $a$ 的值以及 $A$ 的全部特征向量；
  - text: |-
      若 $\boldsymbol{\alpha}_1$ 为 $A$ 的一个特征向量，且 $\boldsymbol{\alpha}_2,\boldsymbol{\alpha}_3$ 满足 $A\boldsymbol{\alpha}_2=\boldsymbol{\alpha}_1-\boldsymbol{\alpha}_2$，$A\boldsymbol{\alpha}_3=\boldsymbol{\alpha}_2-\boldsymbol{\alpha}_3$，证明 $\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\boldsymbol{\alpha}_3$ 线性无关。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设区域 $D=\left\{(x,y)\mid 0\leq x\leq\sqrt{y},0\leq y\leq1\right\}$，二维随机变量 $(X,Y)$ 的联合概率密度为 $f(x,y)=\begin{cases}6xy,&(x,y)\in D,\\0,&\text{其他}.\end{cases}$
  subparts:
  - text: 判断 $X,Y$ 是否相互独立；
  - text: |-
      求 $Z=\sqrt{X^2+Y}$ 的分布函数。
