      设随机变量序列 $X_1,X_2,\ldots,X_n,\ldots$ 独立同分布，其中 $X_i$（$i=1,2,\ldots$）服从参数为 $2,\dfrac{1}{2}$ 的二项分布 $B\left(2,\dfrac{1}{2}\right)$。若当 $n\to\infty$ 时，$\dfrac{1}{n}\sum_{i=1}^{n}X_i^k$ 依概率收敛于 $a_k$（$k=1,2,3$），则 $a_1+a_2+a_3=$\ExamSelection。
