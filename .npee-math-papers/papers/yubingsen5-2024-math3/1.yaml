- number: 20
  section: solution
  points: 12
  stem:
    text: 设函数 $f(x)$ 在 $[a,b]$ 上连续。
  subparts:
  - text: |-
      证明存在 $\xi\in(a,b)$，使得 $\displaystyle\int_a^\xi f(x)\,\mathrm{d}x=(b-\xi)f(\xi)$。
  - text: |-
      如果 $f(x)$ 在 $(a,b)$ 内取得最大值和最小值，证明存在 $\eta\in(a,b)$，使得 $\displaystyle\int_a^\eta f(x)\,\mathrm{d}x=(\eta-a)f(\eta)$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      已知线性方程组 $\begin{cases}x_1+2x_2+x_3=3,\\2x_1+(a+4)x_2-5x_3=6,\\-x_1-2x_2+ax_3=-3\end{cases}$ 有无穷多个解。$A$ 为 $3$ 阶实矩阵，且 $\alpha_1=(1,2a,-1)^{\mathsf T}$，$\alpha_2=(a,a+3,a+2)^{\mathsf T}$，$\alpha_3=(a-2,-1,a+1)^{\mathsf T}$ 是 $A$ 的分别对应于特征值 $\lambda_1=1,\lambda_2=-1,\lambda_3=0$ 的特征向量。
  subparts:
  - text: 求矩阵 $A$。
  - text: 求行列式 $|A^{2024}+2E|$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      二维随机变量设 $(X,Y)$ 的概率密度为 $f(x,y)=\begin{cases}2,&0\leq x\leq1,\,0\leq y\leq1-x,\\0,&\text{其他},\end{cases}$，令 $Z=\begin{cases}0,&X+Y\leq\dfrac12,\\X+Y,&X+Y>\dfrac12\text{。}\end{cases}$
  subparts:
  - text: |-
      求 $(X,Y)$ 的分布函数 $F(x,y)$ 在点 $\left(\dfrac12,1\right)$ 处的值。
  - text: |-
      求 $Z$ 的分布函数 $F_Z(z)$，由此求 $P\{Z=0\}$，并问 $Z$ 是否是连续型随机变量？
  - text: |-
      记 $U=\max\{X,Y\}$，$V=\min\{X,Y\}$，求 $E(U+V)$。
