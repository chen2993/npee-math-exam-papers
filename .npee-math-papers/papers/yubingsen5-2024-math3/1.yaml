- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(u)$ 在 $(0,+\infty)$ 内可导，$z=xf\left(\dfrac{y}{x}\right)+y$ 满足关系式 $x\dfrac{\partial z}{\partial x}-y\dfrac{\partial z}{\partial y}=2z$，且 $f(1)=1$，求曲线 $y=f(x)$ 的斜渐近线。
- number: 19
  section: solution
  points: 12
