questions:
- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)$ 在 $(-\infty,+\infty)$ 内有定义，分别在 $(-\infty,0)$ 和 $(0,+\infty)$ 内具有一阶连续的导数，点 $x=0$ 为 $f(x)$ 的可去间断点，则必有\ExamSelection。
  choices:
  - label: A
    text: 点 $x=0$ 是 $f'(x)$ 的可去间断点
    figures: []
  - label: B
    text: 点 $x=0$ 不是 $f'(x)$ 的可去间断点
    figures: []
  - label: C
    text: |-
      $\displaystyle\int_0^x f(t)\,\mathrm{d}t$ 在点 $x=0$ 处不可导
    figures: []
  - label: D
    text: |-
      $\displaystyle\int_0^x f(t)\,\mathrm{d}t$ 在点 $x=0$ 处可导
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $p(x),q(x)$ 为连续函数且 $q(x)<0$，若 $y=f(x)$ 为微分方程 $y''+p(x)y'+q(x)y=0$ 的解，则函数 $y=f(x)$\ExamSelection。
  choices:
  - label: A
    text: 不可能有负的极大值
    figures: []
  - label: B
    text: 不可能有正的极小值
    figures: []
  - label: C
    text: 不可能有负的极小值或正的极大值
    figures: []
  - label: D
    text: 一定没有极值点
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设非常值函数 $f(x)$ 在 $[-1,1]$ 连续，若对 $[-1,1]$ 上的任意偶函数 $g(x)$，积分 $\displaystyle\int_{-1}^{1}f(x)g(x)\,\mathrm{d}x=0$，则下列不正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\displaystyle\int_{-1}^{1}[f(x)+f(-x)]g(x)\,\mathrm{d}x=0$
    figures: []
  - label: B
    text: |-
      $\displaystyle\int_{-1}^{1}[f(x)-f(-x)]g(x)\,\mathrm{d}x=0$
    figures: []
  - label: C
    text: $f(x)$ 为奇函数
    figures: []
  - label: D
    text: $f(x)$ 未必一定是奇函数
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      关于函数 $f(x,y)=\begin{cases}y\sin\dfrac{1}{x^2+y^2},&x^2+y^2\ne0,\\0,&x^2+y^2=0,\end{cases}$ 给出下列结论：① $f(x,y)$ 在点 $(0,0)$ 处连续；② $\left.\dfrac{\partial f}{\partial x}\right|_{(0,0)}=0$；③ $\left.\dfrac{\partial f}{\partial y}\right|_{(0,0)}=0$；④ $f(x,y)$ 在点 $(0,0)$ 处可微；其中正确的个数为\ExamSelection。
  choices:
  - label: A
    text: '1'
    figures: []
  - label: B
    text: '2'
    figures: []
  - label: C
    text: '3'
    figures: []
  - label: D
    text: '4'
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设 $E$ 为三阶单位矩阵，$A=(a_{ij})$ 为三阶非零实矩阵，$A_{ij}$ 是 $|A|$ 中元素 $a_{ij}$ 的代数余子式。若 $A_{ij}=a_{ij}$，$i,j=1,2,3$，则\ExamSelection。
  choices:
  - label: A
    text: 矩阵 $A-E$ 不可逆
    figures: []
  - label: B
    text: 矩阵 $A-E$ 可逆
    figures: []
  - label: C
    text: 矩阵 $A+E$ 不可逆
    figures: []
  - label: D
    text: 矩阵 $A+E$ 可逆
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 为 $n$ 阶实矩阵，$E$ 为 $n$ 阶单位矩阵，则\ExamSelection。
