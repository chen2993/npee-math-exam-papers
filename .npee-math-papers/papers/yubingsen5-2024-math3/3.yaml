  stem:
    text: |-
      设 $D=\{(x,y)\mid 0\leq x\leq\sqrt{\pi},0\leq y\leq\sqrt{\pi}\}$，$I_1=\iint_D\sin(\max\{x^2,y^2\})\,\mathrm{d}x\,\mathrm{d}y$，$I_2=\iint_D\sin(\min\{x^2,y^2\})\,\mathrm{d}x\,\mathrm{d}y$，$I_3=\dfrac12\iint_D(\sin x^2+\sin y^2)\,\mathrm{d}x\,\mathrm{d}y$，则有\ExamSelection。
