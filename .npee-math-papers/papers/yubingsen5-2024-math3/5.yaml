  stem:
    text: |-
      设 $x>0$，证明：$(x+1)^3-x^3=3[x+\theta(x)]^2$ ①，其中 $0<\theta(x)<1$。
  subparts:
  - text: |-
      证明 ① 中的 $\theta(x)$ 是 $x(0<x<1)$ 的减函数；
  - text: |-
      当 $0<x<1$ 时，证明 ① 中的 $\theta(x)$ 满足 $\dfrac{1}{2}<\theta(x)<\dfrac{1}{\sqrt{3}}$。
