  stem:
    text: 已知函数 $y=y(x)$ 由方程 $y^3+2xy-2y^2-x^2=4$ 所确定，求函数 $y=y(x)$ 的极值。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 在 $(0,+\infty)$ 上具有二阶连续导数，$f(1)=1$，$f'(1)=2$，且二元函数 $z=\sqrt{x^2+y^2}f(\sqrt{x^2+y^2})$ 满足 $\dfrac{\partial^2z}{\partial x^2}+\dfrac{\partial^2z}{\partial y^2}=4$，求 $f(x)$ 及 $f(x)$ 的斜渐近线。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(u)$ 具有一阶连续导数，$z=z(x,y)$ 偏导数连续，$z=z(x,y)$ 是由方程 $x+y+z=f(x^2+y^2+z^2)$ 确定的隐函数，试求曲线积分：$I=\oint_L\left(xz-\dfrac{1}{2}z^2\right)\,\mathrm{d}x+\left(yz-\dfrac{1}{2}z^2\right)\,\mathrm{d}y$。其中 $L$ 为圆周 $(x-1)^2+y^2=1$，取逆时针方向。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f_n(x)=\dfrac{2n}{e}\left[e^x-\left(1+\dfrac{x}{n}\right)^n\right]$。
  subparts:
  - text: |-
      证明：对任意的正整数 $n$，在区间 $[0,1]$ 内都有 $0\leq f_n(x)\leq x^2e^{x-1}$ 成立；
  - text: |-
      设数列 $\{a_n\}$ 满足 $a_1=1$，$a_{n+1}=\int_0^{a_n}f_n(x)\,\mathrm{d}x$。证明 $\lim_{n\to\infty}a_n$ 存在，并求此极限。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      已知矩阵 $B=\begin{pmatrix}2&1&-1\\1&2&-1\\-1&-1&2\end{pmatrix}$。$(I)$ 求可逆矩阵 $A$，正定矩阵 $C$，使得 $B=A^TA=C^2$；$(II)$ 证明：存在正交矩阵 $U(U\neq E)$，正定矩阵 $D$，使得 $A=UD$，并求出 $U$ 和 $D$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $X$ 的密度函数 $f(x)=\dfrac{1}{2\lambda}e^{-\dfrac{|x|}{\lambda}}\ (-\infty<x<+\infty)$，其中 $\lambda>0$，设 $Y=\begin{cases}1,&|X|\leq 1,\\-1,&|X|>1,\end{cases}$，$Z=XY$。$(I)$ 求 $Z$ 的密度函数；$(II)$ 设 $Z_1,Z_2,\cdots,Z_n$ 为来自总体 $Z$ 的简单随机样本，求 $\lambda$ 的最大似然估计 $\hat{\lambda}$。
