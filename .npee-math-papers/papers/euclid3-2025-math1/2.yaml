  section: solution
  points: 12
  stem:
    text: |-
      设 $X$ 的分布函数为 $F_X(x)=\begin{cases}0,&x<0,\\p^2,&0\leq x<1,\\2p-p^2,&1\leq x<2,\\1,&x\geq 2,\end{cases}\ 0<p<1$，$X_1,X_2,\cdots,X_n$ 是来自总体 $X$ 的简单随机样本。
  subparts:
  - text: 求 $p$ 的矩估计量；
  - text: 求 $p$ 的最大似然估计量。
