      设 $D$ 为曲面 $\Sigma_1$ 在 $xOy$ 平面上的投影区域，求 $f(x,y)=10x^3y+10xy^3-9xy$ 在 $D$ 上的最值。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
