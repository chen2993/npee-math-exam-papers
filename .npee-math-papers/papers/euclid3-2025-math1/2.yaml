  stem:
    text: |-
      设直线 $L$ 过 $A(1,0,0),B(0,1,1)$ 两点，将 $L$ 绕 $z$ 轴旋转一周得到曲面 $\Sigma$，记 $\Sigma_1$ 是 $\Sigma$ 被平面 $z=0,z=1$ 所截下来的部分。
