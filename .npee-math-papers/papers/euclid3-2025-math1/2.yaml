  stem:
    text: |-
      设函数 $f(x),g(x)$ 满足 $f'(x)-g(x)+2\displaystyle\int_0^x f(t)\,\mathrm{d}t=0,\ g'(x)+2f(x)=0$，且 $f(0)=1,\ g(0)=-2$。
