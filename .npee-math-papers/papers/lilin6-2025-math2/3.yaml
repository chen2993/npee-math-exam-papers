  stem:
    text: |-
      设 $D$ 是曲线 $y=\sqrt{x}$ 与 $y=ax (a>0)$ 所围成的有界区域，若 $D$ 绕 $x$ 轴旋转一周与绕 $y$ 轴旋转一周所得旋转体的体积相等，则 $a=$\ExamBlank。
