- number: 9
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 是 $n(n\geqslant 3)$ 阶矩阵，$A^*$ 是 $A$ 的伴随矩阵，线性方程组 $AX=0$ 有两个线性无关的解，则\ExamSelection。
