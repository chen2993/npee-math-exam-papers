- number: 15
  section: fill
  points: 5
  stem:
    text: |-
      设 $f(x)$ 有连续的导数，且 $f(1)-f(0)=1$，则 $I=\int_0^1\mathrm{d}x\int_0^x\dfrac{f'(y)}{\sqrt{(1-x)(x-y)}}\,\mathrm{d}y=$\ExamBlank。
- number: 16
  section: fill
  points: 5
  stem:
    text: |-
      设 $A$ 是 $2$ 阶矩阵，线性方程组 $AX=\begin{pmatrix}3\\2\end{pmatrix}$ 的通解为 $k(-2,1)^{\mathrm{T}}+(3,-4)^{\mathrm{T}}$。若 $\beta=(5,-10)^{\mathrm{T}}$，则 $\beta^{\mathrm{T}}A\beta=$\ExamBlank。
- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      设平面曲线 $L$ 过点 $\left(\dfrac{1}{2},0\right)$，$L$ 上任意点 $P(x,y) (x>0)$ 到原点的距离等于该点处的切线在 $y$ 轴上的截距。
  subparts:
  - text: 求 $L$ 的方程；
  - text: 求 $L$ 位于第一象限部分的一条切线，使该切线与 $L$ 以及两坐标轴所围的面积最小。
- number: 18
  section: solution
  points: 12
  stem:
    text: 设 $f(x)$ 满足 $(1-x)f'(x)+nf(x)=n(1-x)^{n+1}$（$n$ 为正整数），且 $f(0)=0$。
  subparts:
  - text: |-
      记 $M(n)$ 为 $f(x)$ 在 $(0,1)$ 内的最大值，求 $\lim_{n\to\infty}M(n)$；
  - text: |-
      证明：$M(n)<\dfrac{1}{e}$。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 $D=\{(x,y)\mid x^2+y^2\leqslant 1, x\geqslant 0, y\geqslant 0\}$，计算 $I=\iint_D(x-y+xye^{x^2-y^2})\,\mathrm{d}x\,\mathrm{d}y$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设曲线 $y=\sin x$ 在 $x\in[0,n\pi] (n=1,2,\cdots)$ 上与 $x$ 轴所围成的区域为 $D$，$D$ 绕 $y$ 轴旋转一周所得旋转体的体积为 $a_n$。
  subparts:
  - text: 求 $a_n$；
  - text: |-
      求极限 $\lim_{n\to\infty}\sum_{k=1}^n\dfrac{2k\pi^2}{a_n}\sin\dfrac{k\pi}{2n}$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 有连续的二阶导数，$f''(x)>0$ 且 $f(0)=0$，$f'(0)=0$，曲线 $y=f(x)$ 上点 $(x,f(x)) (x\ne 0)$ 处的切线在 $x$ 轴上的截距为 $u(x)$。
  subparts:
  - text: |-
      证明：当 $x\to 0^+$ 时，$u(x)$ 与 $\dfrac{1}{2}x$ 是等价无穷小；
  - text: |-
      求 $\lim_{x\to 0^+}\dfrac{\int_0^{u(x)}f(t)\,\mathrm{d}t}{\int_0^x f(t)\,\mathrm{d}t}$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $A=\begin{bmatrix}a&0\\-1&a\\-1&0\end{bmatrix}$，$B=\begin{bmatrix}-1&0&a\\-1&1&a\end{bmatrix}$，已知方程组 $ABX=0$ 与 $BX=0$ 同解。
  subparts:
  - text: 求 $a$ 的取值范围；
  - text: |-
      当 $AB$ 为实对称矩阵时，求正交变换 $X=QY$，将二次型 $f(x_1,x_2,x_3)=X^{\mathrm{T}}ABX$ 化为标准形。
