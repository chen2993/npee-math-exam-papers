  - label: A
    text: $(C_1+C_2x)e^x+e^{2x}$
    figures: []
  - label: B
    text: $C_1e^{2x}+C_2e^x+xe^x$
    figures: []
  - label: C
    text: $C_1e^{2x}+C_2xe^x+e^x$
    figures: []
  - label: D
    text: $C_1e^{2x}+C_2(1+x)e^x$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
