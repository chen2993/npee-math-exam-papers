    text: |-
      计算 $\int_0^{\sqrt{3}}\dfrac{x^4\arctan x}{x^2+1}\,\mathrm{d}x$。
- number: 18
  section: solution
  points: 12
  stem:
    text: 计算二元函数 $f(x,y)=xy(4-3x^2+y)$ 在闭区域 $D$ 上的最大值和最小值，其中区域 $D$ 是由曲线 $y=3x^2$，直线 $y=3$ 及 $y$ 轴所围成的区域位于第一象限的部分。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 $a>0$，$f(a)=\int_0^{+\infty}\dfrac{1}{(ax^2+1)\sqrt{x^2+1}}\,\mathrm{d}x$。判断 $f'(1)$ 是否存在，若存在，试求其值。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 为 $\left[-\dfrac{\pi}{2},\dfrac{\pi}{2}\right]$ 上的连续函数，满足 $f(-x)=f(x)$，且当 $x\in\left(0,\dfrac{\pi}{2}\right]$ 时，$f(x)=\dfrac{\sin x-x\cos x}{x(1-\cos x)}$。证明：$\dfrac{1}{2}\leq f(x)\leq\dfrac{2}{3}$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设二次型 $f(x_1,x_2,x_3)=x_1^2+x_2^2+x_3^2+2ax_1x_2+2x_1x_3+4ax_2x_3$ 经过可逆线性变换 $\begin{pmatrix}x_1\\x_2\\x_3\end{pmatrix}=P\begin{pmatrix}y_1\\y_2\\y_3\end{pmatrix}$ 化为二次型 $g(y_1,y_2,y_3)=y_1^2+y_2^2+2y_3^2+2y_1y_2+2y_1y_3+2y_2y_3$。
  subparts:
  - text: 求 $a$ 的值；
  - text: 求可逆矩阵 $P$。
- number: 22
  section: solution
  points: 12
  stem:
    text: 将长度为 $l$ 的细棒随机分成 $3$ 段，记第 $1$ 段细棒的长度为 $X$，第 $2$ 段细棒的长度为 $Y$。
  subparts:
  - text: |-
      计算在 $X=x$ 的条件下，$Y$ 的条件概率密度 $f_{Y\mid X}(y\mid x)$；
  - text: 求这 $3$ 段细棒恰好能构成一个三角形的三边的概率。
