      求 $\iint_D\dfrac{x^2}{\sqrt{1+x^2+y^2}}\,\mathrm{d}x\mathrm{d}y$。
  - text: |-
      证明：存在 $(\xi,\eta)\in D$，使得 $\xi^2=\dfrac{16}{15}\sqrt{\xi^2+\eta^2+1}$。
- number: 19
  section: solution
