- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      假设某咖啡店在任何长为 $t$（单位：小时）的时间内卖出的咖啡杯数 $N(t)$ 服从参数为 $\lambda t$ 的泊松分布。若一天内卖出 $100$ 杯咖啡，则当天该店净利润大于 $0$。
  subparts:
  - text: 求相继卖出两杯咖啡之间的时间间隔 $T_1$ 的概率密度。
  - text: 记一天中，从开始营业到开始盈利的时间为 $T_2$，求 $T_2$ 的概率密度。
  - text: |-
      已知 $\lambda=20$，问长期来看，若要盈利，则该咖啡店需平均每天至少营业多少小时？
