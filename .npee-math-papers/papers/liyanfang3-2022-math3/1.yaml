    text: |-
      设总体 $X$ 服从正态分布 $N(\mu,\sigma^2)$（$\sigma>0$），$X_1,X_2,\cdots,X_{2n}$（$n\geq2$）为来自该总体的简单随机样本，其样本均值为 $\bar X=\dfrac{1}{2n}\sum_{i=1}^{2n}X_i$。记统计量 $Y_1=\sum_{i=1}^{2n}(X_i-\bar X)^2$，$Y_2=\sum_{i=1}^{2n}(X_i-X_{n+i})^2$，$Y_3=\sum_{i=1}^{n}(X_i+X_{n+i}-2\bar X)^2$，则这 $3$ 个统计量的数学期望 $E(Y_1),E(Y_2),E(Y_3)$ 的大小关系为\ExamSelection
  choices:
