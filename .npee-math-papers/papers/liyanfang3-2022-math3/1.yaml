  stem:
    text: |-
      设 $f(x)$ 是定义在 $(0,+\infty)$ 上的具有二阶连续导数的函数，满足 $f(1)=f'(1)=1$，记 $u=f(\sqrt[3]{x^2+y^2})$。当 $\sqrt[3]{x^2+y^2}>0$ 时，$\dfrac{\partial^2u}{\partial x^2}+\dfrac{\partial^2u}{\partial y^2}=0$。
  subparts:
  - text: 记 $p=f'(x)$，求 $f'(x)$ 满足的微分方程。
  - text: 求 $f(x)$ 的表达式。
