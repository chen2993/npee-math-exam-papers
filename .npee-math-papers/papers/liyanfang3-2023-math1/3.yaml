  subparts:
  - text: |-
      设矩阵 $P=\begin{pmatrix}1&1&1\\0&1&1\\0&0&1\end{pmatrix}$ 为从 $\alpha_1,\alpha_2,\alpha_3$ 到 $\beta_1,\beta_2,\beta_3$ 的过渡矩阵，求矩阵 $B$，使得 $A(\beta_1,\beta_2,\beta_3)=(\beta_1,\beta_2,\beta_3)B$；
  - text: 矩阵 $A$ 是否相似于对角矩阵？请说明理由。
