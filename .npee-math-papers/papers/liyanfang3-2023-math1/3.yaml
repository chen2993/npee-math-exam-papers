- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x,y)=\sqrt{|x^2-ay^2|}\ (a>0)$ 在点 $O(0,0)$ 处沿着从点 $O$ 到点 $P(1,-1)$ 的方向的方向导数为 $\sqrt{2}$。
