- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      设 $\alpha_1=\sqrt{x+\sqrt{x}},\alpha_2=\sqrt[3]{x}\arctan(x+\sqrt{x}),\alpha_3=1-\cos\sqrt{x}$。当 $x\to0^+$ 时，以上 3 个无穷小量按照从低阶到高阶的排序是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\alpha_1,\alpha_2,\alpha_3$。
    figures: []
  - label: B
    text: |-
      $\alpha_1,\alpha_3,\alpha_2$。
    figures: []
  - label: C
    text: |-
      $\alpha_2,\alpha_1,\alpha_3$。
    figures: []
  - label: D
    text: |-
      $\alpha_3,\alpha_1,\alpha_2$。
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $y(x)=\lim_{t\to0}\left[1-\dfrac{\ln(1-t)}{x^2}\right]^{\dfrac{x}{\sin t}}$，下列关于曲线 $y=y(x)$ 的渐近线的说法中，正确的是\ExamSelection。\n①该曲线无渐近线。\n②该曲线有铅直渐近线。\n③该曲线有水平渐近线。\n④该曲线有斜渐近线。
  choices:
  - label: A
    text: ②。
    figures: []
  - label: B
    text: ③。
    figures: []
  - label: C
    text: ②③。
    figures: []
  - label: D
    text: ②④。
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设 $p\geqslant0$，若级数 $\displaystyle\sum_{n=1}^{\infty}\int_0^{\dfrac{1}{n}}\dfrac{x^p}{1+x^q}\,\mathrm{d}x$ 发散，则\ExamSelection。
  choices:
  - label: A
    text: |-
      $p>0,q\geqslant0$。
    figures: []
  - label: B
    text: $p>0,q<0$。
    figures: []
  - label: C
    text: |-
      $p=0,q\geqslant0$。
    figures: []
  - label: D
    text: $p=0,q<0$。
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x,y)=\begin{cases}(xy+a|x|+b\sqrt{|y|})\arctan\dfrac{1}{|x|+y^2},&(x,y)\neq(0,0),\\0,&(x,y)=(0,0),\end{cases}$ 则下列说法中，错误的是\ExamSelection。
  choices:
  - label: A
    text: 函数 $f(x,y)$ 在点 $(0,0)$ 处的连续性与 $a,b$ 的取值无关。
    figures: []
  - label: B
    text: 函数 $f(x,y)$ 在点 $(0,0)$ 处的偏导数是否存在与 $a,b$ 的取值无关。
    figures: []
  - label: C
    text: 函数 $f(x,y)$ 在点 $(0,0)$ 处的可微性与 $a,b$ 的取值有关。
    figures: []
  - label: D
    text: 若函数 $f(x,y)$ 在点 $(0,0)$ 处的偏导数存在，则 $f(x,y)$ 在点 $(0,0)$ 处可微。
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 为 $n(n\geqslant2)$ 阶矩阵，$B$ 为 $n$ 阶可逆矩阵，$b$ 为 $n$ 维列向量。下列命题中，错误的是\ExamSelection。
  choices:
  - label: A
    text: 若方程组 $Ax=b$ 有解，则方程组 $ABx=b$ 有解。
    figures: []
  - label: B
    text: 若方程组 $Ax=b$ 有解，则方程组 $BAx=b$ 有解。
    figures: []
  - label: C
    text: 若方程组 $Ax=0$ 有非零解，则方程组 $ABx=0$ 有非零解。
    figures: []
  - label: D
    text: 若方程组 $Ax=0$ 有非零解，则方程组 $BAx=0$ 有非零解。
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 为 3 阶正交矩阵，且 $A^3=E$。若 $\alpha,\beta$ 均为非零向量，且 $\alpha,A\alpha$ 线性无关，$\alpha,A\alpha,A^2\alpha$ 线性相关，$\beta^{\mathrm T}\alpha=\beta^{\mathrm T}A\alpha=0$，则\ExamSelection。
  choices:
  - label: A
    text: |-
      $\beta$ 与 $A\beta,A^2\alpha$ 均正交。
    figures: []
  - label: B
    text: |-
      $\beta$ 与 $A\beta$ 正交，不与 $A^2\alpha$ 正交。
    figures: []
  - label: C
    text: |-
      $A\beta$ 与 $\alpha,A\alpha$ 均正交。
    figures: []
  - label: D
    text: |-
      $A\beta$ 与 $\alpha$ 正交，不与 $A\alpha$ 正交。
    figures: []
