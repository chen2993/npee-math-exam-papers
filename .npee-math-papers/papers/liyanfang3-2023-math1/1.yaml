- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设非负函数 $y(x)$ 在 $(0,+\infty)$ 内可导且单调减少。记曲线 $y=y(x)$ 上任意一点 $P$ 处的切线与 $x$ 轴，$y$ 轴的交点分别为 $P_x,P_y$。若 $|PP_x|=2|PP_y|$，且曲线上横坐标为 1 的点处的切线斜率为 $-1$，求：
  subparts:
  - text: 曲线 $y=y(x)$ 的方程；
  - text: 曲线 $y=y(x)$ 在点 $(2,y(2))$ 处的曲率半径。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 $\Sigma$ 为曲面 $4x^2+y^2+z^2=1$（$z\geqslant0$）的下侧，计算曲面积分 $I=\displaystyle\iint_{\Sigma}(x+2y)\,\mathrm{d}y\,\mathrm{d}z+\dfrac{z}{\sqrt{x^2+y^2+z^2}}\,\mathrm{d}z\,\mathrm{d}x+\left(x^2-\dfrac{y}{\sqrt{x^2+y^2+z^2}}\right)\,\mathrm{d}x\,\mathrm{d}y$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $a$ 为常数，反常积分 $\displaystyle\int_0^{+\infty}\dfrac{x^a\arctan x^b}{\sqrt{1+x^c}}\,\mathrm{d}x$ 对任意正实数 $b,c$ 均收敛。
  subparts:
  - text: 求 $a$ 的值。
  - text: |-
      证明：$\dfrac{\sqrt{2}\pi^2}{8}\leqslant\displaystyle\int_0^{+\infty}\dfrac{x^a\arctan x}{\sqrt{1+x^2}}\,\mathrm{d}x\leqslant\dfrac{\pi(\pi+2)}{8}$。
- number: 21
  section: solution
  points: 12
  stem:
    text: 设 $A,B$ 均为 2 阶实对称矩阵，$A$ 的特征值为 $1,2$，$B$ 的特征值为 $2,3$。证明：
  subparts:
  - text: |-
      若存在 $\xi$，使得 $\dfrac{\xi^{\mathrm T}A\xi}{\xi^{\mathrm T}\xi}=2$，则 $\xi$ 为 $A$ 的属于特征值 2 的特征向量；
  - text: |-
      若存在 $\xi$，使得 $\dfrac{\xi^{\mathrm T}A\xi}{\xi^{\mathrm T}\xi}=2,\dfrac{\xi^{\mathrm T}B\xi}{\xi^{\mathrm T}\xi}=3$，则 $AB=BA$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设总体 $X$ 的概率密度函数为 $f(x)=\begin{cases}\alpha e^{-\alpha(x-\beta)},&x\geqslant\beta,\\0,&\text{其他},\end{cases}$ 其中 $\alpha$ 为已知正常数，$\beta$ 为未知正参数，$X_1,X_2,\cdots,X_n$ 是来自总体 $X$ 的简单随机样本。
  subparts:
  - text: |-
      求 $\beta$ 的最大似然估计量 $\hat{\beta}$；
  - text: |-
      判断 $\hat{\beta}$ 是否为无偏估计。
