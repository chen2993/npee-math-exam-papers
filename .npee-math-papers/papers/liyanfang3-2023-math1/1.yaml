- number: 10
  section: choice
  points: 5
  stem:
    text: |-
      在一盒骰子中既有正常的均匀骰子，也有灌铅骰子，灌铅骰子掷出六点的概率为 $0.9$，掷出其余五个点数的概率相等。从盒中取一枚骰子检验。原假设 $H_0$：这是一枚均匀骰子。备择假设 $H_1$：这是一枚灌铅骰子。检验法则为，连续投掷这枚骰子 $n$ 次，若连续掷出 $n$ 个六点，则拒绝 $H_0$，否则接受 $H_0$。下列命题中，正确的是\ExamSelection。
  choices:
  - label: A
    text: 当 $n=2$ 时，犯第一类错误的概率是 $0.21$。
    figures: []
  - label: B
    text: 当 $n=2$ 时，犯第二类错误的概率是 $0.21$。
    figures: []
  - label: C
    text: 若 $n$ 越大，则犯第二类错误的概率就越小。
    figures: []
  - label: D
    text: 当 $n=3$ 时，此检验法则是一个显著性水平为 $0.01$ 的检验法则。
    figures: []
