    text: |-
      设函数 $f(x)$ 在 $[0,+\infty)$ 上二阶可导，且 $f(0)=0$。下列命题中，正确命题的个数为\ExamSelection① 若在 $(0,+\infty)$ 上恒有 $f''(x)<0$，则 $\dfrac{f(x)}{x}$ 在 $(0,+\infty)$ 上单调减少。② 若 $\dfrac{f(x)}{x}$ 在 $(0,1]$ 上单调减少，则在 $(0,1]$ 上恒有 $f''(x)\leqslant 0$。③ 若 $\lim\limits_{x\to+\infty}\dfrac{f(x)}{x}$ 存在，则 $\lim\limits_{x\to+\infty}f'(x)$ 存在。④ 若在 $(0,+\infty)$ 上恒有 $f''(x)<0$，且 $\lim\limits_{x\to+\infty}\dfrac{f(x)}{x}$ 存在，则 $\lim\limits_{x\to+\infty}f'(x)$ 存在。
  choices:
  - label: A
    text: $1$
    figures: []
  - label: B
    text: $2$
    figures: []
  - label: C
    text: $3$
    figures: []
  - label: D
    text: $4$
    figures: []
