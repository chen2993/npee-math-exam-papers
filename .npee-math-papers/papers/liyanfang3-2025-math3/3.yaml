  points: 5
  stem:
    text: |-
      已知函数 $z(x,y)$ 是由等式 $z\ln z=\int_x^y\sin t^2\,\mathrm{d}t$ 确定的关于 $x,y$ 的隐函数，则 $\left.\dfrac{\partial^2z}{\partial x\partial y}\right|_{(1,1)}=$\ExamBlank。
- number: 14
