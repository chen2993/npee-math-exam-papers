- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      设连续曲线 $y=f(x)$ 在点 $(0,0)$ 处有切线 $y=x$，令 $I_1=\int_0^x\sin t\cdot f(x-t)\,\mathrm{d}t$，$I_2=\int_0^x\sin x\cdot f(x-t)\,\mathrm{d}t$，则当 $x\to0$ 时，\ExamSelection。
  choices:
  - label: A
    text: $I_1$ 是 $I_2$ 的高阶无穷小。
    figures: []
  - label: B
    text: $I_2$ 是 $I_1$ 的高阶无穷小。
    figures: []
  - label: C
    text: $I_1$ 与 $I_2$ 是等价无穷小。
    figures: []
  - label: D
    text: $I_1$ 与 $I_2$ 是同阶但不等价的无穷小。
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $n$ 为正整数，则 $\dfrac{\cos x}{1+x^2}$ 在 $x=0$ 处的 $2n$ 阶导数等于\ExamSelection。
  choices:
  - label: A
    text: |-
      $(-1)^{n-1}\displaystyle\sum_{k=0}^{n}C_{2n}^{2k}(2k)!$。
    figures: []
  - label: B
    text: |-
      $(-1)^n\displaystyle\sum_{k=0}^{n}C_{2n}^{2k}(2k)!$。
    figures: []
  - label: C
    text: |-
      $(-1)^{n-1}\displaystyle\sum_{k=0}^{2n}C_{2n}^{k}k!$。
    figures: []
  - label: D
    text: |-
      $(-1)^n\displaystyle\sum_{k=0}^{2n}C_{2n}^{k}k!$。
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      若积分 $\int_0^{\pi}\dfrac{\sin^2x}{(1+\cos x)^p[\ln(1+x)]^q}\,\mathrm{d}x$ 收敛，则 $p,q$ 的取值范围是\ExamSelection。
  choices:
  - label: A
    text: |-
      $p<\dfrac{1}{2},q<1$。
    figures: []
  - label: B
    text: |-
      $p<\dfrac{1}{2},q<3$。
    figures: []
  - label: C
    text: |-
      $p<\dfrac{3}{2},q<1$。
    figures: []
  - label: D
    text: |-
      $p<\dfrac{3}{2},q<3$。
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x,y)=\begin{cases}\dfrac{xy^2}{\sqrt{x^2+y^4}},&(x,y)\ne(0,0),\\0,&(x,y)=(0,0),\end{cases}$ 则下列说法中，正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\dfrac{\partial f(x,y)}{\partial x},\dfrac{\partial f(x,y)}{\partial y}$ 在点 $(0,0)$ 处均连续。
    figures: []
  - label: B
    text: |-
      $\dfrac{\partial f(x,y)}{\partial x}$ 在点 $(0,0)$ 处连续，$\dfrac{\partial f(x,y)}{\partial y}$ 在点 $(0,0)$ 处不连续。
    figures: []
  - label: C
    text: |-
      $\dfrac{\partial f(x,y)}{\partial x}$ 在点 $(0,0)$ 处不连续，$\dfrac{\partial f(x,y)}{\partial y}$ 在点 $(0,0)$ 处连续。
    figures: []
  - label: D
    text: |-
      $\dfrac{\partial f(x,y)}{\partial x},\dfrac{\partial f(x,y)}{\partial y}$ 在点 $(0,0)$ 处均不连续。
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设 $\mathbf{A}$ 为 $2$ 阶矩阵，线性无关的 $2$ 维列向量 $\boldsymbol{\alpha},\boldsymbol{\beta}$ 满足 $\mathbf{A}\boldsymbol{\alpha}=2\boldsymbol{\alpha}-\boldsymbol{\beta}$，$\mathbf{A}\boldsymbol{\beta}=2\boldsymbol{\beta}-\boldsymbol{\alpha}$，则 $\mathbf{A}^{100}\boldsymbol{\alpha}=$\ExamSelection。
  choices:
  - label: A
    text: |-
      $\dfrac{1}{2}(1+3^{100})\boldsymbol{\alpha}+\dfrac{1}{2}(1-3^{100})\boldsymbol{\beta}$。
    figures: []
  - label: B
    text: |-
      $\dfrac{1}{2}(3^{100}+1)\boldsymbol{\alpha}+\dfrac{1}{2}(3^{100}-1)\boldsymbol{\beta}$。
    figures: []
  - label: C
    text: |-
      $\dfrac{1}{2}(1-3^{100})\boldsymbol{\alpha}+\dfrac{1}{2}(1+3^{100})\boldsymbol{\beta}$。
    figures: []
  - label: D
    text: |-
      $\dfrac{1}{2}(3^{100}-1)\boldsymbol{\alpha}+\dfrac{1}{2}(3^{100}+1)\boldsymbol{\beta}$。
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      已知 $\mathbf{A},\mathbf{B},\mathbf{C}$ 均为 $n$ 阶矩阵，$\mathbf{E}$ 为 $n$ 阶单位矩阵。记矩阵 $\begin{pmatrix}\mathbf{A}&\mathbf{E}\\\mathbf{E}&\mathbf{B}\end{pmatrix}$，$\begin{pmatrix}\mathbf{AB}&\mathbf{AB}\\\mathbf{AB}&\mathbf{E}\end{pmatrix}$，$\begin{pmatrix}\mathbf{AB}&\mathbf{A}\\\mathbf{B}&\mathbf{E}\end{pmatrix}$ 的秩分别为 $r_1,r_2,r_3$，则\ExamSelection。
  choices:
  - label: A
    text: |-
      $r_2\leq r_3\leq r_1$。
    figures: []
  - label: B
    text: |-
      $r_3\leq r_2\leq r_1$。
    figures: []
  - label: C
    text: |-
      $r_2\leq r_1\leq r_3$。
    figures: []
  - label: D
    text: |-
      $r_3\leq r_1\leq r_2$。
    figures: []
- number: 7
  section: choice
  points: 5
  stem:
    text: |-
      设 $3$ 阶矩阵 $\mathbf{A}$ 与 $3$ 维非零列向量 $\boldsymbol{\beta}$ 满足 $\mathbf{A}\boldsymbol{\beta}=\boldsymbol{0}$，且对 $3$ 维列向量 $\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\boldsymbol{\alpha}_3$，均有 $\mathbf{A}\boldsymbol{\alpha}_i\ne\boldsymbol{0}\,(i=1,2,3)$，则下列说法中，正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $r(\mathbf{A}\boldsymbol{\alpha}_1,\mathbf{A}\boldsymbol{\alpha}_2,\mathbf{A}\boldsymbol{\alpha}_3)<r(\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\boldsymbol{\alpha}_3)$。
    figures: []
  - label: B
    text: |-
      $r(\mathbf{A}\boldsymbol{\alpha}_1,\mathbf{A}\boldsymbol{\alpha}_2,\mathbf{A}\boldsymbol{\alpha}_3)=r(\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\boldsymbol{\alpha}_3)$。
    figures: []
  - label: C
    text: |-
      若 $r(\mathbf{A}\boldsymbol{\alpha}_1,\mathbf{A}\boldsymbol{\alpha}_2,\mathbf{A}\boldsymbol{\alpha}_3)<r(\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\boldsymbol{\alpha}_3)$，则 $\boldsymbol{\beta}$ 必不可由 $\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\boldsymbol{\alpha}_3$ 线性表示。
    figures: []
  - label: D
    text: |-
      若 $r(\mathbf{A}\boldsymbol{\alpha}_1,\mathbf{A}\boldsymbol{\alpha}_2,\mathbf{A}\boldsymbol{\alpha}_3)=r(\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\boldsymbol{\alpha}_3)$，则 $\boldsymbol{\beta}$ 必不可由 $\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\boldsymbol{\alpha}_3$ 线性表示。
    figures: []
- number: 8
  section: choice
  points: 5
  stem:
    text: |-
      将 $n(n>3)$ 个不同的球随机放入 $3$ 个盒子，随机变量 $X$ 表示有球的盒子数，则 $X$ 的数学期望 $E(X)=$\ExamSelection。
  choices:
  - label: A
    text: |-
      $\dfrac{2^n}{3^n}$。
    figures: []
  - label: B
    text: |-
      $\dfrac{2^n}{3^{n-1}}$。
    figures: []
  - label: C
    text: |-
      $3-\dfrac{2^n}{3^{n-1}}$。
    figures: []
  - label: D
    text: |-
      $3-\dfrac{2^n}{3^n}$。
    figures: []
- number: 9
  section: choice
  points: 5
  stem:
    text: |-
      设总体 $X$ 的概率分布为 $P\{X=1\}=a$，$P\{X=2\}=b$，$P\{X=3\}=1-a-b$，其中未知参数 $a,b$ 均大于 $0$。利用来自总体的样本值 $1,3,2,2,1,1,2$ 对 $a,b$ 进行最大似然估计，若所得 $a$ 的最大似然估计值恰好等于 $a$，则利用该样本值对 $b$ 进行矩估计所得矩估计值为\ExamSelection。
  choices:
  - label: A
    text: |-
      $\dfrac{1}{7}$。
    figures: []
  - label: B
    text: |-
      $\dfrac{2}{7}$。
    figures: []
  - label: C
    text: |-
      $\dfrac{3}{7}$。
    figures: []
  - label: D
    text: |-
      $\dfrac{4}{7}$。
    figures: []
- number: 10
  section: choice
  points: 5
  stem:
    text: |-
      设 $X\sim N(0,1)$，$X_1,X_2$ 是来自总体 $X$ 的简单随机样本，则下列说法中，正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\dfrac{(X_1+X_2)^2}{2}$ 服从 $\chi^2(1)$，$\dfrac{(X_1+X_2)^2}{(X_1-X_2)^2}$ 服从 $F(1,1)$。
    figures: []
  - label: B
    text: |-
      $\dfrac{(X_1+X_2)^2}{2}$ 不服从 $\chi^2(1)$，$\dfrac{(X_1+X_2)^2}{(X_1-X_2)^2}$ 服从 $F(1,1)$。
    figures: []
  - label: C
    text: |-
      $\dfrac{(X_1+X_2)^2}{2}$ 服从 $\chi^2(1)$，$\dfrac{(X_1+X_2)^2}{(X_1-X_2)^2}$ 不服从 $F(1,1)$。
    figures: []
  - label: D
    text: |-
      $\dfrac{(X_1+X_2)^2}{2}$ 不服从 $\chi^2(1)$，$\dfrac{(X_1+X_2)^2}{(X_1-X_2)^2}$ 不服从 $F(1,1)$。
    figures: []
- number: 11
  section: fill
  points: 5
  stem:
    text: |-
      设 $n$ 为大于等于 $3$ 的整数，函数 $f_n(x)=a_nx^{2n+1}+a_{n-1}x^{2n}$，其中 $a_n$ 满足 $a_1=0$，$a_2=-\dfrac{1}{2}$，且对 $n\geq3$，$a_n=\dfrac{4}{3}a_{n-1}-\dfrac{1}{3}a_{n-2}$，记曲线 $y=f_n(x)\,(x<0)$ 的拐点横坐标为 $x_n$，则 $\lim_{n\to\infty}a_nx_n=$\ExamBlank。
