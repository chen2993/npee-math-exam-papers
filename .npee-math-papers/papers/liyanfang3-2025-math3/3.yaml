      设随机变量序列 $X_1,X_2,\cdots,X_n,\cdots$ 独立同分布，且 $X_1$ 的概率密度为 $f(x)=\begin{cases}\dfrac{3}{4}x(2-x),&0<x<2,\\0,&\text{其他},\end{cases}$ 则当 $n\to\infty$ 时，$\dfrac{1}{n}\sum_{i=1}^nX_i^3$ 依概率收敛于\ExamBlank。
- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      设函数 $f(x)=(ax^2+bx+a)\cos\dfrac{1}{x}-2x^2$，且曲线 $y=f(x)$ 恰有一条斜渐近线 $y=2x+c$，求 $a,b,c$。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设区域 $D_r=\{(x,y)\mid x^2+y^2\leq r^2,x+y\geq r\}\,(r>0)$，记函数 $f(r)=\iint_{D_r}\dfrac{(x+y)^2|x^2-y^2|}{(x^2+y^2)^2}\mathrm{e}^{(x+y)^2}\,\mathrm{d}x\mathrm{d}y$，计算 $\lim_{r\to0^+}\dfrac{f(r)}{(\dfrac{\pi}{2}-\arccos r)^2}$。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设数列 $\{a_n\}$ 满足当 $n\geq1$ 时，$(n+1)a_{n+1}+na_{n-1}=0$，$a_0=1$，$a_1=0$。
  subparts:
  - text: |-
      求幂级数 $\displaystyle\sum_{n=0}^{\infty}a_nx^n$ 的收敛半径，并求其在收敛区间内的和函数 $S(x)$；
  - text: $S(x)$ 为第（I）问中所得，求曲线 $y=S(x)$ 与直线 $x=-1$，$x=1$ 以及 $x$ 轴所围平面区域 $D$ 绕 $y$ 轴旋转一周所得旋转体的体积。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 在 $[0,+\infty)$ 上连续，在 $(0,+\infty)$ 内可导，$f(0)=0$，且对任意 $x>0$，$[f'(x)]^2\leq1+2f(x)$。证明：
  subparts:
  - text: |-
      对任意 $x>0$，存在 $\xi_x\in(0,x)$，$f'(x)\leq\dfrac{f'(\xi_x)x}{\sqrt{1+2f(\xi_x)}}+1$；
  - text: |-
      对任意 $x\in[0,+\infty)$，$|f(x)|\leq\dfrac{x^2}{2}+x$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $a$ 为非零常数，矩阵 $\mathbf{A}=\begin{pmatrix}0&a&1\\a&0&2\\1&2&0\end{pmatrix}$，$\mathbf{B}=\begin{pmatrix}1&0&0\\0&-1&a\\0&a&0\end{pmatrix}$，二次型 $f(x_1,x_2,x_3)=\mathbf{x}^{\mathrm T}\mathbf{A}\mathbf{x}$，$g(y_1,y_2,y_3)=\mathbf{y}^{\mathrm T}\mathbf{B}\mathbf{y}$。已知 $f(x_1,x_2,x_3)$ 可经可逆线性变换化为 $g(y_1,y_2,y_3)$。
  subparts:
  - text: 求 $a$ 的取值范围；
  - text: |-
      若 $|\mathbf{A}|=|\mathbf{B}|$，求可逆线性变换 $\mathbf{x}=\mathbf{P}\mathbf{y}$ 将 $f(x_1,x_2,x_3)$ 化为 $g(y_1,y_2,y_3)$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X$ 的概率密度为 $f_X(x)=\begin{cases}6x(1-x),&0<x<1,\\0,&\text{其他},\end{cases}$ 在给定 $X=x$ 的条件下，随机变量 $Y$ 服从 $(0,x)$ 上的均匀分布。
  subparts:
  - text: 求 $(X,Y)$ 的联合分布函数 $F(x,y)$；
  - text: |-
      比较 $F(\dfrac{1}{2},1)$ 与 $F(1,\dfrac{1}{2})$ 的大小。
