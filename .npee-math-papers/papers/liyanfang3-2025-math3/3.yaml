    text: |-
      设某产品的产量 $Q$ 由劳动投入量 $L$ 和资本投入量 $K$ 决定，生产函数为 $Q=50L^\alpha K^\beta$，其中 $\alpha,\beta$ 均大于零，且 $\alpha+\beta=1$。已知当 $Q=600$（单位：件）时，$L$ 关于 $K$ 的弹性为 $\dfrac{1}{2}$，且单位劳动投入和单位资本投入的价格分别为 $27$ 和 $4$（单位：元），则此时的最小成本为\ExamBlank 元。
- number: 15
  section: fill
  points: 5
  stem:
    text: |-
      已知向量 $\boldsymbol{\alpha}_1=\begin{pmatrix}1\\0\\1\end{pmatrix}$，$\boldsymbol{\alpha}_2=\begin{pmatrix}-1\\-1\\0\end{pmatrix}$，$\boldsymbol{\alpha}_3=\begin{pmatrix}0\\1\\1\end{pmatrix}$，$\boldsymbol{\beta}=\begin{pmatrix}1\\0\\-1\end{pmatrix}$，$\boldsymbol{\gamma}=k_1\boldsymbol{\alpha}_1+k_2\boldsymbol{\alpha}_2+k_3\boldsymbol{\alpha}_3$。若 $\boldsymbol{\gamma}^{\mathrm T}\boldsymbol{\alpha}_i=\boldsymbol{\beta}^{\mathrm T}\boldsymbol{\alpha}_i\,(i=1,2,3)$，则 $k_1^2+k_2^2+k_3^2=$\ExamBlank。
