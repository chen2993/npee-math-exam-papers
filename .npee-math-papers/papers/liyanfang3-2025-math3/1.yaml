      （本题满分 12 分）（公众号：风中羽小易）设函数 $z=z(x,y)$ 有一阶连续偏导数，考虑变换 $\begin{cases}\xi=x+y,\\\eta=x-y,\end{cases}$，$\dfrac{\partial z}{\partial\xi},\dfrac{\partial z}{\partial\eta}$ 满足方程组①：$\begin{cases}4\xi\dfrac{\partial z}{\partial\xi}-4\eta\dfrac{\partial z}{\partial\eta}=(\xi+\eta)(3\xi+\eta),\\\dfrac{\partial z}{\partial\xi}+3\dfrac{\partial z}{\partial\eta}=(3\xi+\eta)\ln\xi.\end{cases}$
  subparts:
  - text: |-
      将方程组①化为变量 $x,y$ 与 $\dfrac{\partial z}{\partial x},\dfrac{\partial z}{\partial y}$ 的方程组。
  - text: 在第（I）问的基础上，结合 $z(1,0)=0$，求 $z(x,y)$ 的表达式。
