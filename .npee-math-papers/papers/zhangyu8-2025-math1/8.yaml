- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $X_1,X_2,\cdots,X_n$ 是来自总体 $X$ 的简单随机样本，总体 $X$ 的概率密度为 $f(x;\theta)=\dfrac{1}{2}(1+\theta x),-1<x<1,|\theta|\leq1$，因观测设备精度不高，观察不到 $X_1,X_2,\cdots,X_n$ 的具体取值，只能观察到每个 $X_i$ 是否大于 $0$，记 $Y_i=\begin{cases}1,&X_i>0,\\0,&\text{其他},\end{cases}i=1,\cdots,n$，$\overline Y=\dfrac{1}{n}\sum_{i=1}^nY_i$，求 $\theta$ 的最大似然估计量。
