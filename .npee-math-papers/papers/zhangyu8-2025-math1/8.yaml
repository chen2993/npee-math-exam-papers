  stem:
    text: |-
      设 $f(x),g(x)$ 为连续函数，以下结论：\par （1）若 $\lim_{x\to0}\dfrac{f(x)}{g(x)}=1$，则 $f(x)$ 是 $g(x)$ 在 $x\to0$ 时的等价无穷小；\par （2）若 $f(x)$ 是 $g(x)$ 在 $x\to0$ 时的等价无穷小，则 $\lim_{x\to0}\dfrac{f(x)}{g(x)}=1$；\par （3）若 $f(n)$ 是 $g(n)$ 在 $n\to\infty$ 时的等价无穷小，则 $\sum_{n=1}^{\infty}f(n)$ 与 $\sum_{n=1}^{\infty}g(n)$ 同敛散；\par （4）若 $\sum_{n=1}^{\infty}f(n)$ 与 $\sum_{n=1}^{\infty}g(n)$ 同敛散，则 $f(n)$ 是 $g(n)$ 在 $n\to\infty$ 时的等价无穷小。\par 正确结论的个数为\ExamSelection。
  choices:
  - label: A
    text: $1$
    figures: []
  - label: B
    text: $2$
    figures: []
  - label: C
    text: $3$
    figures: []
  - label: D
    text: $4$
    figures: []
