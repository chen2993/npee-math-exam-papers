- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      （本题满分 12 分）设 $f(x)$ 在 $[a,b]$ 上连续，证明 $f(x)$ 是 $[a,b]$ 上的凸函数的充要条件是：对任意 $[x-c,x+c]\subset[a,b](c>0)$，均有 $f(x)\geq\dfrac{1}{2c}\int_{x-c}^{x+c}f(t)\mathrm{d}t$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      （本题满分 12 分）设曲面 $\Sigma$ 是由直线 $L:\begin{cases}x=\dfrac{\sqrt{2}}{2}t-\dfrac{\sqrt{2}}{2}\\y=\dfrac{\sqrt{2}}{2}t+\dfrac{\sqrt{2}}{2}\\z=t\end{cases}(t\in[0,1])$ 绕 $z$ 轴旋转而得，$\Omega$ 是 $\Sigma$ 与平面 $z=0,z=1$ 所围成的立体，其密度为 $\mu(x,y,z)=\dfrac{z}{1+x^2+y^2}$，求：（1）曲面 $\Sigma$ 的直角坐标方程；（2）$\Omega$ 的质量。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      （本题满分 12 分）设 $A\begin{pmatrix}x_1\\x_2\end{pmatrix}=\begin{pmatrix}x_1+2x_2\\x_1-x_2\\2x_1+ax_2\end{pmatrix}$，$B\begin{pmatrix}x_1\\x_2\\x_3\end{pmatrix}=\begin{pmatrix}x_1+2x_2+3x_3\\bx_1-2x_2-3x_3\end{pmatrix}$。若 $A^{\mathsf T}\boldsymbol{x}=0$ 的解是 $B\boldsymbol{x}=0$ 的解且它们不同解，（1）求 $a,b$ 的值；（2）用正交矩阵 $Q$ 将 $f(x_1,x_2)=\boldsymbol{x}^{\mathsf T}B A\boldsymbol{x}$ 化为标准形。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      （本题满分 12 分）设二维总体随机变量 $(X,Y)$ 的概率密度为 $f(x,y)=2\theta^{-2}e^{-\dfrac{x+y}{\theta}}$，$0<x<y$，其中 $\theta>0$ 为未知参数，$(X_1,Y_1),(X_2,Y_2),\cdots,(X_n,Y_n)$ 为来自总体 $(X,Y)$ 的一组简单随机样本。
  subparts:
  - text: |-
      求 $\theta$ 的最大似然估计量 $\hat{\theta}$；
  - text: |-
      求 $E(\hat{\theta})$。
