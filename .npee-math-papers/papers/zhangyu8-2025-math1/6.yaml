- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      已知 $f(x)=\begin{cases}x^2\ln|x|+1,&0<|x|\leq 1,\\1,&x=0,\end{cases}$，则\ExamSelection
  choices:
  - label: A
    text: $f(0)$ 是 $f(x)$ 在 $[-1,1]$ 上的最小值。
    figures: []
  - label: B
    text: $f(0)$ 是 $f(x)$ 在 $[-1,1]$ 上的最大值。
    figures: []
  - label: C
    text: $f(x)$ 在点 $x=0$ 处连续但不可导。
    figures: []
  - label: D
    text: $f(x)$ 在点 $x=0$ 处二阶可导。
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设常数项级数 $\sum_{n=1}^{\infty}a_n$ 条件收敛，$r$ 是实数，则\ExamSelection
  choices:
  - label: A
    text: |-
      当 $|r|\geq 1$ 时，$\sum_{n=1}^{\infty}a_{2n-1}r^{2n-1}$ 发散。
    figures: []
  - label: B
    text: |-
      当 $|r|\leq 1$ 时，$\sum_{n=1}^{\infty}a_{2n}r^{2n}$ 发散。
    figures: []
  - label: C
    text: |-
      当 $\sum_{n=1}^{\infty}a_{2n-1}r^{2n-1}$ 发散时，$|r|\geq 1$。
    figures: []
  - label: D
    text: |-
      当 $\sum_{n=1}^{\infty}a_{2n}r^{2n}$ 发散时，$|r|\leq 1$。
    figures: []
- number: 3
