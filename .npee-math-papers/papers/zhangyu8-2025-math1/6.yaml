- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 是 $[a,b]$ 上的单调有界且有间断点的函数，则以下结论（1）对任意 $x_0\in(a,b)$，$\lim_{x\to x_0^+}f(x)$ 存在；（2）$\lim_{x\to a^+}f(x),\lim_{x\to b^-}f(x)$ 存在；（3）$f(x)$ 只有第一类间断点；（4）$f(x)$ 可以取到 $f(a)$ 与 $f(b)$ 之间的任意值。正确结论的个数为\ExamSelection
  choices:
  - label: A
    text: 1。
    figures: []
  - label: B
    text: 2。
    figures: []
  - label: C
    text: 3。
    figures: []
  - label: D
    text: 4。
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 为 $n$ 阶实对称矩阵，$\boldsymbol{b}$ 为 $n$ 维实列向量，则 $A-\boldsymbol{b}\boldsymbol{b}^{\mathsf T}$ 正定是 $\boldsymbol{b}^{\mathsf T}A^{-1}\boldsymbol{b}<1$ 的\ExamSelection
  choices:
  - label: A
    text: 必要非充分条件。
    figures: []
  - label: B
    text: 充分非必要条件。
    figures: []
  - label: C
    text: 充分必要条件。
    figures: []
  - label: D
    text: 既非充分又非必要条件。
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $\boldsymbol{\alpha},\boldsymbol{\beta},\boldsymbol{\gamma}$ 为 $n$ 维列向量，以下结论不正确的是\ExamSelection
  choices:
  - label: A
    text: |-
      若 $\boldsymbol{\gamma}$ 与 $\boldsymbol{\alpha},\boldsymbol{\beta}$ 均正交，则 $\boldsymbol{\gamma}$ 与 $\boldsymbol{\alpha}-\boldsymbol{\beta}$ 正交。
    figures: []
  - label: B
    text: |-
      若 $\|\boldsymbol{\alpha}+\boldsymbol{\beta}\|^2=\|\boldsymbol{\alpha}\|^2+\|\boldsymbol{\beta}\|^2$，则 $\boldsymbol{\alpha}$ 与 $\boldsymbol{\beta}$ 正交。
    figures: []
  - label: C
    text: |-
      若 $\|\boldsymbol{\alpha}-\boldsymbol{\beta}\|^2=\|\boldsymbol{\alpha}\|^2+\|\boldsymbol{\beta}\|^2$，则 $\boldsymbol{\alpha}$ 与 $\boldsymbol{\beta}$ 正交。
    figures: []
  - label: D
    text: |-
      若 $\boldsymbol{\alpha}$ 与 $\boldsymbol{\beta}$ 正交，则 $\boldsymbol{\alpha}$ 与 $\boldsymbol{\beta}$ 线性无关。
    figures: []
- number: 7
  section: choice
  points: 5
  stem:
    text: |-
      设 $A,B$ 为 $n$ 阶实对称矩阵，则下列结论不成立的是\ExamSelection
  choices:
  - label: A
    text: $r(A-AB)=r(A)$。
    figures: []
  - label: B
    text: |-
      $r\left(AB^{\mathsf T}-AB^{\mathsf T}B\right)=r(AB^{\mathsf T})$。
    figures: []
  - label: C
    text: |-
      $r\left(\begin{pmatrix}BA\\B^{\mathsf T}BA\end{pmatrix}\right)=r(AB^{\mathsf T})$。
    figures: []
  - label: D
    text: $r(A^{T}A;B^{T}A)=r(A)$。
    figures: []
- number: 8
  section: choice
  points: 5
  stem:
    text: |-
      设随机事件 $A,B,C$，则下列条件中，使得 $P[(A-B)-C]=P[A-(B-C)]$ 成立的一个充分条件是\ExamSelection
  choices:
