  subparts:
  - text: |-
      证明：存在 $\xi\in(0,x)$，使 $\int_0^x f(t)\,\mathrm{d}t=\dfrac{x[f(0)+f(x)]}{2}-\dfrac{x^3}{12}f''(\xi)$；
  - text: |-
      由（1），计算 $\lim_{x\to0^+}\dfrac{\xi}{x}$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x,y)$ 在平面 $\mathbb{R}^2$ 上存在连续偏导数，且只有唯一一零点 $O(0,0)$，对任何包围 $O(0,0)$ 的光滑正向闭曲线 $C$，曲线积分 $\oint_C\dfrac{x\,\mathrm{d}y-y\,\mathrm{d}x}{f(x,y)}=m$，$m$ 为正常数。
  subparts:
  - text: |-
      证明：对任何不包围 $O(0,0)$ 的光滑闭曲线 $L$，曲线积分 $\oint_L\dfrac{x\,\mathrm{d}y-y\,\mathrm{d}x}{f(x,y)}=0$；
  - text: |-
      若 $f(x,y)=g(x)+h(y)$，且 $g'(1)\cdot h'(1)=4\pi^2$，求 $m$ 的值。
- number: 21
