- number: 7
  section: choice
  points: 5
  stem:
    text: |-
      设可逆矩阵 $\mathbf{A}=\begin{pmatrix}2&1&1\\1&2&1\\1&1&a\end{pmatrix}$，$\boldsymbol{\alpha}=\begin{pmatrix}1\\b\\1\end{pmatrix}$，若 $\mathbf{A}^{*}\boldsymbol{\alpha}=\lambda\boldsymbol{\alpha}$，则\ExamSelection。
