  - label: A
    text: |-
      $a=2$ 时，$\lambda=1$。
    figures: []
  - label: B
    text: |-
      $a=2$ 时，$\lambda=4$。
    figures: []
  - label: C
    text: |-
      $b=1$ 时，$\lambda=1$。
    figures: []
  - label: D
    text: |-
      $b=1$ 时，$\lambda=4$。
    figures: []
- number: 8
