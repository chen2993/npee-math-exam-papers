    text: |-
      $f(x)=\dfrac{|\ln |x||}{x^2-1}$ 有\ExamSelection。
  choices:
  - label: A
    text: 两个跳跃间断点，一个无穷间断点。
    figures: []
  - label: B
    text: 两个可去间断点，一个无穷间断点。
    figures: []
  - label: C
    text: 一个可去间断点，一个跳跃间断点，一个无穷间断点。
    figures: []
  - label: D
    text: 三个无穷间断点。
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      以下结论，正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      若 $\sum_{n=0}^{\infty}a_n^2$ 收敛，则 $\sum_{n=0}^{\infty}a_n^3$ 收敛。
    figures: []
  - label: B
    text: |-
      若 $\sum_{n=0}^{\infty}a_n^2$ 发散，则 $\sum_{n=0}^{\infty}a_n^3$ 发散。
    figures: []
  - label: C
    text: |-
      若 $\sum_{n=0}^{\infty}a_n^3$ 收敛，则 $\sum_{n=0}^{\infty}a_n^4$ 收敛。
    figures: []
  - label: D
    text: |-
      若 $\sum_{n=0}^{\infty}a_n^3$ 发散，则 $\sum_{n=0}^{\infty}a_n^4$ 发散。
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设曲面 $z_1=f(x,y)$ 与 $z_2=g(x,y)$ 在点 $(1,0)$ 处的切平面 $\pi_1$ 与 $\pi_2$ 的交线与 $xOy$ 面相交于点 $\left(-\dfrac{1}{2},-\dfrac{1}{2},0\right)$，$f(1,0)=f'_x(1,0)=1$，$g(1,0)=g'_x(1,0)=-1$，则\ExamSelection。
  choices:
  - label: A
    text: $f'_y(1,0)=1$，$g'_y(1,0)=1$。
    figures: []
  - label: B
    text: $f'_y(1,0)=-1$，$g'_y(1,0)=1$。
    figures: []
  - label: C
    text: $f'_y(1,0)=1$，$g'_y(1,0)=-1$。
    figures: []
  - label: D
    text: $f'_y(1,0)=-1$，$g'_y(1,0)=-1$。
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      已知函数 $f(x)$ 在区间 $(0,+\infty)$ 上可导，则\ExamSelection。
  choices:
  - label: A
    text: |-
      若 $\lim_{x\to+\infty}f'(x)=0$，则 $\lim_{x\to+\infty}\dfrac{f(x)}{x}=0$。
    figures: []
  - label: B
    text: |-
      若 $\lim_{x\to+\infty}\dfrac{f(x)}{x}=0$，则 $\lim_{x\to+\infty}f'(x)=0$。
    figures: []
  - label: C
    text: |-
      若 $\lim_{x\to+\infty}f'(x)$ 存在，则 $f(x)$ 在 $x\to+\infty$ 时有渐近线。
    figures: []
  - label: D
    text: |-
      若 $f(x)$ 在 $x\to+\infty$ 时有渐近线，则 $\lim_{x\to+\infty}f'(x)$ 存在。
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      $n$ 阶矩阵 $\mathbf{A}$ 经有限次初等行变换得到矩阵 $\mathbf{B}$，则\ExamSelection。
  choices:
  - label: A
    text: |-
      $\mathbf{A},\mathbf{B}$ 有相同的特征值。
    figures: []
  - label: B
    text: |-
      $\mathbf{A}x=b,\mathbf{B}x=b$ 是同解方程组。
    figures: []
  - label: C
    text: |-
      $r(\mathbf{A})=r(\mathbf{B})=r(\mathbf{A}:\mathbf{B})$。
    figures: []
  - label: D
    text: |-
      $r(\mathbf{A})=r(\mathbf{B})=r(\mathbf{A}^{\mathrm{T}}:\mathbf{B}^{\mathrm{T}})$。
    figures: []
