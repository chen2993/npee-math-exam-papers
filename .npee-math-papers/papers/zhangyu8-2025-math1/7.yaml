  - label: A
    text: |-
      $\dfrac{z}{2\lambda},\dfrac{z}{2\lambda^2}$。
    figures: []
  - label: B
    text: |-
      $\dfrac{1}{\lambda^2},\dfrac{1}{\lambda^4}$。
    figures: []
  - label: C
    text: |-
      $\dfrac{z}{\lambda^2},\dfrac{z}{\lambda^4}$。
    figures: []
  - label: D
    text: |-
