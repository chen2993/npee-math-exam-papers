  stem:
    text: |-
      设 $f(x)$ 在 $(-1,1)$ 内有 $f''(x)<0$，且 $\lim_{x\to 0}\dfrac{f(x)-\sin x}{x}=a\ne 0$，则以下结论：$(1)\;\lim_{x\to 0}f(x)=0$；$(2)\;\lim_{x\to 0}f'(x)=a+1$；$(3)\;f(x)\leq ax$；$(4)\;f'(0)>a$。所有正确结论的序号为\ExamSelection。
