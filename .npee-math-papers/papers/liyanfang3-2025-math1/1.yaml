- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设二元函数 $f(x,y)$ 在区域 $D=\{(x,y)\mid0\leq x\leq1,0\leq y\leq1\}$ 上有连续的偏导数 $\dfrac{\partial f}{\partial x},\dfrac{\partial f}{\partial y}$，且 $\left|\dfrac{\partial f}{\partial x}\right|\leq M\text{，}\left|\dfrac{\partial f}{\partial y}\right|\leq M$。已知 $f(0,0)=f(0,1)=f(1,0)=f(1,1)=0$，证明：
  subparts:
  - text: |-
      在区域 $D$ 上，$|f(x,y)|\leq M(x+y)$；
  - text: |-
      $\left|\iint_Df(x,y)\,\mathrm{d}x\mathrm{d}y\right|\leq\dfrac{M}{2}$。
