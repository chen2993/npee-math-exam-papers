- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设矩阵 $A=(\alpha_1,\alpha_2,\cdots,\alpha_n)$，$B=(\beta_1,\beta_2,\cdots,\beta_n)$，$C=(\gamma_1,\gamma_2,\cdots,\gamma_n)$，$P,Q$ 为可逆矩阵，满足 $PA=B,AQ=C,\xi\ne0$，则下列说法中，正确的是（\ExamSelection）。
  choices:
  - label: A
    text: |-
      若 $k_1\alpha_1+k_2\alpha_2+\cdots+k_n\alpha_n=0$，则 $k_1\beta_1+k_2\beta_2+\cdots+k_n\beta_n=0$。
    figures: []
  - label: B
    text: |-
      若 $k_1\alpha_1+k_2\alpha_2+\cdots+k_n\alpha_n=\xi$，则 $k_1\beta_1+k_2\beta_2+\cdots+k_n\beta_n=\xi$。
    figures: []
  - label: C
    text: |-
      若 $k_1\alpha_1+k_2\alpha_2+\cdots+k_n\alpha_n=0$，则 $k_1\gamma_1+k_2\gamma_2+\cdots+k_n\gamma_n=0$。
    figures: []
  - label: D
    text: |-
      若 $k_1\alpha_1+k_2\alpha_2+\cdots+k_n\alpha_n=\xi$，则 $k_1\gamma_1+k_2\gamma_2+\cdots+k_n\gamma_n=\xi$。
    figures: []
