  stem:
    text: |-
      设随机变量 $X$ 的概率分布为 $P\{X=k\}=\dfrac{1}{2^k},k=1,2,\cdots$，当 $X=k$ 时，随机变量 $Y$ 服从参数为 $k$ 的指数分布。令 $Z=XY$。
  subparts:
  - text: 求 $Z$ 的概率密度；
  - text: |-
