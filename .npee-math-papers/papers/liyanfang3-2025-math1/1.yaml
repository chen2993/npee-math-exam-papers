- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)$ 是 $\dfrac{\sin x}{1+x^2}$ 在 $[0,1]$ 上的一个原函数，$k$ 为非零常数，则下列说法中，正确的是（\ExamSelection）。
  choices:
  - label: A
    text: |-
      若 $\lim_{x\to0}\dfrac{f(x)}{x^k}$ 存在，则 $\lim_{x\to0}f(x)=0$。
    figures: []
  - label: B
    text: |-
      若 $\lim_{x\to0}\dfrac{f(x)}{x^k}$ 存在，则 $0<k\leq2$。
    figures: []
  - label: C
    text: |-
      若 $\lim_{x\to0}f(x)=0$，则 $\lim_{x\to0}\dfrac{f(x)}{\sqrt{x}}=0$。
    figures: []
  - label: D
    text: |-
      若 $\lim_{x\to0}f(x)=0$，则 $\lim_{x\to0}\dfrac{f(x)}{x^2}=1$。
    figures: []
