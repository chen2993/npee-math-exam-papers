      设 $A$ 是3阶矩阵，$\alpha$ 是满足 $A\alpha=0$ 的非零向量，且 $A$ 有二重正特征值。已知对满足 $\beta^{\mathrm T}\alpha=0$ 的3维列向量 $\beta$，均有 $A^2\beta=\beta$。\n（Ⅰ）证明：$A$ 能相似对角化。\n（Ⅱ）设可逆矩阵 $P=(\alpha,\beta_1-\alpha,\beta_2-\beta_1)$，其中 $\alpha,\beta_1,\beta_2$ 为 $A$ 的三个线性无关的特征向量，矩阵 $B$ 满足 $P^{-1}AP=B$，求矩阵 $B$。
- number: 22
  section: solution
