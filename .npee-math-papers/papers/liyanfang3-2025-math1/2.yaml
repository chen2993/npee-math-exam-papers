    text: |-
      设总体 $X$ 服从 $(\theta,\lambda\theta)$ 上的均匀分布，其中 $\theta>0,\lambda>1$，$X_1,X_2,\cdots,X_n$ 是来自总体 $X$ 的简单随机样本。\n（Ⅰ）利用样本的一阶原点矩与二阶原点矩求 $\theta,\lambda$ 的矩估计量；\n（Ⅱ）求 $\theta,\lambda$ 的最大似然估计量。
