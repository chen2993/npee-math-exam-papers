- number: 10
  section: choice
  points: 5
  stem:
    text: |-
      设总体 $X\sim N(\mu,2)$，$X_1,X_2,\cdots,X_n(n>2)$ 是来自总体 $X$ 的简单随机样本。记样本均值 $\overline{X}=\dfrac{1}{n}\sum_{i=1}^nX_i$，样本方差 $S^2=\dfrac{1}{n-1}\sum_{i=1}^n(X_i-\overline{X})^2(S>0)$，则下列说法中，错误的是\ExamSelection
  choices:
  - label: A
    text: |-
      $\dfrac{X_1-X_2}{\sqrt{2}|X_n-\mu|}$ 服从自由度为1的 $t$ 分布。
    figures: []
  - label: B
    text: |-
      $\dfrac{\sqrt{n}(\overline{X}-\mu)}{S}$ 服从自由度为 $n-1$ 的 $t$ 分布。
    figures: []
  - label: C
    text: |-
      $\dfrac{n(X_1-\overline{X})^2}{2(n+1)}$ 服从自由度为1的 $\chi^2$ 分布。
    figures: []
  - label: D
    text: |-
      $\dfrac{1}{2}\sum_{i=1}^n(X_i-\mu)^2$ 服从自由度为 $n$ 的 $\chi^2$ 分布。
    figures: []
