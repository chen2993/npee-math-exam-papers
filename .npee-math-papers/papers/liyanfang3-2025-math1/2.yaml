- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x,y,z)$ 在空间闭区域 $\Omega$ 上连续，我们称 $\dfrac{\displaystyle\iiint_\Omega f(x,y,z)\,\mathrm{d}v}{\Omega\text{的体积}}$ 为 $f(x,y,z)$ 在 $\Omega$ 上的平均值。已知 $\Omega$ 是由曲面 $x^2+y^2+(z-1)^2=1\ (z\geq1)$ 与旋转抛物面 $z=x^2+y^2$ 所围成的空间闭区域，$f(x,y,z)=x^2+y^2-z^2$，求 $f(x,y,z)$ 在 $\Omega$ 上的平均值。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      记 $a_n=\displaystyle\int_0^1\sqrt{x}(1-x)^n\,\mathrm{d}x,b_n=\displaystyle\int_0^1\dfrac{x^n}{\sqrt{1-x}}\,\mathrm{d}x$。\n（Ⅰ）证明对任意正整数 $n$，$b_n$ 均有定义，且数列 $\{b_n\}$ 收敛；\n（Ⅱ）证明级数 $\displaystyle\sum_{n=1}^{\infty}a_n$ 收敛，并求该级数和。
- number: 21
  section: solution
