- number: 7
  section: choice
  points: 5
  stem:
    text: |-
      设 $t$ 为非零参数，二次型 $f(x_1,x_2,x_3)=x_1^2+(1+t)x_2^2+(1-t)x_3^2+2(1-t)x_1x_2+2(1+t)x_1x_3+2x_2x_3$，二次曲面 $S$ 的方程为 $f(x_1,x_2,x_3)=1$，若正交变换 $x=Qy$ 将曲面方程化为标准方程，则下列说法中，错误的是\ExamSelection
  choices:
  - label: A
    text: $S$ 必为单叶双曲面。
    figures: []
  - label: B
