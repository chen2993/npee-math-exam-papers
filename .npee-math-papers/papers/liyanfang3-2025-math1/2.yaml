- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)=\begin{cases}\dfrac{\sin(\pi x)}{[e^x-(e-1)x-1]\ln x^2},&x\ne 0,\\0,&x=0,\end{cases}$，则下列关于 $f(x)$ 的间断点的说法中，正确的是\ExamSelection
  choices:
  - label: A
    text: $f(x)$ 共有2个间断点，可去间断点和无穷间断点各1个。
    figures: []
  - label: B
    text: $f(x)$ 共有2个间断点，可去间断点和跳跃间断点各1个。
    figures: []
  - label: C
    text: $f(x)$ 共有3个间断点，包括2个可去间断点，1个无穷间断点。
    figures: []
  - label: D
    text: $f(x)$ 共有3个间断点，可去间断点、跳跃间断点、无穷间断点各1个。
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      已知函数 $x\sin x$ 是二阶常系数非齐次线性微分方程 $y''+py'+qy=r\cos x+x\sin x$ 的一个解，则下列关于该方程的通解的说法中，正确的是\ExamSelection
  choices:
  - label: A
    text: |-
      通解为 $y=x\sin x+C_1\sin x+C_2\cos x$，其中 $C_1,C_2$ 为任意常数。
    figures: []
  - label: B
    text: |-
      通解为 $y=x\sin x+C_1\sin\sqrt{2}x+C_2\cos\sqrt{2}x$，其中 $C_1,C_2$ 为任意常数。
    figures: []
  - label: C
    text: |-
      通解为 $y=x\sin x+\cos x+C_1\sin\sqrt{2}x+C_2\cos\sqrt{2}x$，其中 $C_1,C_2$ 为任意常数。
    figures: []
  - label: D
    text: 无法确定该方程的通解。
    figures: []
