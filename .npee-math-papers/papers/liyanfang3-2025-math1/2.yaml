    figures: []
  - label: C
    text: 正交变换 $x=Qy$ 对应的基变换的过渡矩阵为 $Q$。
    figures: []
  - label: D
    text: |-
      $(1,1,1)^{\mathrm T}$ 必为正交变换下的新坐标系的一个坐标轴方向。
    figures: []
