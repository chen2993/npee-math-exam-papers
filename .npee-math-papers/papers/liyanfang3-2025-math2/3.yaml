questions:
- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)=\lim_{n\to\infty}\left(e^{-\dfrac{[x]\cos\sqrt{4n^2+1}\pi}{x}}-e^{n[x]}\right)$，其中 $[x]$ 表示不超过 $x$ 的最大整数，则\ExamSelection。
  choices:
  - label: A
    text: $x=0$ 是 $f(x)$ 的连续点。
    figures: []
  - label: B
    text: $x=0$ 是 $f(x)$ 的可去间断点。
    figures: []
  - label: C
    text: $x=0$ 是 $f(x)$ 的跳跃间断点。
    figures: []
  - label: D
    text: $x=0$ 是 $f(x)$ 的无穷间断点。
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)$ 在 $x=\dfrac{\pi}{2}$ 处连续，且 $\lim_{x\to\dfrac{\pi}{2}}\dfrac{f(x)}{|\cos x|}=1$，则\ExamSelection。
  choices:
  - label: A
    text: |-
      $\lim_{x\to\dfrac{\pi}{2}}f'(x)=1$。
    figures: []
  - label: B
    text: |-
      $f(x)$ 在 $x=\dfrac{\pi}{2}$ 处可导。
    figures: []
  - label: C
    text: |-
      $f(x)$ 在 $x=\dfrac{\pi}{2}$ 处的左导数为 $1$。
    figures: []
  - label: D
    text: |-
      $f(x)$ 在 $x=\dfrac{\pi}{2}$ 处的右导数为 $1$。
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设 $a\ne0$，则下列关于曲线 $l_1:y_1=e^{ax}$ 和曲线 $l_2:y_2=\dfrac{1}{1+ax^2}+ax$ 的说法中，错误的是\ExamSelection。
  choices:
  - label: A
    text: 不论 $a$ 为何值，直线 $y=ax+1$ 必为 $l_1$ 与 $l_2$ 的公切线。
    figures: []
  - label: B
    text: 曲线 $l_1$ 与 $l_2$ 在点 $(0,1)$ 处的曲率半径与 $a$ 有关。
    figures: []
  - label: C
    text: 当 $a=2$ 时，$l_1$ 与 $l_2$ 在点 $(0,1)$ 处有相同的曲率与曲率圆。
    figures: []
  - label: D
    text: 当 $a=-2$ 时，$l_1$ 与 $l_2$ 在点 $(0,1)$ 处有相同的曲率与曲率圆。
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)$ 为 $[0,1]$ 上的可导函数，且 $|f'(x)|$ 在 $[0,1]$ 上的最大值为 $M$。若方程 $f(x)-x+1=0$，$f(x)+x-1=0$ 在 $(0,1)$ 内均有解，则对于满足条件的函数 $f(x)$，均有\ExamSelection。
  choices:
  - label: A
    text: |-
      $|f(0)|+|f(1)|\leq M$。
    figures: []
  - label: B
    text: |-
      $|f(0)|+|f(1)|\geq M$。
    figures: []
  - label: C
    text: $|f(0)|+|f(1)|=M$。
    figures: []
  - label: D
    text: |-
      $|f(0)|+|f(1)|\ne M$。
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $y_1(x),y_2(x),y_3(x)$ 分别为一阶非齐次线性微分方程 $y'+p(x)y=q(x)$ 的三个不同的解，已知 $y_1(0)=a,y_2(0)=b,y_3(0)=c$，则下列说法中，正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\dfrac{y_3(x)-y_1(x)}{y_2(x)-y_1(x)}$ 是否为常数与 $p(x),q(x)$ 有关。
    figures: []
  - label: B
    text: |-
      $\dfrac{y_3(x)-y_1(x)}{y_2(x)-y_1(x)}$ 是否为常数与 $a,b,c$ 的取值有关。
    figures: []
  - label: C
    text: |-
      若 $a<b<c$，则 $\dfrac{y_3(x)-y_1(x)}{y_2(x)-y_1(x)}$ 必为大于 $0$ 的常数。
    figures: []
  - label: D
    text: |-
      若 $a<b<c$，则 $\dfrac{y_3(x)-y_1(x)}{y_2(x)-y_1(x)}$ 必为小于 $0$ 的常数。
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $D$ 是由曲线 $2xy=1$ 与直线 $x+y=\dfrac{3}{2}$ 所围成的封闭区域，已知函数 $f(x,y)$ 在区域 $D$ 上连续，且 $f(x,y)=f(y,x)$，则 $\iint_D f(x,y)\,\mathrm{d}x\mathrm{d}y=$\ExamSelection。
  choices:
  - label: A
    text: |-
      $2\int_{\dfrac{\pi}{4}}^{\dfrac{\pi}{2}}\mathrm{d}\theta\int_{\dfrac{1}{\sqrt{\sin2\theta}}}^{\dfrac{3}{2(\sin\theta+\cos\theta)}}f(r\cos\theta,r\sin\theta)r\,\mathrm{d}r$
    figures: []
  - label: B
    text: |-
      $2\int_{\dfrac{\pi}{4}}^{\dfrac{\pi}{2}}\mathrm{d}\theta\int_{\dfrac{1}{\sqrt{2\sin2\theta}}}^{\dfrac{3}{2(\sin\theta+\cos\theta)}}f(r\cos\theta,r\sin\theta)r\,\mathrm{d}r$。
    figures: []
  - label: C
    text: |-
      $2\int_{\dfrac{\pi}{4}}^{\arctan2}\mathrm{d}\theta\int_{\dfrac{1}{\sqrt{\sin2\theta}}}^{\dfrac{3}{2(\sin\theta+\cos\theta)}}f(r\cos\theta,r\sin\theta)r\,\mathrm{d}r$
    figures: []
  - label: D
    text: |-
      $2\int_{\dfrac{\pi}{4}}^{\arctan2}\mathrm{d}\theta\int_{\dfrac{1}{\sqrt{2\sin2\theta}}}^{\dfrac{3}{2(\sin\theta+\cos\theta)}}f(r\cos\theta,r\sin\theta)r\,\mathrm{d}r$
    figures: []
