- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设数列 $\{x_n\}$ 满足 $x_1=\dfrac{1}{2}$，且对所有正整数 $n$，$\dfrac{1}{x_{n+1}}=\dfrac{2}{3}\left(\dfrac{1}{x_n}+\dfrac{1}{3-x_n}\right)$。
  subparts:
  - text: |-
      证明 $\lim_{n\to\infty}x_n$ 存在，并求其值；
  - text: |-
      求 $\lim_{n\to\infty}2^{-n}\prod_{i=1}^n(3-x_i)$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $3$ 阶矩阵 $\boldsymbol{A}$ 与非零向量 $\boldsymbol{\alpha}$ 满足 $\boldsymbol{A}\boldsymbol{\alpha}=\boldsymbol{\alpha}$，不同于 $\boldsymbol{\alpha}$ 的向量 $\boldsymbol{\beta}$ 满足 $\boldsymbol{A}\boldsymbol{\beta}=\boldsymbol{\alpha}$，向量 $\boldsymbol{\gamma}$ 满足 $\boldsymbol{A}\boldsymbol{\gamma}=\boldsymbol{\alpha}+\boldsymbol{\beta}$。求与 $\boldsymbol{A}^n$（$n\geq2$）相似的对角矩阵。
