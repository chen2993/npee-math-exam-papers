      设 $\alpha_1=\sin\sqrt{x}-\sin(2\sqrt{x}),\alpha_2=\mathrm{e}^{\sqrt[3]{x}}-\mathrm{e}^{\sqrt{x}},\alpha_3=\sqrt[3]{8+x}-\sqrt[3]{8-x}$。当 $x\to0^+$ 时，以上 3 个无穷小量按照从低阶到高阶的排序是\ExamSelection
  choices:
  - label: A
    text: |-
      $\alpha_1,\alpha_2,\alpha_3$。
    figures: []
  - label: B
    text: |-
      $\alpha_2,\alpha_3,\alpha_1$。
    figures: []
  - label: C
    text: |-
      $\alpha_2,\alpha_1,\alpha_3$。
    figures: []
  - label: D
    text: |-
      $\alpha_3,\alpha_2,\alpha_1$。
    figures: []
- number: 2
