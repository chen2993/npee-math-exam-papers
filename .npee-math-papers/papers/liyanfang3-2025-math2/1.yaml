      设函数 $y(x)$ 在 $[0,1)$ 上单调增加且满足 $y(0)=0$，过曲线 $y=y(x)$ 上任一点 $(x,y)$ 作该曲线的切线交直线 $x=1$ 于点 $(1,y_1)$。已知曲线 $y=y(x)$ 从点 $(0,0)$ 到点 $(x,y)$ 的弧长等于 $y_1$，$y_1>0$，且曲线 $y=y(x)$、$x$ 轴以及 $x=1$ 围成的平面图形的面积为 $\dfrac{1}{3}$。求 $y(x)$。
