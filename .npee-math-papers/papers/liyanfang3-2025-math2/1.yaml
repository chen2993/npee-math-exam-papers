- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $\boldsymbol{\alpha},\boldsymbol{\beta},\boldsymbol{\gamma}$ 是 3 阶矩阵 $\boldsymbol{A}$ 的 3 个特征向量，其中 $\boldsymbol{\beta}$ 与 $\boldsymbol{\gamma}$ 为属于不同特征值的特征向量，方程组 $\boldsymbol{A}x=\boldsymbol{\beta}+\boldsymbol{\gamma}$ 的通解为 $x=k\boldsymbol{\alpha}+\boldsymbol{\beta}+\dfrac{1}{3}\boldsymbol{\gamma}$，其中 $k$ 为任意常数。
  subparts:
  - text: |-
      求方程组 $\boldsymbol{A}x=\boldsymbol{\beta}-\boldsymbol{\gamma}$ 的通解；
  - text: |-
      若 $\boldsymbol{\alpha}=(1,1,1)^{\mathrm T}$，且 $\boldsymbol{A}$ 的伴随矩阵 $\boldsymbol{A}^*$ 为对称矩阵，求 $\boldsymbol{A}^*$。
