- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 为 $[a,+\infty)$ 上的二阶可导函数，$f''(x)>0,a<b<c$，若 $\dfrac{f(b)-f(a)}{b-a}=f'(\xi_1)$，$\dfrac{f(c)-f(a)}{c-a}=f'(\xi_2)$，则\ExamSelection
  choices:
  - label: A
    text: |-
      $\xi_1<\xi_2$。
    figures: []
  - label: B
    text: |-
      $\xi_1=\xi_2$。
    figures: []
  - label: C
    text: |-
      $\xi_1>\xi_2$。
    figures: []
  - label: D
    text: |-
      无法确定 $\xi_1$ 与 $\xi_2$ 的大小关系。
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)$ 为 $(-\infty,+\infty)$ 上的连续函数，满足对任意的 $x$，都有 $f(\pi-x)+f(\pi+x)=2$，$f\left(\dfrac{\pi}{2}-x\right)=f\left(\dfrac{\pi}{2}+x\right)$，则下列说法中，正确的是\ExamSelection
  choices:
  - label: A
    text: |-
      $\int_{-\dfrac{\pi}{2}}^0f(x)\,\mathrm{d}x=\int_0^{\dfrac{\pi}{2}}f(x)\,\mathrm{d}x$。
    figures: []
  - label: B
    text: |-
      $\int_0^\pi f(x)\,\mathrm{d}x=\int_\pi^{2\pi}f(x)\,\mathrm{d}x$。
    figures: []
  - label: C
    text: |-
      $\int_{-\dfrac{3\pi}{2}}^0f(x)\,\mathrm{d}x=\int_0^{\dfrac{3\pi}{2}}f(x)\,\mathrm{d}x$。
    figures: []
  - label: D
    text: |-
      $\int_0^{2\pi}f(x)\,\mathrm{d}x=\int_{2\pi}^{4\pi}f(x)\,\mathrm{d}x$。
    figures: []
