  stem:
    text: |-
      某自然保护区重新引入了一种濒危动物. 在理想条件下（无资源限制），该种群的增长速率与当前种群数量 \(N\) 成正比，比例常数为 \(r\). 但实际上，栖息地的食物和空间是有限的，环境最大容纳量为 \(K=250\) 只. 当种群数量接近 \(K\) 时，增长会受到抑制. 假设种群数量的实际增长率满足：实际增长率\(=\)理想增长率\(\times\)资源剩余比例，其中资源剩余比例为 \(1-\dfrac{N}{K}\). ① 已知某年放归了 50 只，10 年后种群数量增长到 125 只. 求第 \(t\) 年后的种群数量 \(N(t)\)； ② 种群数量达到环境容纳量的 80%（即 200 只）需要多少年？
