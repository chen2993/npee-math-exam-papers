- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $A=\begin{pmatrix}1&a&1\\2&-1&1\\0&1&b\end{pmatrix}$，$ab\ne0$，存在非零矩阵 $B$，使得 $r\left[B(A+E)\right]<r(B)$，且 $A^*=4A^{-1}$。
