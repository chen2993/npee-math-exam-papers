  stem:
    text: |-
      当 $x\to0$ 时，$\alpha(x),\beta(x)$ 是非零无穷小量，则下列命题：\textcircled{1}若 $\alpha(x)\sim\beta(x)$，则 $\lim_{x\to0}[1+\alpha(x)]^{1/\beta(x)}=e$；\textcircled{2}若 $\lim_{x\to0}[1+\alpha(x)]^{1/\beta(x)}=e$，则 $\alpha(x)\sim\beta(x)$；\textcircled{3}若 $\alpha(x)-\beta(x)=o(\alpha(x))$，则 $\lim_{x\to0}\dfrac{1-\cos\alpha(x)}{\alpha(x)\beta(x)}=\dfrac12$；\textcircled{4}若 $\lim_{x\to0}\dfrac{1-\cos\alpha(x)}{\beta^2(x)}=\dfrac12$，则 $\alpha(x)-\beta(x)=o(\beta(x))$。所有真命题的序号为\ExamSelection
  choices:
  - label: A
    text: |-
      \textcircled{1}\textcircled{3}\textcircled{4}
    figures: []
  - label: B
    text: |-
      \textcircled{1}\textcircled{2}\textcircled{3}
    figures: []
  - label: C
    text: |-
      \textcircled{2}\textcircled{4}
    figures: []
  - label: D
    text: |-
      \textcircled{2}\textcircled{3}\textcircled{4}
    figures: []
- number: 3
