- number: 21
  section: solution
  points: 12
  stem:
    text: 某产品当前的市场占有率为 80%，经调研，正使用该产品的用户中有 80% 仍会继续购买，当前未使用该产品的用户中有 20% 将会购买，设第 $n$ 年时，购买的用户比例为 $x_n$，不购买的用户比例为 $y_n$。
  subparts:
  - text: |-
      求 $\begin{pmatrix}x_n\\y_n\end{pmatrix}$ 的表达式；
  - text: 按此趋势，求该产品最终的市场占有率。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $(X,Y)$ 服从区域 $D=\{(x,y)\mid 0\leq x\leq1,1-\sqrt{2x-x^2}\leq y\leq\sqrt{1-x^2}\}$ 上的均匀分布。记 $Z=\begin{cases}1,&X+Y>1,\\0,&X+Y\leq1,\end{cases}$，$U=XZ$ 的分布函数为 $F_U(u)$。
  subparts:
  - text: 证明 $X$ 与 $Z$ 不独立；
  - text: |-
      计算 $F_U\left(\dfrac{1}{2}\right)$。
