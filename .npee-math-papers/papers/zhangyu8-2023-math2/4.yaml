      设函数 $f(x,y)$ 具有二阶连续偏导数，且满足 $f(x,0)=x^2$，$f'_y(x,0)=\sqrt{2}x$，$f''_{yy}(x,y)=4$，求 $f(x,y)$ 在限制条件 $x^2+2y^2=4$ 下的最大值与最小值。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      \mbox{}
  subparts:
  - text: |-
      设 $f(x)$ 在 $[a,b]$ 上可导，若 $f'_+(a)\ne f'_-(b)$，证明对于任意的介于 $f'_+(a)$ 与 $f'_-(b)$ 之间的 $\mu$，存在 $\xi\in(a,b)$，使得 $f'(\xi)=\mu$；
  - text: |-
      设 $f(x)$ 在区间 $[-1,1]$ 上三阶可导，证明：存在 $\xi\in(-1,1)$，使得 $\dfrac{f'''(\xi)}{6}=\dfrac{f(1)-f(-1)}{2}-f'(0)$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 连续，证明：$\iint_{|y|\leq x\leq1}f(\sqrt{x^2+y^2})\,\mathrm{d}x\mathrm{d}y=\pi\int_0^1xf(x)\,\mathrm{d}x+\int_1^{\sqrt{2}}\left(\pi-4\arccos\dfrac{1}{x}\right)xf(x)\,\mathrm{d}x$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设二次型 $f(x_1,x_2,x_3)$ 的矩阵为 $A$，已知 $\lvert A+E\rvert=0$，$AB-2B=O$，其中 $B=\begin{pmatrix}-1&-1&-1\\1&0&2\\0&1&-1\end{pmatrix}$。求一个正交变换 $x=Qy$，将二次型 $f(x_1,x_2,x_3)$ 化为标准形，并求矩阵 $A$。
