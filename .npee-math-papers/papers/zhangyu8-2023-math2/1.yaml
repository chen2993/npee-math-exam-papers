- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      （本题满分12分） 设二次型 \(f(x_1,x_2,x_3)=x_1^2+x_2^2+2x_3^2-2x_1x_3\)，\(g(x_1,x_2,x_3)=x_1^2+2x_3^2-2x_1x_2-2x_1x_3\)。 (1) 求一个可逆矩阵 \(C\)，使得 \(f(x_1,x_2,x_3)\) 在合同变换 \(\boldsymbol{x}=C\boldsymbol{y}\) 下化为标准形； (2) 记 \(g(x_1,x_2,x_3)\) 的矩阵为 \(B\)，求正交矩阵 \(Q\)，使得 \(Q^{\mathrm{T}}(C^{\mathrm{T}}BC)Q\) 为对角矩阵； (3) 求一个可逆矩阵 \(T\)，使得在合同变换 \(\boldsymbol{x}=T\boldsymbol{y}\) 下可将 \(f(x_1,x_2,x_3)\) 与 \(g(x_1,x_2,x_3)\) 同时化为标准形。
