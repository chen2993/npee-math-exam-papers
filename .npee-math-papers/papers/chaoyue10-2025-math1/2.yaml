  stem:
    text: |-
      设 $y=f(x)$ 是微分方程 $y'-P(x)y=\dfrac{1}{2}e^x-1$ 满足 $y(0)=1$ 的解，其中 $P(x)=\int_0^1|x-t|\,\mathrm{d}t$，则有$\ExamSelection$。
