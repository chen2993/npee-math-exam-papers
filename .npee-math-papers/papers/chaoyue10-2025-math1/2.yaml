  stem:
    text: |-
      设 $I_k=\iint_{D_k}(xy^2e^{-x^2}+x^2\sin(x^2+y^2))\,\mathrm{d}\sigma,k=1,2,3$，其中 $D_1:x^2+y^2\leq\dfrac{\pi}{2}$，$D_2:x^2+y^2\leq\pi$，$D_3:x^2+y^2\leq2\pi$，则 $I_1,I_2,I_3$ 三者的大小关系为$\ExamSelection$。
