  stem:
    text: |-
      设随机变量 $X,Y$ 独立，且均服从 $N(0,1)$，$(R,\Theta)$ 为 $(X,Y)$ 的极坐标表示，其中 $R\geq0,0\leq\Theta\leq2\pi$。
  subparts:
  - text: |-
      求 $P\{R\leq1,\Theta\leq\dfrac{\pi}{2}\}$。
  - text: |-
      求 $(R,\Theta)$ 的密度函数 $f_{R,\Theta}(r,\theta)$，以及 $R$ 和 $\Theta$ 的边缘密度函数 $f_R(r)$ 和 $f_\Theta(\theta)$，并问 $R$ 和 $\Theta$ 是否相互独立？
