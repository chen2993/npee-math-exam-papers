- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      设函数 $f(x,y)$ 具有二阶连续偏导数，当 $(x,y)\ne(0,0)$ 时，$f'_x\ne 0$，且 $f\cdot\dfrac{\partial^2f}{\partial x\partial y}=\dfrac{\partial f}{\partial x}\cdot\dfrac{\partial f}{\partial y}$。
  subparts:
  - text: |-
      证明 $\dfrac{\partial f}{\partial x}=f\cdot\varphi(x)$；
  - text: |-
      若 $\varphi(x)=\dfrac{1}{x}$，$f(1,y)=y^3$，求 $z=f(x,y)$ 在条件 $x^2+y^2=1$ 下的最大值与最小值。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      计算积分 $I=\int_{-1}^{1}\mathrm{d}z\iint_{x^2+y^2\leq 1-z^2}\dfrac{(\cos x+\sin y+\sqrt{3}z)^2}{(x^2+y^2+z^2)^2+1}\,\mathrm{d}x\mathrm{d}y$。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      函数 $f(x)$ 在 $[0,1]$ 上有二阶导数，$f(0)=0$。若 $f(x)$ 在 $[0,1]$ 上的最大值 $M>0$，证明存在 $\xi\in(0,1)$ 使得 $\xi f''(\xi)+2f'(\xi)>f(\xi)$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设曲面 $\Sigma$ 为曲线段 $\begin{cases}z=e^y,\\x=0\end{cases}\,(0\leq y\leq 1)$ 绕 $z$ 轴旋转一周所得。取下侧，计算曲面积分 $I=\iint_{\Sigma}2xzx\,\mathrm{d}y\mathrm{d}z+yz\,\mathrm{d}z\mathrm{d}x+(x^2+z^2)\,\mathrm{d}x\mathrm{d}y$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $A=\begin{pmatrix}0&-1&a\\-1&3&b\\a&b&0\end{pmatrix}$，$|A|=-40$，若 $A$ 的伴随矩阵 $A^*$ 有特征向量 $(1,-1,1)^T$。
  subparts:
  - text: 求实数 $a,b$；
  - text: 正交变换 $x=Py$，化二次型 $f=x^TA^*x$ 为标准形；
  - text: |-
      若 $B=A+\lambda E$，问当 $\lambda$ 为何值时，方阵 $ABA$ 正定。
