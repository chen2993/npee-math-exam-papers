  - text: 求正交变换 $x=Py$ 化二次型 $f$ 为标准形。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $(X,Y)$ 的概率密度 $f(x,y)$ 满足 $f(x,y)=f(y,x)$，在 $Y=y\ (-\infty<y<+\infty)$ 条件下，$X$ 的条件密度函数为 $f_{X\mid Y}(x\mid y)=k e^{-\dfrac{1}{2}(x-\dfrac{y}{2})^2}$，$-\infty<x<+\infty$。
  subparts:
  - text: 求常数 $k$；
  - text: |-
      求 $f_{Y\mid X}(y\mid x)$；
  - text: 求 $Y$ 的概率密度函数 $f_Y(y)$，以及 $(X,Y)$ 的联合密度函数 $f(x,y)$。
