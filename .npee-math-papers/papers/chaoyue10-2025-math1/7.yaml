    text: |-
      设 $\Sigma$ 为曲线 $L:\dfrac{x-1}{1}=\dfrac{y}{1}=\dfrac{z}{2}$ 绕 $z$ 轴旋转一周而成的曲面，介于 $z=0$ 和 $z=2$ 的一部分，取外侧，计算曲面积分 $I=\iint_\Sigma 2x\,\mathrm{d}y\,\mathrm{d}z+(y+z)\,\mathrm{d}z\,\mathrm{d}x+(z-x^2)\,\mathrm{d}x\,\mathrm{d}y$。
- number: 19
  section: solution
