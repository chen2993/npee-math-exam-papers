  stem:
    text: |-
      设 $x_1>0,x_{n+1}=\sqrt{1+x_n\ln(1+x_n)}$，$n=1,2,\cdots$。$(\mathrm I)$ 证明当 $x>0$ 时，$\ln(1+x)<\dfrac{x}{\sqrt{1+x}}$；$(\mathrm {II})$ 证明 $\lim_{n\to\infty}x_n$ 存在，并求之。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $S(x)$ 满足微分方程 $S'(x)+S(x)=0$，$S'(0)=-1,S(0)=1$，且 $S(x)$ 的幂级数展开式为 $\sum_{n=0}^{\infty}a_nx^n$。
  subparts:
  - text: 求 $S(x)$。
  - text: |-
      证明系数 $a_n$ 满足：$a_{n+2}=-\dfrac{a_n}{(n+2)(n+1)}$，且 $a_{2n}+a_{2n+1}=(-1)^n\dfrac{2n}{(2n+1)!}$，$n=0,1,2,\cdots$。
