- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 在 $(0,+\infty)$ 内二阶可导，则下列说法正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      若 $f(x)$ 在 $(0,+\infty)$ 内有界，则 $\lim_{x\to+\infty}f'(x)=0$。
    figures: []
  - label: B
    text: |-
      若 $f(x)$ 和 $f'(x)$ 在 $(0,+\infty)$ 内均有界，则 $\lim_{x\to+\infty}f'(x)=0$。
    figures: []
  - label: C
    text: |-
      若 $f'(x)$ 在 $(0,+\infty)$ 内有界，则 $f(x)$ 在 $(0,+\infty)$ 内一定有界。
    figures: []
  - label: D
    text: |-
      若 $f(x),f''(x)$ 在 $(0,+\infty)$ 内有界，则 $f'(x)$ 在 $(0,+\infty)$ 内一定有界。
    figures: []
