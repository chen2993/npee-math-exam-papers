- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      设 $D=\{(x,y)\mid0\leq x\leq\sqrt{\pi},0\leq y\leq\sqrt{\pi}\}$，记 $I_1=\iint_D\sin(\max\{x^2,y^2\})\,\mathrm{d}x\mathrm{d}y$，$I_2=\iint_D\sin(\min\{x^2,y^2\})\,\mathrm{d}x\mathrm{d}y$，证明 $I_2<I_1$。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设 $D_0$ 为椭球面 $\Sigma:x^2+y^2+z^2-yz=1$ 在 $xOy$ 坐标面上的投影区域，求 $f(x,y)=\dfrac{4}{3}x^2+y^2+\dfrac{4}{3}x+y$ 在 $D_0$ 内的最大值和最小值。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 在点 $x_0$ 某邻域内有一阶连续导数，记 $a_n=f\left(x_0+\dfrac{1}{n^2}\right)+f\left(x_0+\dfrac{2}{n^2}\right)+\cdots+f\left(x_0+\dfrac{n}{n^2}\right)-nf(x_0)$。
  subparts:
  - text: |-
      证明：$\lim_{n\to\infty}a_n=\dfrac{1}{2}f'(x_0)$；
  - text: |-
      求 $\lim_{n\to\infty}\dfrac{(1+n^2)(2+n^2)\cdots(n+n^2)}{(n+1)^{2n}}$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $\Gamma$ 为柱面 $|x|+|y|=1$ 与抛物面 $z=x^2+y^2$ 的交线，从 $z$ 轴正向往负向看为逆时针方向，计算曲线积分 $I=\oint_{\Gamma}(y^3-z^2)\,\mathrm{d}x+(x-2y^2)\,\mathrm{d}y+(z^2-2x^2)\,\mathrm{d}z$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设二次型 $f(x_1,x_2,x_3)$ 的矩阵为 $A$，满足 $|A-2E|=0$ 且 $AB=O$，其中 $B=\begin{pmatrix}-1&-1&1\\1&0&1\\0&1&-2\end{pmatrix}$。用正交变换化该二次型为标准形，求出该正交变换和矩阵 $A$，并说明 $f(x_1,x_2,x_3)=1$ 是什么曲面。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X$ 在 $(0,\pi)$ 上服从均匀分布，$Y$ 的分布律为 $P\{Y=i\}=\dfrac{|i|}{2},i=-1,1$，且 $X$ 和 $Y$ 相互独立，记 $U=\sin X,V=Y+U$。
  subparts:
  - text: 求 $U$ 的概率密度函数 $f_U(u)$；
  - text: 求 $V$ 的概率密度函数 $f_V(v)$；
  - text: |-
      求协方差 $\operatorname{cov}(U,V)$。
