  stem:
    text: 已知二次型 $f(x_1,x_2,x_3)=ax_1^2-(b^2+1)x_2^2+ax_3^2+2x_1x_3$ 经可逆线性变换化为 $g(y_1,y_2,y_3)=(2a^2-1)y_1^2+(a^2+1)y_2^2+(a^2-2)y_3^2+2(a^2+1)y_1y_2-2(a^2-2)y_1y_3$，其中 $a,b$ 为实数。
  subparts:
  - text: 求二次型 $f(x_1,x_2,x_3)$ 的正负惯性指数；
  - text: 当 $b=1$ 时，求正交变换 $x=Py$ 将二次型 $f(x_1,x_2,x_3)$ 化为标准形。
