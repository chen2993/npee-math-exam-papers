- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      当 $x\to 0^+$ 时，下列式子中正确的个数为\ExamSelection。① $\dfrac{1}{\ln x}\sim\dfrac{1}{\ln\sin x}$；② $\int_0^x t^2\,\mathrm{d}t\sim\int_0^x\sin^2t\,\mathrm{d}t$；③ $(1+\sin x)^x-1\sim(1+x)^{\sin x}-1$。
  choices:
  - label: A
    text: '0'
    figures: []
  - label: B
    text: '1'
    figures: []
  - label: C
    text: '2'
    figures: []
  - label: D
    text: '3'
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      已知函数 $\phi(x)$ 具有二阶连续导数，$\phi(0)=0$，且函数 $f(x)=\begin{cases}\dfrac{\phi(x)}{x},&x>0,\\ax+b,&x\leq 0\end{cases}$ 可导，则\ExamSelection。
  choices:
  - label: A
    text: |-
      $a=\phi''(0),b=\phi'(0)$
    figures: []
  - label: B
    text: |-
      $a=\phi''(0),b=\dfrac{\phi'(0)}{2}$
    figures: []
  - label: C
    text: |-
      $a=\dfrac{\phi''(0)}{2},b=\phi'(0)$
    figures: []
  - label: D
    text: |-
      $a=\dfrac{\phi''(0)}{2},b=\dfrac{\phi'(0)}{2}$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $y=y(x)$ 由 $\begin{cases}x=t^3+2t+1\\\int_1^{y+1}e^{-u^2}\,\mathrm{d}u=t\end{cases}$ 确定，则\ExamSelection。
  choices:
  - label: A
    text: |-
      $\left.\dfrac{\mathrm{d}y}{\mathrm{d}x}\right|_{t=0}=\dfrac{e+1}{2},\left.\dfrac{\mathrm{d}^2y}{\mathrm{d}x^2}\right|_{t=0}=\dfrac{e^2}{2}$
    figures: []
  - label: B
    text: |-
      $\left.\dfrac{\mathrm{d}y}{\mathrm{d}x}\right|_{t=0}=\dfrac{e-1}{2},\left.\dfrac{\mathrm{d}^2y}{\mathrm{d}x^2}\right|_{t=0}=\dfrac{e}{2}$
    figures: []
  - label: C
    text: |-
      $\left.\dfrac{\mathrm{d}y}{\mathrm{d}x}\right|_{t=0}=\dfrac{e+1}{2},\left.\dfrac{\mathrm{d}^2y}{\mathrm{d}x^2}\right|_{t=0}=\dfrac{e}{2}$
    figures: []
  - label: D
    text: |-
      $\left.\dfrac{\mathrm{d}y}{\mathrm{d}x}\right|_{t=0}=\dfrac{e-1}{2},\left.\dfrac{\mathrm{d}^2y}{\mathrm{d}x^2}\right|_{t=0}=\dfrac{e^2}{2}$
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 在 $(0,+\infty)$ 内二阶可导，则下列说法正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      若 $f(x)$ 在 $(0,+\infty)$ 内有界，则 $\lim_{x\to+\infty}f'(x)=0$
    figures: []
  - label: B
    text: |-
      若 $f(x)$ 和 $f'(x)$ 在 $(0,+\infty)$ 内均有界，则 $\lim_{x\to+\infty}f''(x)=0$
    figures: []
  - label: C
    text: |-
      若 $f'(x)$ 在 $(0,+\infty)$ 内有界，则 $f(x)$ 在 $(0,+\infty)$ 内一定有界
    figures: []
  - label: D
    text: |-
      若 $f(x),f''(x)$ 在 $(0,+\infty)$ 内有界，则 $f'(x)$ 在 $(0,+\infty)$ 内一定有界
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设 $f,\phi$ 具有一阶连续偏导数，且 $\phi'_x(x,y,z)\ne0$，已知点 $P_0(x_0,y_0,z_0)$ 是函数 $u=f(x,y,z)$ 在条件 $\phi(x,y,z)=0$ 下的一个极值点，则下列选项正确的是\ExamSelection。
  choices:
  - label: A
    text: 若 $f'_x(x_0,y_0,z_0)=0$，则 $f'_z(x_0,y_0,z_0)=0$
    figures: []
  - label: B
    text: 若 $f'_y(x_0,y_0,z_0)=0$，则 $f'_z(x_0,y_0,z_0)=0$
    figures: []
  - label: C
    text: 若 $f'_z(x_0,y_0,z_0)=0$，则 $f'_x(x_0,y_0,z_0)=0$ 且 $f'_y(x_0,y_0,z_0)=0$
    figures: []
  - label: D
    text: |-
      若 $f'_z(x_0,y_0,z_0)\ne0$，则 $f'_x(x_0,y_0,z_0)\ne0$ 且 $f'_y(x_0,y_0,z_0)\ne0$
    figures: []
