      （本题满分 12 分）设函数 $f(x)$ 在 $[-1,1]$ 上连续，在点 $x=0$ 处可导且 $f'(0)\ne0$。(Ⅰ) 证明对任意 $x\in[0,1]$，存在 $\theta\in(0,1)$，使得 $\int_0^x f(t)\,\mathrm{d}t+\int_0^{-x}f(t)\,\mathrm{d}t=x[f(\theta x)-f(-\theta x)]$；(Ⅱ) 求极限 $\lim_{x\to0^+}\theta$。
