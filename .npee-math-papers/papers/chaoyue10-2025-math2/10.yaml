    text: |-
      求曲线 $y=f(x)=x^2\left[\left(1+\dfrac{1}{x}\right)^x-e\right]\,(x>0)$ 的斜渐近线。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 在 $[0,1]$ 上二阶可导，满足 $\lim_{x\to0^+}\dfrac{f(x)-f(1)}{x^2}=2$。证明：
  subparts:
  - text: |-
      存在 $\xi\in(0,1)$，有 $f''(\xi)=0$。
  - text: |-
      存在 $\eta\in(0,1)$，使得 $f'(\eta)=\dfrac{f(\eta)-f(0)}{\eta}$。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      求 $f(x,y)=\dfrac{4}{3}x^2+y^2+\dfrac{4}{3}x+y$ 在 $D:x^2+\dfrac{3}{4}y^2\leq1$ 内的最大值和最小值。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $D=\{(x,y)\mid0\leq x\leq\sqrt{\pi},0\leq y\leq\sqrt{\pi}\}$，记 $I_1=\iint_D\sin(\max\{x^2,y^2\})\,\mathrm{d}x\mathrm{d}y$，$I_2=\iint_D\sin(\min\{x^2,y^2\})\,\mathrm{d}x\mathrm{d}y$，证明 $I_2<I_1$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 在点 $x_0$ 某邻域内有一阶连续导数，记 $a_n=f\left(x_0+\dfrac{1}{n^2}\right)+f\left(x_0+\dfrac{2}{n^2}\right)+\cdots+f\left(x_0+\dfrac{n}{n^2}\right)-nf(x_0)$。
  subparts:
  - text: |-
      证明：$\lim_{n\to\infty}a_n=\dfrac{1}{2}f'(x_0)$。
  - text: |-
      求 $\lim_{n\to\infty}\dfrac{(1+n^2)(2+n^2)\cdots(n+n^2)}{(n+1)^{2n}}$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设二次型 $f(x_1,x_2,x_3)$ 的矩阵为 $A$，满足 $|A-2E|=0$ 且 $AB=O$，其中 $B=\begin{pmatrix}-1&-1&1\\1&0&1\\0&1&-2\end{pmatrix}$。用正交变换化该二次型为标准形，求出该正交变换和矩阵 $A$。
