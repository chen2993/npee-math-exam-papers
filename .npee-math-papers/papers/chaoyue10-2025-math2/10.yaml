- number: 8
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 是 $4\times3$ 矩阵，$A$ 的列向量组线性无关，则下列结论中：\n① $A^{\mathrm{T}}x=0$ 有非零解；\n② 对任意 $3$ 维列向量 $\beta$，$A^{\mathrm{T}}x=\beta$ 有无穷多解；\n③ $A^{\mathrm{T}}Ax=0$ 只有零解；\n④ 对 $3\times3$ 矩阵 $B$ 和 $C$，若 $AB=AC$，则 $B=C$。\n正确的个数为\ExamSelection。
  choices:
  - label: A
    text: $1$
    figures: []
  - label: B
    text: $2$
    figures: []
  - label: C
    text: $3$
    figures: []
  - label: D
    text: $4$
    figures: []
