- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 在点 $x=1$ 处二阶可导，且 $f(1)\ne0$。若 $\lim_{x\to0}\left(\dfrac{f(\cos x)}{f(1)}\right)^{\dfrac{1}{x^4}}=e$，则下列说法错误的是\ExamSelection。
  choices:
  - label: A
    text: $f'(1)=0$
    figures: []
  - label: B
    text: 若 $f(1)>0$，则 $f(1)$ 是极大值
    figures: []
  - label: C
    text: 若 $f(1)<0$，则 $f(1)$ 是极大值
    figures: []
  - label: D
    text: $(1,f(1))$ 一定不是拐点
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      若反常积分 $\int_0^{+\infty}\dfrac{x^p(1-e^{-x})}{(1+x)^q}\,\mathrm{d}x$ 收敛，则\ExamSelection。
