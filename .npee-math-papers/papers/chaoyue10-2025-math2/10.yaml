- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      当 $x\to0$ 时，下列无穷小量中阶数最高的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\int_{x^2}^{x^3}\sqrt{1-\sqrt{\cos t}}\,\mathrm{d}t$
    figures: []
  - label: B
    text: |-
      $\int_{\sin x}^{2x}\sin t^2\,\mathrm{d}t$
    figures: []
  - label: C
    text: |-
      $\int_x^{\sin x}(e^{t^2}-1)\,\mathrm{d}t$
    figures: []
  - label: D
    text: |-
      $\int_0^{1-\cos x}\ln(1+\sqrt{t})\,\mathrm{d}t$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)=xe^x$，则 $\lim_{n\to\infty}\dfrac{1}{f^{(n)}(0)}\sum_{k=1}^n f\left[\dfrac{f^{(k)}(0)}{n}\right]=$\ExamSelection。
