    text: |-
      设 3 阶实对称矩阵 $A$ 有两个不同特征值，且 $A\begin{pmatrix}1\\0\\1\end{pmatrix}=\begin{pmatrix}-1\\0\\-1\end{pmatrix}$，$A$ 与 $B=\begin{pmatrix}a&1&1\\0&b&0\\0&0&2\end{pmatrix}\ (a\leq b)$ 相似。
  subparts:
  - text: 求 $a,b$；
  - text: 求可逆矩阵 $P$，使得 $P^{-1}AP=B$。
