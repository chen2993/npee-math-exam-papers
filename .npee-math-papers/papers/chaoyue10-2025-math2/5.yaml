  stem:
    text: |-
      设函数 $f(x)$ 在 $(0,+\infty)$ 内有连续二阶导数。令 $g(x)=x^2f(x)$ 且 $\lim_{x\to+\infty}g''(x)=1$，求 $\lim_{x\to+\infty}f(x)$ 和 $\lim_{x\to+\infty}xf'(x)$。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 和 $g(x)$ 可微且满足条件 $f'(x)=\dfrac12g(x)$，$g'(x)=\dfrac12f(x)$，$f(0)=0$，$g(x)\ne0$。
  subparts:
  - text: |-
      求 $y=\dfrac{f(x)}{g(x)}$ 的表达式；
  - text: |-
      求曲线 $y=\dfrac{f(x)}{g(x)}$ 当 $x\geq0$ 时绕直线 $y=1$ 旋转一周所生成立体的体积。
