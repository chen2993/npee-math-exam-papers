- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      下列说法错误的是\ExamSelection。
  choices:
  - label: A
    text: 若 $F(x)$ 在 $[-a,a]$ 上可导，且 $F'(x)$ 为奇函数，则 $F(x)$ 一定是偶函数
    figures: []
  - label: B
    text: 若 $F(x)$ 在 $[-a,a]$ 上可导，且 $F'(x)$ 为偶函数，$F(0)=0$，则 $F(x)$ 一定是奇函数
    figures: []
  - label: C
    text: |-
      若 $F(x)$ 在 $(-\infty,+\infty)$ 内可导，且 $F'(x)$ 是以 $T$ 为周期的函数，$F(T)=0$，则 $F(x)$ 一定是周期函数
    figures: []
  - label: D
    text: 若 $F(x)$ 在 $(a,b)$ 内可导，且 $F'(x)$ 有界，则 $F(x)$ 在 $(a,b)$ 内一定有界
    figures: []
