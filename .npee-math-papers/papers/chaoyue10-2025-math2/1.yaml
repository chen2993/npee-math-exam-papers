    text: |-
      设 $f(x)$ 在 $[a,b]$ 上连续，在 $(a,b)$ 内可导，$f(a)<0,f(b)<0$，$\int_a^bf(x)\,\mathrm{d}x=0$。试证：
  subparts:
  - text: |-
      存在不同的 $\xi_1,\xi_2\in(a,b)$，使得 $f(\xi_1)=f(\xi_2)=0$；
  - text: |-
      对任意的整数 $k(k>1)$，存在 $\eta\in(a,b)$，使得 $f'(\eta)+[f(\eta)]^k=0$。
- number: 22
  section: solution
