  stem:
    text: |-
      设 $A$ 为 $3$ 阶实对称矩阵，$|A|=0,A$ 的迹 $\operatorname{tr}(A)=4$，且 $A$ 有一个二重特征值，$\alpha=(1,-1,1)^T$ 是单特征值对应的特征向量。
  subparts:
  - text: 当单特征值不等于 $0$ 时，求 $A$ 以及 $Ax=0$ 的通解；
  - text: 当单特征值等于 $0$ 时，求正定矩阵 $B$，使得 $A=B^2-2E$。
