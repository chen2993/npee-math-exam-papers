      设 $f(x)$ 是以 $T$ 为周期的连续函数，$x\in(-\infty,+\infty)$，则下列说法中正确的个数为\ExamSelection。\n① 若 $\int_0^T f(x)\,\mathrm{d}x=0$，则 $\int_0^x f(t)\,\mathrm{d}t$ 是周期函数。\n② 若 $f(x)$ 为奇函数，则 $\int_0^x f(t)\,\mathrm{d}t$ 是周期函数。\n③ 若 $\int_0^{+\infty}f(x)\,\mathrm{d}x=0$，则 $\int_0^x f(t)\,\mathrm{d}t$ 是周期函数。\n④ $F(x)=\int_0^x f(t)\,\mathrm{d}t-\dfrac{x}{T}\int_0^T f(t)\,\mathrm{d}t$ 是周期函数。
