  stem:
    text: 设 3 阶矩阵 $A=(a_{ij})$ 满足 $A$ 的各列元素之和均为 1。
  subparts:
  - text: |-
      若 $\xi$ 为各分量之和为 1 的 3 维列向量，求 $A\xi$ 的各分量之和。
  - text: 若 $k$ 为任意正整数，证明：$A^k$ 的各列元素之和均为 1，且 1 为 $A^k$ 的一个特征值。
  - text: |-
      记 $\alpha=(1,1,1)^{\mathrm{T}}$，若 $\beta$ 为 $A^k$ 的属于特征值 $\lambda$（$\lambda\ne1$）的特征向量，求 $\alpha^{\mathrm{T}}\beta$。
