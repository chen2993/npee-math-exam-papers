- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $y=f(x)$ 在点 $x=0$ 处连续，则下列命题中，错误的是\ExamSelection。
  choices:
  - label: A
    text: |-
      若 $\lim_{x\to0}\dfrac{f(x)}{x}=a$，则 $f'(0)=a$。
    figures: []
  - label: B
    text: |-
      若 $f(0)=0$，$f'(0)=a$，则 $\lim_{x\to0}\dfrac{f(x)}{x}=a$。
    figures: []
  - label: C
    text: |-
      若 $\lim_{x\to0}\dfrac{f(x)}{x^2}=\dfrac{a}{2}$，则 $f''(0)=a$。
    figures: []
  - label: D
    text: |-
      若 $f(0)=f'(0)=0$，$f''(0)=a$，则 $\lim_{x\to0}\dfrac{f(x)}{x^2}=\dfrac{a}{2}$。
    figures: []
