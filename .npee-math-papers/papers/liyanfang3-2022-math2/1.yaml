- number: 17
  section: solution
  points: 10
  stem:
    text: 某行星上的磁场强度为 $M(x,y,z)=6x-y^2+xz+50$，行星表面的点 $(x,y,z)$ 满足方程 $x^2+y^2+z^2=20$。科学家欲在该行星表面磁场强度最小处架设一台天文望远镜进行探测，求该望远镜的选址坐标 $(x_0,y_0,z_0)$。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设 $D=\{(x,y)\mid x^2+y^2\leq2y,y\geq1\}$。连续函数 $f(x,y)$ 满足 $f(x,y)=\dfrac{x+y}{x^2+y^2}+\lvert x\rvert\iint_D f(x,y)\,\mathrm{d}x\,\mathrm{d}y$。求函数 $f(x,y)$ 的表达式。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设数列 $\{x_n\}$ 满足 $x_{n+1}=\sqrt{\dfrac{\pi}{2}x_n\sin x_n}$，且 $0<x_1<\dfrac{\pi}{2}$。求 $\lim_{n\to\infty}\dfrac{\sec x_n-\tan x_n}{\dfrac{\pi}{2}-x_n}$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      考虑二阶微分方程 $\sin\theta\dfrac{\mathrm{d}^2y}{\mathrm{d}\theta^2}+\cos\theta\dfrac{\mathrm{d}y}{\mathrm{d}\theta}+n(n+1)y\sin\theta=0$。
  subparts:
  - text: |-
      令 $x=\cos\theta$，将上述方程转化为关于 $y$、$\dfrac{\mathrm{d}y}{\mathrm{d}x}$ 以及 $\dfrac{\mathrm{d}^2y}{\mathrm{d}x^2}$ 的二阶微分方程；
  - text: 设 $u_n(x)=(x^2-1)^n$，其 $n$ 阶导数记为 $p_n(x)$，证明 $p_n(x)$ 为第（I）问中所得到方程的一个特解。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设二元函数 $f(x,y)$ 具有一阶连续偏导数，且满足 $f(0,0)=0$，$f'_1(0,0)=k\ne0$ 以及对于任意 $x$，都有 $f'_2(x,y)>0$。
  subparts:
  - text: |-
      设 $n>1$，证明：当 $x>0$ 时，对所有的 $0\leq\xi\leq x^n$，都有 $\lim_{x\to0^+}\dfrac{f(x,\xi)}{x}$ 存在，并计算该极限。
  - text: |-
      若当 $x\to0^+$ 时，$\int_0^{x^n}\mathrm{d}u\int_x^{u^{1/n}}f(t,u)\,\mathrm{d}t$ 与 $1-\cos x^2$ 是等价无穷小，求 $n,k$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $A$ 为 $3$ 阶正定矩阵，$\beta,x$ 为 $3$ 维列向量。考虑二次函数 $f(x)=x^TAx-2x^T\beta$。
  subparts:
  - text: |-
      证明：若 $y_0=A^{-1}\beta$，则对任意 $3$ 维列向量 $x$，$f(x)\geq-y_0^T\beta$。
  - text: 求二次函数 $f(x_1,x_2,x_3)=x_1^2+2x_2^2+3x_3^2-2x_1x_2-2x_1x_3+4x_2x_3-2x_1-4x_2-6x_3$ 的最小值。
