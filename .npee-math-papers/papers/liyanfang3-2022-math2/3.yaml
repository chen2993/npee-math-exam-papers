- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 2 阶矩阵 $A$ 有两个不同的特征值 $1,2$，分别对应特征向量 $\alpha_1,\alpha_2$。记 $Q=(\alpha_1,\alpha_2),B=\begin{pmatrix}0&-2\\1&3\end{pmatrix},\beta=\alpha_1+\alpha_2$。
  subparts:
  - text: |-
      证明：$P_1=(\beta,A\beta)$ 为矩阵方程 $AX=XB$ 的一个可逆解。
  - text: |-
      求常数 $k_1,k_2$，满足 $k_1\ne k_2$，使得可逆矩阵 $P_2$ 满足 $P_2^{-1}Q=\begin{pmatrix}k_1&k_2\\1&1\end{pmatrix}$，且也是矩阵方程 $AX=XB$ 的一个解。
  - text: 设 $P_2$ 为第（II）问中所定义矩阵，求 $r(P_1-P_2)$。
