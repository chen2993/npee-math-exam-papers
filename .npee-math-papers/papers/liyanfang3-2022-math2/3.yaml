  stem:
    text: |-
      设函数 $f(x)=\begin{cases}\arctan\dfrac{x+1}{x-1}+a,&x>1,\\c,&x=1,\\\arctan\dfrac{x+1}{x-1}+b,&x<1,\end{cases}$ 可导，则 $f'(1)=$\ExamSelection
  choices:
  - label: A
    text: |-
      $-\dfrac{1}{2}$
    figures: []
  - label: B
    text: |-
      $\dfrac{1}{2}$
    figures: []
  - label: C
    text: $1$
    figures: []
  - label: D
    text: 与 $a,b$ 的值有关
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      若 $f(x)$ 为区间 $I$ 上的连续函数，且 $f(x)$ 的值域包含于 $I,x_1,x_2$ 为 $I$ 中任意两个不同的点，则\ExamSelection
  choices:
  - label: A
    text: |-
      若在区间 $I$ 上，$f(x)<0,f''(x)>0$，则 $f^2\left(\dfrac{x_1+x_2}{2}\right)<\dfrac{f^2(x_1)+f^2(x_2)}{2}$
    figures: []
  - label: B
    text: |-
      若在区间 $I$ 上，$f'(x)<0,f''(x)>0$，则 $f^2\left(\dfrac{x_1+x_2}{2}\right)<\dfrac{f^2(x_1)+f^2(x_2)}{2}$
    figures: []
  - label: C
    text: |-
      若在区间 $I$ 上，$f(x)>0,f''(x)>0$，则 $f\left(f\left(\dfrac{x_1+x_2}{2}\right)\right)<\dfrac{f(f(x_1))+f(f(x_2))}{2}$
    figures: []
  - label: D
    text: |-
      若在区间 $I$ 上，$f'(x)>0,f''(x)>0$，则 $f\left(f\left(\dfrac{x_1+x_2}{2}\right)\right)<\dfrac{f(f(x_1))+f(f(x_2))}{2}$
    figures: []
