- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      关于数列 $\{x_n\}$、$\{y_n\}$，有以下论断：① 若数列 $\{x_n\}$ 和 $\{y_n\}$ 都收敛，则数列 $\{x_ny_n\}$ 收敛；② 若数列 $\{x_n+y_n\}$ 和 $\{x_n-y_n\}$ 都收敛，则数列 $\{x_n\}$、$\{y_n\}$ 均收敛；③ 若数列 $\{x_n\}$ 和 $\{y_n\}$ 都发散，则数列 $\{x_n+y_n\}$ 可能收敛；④ 若数列 $\{x_ny_n\}$ 收敛，则数列 $\{x_n\}$ 和 $\{y_n\}$ 必有一个收敛。以上结论中正确的个数为\ExamSelection。
  choices:
  - label: A
    text: $1$
    figures: []
  - label: B
    text: $2$
    figures: []
  - label: C
    text: $3$
    figures: []
  - label: D
    text: $4$
    figures: []
