  stem:
    text: |-
      设函数 $y=y(x)$ 由参数方程 $\begin{cases}x=\ln(1+t),\\y=\varphi(t)\end{cases}$ 确定，其中 $\varphi(t)$ 具有二阶导数且 $y=\varphi(t)$ 在点 $(0,1)$ 处有水平切线。若 $\dfrac{\mathrm{d}^2y}{\mathrm{d}x^2}=4t^2+6t+2$，试求 $y=\varphi(t)$ 的表达式。
- number: 18
  section: solution
  points: 12
  stem:
    text: 证明：
  subparts:
  - text: |-
      方程 $\ln x+x^n=0$ 在 $(0,1)$ 内有唯一实根 $x_n$（$n=1,2,\cdots$）；
  - text: |-
      $\lim_{n\to\infty}x_n$ 存在。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 $z=u(x,y)e^{ax+by}$，其中 $u(x,y)$ 满足 $\dfrac{\partial^2u}{\partial x\partial y}=0$。试确定 $a,b$ 使函数 $z$ 满足方程 $\dfrac{\partial^2z}{\partial x\partial y}-\dfrac{\partial z}{\partial x}-\dfrac{\partial z}{\partial y}+z=0$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 在 $[0,1]$ 上二阶可导，且 $\lim_{x\to0^+}\dfrac{f(x)-f(1)}{x}=-1$，证明存在 $\xi\in(0,1)$，使得 $f''(\xi)=2$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      计算积分 $I=\iint_D\dfrac{1}{(a^2+x^2+y^2)^{\dfrac{3}{2}}}\,\mathrm{d}\sigma$，其中 $D:0\leq x\leq a,0\leq y\leq a$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      已知 $A=\begin{pmatrix}-1&a&0\\0&b&2\\0&0&3\end{pmatrix}$，$B=\begin{pmatrix}2&-6&1\\0&-1&0\\3&-6&0\end{pmatrix}$。
  subparts:
  - text: 讨论 $a,b$ 为何值时，$A$ 可相似对角化；
  - text: 讨论 $a,b$ 为何值时，$A$ 与 $B$ 相似。
