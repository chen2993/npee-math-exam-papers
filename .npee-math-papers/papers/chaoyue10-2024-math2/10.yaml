- number: 18
  section: solution
  points: 12
  stem:
    text: 完成下列证明。
  subparts:
  - text: |-
      设 $f(x),g(x)$ 均为 $[a,b]$ 上的连续函数，证明方程 $f(x)\int_a^xg(t)\,\mathrm{d}t=g(x)\int_x^bf(t)\,\mathrm{d}t$ 在 $(a,b)$ 内至少有一个根。
  - text: |-
      设 $f(x)$ 是 $[a,b]$ 上的可导函数且 $f'(x)>0$，证明方程 $(x-a)\int_x^bf(t)\,\mathrm{d}t=(b-x)\int_a^xf(t)\,\mathrm{d}t$ 在 $(a,b)$ 内没有根。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 是在 $(-\infty,+\infty)$ 内以 $T$（$T>0$）为周期的连续函数，$F(x)=\int_0^xf(t)\,\mathrm{d}t-\dfrac{x}{T}\int_0^Tf(x)\,\mathrm{d}x$。
  subparts:
  - text: 证明 $F(x)$ 是以 $T$ 为周期的周期函数；
  - text: |-
      计算极限 $\lim_{x\to\infty}\dfrac{1}{x}\int_0^xf(t)\,\mathrm{d}t$。
