      定义在 $[-1,1]$ 上的函数 $f(x)=\begin{cases}\dfrac{1}{2^{n+1}},&\dfrac{1}{2^{n+1}}<x\leqslant\dfrac{1}{2^n},\quad n=0,1,2,\cdots,\\0,&-1\leqslant x\leqslant0,\end{cases}$ 则\ExamSelection。
