- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 具有连续导数，且满足 $f(1)=1$。区域 $D$ 是由 $x$ 轴，$y$ 轴和 $x+y=1$ 所围区域，若 $f(x+y)=\dfrac{x}{1+x+y}+\iint_Dyf'(x+y)\,\mathrm{d}\sigma$，求 $\iint_Df(x+y)\,\mathrm{d}\sigma$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $A,B$ 均为 $3$ 阶方阵，其中 $A$ 为实对称矩阵，$A=(a_{ij})_{3\times3},a_{11}=2$，$B=\begin{pmatrix}1&0&-1\\-1&0&1\\0&2&0\end{pmatrix}$，且满足 $(A-E)B=O$。
  subparts:
  - text: 求矩阵 $A$；
  - text: |-
      求可逆矩阵 $P$，使 $P^{-1}AP=\Lambda$。
