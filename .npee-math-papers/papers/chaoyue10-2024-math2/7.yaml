questions:
- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      已知反常积分 $\int_0^{+\infty}\dfrac{\ln^q(1+x)}{x^p}\,\mathrm{d}x\,(p>0,q>0)$ 收敛，则参数 $p,q$ 需满足的条件为\ExamSelection。
  choices:
  - label: A
    text: $p>1,q>1$
    figures: []
  - label: B
    text: $p>1,p-q>1$
    figures: []
  - label: C
    text: $0<p<1,0<q<1$
    figures: []
  - label: D
    text: $p>1,p-q<1$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)$ 在区间 $(0,+\infty)$ 内有界且存在二阶导数，则下列说法正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      若 $\lim_{x\to+\infty}f(x)$ 存在，则 $\lim_{x\to+\infty}f''(x)$ 存在
    figures: []
  - label: B
    text: |-
      若 $\lim_{x\to+\infty}f'(x)$ 存在，则 $\lim_{x\to+\infty}f(x)$ 存在
    figures: []
  - label: C
    text: |-
      若 $\lim_{x\to+\infty}f'(x)$ 存在，则 $\lim_{x\to+\infty}f''(x)=0$
    figures: []
  - label: D
    text: |-
      若 $\lim_{x\to+\infty}f(x)=0$ 存在，则 $\lim_{x\to+\infty}f''(x)=0$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 在 $(-1,1)$ 上有定义且为奇函数，当 $x\in(0,1)$ 时，$f(x)=\dfrac{x-\cos x\ln(1+x)}{x}$，则函数 $f(x)$ 在 $x=0$ 处\ExamSelection。
  choices:
  - label: A
    text: 左导数不存在，右导数存在
    figures: []
  - label: B
    text: 左导数存在，右导数不存在
    figures: []
  - label: C
    text: 左右导数都存在但不相等
    figures: []
  - label: D
    text: 可导
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 二阶可导，$f'(0)=0$ 且 $\lim_{x\to0}\dfrac{f''(x)}{|x|+\sin x}=1$，则\ExamSelection。
  choices:
  - label: A
    text: $x=0$ 为 $f(x)$ 的极小值点
    figures: []
  - label: B
    text: $x=0$ 为 $f(x)$ 的极大值点
    figures: []
  - label: C
    text: $(0,f(0))$ 为 $y=f(x)$ 的拐点
    figures: []
  - label: D
    text: $x=0$ 不是 $f(x)$ 的极值点，$(0,f(0))$ 也不是 $y=f(x)$ 的拐点
    figures: []
