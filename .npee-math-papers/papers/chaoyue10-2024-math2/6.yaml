- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 在 $(0,+\infty)$ 内连续，$f(1)=1$，若对于任意的正数 $a,b$，积分 $\int_a^{ab}f(x)\,\mathrm{d}x$ 与 $a$ 无关，计算 $I=\int_0^{\dfrac{\pi}{2}}\dfrac{f(\sec^3x)}{\sin x+\cos x}\,\mathrm{d}x$。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 在 $(-\infty,+\infty)$ 上三阶可导，且对任意的 $x$ 有 $|f(x)|\leq1$，$|f'''(x)|\leq1$。
  subparts:
  - text: 写出 $f(x+y)$ 在点 $x$ 处的带拉格朗日余项的二阶泰勒公式；
  - text: |-
      证明对任意的 $y>0$，有 $|f'(x)|\leq\dfrac{1}{y}+\dfrac{y^2}{6}$；
  - text: |-
      证明 $f'(x)$ 在 $(-\infty,+\infty)$ 有界，且 $|f'(x)|\leq\dfrac{\sqrt[3]{9}}{2}$。
- number: 20
  section: solution
  points: 12
  stem:
    text: 设 $f(x,y)=x^2-4xy+2y^2$。
  subparts:
  - text: 证明 $f(x,y)$ 在任意开区域内不存在最值；
  - text: 求函数在条件 $x^2+2y^2=1$ 上的最大值和最小值。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      计算：$I=\iint_D\bigl||x+y|-1\bigr|\,\mathrm{d}x\mathrm{d}y$，其中 $D=\{(x,y)\mid x^2+y^2\leq1,0\leq x\leq1\}$。
