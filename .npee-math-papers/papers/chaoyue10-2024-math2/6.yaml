      记 $A=\begin{pmatrix}1&2&0\\2&2&a\\0&a&3\end{pmatrix}$，设 $\xi_1=\begin{pmatrix}-2\\2\\1\end{pmatrix}$ 是方阵 $A$ 的特征向量。
  subparts:
  - text: 求 $a$；
  - text: 求方阵 $B$，使得 $A=B^3$。
