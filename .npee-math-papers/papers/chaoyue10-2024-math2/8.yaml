    text: |-
      设函数 $f(x)=1+2x^2+o(x^2)$，$x\in\mathring{U}(0,\delta)$，且 $f(0)=1$，则下列命题：\n① $f'(x)=4x+o(x)$，$x\in\mathring{U}(0,\delta)$；\n② $f'(0)=0$；\n③ $f''(0)=4$；\n④ $f(x)$ 在 $(-\delta,\delta)$ 内为凹函数。\n正确的个数是\ExamSelection。
  choices:
  - label: A
    text: $1$
    figures: []
  - label: B
    text: $2$
    figures: []
  - label: C
    text: $3$
    figures: []
  - label: D
    text: $4$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)$ 在区间 $(0,+\infty)$ 内可导，则下列说法正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      若 $f'_+(0)$ 存在，则 $\lim\limits_{x\to0^+}f'(x)$ 存在
    figures: []
  - label: B
    text: |-
      若 $\lim\limits_{x\to0^+}f'(x)$ 存在，则 $f'_+(0)$ 存在
    figures: []
  - label: C
    text: |-
      若 $f'_+(0)>0$，则存在 $\delta>0$，当 $x\in(0,\delta)$ 时，$f(x)$ 单增
    figures: []
  - label: D
    text: |-
      若 $\lim\limits_{x\to0^+}f'(x)>0$，则存在 $\delta>0$，当 $x\in(0,\delta)$ 时，$f(x)$ 单增
    figures: []
