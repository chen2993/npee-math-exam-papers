- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      对于 $\{a_n\},n=1,2,\cdots$，以下命题：① 若 $0<a_n<1$，则 $\lim_{n\to\infty}a_n^n=0$；② 若 $\lim_{n\to\infty}\sqrt[n]{a_n}=1$，则 $\lim_{n\to\infty}a_n$ 必存在且大于 $0$；③ 若 $\lim_{n\to\infty}a_n=+\infty$，则 $\lim_{n\to\infty}\sqrt[n]{a_n}=+\infty$；④ 若 $a_n>0$，$\lim_{n\to\infty}a_n$ 存在且大于 $0$，则 $\lim_{n\to\infty}\sqrt[n]{a_n}=1$。不正确的序号为\ExamSelection。
  choices:
  - label: A
    text: ①②
    figures: []
  - label: B
    text: ②③
    figures: []
  - label: C
    text: ①③④
    figures: []
  - label: D
    text: ①②③
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 是在 $(-\infty,+\infty)$ 内以 $T$ 为周期的连续函数，以下命题中正确的个数为\ExamSelection。① 若 $\int_0^T f(x)\,\mathrm{d}x=0$，则 $\int_0^x f(t)\,\mathrm{d}t$ 是以 $T$ 为周期的函数；② 若 $f(x)$ 是奇函数，则 $\int_0^x f(t)\,\mathrm{d}t$ 是以 $T$ 为周期的函数；③ 若 $\int_0^{+\infty}f(x)\,\mathrm{d}x$ 收敛，则 $\int_0^x f(t)\,\mathrm{d}t$ 是以 $T$ 为周期的函数；④ 函数 $F(x)=\int_0^x[f(t)-f(-t)]\,\mathrm{d}t$ 是以 $T$ 为周期的函数。
  choices:
  - label: A
    text: $1$
    figures: []
  - label: B
    text: $2$
    figures: []
  - label: C
    text: $3$
    figures: []
  - label: D
    text: $4$
    figures: []
