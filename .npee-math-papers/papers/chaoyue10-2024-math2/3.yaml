- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      \mbox{}
  subparts:
  - text: |-
      当 $x>0$ 时，求极限 $\lim_{\substack{x\to 0\\y\to 0}}\dfrac{x^2+y^2}{\sqrt{x^2+y^2}+x}$。
  - text: |-
      计算二重积分 $I=\iint_D\dfrac{x^2+y^2}{\sqrt{x^2+y^2}+x}\,\mathrm{d}\sigma$，其中 $D$ 是由 $x=\sqrt{y-y^2}$，$y=\sqrt{1-x^2}$ 以及 $x$ 轴所围位于第一象限区域。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $A$ 为 $3$ 阶实对称矩阵，$\boldsymbol{\alpha}=(1,1,0)^{\mathrm{T}}$，$\boldsymbol{\beta}=(1,0,1)^{\mathrm{T}}$，$A\boldsymbol{\alpha}=2\boldsymbol{\beta}$，$A\boldsymbol{\beta}=2\boldsymbol{\alpha}$，且存在 $3$ 阶矩阵 $B$，有 $r(AB)<r(B)$。
  subparts:
  - text: |-
      求正交变换 $x=Qy$，化二次型 $x^{\mathrm{T}}Ax$ 为标准形，并写出标准形。
  - text: |-
      若 $\boldsymbol{\gamma}=(1,0,4)^{\mathrm{T}}$，求 $A^{2024}\boldsymbol{\gamma}$。
