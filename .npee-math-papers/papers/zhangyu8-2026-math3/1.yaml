  stem:
    text: |-
      设 $I_i=\iint_{D_i}e^{-(x^2+y^2)}\,\mathrm{d}\sigma,i=1,2,3$，其中 $D_1=\{(x,y)\mid x^2+y^2\leq R^2\}$，$D_2=\{(x,y)\mid x^2+y^2\leq 2R^2\}$，$D_3=\{(x,y)\mid |x|\leq R,|y|\leq R\}$，$R>0$，则\ExamSelection。
  choices:
  - label: A
    text: $I_1<I_2<I_3$
    figures: []
  - label: B
    text: $I_2<I_3<I_1$
    figures: []
  - label: C
    text: $I_1<I_3<I_2$
    figures: []
  - label: D
    text: $I_3<I_2<I_1$
    figures: []
