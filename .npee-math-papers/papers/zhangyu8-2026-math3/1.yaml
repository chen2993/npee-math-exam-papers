  stem:
    text: |-
      设一组两台机器同时启动开始制作产品，其独立工作时间 $T_1,T_2$ 均服从参数为 1 的指数分布，$X$ 表示两台机器较早出现故障的时间，且收益 $Y=\begin{cases}X-1,&X>1,\\0,&X\leq1.\end{cases}$
  subparts:
  - text: |-
      求 $P\{Y>0\}$；
  - text: |-
      若有 $N$ 组机器承接制作产品的任务，收益大于 0 的组数记为 $M$，记 $N\sim P(2e^2)$，在 $N=n\ (n\geq1)$ 的条件下，$M\sim B(n,P\{Y>0\})$，求 $M$ 的概率分布。
