  stem:
    text: |-
      设 $f(x)$ 在 $(0,+\infty)$ 内可导，以下结论：①若 $\lim_{x\to+\infty}f(x)$ 存在，则 $\lim_{x\to+\infty}f'(x)$ 存在；②若 $\lim_{x\to+\infty}f'(x)$ 存在，则 $\lim_{x\to+\infty}f(x)$ 存在；③若 $\lim_{x\to+\infty}f'(x)=a\neq 0$，则 $f(x)$ 在 $x\to+\infty$ 时无界；④若 $\lim_{x\to+\infty}f'(x)=0$，则 $f(x)$ 在 $x\to+\infty$ 时有界。正确的个数为\ExamSelection。
  choices:
  - label: A
    text: $1$
    figures: []
  - label: B
    text: $2$
    figures: []
  - label: C
    text: $3$
    figures: []
  - label: D
    text: $4$
    figures: []
