      设 $f(x)$ 在 $(0,+\infty)$ 内可导，对于以下结论：①若 $\lim_{x\to+\infty}f(x)$ 存在，$\lim_{x\to+\infty}f'(x)$ 存在，则 $\lim_{x\to+\infty}f'(x)=0$；②若 $\lim_{x\to+\infty}[f(x)+f'(x)]$ 存在，则 $\lim_{x\to+\infty}f'(x)=0$。正确的说法是\ExamSelection。
  choices:
  - label: A
    text: ①正确，②错误
    figures: []
  - label: B
    text: ①错误，②正确
    figures: []
  - label: C
    text: ①与②均正确
    figures: []
