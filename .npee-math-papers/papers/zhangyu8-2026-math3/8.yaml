    text: |-
      设某营运车辆的使用寿命 $X$（天）服从参数为 $\dfrac{1}{1000}$ 的指数分布，车辆的使用成本为 $300$ 元/天，司机的报酬为 $400$ 元/天，并约定按照 $m$ 天支付报酬，车辆每天正常运营可获得 $1000$ 元收益，求该营运车辆的期望利润最大时 $m$ 的值（$m$ 为整数）。（$\ln2$ 取 $0.693$，$\ln7$ 取 $1.946$）
