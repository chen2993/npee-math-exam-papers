    text: 设函数 $f(x)$ 在 $x=x_0$ 的某邻域 $U$ 内存在连续的二阶导数。
  subparts:
  - text: |-
      设当 $h>0$，$x_0-h\in U$，$x_0+h\in U$，恒有 $f(x_0)<\dfrac12[f(x_0+h)+f(x_0-h)]$，证明 $f''(x_0)\geq0$；
  - text: |-
      如果 $f''(x_0)>0$，证明必存在 $h>0$，$x_0-h\in U$，$x_0+h\in U$，使 $(*)$ 式成立。
