- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      利用变换 $u=\tan y$ 将方程 $y''\sec^2y+2(y')^2\sec^2y\tan y+2y'\sec^2y-3\tan y=-3x+2$ 简化，并求出原方程的通解。
- number: 21
  section: solution
  points: 12
  stem:
    text: 设 $x>0$。
  subparts:
  - text: |-
      证明：$(x+1)^3-x^3=3[x+\theta(x)]^2$（①），其中 $0<\theta(x)<1$。
  - text: |-
      证明①中的 $\theta(x)$ 是 $x$（$0<x<1$）的减函数。
  - text: |-
      当 $0<x<1$ 时，证明①中的 $\theta(x)$ 满足 $\dfrac{1}{2}<\theta(x)<\dfrac{1}{\sqrt{3}}$。
- number: 22
  section: solution
  points: 12
  stem:
    text: 设 3 阶实矩阵 $A$ 满足 $A^2-A-2E=O$，$|A|=2$。
  subparts:
  - text: 证明 $A$ 可以对角化。
  - text: |-
      如果 $A$ 为实对称矩阵，且 $\xi=(1,1,-1)^{\mathsf T}$ 是齐次线性方程组 $(A-2E)x=0$ 的一个解，求一个对称矩阵 $B$ 使得 $B^2=A+E$。
