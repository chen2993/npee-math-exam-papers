  stem:
    text: |-
      设函数 $f(x)$ 连续，$f(x)=x^2+x\int_0^{x^2}f(x^2-t)\,\mathrm{d}t+\iint_Df(xy)\,\mathrm{d}x\,\mathrm{d}y$，其中 $D$ 为以 $A(1,-1),B(-1,1),C(1,1)$ 为顶点的三角区域，若 $f(1)=0$。
