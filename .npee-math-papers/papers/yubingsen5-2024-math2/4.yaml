- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设有向量组（Ⅰ）$\alpha_1=(1,0,1)^{\mathsf T},\alpha_2=(1,1,2)^{\mathsf T},\alpha_3=(1,2,a)^{\mathsf T}$，（Ⅱ）$\beta_1=(-1,2,1)^{\mathsf T},\beta_2=(1,0,b)^{\mathsf T}$。
  subparts:
  - text: 问 $a,b$ 为何值时，向量组（Ⅱ）不能由向量组（Ⅰ）线性表示？
  - text: |-
      设 $A=\begin{pmatrix}1&1&1\\0&1&2\\1&2&a\end{pmatrix},B=\begin{pmatrix}-1&1\\2&0\\1&b\end{pmatrix}$，问 $a,b$ 为何值时，矩阵方程 $AX=B$ 有解；有解时求出其全部解。
