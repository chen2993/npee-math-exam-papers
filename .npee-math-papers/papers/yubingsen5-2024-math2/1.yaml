  stem:
    text: 设函数 $f(x)$ 在 $[a,b]$ 上连续。
  subparts:
  - text: |-
      证明存在 $\xi\in(a,b)$，使得 $\int_a^\xi f(x)\,\mathrm{d}x=(b-\xi)f(\xi)$。
  - text: |-
      如果 $f(x)$ 在 $(a,b)$ 内取得最大值和最小值，证明存在 $\eta\in(a,b)$，使得 $\int_a^\eta f(x)\,\mathrm{d}x=(\eta-a)f(\eta)$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设在区间 $(-1,+\infty)$ 内 $F(x)$ 为 $f(x)$ 的原函数，$f(x)F(x)=\dfrac{xe^x}{2(1+x)^2}$，已知 $F(0)=1$，求 $f(x)$ 的表达式。
- number: 22
  section: solution
