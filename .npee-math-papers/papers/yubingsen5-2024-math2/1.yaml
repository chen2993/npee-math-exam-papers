  - label: B
    text: 点 $x=0$ 不是 $f'(x)$ 的可去间断点
    figures: []
  - label: C
    text: |-
      $\int_{0}^{x}f(t)\,\mathrm{d}t$ 在点 $x=0$ 处不可导
    figures: []
