- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设二元函数 $f(x,y)$ 在点 $(1,1)$ 处连续，且满足 $\lim_{(x,y)\to(1,1)}\dfrac{f(x,y)}{x^3+y^3-\dfrac{9}{2}(x^2+y^2)+6(x+y)-5}=1$，则下列结论中，正确的是\ExamSelection
  choices:
  - label: A
    text: 点 $(1,1)$ 是 $f(x,y)$ 的极大值点。
    figures: []
  - label: B
    text: 点 $(1,1)$ 是 $f(x,y)$ 的极小值点。
    figures: []
  - label: C
    text: 点 $(1,1)$ 不是 $f(x,y)$ 的极值点。
    figures: []
  - label: D
