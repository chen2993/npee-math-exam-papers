- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)$ 为 $(-\infty,+\infty)$ 上的单调增加的正值函数，且 $f'(0)$ 存在，则下列关于极限 $I_1=\lim_{x\to0^+}\left[\dfrac{f(x)}{f(0)}\right]^{\dfrac{1}{x}}$ 和 $I_2=\lim_{x\to0^+}\left(\dfrac{1}{x}\right)^{f(x)-f(0)}$ 的结论中，正确的是\ExamSelection
  choices:
  - label: A
    text: $I_1$ 与 $I_2$ 是否存在均与 $f(x)$ 的表达式有关。
    figures: []
  - label: B
    text: $I_1$ 与 $I_2$ 均存在，且 $I_1>I_2$。
    figures: []
  - label: C
    text: $I_1$ 与 $I_2$ 均存在，且 $I_1<I_2$。
    figures: []
  - label: D
    text: 以上说法均不正确。
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $0<a<1$，$I_1=\int_0^{\dfrac{\pi}{4}}\dfrac{\sin ax}{\sin x}\,\mathrm{d}x$，$I_2=\int_0^{\dfrac{\pi}{4}}\dfrac{\tan ax}{\tan x}\,\mathrm{d}x$，则\ExamSelection
  choices:
  - label: A
    text: |-
      $I_1>\dfrac{\pi}{4}a>I_2$。
    figures: []
  - label: B
    text: |-
      $I_2>\dfrac{\pi}{4}a>I_1$。
    figures: []
  - label: C
    text: |-
      $\dfrac{\pi}{4}a>I_1>I_2$。
    figures: []
  - label: D
    text: |-
      $I_1>I_2>\dfrac{\pi}{4}a$。
    figures: []
