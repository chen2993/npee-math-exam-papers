- number: 7
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 为 $n$ 阶正定矩阵，特征值为 $\lambda_n\geqslant\lambda_{n-1}\geqslant\cdots\geqslant\lambda_1>1$，$Q$ 为正交矩阵，则下列命题中，正确命题的个数是\ExamSelection\quad \n①$A+Q^TA^{-1}Q$ 是正定矩阵；\quad \n②$A+Q^TA^{-1}Q$ 的最小特征值为 $\lambda_1+\dfrac{1}{\lambda_1}$；\quad \n③$A+Q^TA^{-1}Q$ 的最大特征值为 $\lambda_n+\dfrac{1}{\lambda_n}$；\quad \n④若 $\alpha$ 为 $A$ 的特征向量，则 $Q^T\alpha$ 为 $Q^TA^{-1}Q$ 的特征向量。
  choices:
  - label: A
    text: $1$。
    figures: []
  - label: B
    text: $2$。
    figures: []
  - label: C
    text: $3$。
    figures: []
  - label: D
    text: $4$。
    figures: []
