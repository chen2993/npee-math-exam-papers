- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 为非零矩阵，$\alpha_1,\alpha_2,\alpha_3$ 是齐次线性方程组 $Ax=0$ 的一个基础解系，$k,l,m$ 是非零常数，则下列各组向量中仍为 $Ax=0$ 的基础解系的是\ExamSelection
  choices:
  - label: A
    text: |-
      $k\alpha_1^{T}\alpha_2\alpha_3,\ l\alpha_2^{T}\alpha_3\alpha_1,\ m\alpha_3^{T}\alpha_1\alpha_2$。
    figures: []
  - label: B
    text: |-
      $\alpha_1^{T}\alpha_2\alpha_3+k\alpha_2^{T}\alpha_3\alpha_1,\ \alpha_2^{T}\alpha_3\alpha_1+l\alpha_3^{T}\alpha_1\alpha_2,\ \alpha_3^{T}\alpha_1\alpha_2+m\alpha_1^{T}\alpha_2\alpha_3$。
    figures: []
  - label: C
    text: |-
      $k\alpha_1+l\alpha_2,\ l\alpha_2+m\alpha_3,\ m\alpha_3+k\alpha_1$。
    figures: []
  - label: D
    text: |-
      $k\alpha_1+l\alpha_2+m\alpha_3,\ l\alpha_1+m\alpha_2+k\alpha_3,\ m\alpha_1+k\alpha_2+l\alpha_3$。
    figures: []
