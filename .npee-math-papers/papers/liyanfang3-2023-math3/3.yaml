- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      已知函数 $f(x)$ 在 $[0,\dfrac{\pi}{2}]$ 上连续，在 $(0,\dfrac{\pi}{2})$ 内二阶可导。当 $x\in(0,\dfrac{\pi}{2})$ 时，$f'(x)=\dfrac{x}{\sin x}+\dfrac{\sin x}{x}$，且 $f(0)=0$。证明：对任意 $a\in(0,\dfrac{\pi}{2})$，$af(\dfrac{a}{2})<\int_0^af(x)\,\mathrm{d}x<\dfrac{a}{2}f(a)$。
- number: 20
  section: solution
