- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)=\dfrac{x^2+x+a}{x+b}$，$g(x)=\dfrac{x+\sqrt{x^2+4(1-b)x+a}}{2}$，则当 $x\to+\infty$ 时，下列关于曲线 $y=f(x)$ 与 $y=g(x)$ 的渐近线的结论中，正确的是\ExamSelection。
  choices:
  - label: A
    text: 没有公共斜渐近线
    figures: []
  - label: B
    text: 是否具有公共斜渐近线与 $a,b$ 的取值有关
    figures: []
  - label: C
    text: 有公共斜渐近线，且公共斜渐近线的方程与 $a$ 的取值有关
    figures: []
  - label: D
    text: 有公共斜渐近线，且公共斜渐近线的方程与 $b$ 的取值有关
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $I_1=\int_0^{\dfrac{\pi}{2}}e^{-x^2}\sin x\,\mathrm{d}x$，$I_2=\int_0^{\dfrac{\pi}{2}}e^{-x^2}\cos x\,\mathrm{d}x$，$I_3=\int_0^{\dfrac{\pi}{2}}e^{-x^2}\cot x\,\mathrm{d}x$，则 $I_1,I_2,I_3$ 的大小关系为\ExamSelection。
  choices:
  - label: A
    text: $I_1>I_2>I_3$
    figures: []
  - label: B
    text: $I_1>I_3>I_2$
    figures: []
  - label: C
    text: $I_3>I_2>I_1$
    figures: []
  - label: D
    text: $I_3>I_1>I_2$
    figures: []
