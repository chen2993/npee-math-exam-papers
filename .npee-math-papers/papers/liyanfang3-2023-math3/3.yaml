- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设相互独立的随机变量 $X,Y$ 服从参数为 $\theta$ 的指数分布，$\theta$ 为未知参数。令随机变量 $Z=X+Y$。
  subparts:
  - text: 求 $Z$ 的概率密度；
  - text: |-
      设 $Z_1,Z_2,\cdots,Z_n$ 是来自于总体 $Z$ 的一个简单随机样本，求 $\theta$ 的最大似然估计量 $\widehat{\theta}$，并计算 $E\left(\dfrac{1}{\widehat{\theta}}\right)$。
