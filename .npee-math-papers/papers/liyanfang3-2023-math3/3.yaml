  stem:
    text: 设 $A$ 为 $3$ 阶实对称矩阵，$B$ 为可相似对角化的 $3$ 阶正交矩阵，满足 $|A|=|B|$，$r(E+B)=r(2E-A)=1$。
  subparts:
