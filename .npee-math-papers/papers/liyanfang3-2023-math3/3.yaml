- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 为 $n$ 阶矩阵，$A$ 的特征多项式为 $f(\lambda)$。下列命题中，错误的是\ExamSelection。
  choices:
  - label: A
    text: 若矩阵 $A$ 可逆，且 $A^{-1}$ 有特征值 $1$，则 $f(1)=0$
    figures: []
  - label: B
    text: 若矩阵 $A$ 可逆，且方程组 $A^2x=Ax$ 有非零解，则 $f(1)=0$
    figures: []
  - label: C
    text: 若方程组 $A^4x=x$ 对所有 $3$ 维向量 $x$ 均成立，则 $f(1)=0$
    figures: []
  - label: D
    text: 若方程组 $A^3x=Ax$ 对所有 $3$ 维向量 $x$ 均成立，则 $f(1)=0$
    figures: []
- number: 7
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 为 $n$ 阶实矩阵，$A\neq A^{\mathrm{T}}$，$B=\begin{pmatrix}E&A\\A^{\mathrm{T}}&O\end{pmatrix}$，则下列矩阵中，可能与 $B$ 合同的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\begin{pmatrix}E_n&O\\O&E_n\end{pmatrix}$
    figures: []
  - label: B
    text: |-
      $\begin{pmatrix}E_n&O\\O&-E_n\end{pmatrix}$
    figures: []
  - label: C
    text: |-
      $\begin{pmatrix}E_p&O\\O&-E_q\end{pmatrix}$，其中 $p>q$
    figures: []
  - label: D
    text: |-
      $\begin{pmatrix}E_p&O\\O&-E_q\end{pmatrix}$，其中 $p<q$
    figures: []
- number: 8
  section: choice
  points: 5
  stem:
    text: |-
      设试验 $E$ 的样本空间为 $S$，$A$ 是概率非 $0$ 的事件，$B_1,B_2,B_3$ 为 $S$ 的一个划分，且 $P(B_i)>0$，$C_i=A\cup B_i\, (i=1,2,3)$，则下列结论中，错误的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\dfrac{P(C_1)P(C_2\mid C_1)P(C_3\mid C_1C_2)}{P(A)}=1$
    figures: []
  - label: B
    text: $P(C_1)+P(C_2)+P(C_3)-2P(A)=1$
    figures: []
  - label: C
    text: |-
      $\dfrac{P(A\mid C_1)P(C_1)}{\displaystyle\sum_{i=1}^{3}P(A\mid B_i)P(B_i)}=1$
    figures: []
  - label: D
    text: |-
      $P(B_1\mid C_1)+P(B_2\mid C_2)+P(B_3\mid C_3)=1$
    figures: []
- number: 9
  section: choice
  points: 5
  stem:
    text: |-
      设 $X_1,X_2$ 是来自非负值总体 $X$ 的简单随机样本，$D(\sqrt{X})>0$。定义统计量 $Y_1=\dfrac{1}{2}(X_1+X_2)$，$Y_2=\sqrt{X_1X_2}$，则下列关于 $E(Y_1)$ 和 $E(Y_2)$ 的说法中，正确的是\ExamSelection。
  choices:
  - label: A
    text: 对于任意符合题设条件的总体 $X$，都有 $E(Y_1)=E(Y_2)$
    figures: []
  - label: B
    text: 存在符合题设条件的总体 $X$，使得 $E(Y_1)=E(Y_2)$
    figures: []
  - label: C
    text: 对于任意符合题设条件的总体 $X$，都有 $E(Y_1)>E(Y_2)$
    figures: []
  - label: D
    text: 存在符合题设条件的总体 $X$，使得 $E(Y_1)<E(Y_2)$
    figures: []
- number: 10
  section: choice
  points: 5
  stem:
    text: |-
      设总体 $X$ 服从正态分布 $N(\mu,\sigma^2)\, (\sigma>0)$，$X_1,X_2,\cdots,X_{2n}\, (n>2)$ 为来自该总体的简单随机样本。令 $\overline{X}_1=\dfrac{1}{n}\displaystyle\sum_{i=1}^{n}X_i$，$\overline{X}_2=\dfrac{1}{n}\displaystyle\sum_{j=n+1}^{2n}X_j$，则下列结论中，正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\dfrac{\overline{X}_1-\overline{X}_2}{\sigma}\sim N(0,1)$
    figures: []
  - label: B
    text: |-
      $\displaystyle\sum_{i=1}^{n}\dfrac{(X_i-X_{n+i})^2}{\sigma^2}\sim\chi^2(n)$
    figures: []
  - label: C
    text: |-
      $\dfrac{n(\overline{X}_2-\mu)}{\sqrt{\displaystyle\sum_{i=1}^{n}(X_i-\mu)^2}}\sim t(n)$
    figures: []
  - label: D
    text: |-
      $\dfrac{\displaystyle\sum_{i=1}^{n}(X_i-\overline{X}_1)^2}{\displaystyle\sum_{j=n+1}^{2n}(X_j-\overline{X}_2)^2}\sim F(n,n)$
    figures: []
