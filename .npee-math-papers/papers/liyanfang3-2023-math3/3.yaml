      证明：当 $x>0$ 时，$\dfrac{x}{1+x}<\ln(1+x)<x$。
  - text: |-
      设 $a_n>0$，$\dfrac{a_n}{\ln(1+a_n)}=1+a_{n+1}$，求幂级数 $\displaystyle\sum_{n=1}^{\infty}a_nx^n$ 的收敛半径。
- number: 21
