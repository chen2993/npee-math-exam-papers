    figures: []
- number: 8
  section: choice
  points: 5
  stem:
    text: |-
      设随机变量 $X_1,X_2$ 均服从参数为 $\lambda(\lambda>0)$ 的泊松分布，且相互独立。若 $k$ 为非负整数，则下列结论中，正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $P\{X_1+X_2=2k\}=\dfrac{\mathrm{e}^{-2\lambda}(2\lambda)^k}{k!}$。
    figures: []
  - label: B
    text: |-
      $P\{X_1+X_2=k\}=\dfrac{\mathrm{e}^{-2\lambda}(2\lambda)^k}{k!}$。
    figures: []
  - label: C
    text: |-
      $P\{X_1+X_2=2k\}=\dfrac{\mathrm{e}^{-\lambda}\lambda^k}{k!}$。
    figures: []
  - label: D
    text: |-
      $P\{X_1+X_2=k\}=\dfrac{\mathrm{e}^{-\lambda}\lambda^k}{k!}$。
    figures: []
- number: 9
  section: choice
  points: 5
  stem:
    text: |-
      设总体 $X\sim N(\mu,\sigma^2)(\mu,\sigma>0)$，$X_1,X_2,\cdots,X_n$ 为来自该总体的简单随机样本，则样本均值 $\overline{X}$ 与总体均值 $\mu$ 的误差不超过 $\dfrac{\mu\sigma}{\sqrt{n}}$ 的概率 $p$\ExamSelection。
  choices:
  - label: A
    text: |-
      随着 $\mu$ 增加而增加。
    figures: []
  - label: B
    text: |-
      随着 $\mu$ 增加而减少。
    figures: []
  - label: C
    text: 随着 $n$ 增加而增加。
    figures: []
  - label: D
    text: 随着 $n$ 增加而减少。
    figures: []
