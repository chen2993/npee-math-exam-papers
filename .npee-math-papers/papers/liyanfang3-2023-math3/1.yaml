questions:
- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      当 $x\to 0$ 时，若 $\alpha_1(x),\alpha_2(x),\beta_1(x),\beta_2(x)$ 都是非零无穷小量，且 $\alpha_1(x)\sim\alpha_2(x)$，$\beta_1(x)\sim\beta_2(x)$，则下列命题中，错误的是\ExamSelection。
  choices:
  - label: A
    text: |-
      若 $\alpha_1(x)\sim\beta_1(x)$，则 $\alpha_2(x)-\beta_2(x)=o(\alpha_2(x))$。
    figures: []
  - label: B
    text: |-
      若 $\alpha_1(x)-\beta_1(x)=o(\alpha_1(x))$，则 $\alpha_2(x)\sim\beta_2(x)$。
    figures: []
  - label: C
    text: |-
      若 $\alpha_1(x)\sim\beta_1(x)$，则 $\alpha_1(x)-\beta_1(x)\sim\alpha_2(x)-\beta_2(x)$。
    figures: []
  - label: D
    text: |-
      若 $\alpha_1(x)=o(\beta_1(x))$，则 $\alpha_1(x)-\beta_1(x)\sim\alpha_2(x)-\beta_2(x)$。
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      下列幂级数的和函数在区间 $(0,1)$ 内必有零点的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\displaystyle\sum_{n=1}^{\infty}\dfrac{(-1)^{n-1}}{n}x^n$。
    figures: []
  - label: B
    text: |-
      $\displaystyle\sum_{n=2}^{\infty}\dfrac{(-1)^n}{n(n-1)}x^n$。
    figures: []
  - label: C
    text: |-
      $\displaystyle\sum_{n=0}^{\infty}\dfrac{(-1)^n\pi^{2n}}{(2n)!}x^{2n}$。
    figures: []
  - label: D
    text: |-
      $\displaystyle\sum_{n=0}^{\infty}\dfrac{(-1)^n\pi^{2n+1}}{(2n+1)!(2n+1)}x^{2n+1}$。
    figures: []
