- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 为 3 阶正交矩阵且 $A^3=E$。已知 $\alpha,\beta$ 均为 3 维非零向量，且满足 $\alpha,A\alpha$ 线性无关，$\alpha,A\alpha,A^2\alpha$ 线性相关，$\beta^{\mathrm{T}}\alpha=\beta^{\mathrm{T}}A\alpha=0$。下列命题中，错误的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\alpha,A^2\alpha$ 线性无关。
    figures: []
  - label: B
    text: |-
      $\beta,A\beta$ 线性无关。
    figures: []
  - label: C
    text: |-
      $\alpha,A\alpha,\beta$ 线性无关。
    figures: []
  - label: D
    text: |-
      $\beta,A\beta,A^2\beta$ 线性相关。
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 为 $n(n\geq 2)$ 阶矩阵，若 1 不是 $A$ 的特征值，且 $|A|=-1$，则下列命题中，正确的是\ExamSelection。① 2 不是 $A+A^{-1}$ 的特征值。② 2 不是 $A+A^*$ 的特征值。③ $-1$ 不是 $A+A^{\mathrm{T}}-AA^{\mathrm{T}}$ 的特征值。④ 1 不是 $A-A^*+AA^*$ 的特征值。
  choices:
  - label: A
    text: ①②。
    figures: []
  - label: B
    text: ③④。
    figures: []
  - label: C
    text: ①④。
    figures: []
  - label: D
    text: ②③。
    figures: []
