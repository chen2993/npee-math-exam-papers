- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      已知抛物线 $l_1:y=(x+1)^2$ 和 $l_2:y=ax^2+bx$ 相切于唯一的公共点 $P$，其中参数 $b\in(-\infty,0)$。记抛物线 $l_2$ 与 $x$ 轴所围图形的面积为 $A$，问：$A$ 是否存在最值？若存在，求出该最值。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设区域 $D=\{(x,y)\mid-1\leq x\leq 1,0\leq y\leq 1\}$，$[x^2-y]$ 表示不超过 $x^2-y$ 的最大整数，计算 $I=\displaystyle\iint_D(1-[x^2-y])\cdot\sqrt{|x^2-y|}\,\mathrm{d}x\,\mathrm{d}y$。
- number: 19
  section: solution
  points: 12
  stem:
    text: 求下列极限：
  subparts:
  - text: |-
      求 $\displaystyle\lim_{n\to\infty}\dfrac{1}{n^2}\left(\sqrt[4]{1}+\sqrt[4]{2}+\cdots+\sqrt[4]{n}\right)\left(\dfrac{1}{\sqrt[4]{1}}+\dfrac{1}{\sqrt[4]{2}}+\cdots+\dfrac{1}{\sqrt[4]{n}}\right)$；
  - text: |-
      求 $\displaystyle\lim_{n\to\infty}\left(\dfrac{1}{n^4+1}+\dfrac{2}{n^4+2}+\cdots+\dfrac{n}{n^4+n}\right)\left(\sqrt[4]{1}+\sqrt[4]{2}+\cdots+\sqrt[4]{n}\right)\left(\dfrac{1}{\sqrt[4]{1}}+\dfrac{1}{\sqrt[4]{2}}+\cdots+\dfrac{1}{\sqrt[4]{n}}\right)$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $a>0$，函数 $f(x)$ 在 $[a,b]$ 上连续，在 $(a,b)$ 内可导。证明：若对任意 $x\in(a,b)$，都有 $f'(x)\neq 0$，则存在 $\xi_1,\xi_2\in(a,b)$，使得 $\dfrac{f'(\xi_1)}{f'(\xi_2)}=\dfrac{a^2+ab+b^2}{a+b}\cdot\dfrac{2\xi_1}{3\xi_2^2}$。
- number: 21
  section: solution
  points: 12
  stem:
    text: 设 $A,B$ 均为 2 阶实对称矩阵，$A$ 的特征值为 $1,2$，$B$ 的特征值为 $2,3$。
  subparts:
  - text: |-
      证明：当 $AB=BA$ 时，存在正交矩阵 $Q$，使得 $Q^{\mathrm{T}}AQ,Q^{\mathrm{T}}BQ$ 均为对角矩阵。
  - text: |-
      求 $\displaystyle\max_{x\neq 0}\dfrac{x^{\mathrm{T}}Bx}{x^{\mathrm{T}}Ax}$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设区域 $D$ 由直线 $y=x,y=1$ 和 $x=\mathrm{e}$ 围成，二维随机变量 $(X,Y)$ 的联合概率密度为 $f(x,y)=\begin{cases}\dfrac{2}{xy},&(x,y)\in D,\\0,&\text{其他}\text{。}\end{cases}$
  subparts:
  - text: |-
      求条件概率密度 $f_{X\mid Y}(x\mid y)$。
  - text: |-
      设 $a\in[1,2)$，记 $p_1(a)=\displaystyle\int_{-\infty}^{2}f_{X\mid Y}(x\mid a)\,\mathrm{d}x$，$p_2(a)$ 为当 $Y\geq a$ 时，事件 $\{|X|\leq 2\}$ 发生的概率，请问 $p_1(a)$ 和 $p_2(a)$ 是否存在最大值？若均存在，则这两个最大值是否相等？
