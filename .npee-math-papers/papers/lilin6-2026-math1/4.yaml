      三、解答题：17～22小题，共70分。解答应写出文字说明、证明过程或演算步骤。设 $M(x,y)$ 是曲线 $y=f(x)(y>0)$ 上任一点，曲线在点 $M$ 处的切线交 $y$ 轴于点 $P$，若 $\lvert MP\rvert=\lvert PO\rvert$，其中 $O$ 为坐标原点，且曲线过点 $(4,3)$。求 $y=f(x)$ 的表达式，并求 $f(x)$ 的极值。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)=\dfrac{(x-a)^2}{\ln x}(x>0)(0<a<1)$，若 $f(x)$ 的3个极值点为 $x_1,x_2,x_3$，且 $x_1<x_2<x_3$。
  subparts:
  - text: 求 $f(x)$ 的极大值；
  - text: |-
      证明：$x_1+x_3>\dfrac{2}{\sqrt{e}}$。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设曲面 $z=1+x^2+y^2$ 上点 $P_0(x_0,y_0,z_0)$ 处的切平面为 $\Pi$，$\Pi$ 与 $z=x^2+y^2$ 的交线为 $L$，从 $z$ 轴正向看 $L$ 是逆时针方向，切平面 $\Pi$ 与 $z=x^2+y^2$ 所围立体为 $\Omega$。
  subparts:
  - text: |-
      计算 $I=\oint_L y\,\mathrm{d}x-x\,\mathrm{d}y+(z-x^2-y^2)\,\mathrm{d}z$；
  - text: |-
      求 $\Omega$ 的体积。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 有连续导数，$f(x)$ 不恒为零，且 $\int_0^1 f(x)\,\mathrm{d}x=0$，记 $M=\max_{x\in[0,1]}\lvert f'(x)\rvert$。
  subparts:
  - text: |-
      证明：对于 $\forall x\in[0,1]$，有 $\lvert f(x)\rvert\le\dfrac{1}{2}M$；
  - text: |-
      设 $D=\{(x,y)\mid0\le x\le1,0\le y\le x\}$，证明：$\left\lvert\iint_D f(y)\,\mathrm{d}x\,\mathrm{d}y\right\rvert\le\dfrac{1}{8}M$。
- number: 21
  section: solution
  points: 12
  stem:
    text: 设二次型 $f(x_1,x_2,x_3)=2(x_1^2+x_2^2+x_3^2)+2a(x_1x_2+x_1x_3+x_2x_3)$，$a$ 为正整数。
  subparts:
  - text: 求正交变换 $X=QY$，将 $f(x_1,x_2,x_3)$ 化为标准形；
  - text: |-
      若存在可逆矩阵 $P$，对任意 $X=(x_1,x_2,x_3)^\mathrm{T}$，有 $f(x_1,x_2,x_3)=\lVert PX\rVert^2$，求 $a$ 的值及 $P$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X$ 与 $Y$ 相互独立，且服从同一分布 $N\left(\mu,\dfrac{\sigma^2}{2}\right)$，其中 $\sigma(\sigma>0)$ 是未知参数，记 $Z=X-Y$。
  subparts:
  - text: |-
      若 $Z_1,Z_2,\cdots,Z_{2n}(n\ge2)$ 是总体 $Z$ 的简单随机样本，求 $\sigma^2$ 的最大似然估计量 $\hat{\sigma}^2$；
  - text: |-
      记 $U=\sum_{i=1}^{n+1}Z_i,V=\sum_{i=n}^{2n}Z_i$，利用（I）的 $\hat{\sigma}^2$，求相关系数 $\rho_{UV}$。
