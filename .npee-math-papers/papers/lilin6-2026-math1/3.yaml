- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(u)$ 在 $(0,+\infty)$ 内具有二阶导数，$z=xf\left(\dfrac{y}{x}\right)+yf\left(\dfrac{y}{x}\right)$ 满足 $x\dfrac{\partial^2z}{\partial x\partial y}+2y\dfrac{\partial^2z}{\partial y^2}=\dfrac{y}{x}$，$z(x,x)=x$，$\left.\dfrac{\partial z}{\partial x}\right|_{(x,x)}=-\dfrac{3}{2}$，求 $f(u)$。
