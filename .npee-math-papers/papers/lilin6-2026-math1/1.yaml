      设 $f(x)$ 在 $(-\infty,+\infty)$ 内有二阶连续的导数，且对 $\forall x,y\in(-\infty,+\infty)$ 满足 $f\left(\sqrt{\dfrac{x^2+y^2}{2}}\right)=\sqrt{f(x)f(y)}$，$f(x)$ 在 $(0,+\infty)$ 内严格单调递增。证明：
  subparts:
