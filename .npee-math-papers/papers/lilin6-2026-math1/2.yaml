- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 \(X\) 与 \(Y\) 相互独立且服从同一分布，当 \(x\le0\) 时，\(X\) 的概率密度 \(f(x)=0\)；当 \(x>0\) 时，\(f(x)\) 满足方程 \(f'(x)+2xf(x)=0\)。 \(Z=\sqrt{X^2+Y^2}\)。 求： (1) \(Z\) 的分布函数与概率密度； (2) \(D(Z)\)。
