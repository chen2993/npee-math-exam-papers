- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设平面力 \(F(x,y)=(P(x,y),Q(x,y))\)，其中 \(P(x,y)=f(x)+y[{\mathrm e}^{-x}-f'(x)]\)， \(Q(x,y)=f'(x)\)， \(f(x)\) 有二阶连续导数，且 \(f'(0)=0\)。 (1) 若力 \(F\) 对运动质点做的功与路径无关，求 \(f(x)\)； (2) 若 \(L\) 是从点 \(A(-1,1)\) 到点 \(B(1,0)\) 的光滑有向曲线，且 \( \int_L P(x,y)\, \mathrm dx+Q(x,y)\, \mathrm dy=\dfrac{4}{\mathrm e}\)，求 \(f(x)\) 的极值。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 \(f(x)\) 在 \([0,1]\) 上二阶可导，且 \(f''(x)>0\)。 (1) 证明：对于区间 \((0,1)\) 内的任意不同的两点 \(x_1,x_2\)，有\( f[\lambda x_1+(1-\lambda)x_2]<\lambda f(x_1)+(1-\lambda)f(x_2)\quad(0<\lambda<1); \) (2) 若 \(\int_0^1f(x)\, \mathrm dx=0\)，证明：对任意 \(x\in[0,1]\)，有 \(|f(x)|\le\max\{f(0),f(1)\}\)。
- number: 21
