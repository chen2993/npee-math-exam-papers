  stem:
    text: |-
      设 $y=f(x)$ 满足 $yy''-y'^2=1$，$y(1)=1$，$y'(1)=0$。曲线 $\begin{cases}y=f(x),\\z=0\end{cases}$ 绕直线 $\begin{cases}x=1,\\z=0\end{cases}$ 旋转一周所得曲面为 $\Sigma_1$，$\Sigma$ 为 $\Sigma_1$ 与两个平面 $y=\sqrt2,y=e$ 所围立体的全表面，取外侧。
  subparts:
  - text: 求 $y=f(x)$；
  - text: |-
      计算 $I=\displaystyle\iint_{\Sigma}\dfrac{x}{\sqrt{y^2-1}}\,\mathrm{d}y\mathrm{d}z$。
