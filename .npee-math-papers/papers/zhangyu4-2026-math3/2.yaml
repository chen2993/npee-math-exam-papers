    text: 设 $f(x)$ 是 $[0,1]$ 上的正值连续函数，证明：
  subparts:
  - text: |-
      存在唯一的 $\xi\in(0,1)$，使得 $\int_0^{\xi}f(t)\,\mathrm{d}t=\int_{\xi}^1\dfrac{1}{f(t)}\,\mathrm{d}t$；
  - text: |-
      对任意自然数 $n$（$n\geq2$），存在唯一的 $x_n\in(0,1)$，使得 $\int_{\dfrac{1}{n}}^{x_n}f(t)\,\mathrm{d}t=\int_{x_n}^1\dfrac{1}{f(t)}\,\mathrm{d}t$，且 $\lim_{n\to\infty}x_n=\xi$。
