- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X$ 与 $Y$ 相互独立，且分别服从正态分布 $N(\mu,\sigma^2)$ 与 $N(\mu,2\sigma^2)$，其中 $\sigma$ 是未知参数且 $\sigma>0$。记 $Z=X-Y$。
  subparts:
  - text: |-
      求 $Z$ 的概率密度 $f(z;\sigma^2)$；
  - text: |-
      设 $Z_1,Z_2,\cdots,Z_n$ 为来自总体 $Z$ 的简单随机样本，求 $\sigma^2$ 的最大似然估计量 $\widehat{\sigma}^2$；
  - text: |-
      是否存在实数 $a$，使得对任意的 $\varepsilon>0$，都有 $\lim_{n\to\infty}P\{|\widehat{\sigma}^2-a|\geq\varepsilon\}=0$？
