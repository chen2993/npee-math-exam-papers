- number: 9
  section: choice
  points: 5
  stem:
    text: |-
      某人打靶环数 $N$ 有三种结果 $A_1:8<N\leq 10,A_2:5<N\leq 8,A_3:0\leq N\leq 5$，且三种结果发生的概率分别为 $\dfrac{1}{2},\dfrac{1}{3},\dfrac{1}{6}$。独立重复打靶 $3$ 次，$X$ 表示 $3$ 次打靶中结果 $A_1$ 发生的次数，$Y$ 表示 $3$ 次打靶中结果 $A_2$ 发生的次数，则 $X$ 与 $Y$ 的相关系数为\ExamSelection。
