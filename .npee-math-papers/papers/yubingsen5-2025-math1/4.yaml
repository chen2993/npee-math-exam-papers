- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      求 $I=\oint_L(y^2+z^2)\,\mathrm{d}x+(z^2+x^2)\,\mathrm{d}y+(x^2+y^2)\,\mathrm{d}z$，其中 $L$ 是球面 $x^2+y^2+z^2=2bx(z\geq 0)$ 与柱面 $x^2+y^2=2ax(b>a>0)$ 的交线，从 $z$ 轴正向看，$L$ 为逆时针方向。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 在 $[a,b]$ 上连续，在 $(a,b)$ 内可导，$f(a)=a^2$，且 $\int_a^b f(x)\,\mathrm{d}x=\dfrac{1}{3}(b^3-a^3)$。证明：
  subparts:
  - text: |-
      存在 $\xi\in(a,b)$，使得 $f(\xi)=\xi^2$；
  - text: |-
      在 $(a,b)$ 内存在与（1）中相异的点 $\eta$，使得 $f'(\eta)+f(\eta)=\eta^2+2\eta$。
