  stem:
    text: |-
      关于 $x$ 的方程 $\int_0^x\sqrt{1+t^2}\,\mathrm{d}t+\int_{\cos x}^0e^{-t^2}\,\mathrm{d}t=0$ 的根的个数为\ExamSelection。
  choices:
  - label: A
    text: $0$
    figures: []
  - label: B
    text: $1$
    figures: []
  - label: C
    text: $2$
    figures: []
  - label: D
    text: $3$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $y=f(x)$ 在闭区间 $[a,b]$ 上有定义，对于命题：①若 $y=f$ 在 $[a,b]$ 上无界，则 $y=f(x)$ 在 $[a,b]$ 上必不连续；②若 $y=f$ 在 $[a,b]$ 上可导，则导函数 $f'(x)$ 在 $[a,b]$ 上必有界；③若 $y=f$ 在 $[a,b]$ 上可积，则 $y=f(x)$ 在 $[a,b]$ 上必存在原函数。则以上三个命题中正确的个数是\ExamSelection。
  choices:
  - label: A
    text: $0$
    figures: []
  - label: B
    text: $1$
    figures: []
  - label: C
    text: $2$
    figures: []
  - label: D
    text: $3$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设 $p,q$ 为常数且 $0<p\leq q$，若反常积分 $\int_0^{+\infty}\dfrac{1}{x^p+x^q}\,\mathrm{d}x$ 收敛，则\ExamSelection。
  choices:
  - label: A
    text: $p=q$
    figures: []
  - label: B
    text: |-
      $p<q\leq1$
    figures: []
  - label: C
    text: $1<p<q$
    figures: []
  - label: D
    text: $p<1<q$
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设微分方程 $y''+qy=0$，当 $x\to+\infty$ 时有趋于零的非零解，则\ExamSelection。
  choices:
  - label: A
    text: $q>0$
    figures: []
  - label: B
    text: $q=0$
    figures: []
  - label: C
    text: $q<0$
    figures: []
  - label: D
    text: |-
      $q\leq0$
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设 $\mathbf{A},\mathbf{B}$ 为 $n$ 阶方阵，$\mathbf{E}$ 为 $n$ 阶单位矩阵。若 $\mathbf{A}$ 为可逆的对称矩阵，且 $(\mathbf{A}-\mathbf{B})^2=\mathbf{E}$，则 $(\mathbf{E}+\mathbf{A}^{-1}\mathbf{B}^{\mathrm{T}})^{\mathrm{T}}(\mathbf{E}-\mathbf{B}\mathbf{A}^{-1})^{-1}=$\ExamSelection。
  choices:
  - label: A
    text: |-
      $(\mathbf{A}-\mathbf{B})(\mathbf{A}+\mathbf{B})$
    figures: []
  - label: B
    text: |-
      $(\mathbf{A}+\mathbf{B})(\mathbf{A}-\mathbf{B})$
    figures: []
  - label: C
    text: |-
      $(\mathbf{B}+\mathbf{A})(\mathbf{B}-\mathbf{A})$
    figures: []
  - label: D
    text: |-
      $(\mathbf{B}-\mathbf{A})(\mathbf{B}+\mathbf{A})$
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\cdots,\boldsymbol{\alpha}_r$ 是 $n\times r$ 矩阵 $\mathbf{A}$ 的列向量组，$\boldsymbol{\beta}_1,\boldsymbol{\beta}_2,\cdots,\boldsymbol{\beta}_s$ 是 $s$ 个 $n$ 维列向量。若线性方程组 $\mathbf{A}\mathbf{x}=\boldsymbol{\beta}_i$，$i=1,2,\cdots,s$ 均有解，则下列成立的是\ExamSelection（公众号：风中羽小易）。
  choices:
  - label: A
    text: |-
      若向量组 $\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\cdots,\boldsymbol{\alpha}_r$ 线性无关，则 $r\geq s$
    figures: []
  - label: B
    text: |-
      若向量组 $\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\cdots,\boldsymbol{\alpha}_r$ 线性相关，则 $r<s$
    figures: []
  - label: C
    text: |-
      若向量组 $\boldsymbol{\beta}_1,\boldsymbol{\beta}_2,\cdots,\boldsymbol{\beta}_s$ 线性无关，则 $r\geq s$
    figures: []
  - label: D
    text: |-
      若向量组 $\boldsymbol{\beta}_1,\boldsymbol{\beta}_2,\cdots,\boldsymbol{\beta}_s$ 线性相关，则 $r<s$
    figures: []
