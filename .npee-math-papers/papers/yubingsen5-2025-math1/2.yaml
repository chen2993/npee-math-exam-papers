  stem:
    text: |-
      设 $F(x)=\int_0^x\dfrac{t-\arctan t}{t}\,\mathrm{d}t$，$G(x)=\int_0^x\dfrac{\arcsin t-t}{t}\,\mathrm{d}t$，试求：
  subparts:
