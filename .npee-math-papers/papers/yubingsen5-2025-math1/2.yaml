      计算 $I=\int_0^{1/2}\mathrm{d}y\int_y^{1/2}\dfrac{\ln(1+x)}{x}\,\mathrm{d}x$；
  - text: |-
      求 $\dfrac{\ln(1+x)}{x}$ 关于 $x$ 的幂级数展开式，并利用（1）求 $\sum_{n=1}^{\infty}(-1)^{n-1}\dfrac{1}{n(n+1)2^n}$ 的和。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $0<x<y<\dfrac{\pi}{2}$，证明 $(y-x)(\cot y+\cot x)>2(\ln\sin y-\ln\sin x)$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设实矩阵 $\mathbf{A}=\begin{pmatrix}0&-1&4\\-1&3&a\\4&a&b\end{pmatrix}$，已知二次型 $\mathbf{x}^{\mathrm{T}}\mathbf{A}\mathbf{x}$ 可以经过正交变换 $\mathbf{x}=\mathbf{Q}\mathbf{y}$ 化为标准形，且 $\mathbf{Q}$ 的第一列为 $\dfrac{1}{\sqrt{6}}(1,2,1)^{\mathrm{T}}$，求：
  subparts:
  - text: 常数 $a,b$ 的值；
  - text: |-
      一个正交矩阵 $\mathbf{Q}$，使得 $\mathbf{Q}^{-1}\mathbf{A}\mathbf{Q}$ 为对角矩阵；
  - text: |-
      判断二次型 $\mathbf{x}^{\mathrm{T}}(\mathbf{A}+4\mathbf{E})\mathbf{x}$ 是否为正定二次型，并说明理由。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设总体 $X$ 的密度函数为 $f(x)=\begin{cases}ax,&0\leq x<2,\\\dfrac{b}{x},&2\leq x\leq4,\\0,&\text{其他},\end{cases}$，其中正数 $a,b$ 均未知，样本观察值为 $\dfrac{3}{2},\dfrac{12}{5},\dfrac{1}{3},\dfrac{4}{5},\dfrac{8}{3},\dfrac{5}{2},\dfrac{3}{4},\dfrac{5}{4}$。
  subparts:
  - text: |-
      分别求 $a,b$ 的最大似然估计值 $\widehat{a},\widehat{b}$；
  - text: |-
      令 $Y=\begin{cases}2X+1,&X\leq1,\\4-X,&1<X<3,\\2X-5,&X\geq3,\end{cases}$，求 $p=P\left\{Y\geq\dfrac{1}{4}X^2+1\right\}$ 的最大似然估计值 $\widehat{p}$。
