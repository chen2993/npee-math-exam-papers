  - text: |-
      $\lim_{x\to0}\dfrac{G(x)}{x^3}$；
  - text: |-
      $\lim_{x\to0}\dfrac{F[G(x)]}{G[F(x)]}$。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 在 $(-\infty,+\infty)$ 内有连续的导函数，求第二型曲线积分 $\int_L\dfrac{y}{x^2}[x^2f(xy)-1]\,\mathrm{d}x+\left[\dfrac{1}{x}+xf(xy)\right]\,\mathrm{d}y$，其中 $L$ 是从点 $A\left(\dfrac{2}{3},3\right)$ 到 $B(2,1)$ 的直线段。
- number: 19
  section: solution
