- number: 9
  section: choice
  points: 5
  stem:
    text: |-
      设随机变量 $X\sim N(-1,1)$，其分布函数为 $F(x)$，$\Phi(x)$ 为标准正态分布的分布函数，则下列不正确的选项是\ExamSelection。
