- number: 10
  section: choice
  points: 5
  stem:
    text: |-
      设 $X_1,X_2,\cdots,X_n$ 是来自总体 $X\sim N(\mu,\sigma^2)$ 的简单随机样本，$\overline{X}=\dfrac{1}{n}\sum_{i=1}^nX_i$，$S^2=\dfrac{1}{n-1}\sum_{i=1}^n(X_i-\overline{X})^2$，$S=\sqrt{\dfrac{1}{n-1}\sum_{i=1}^n(X_i-\overline{X})^2}$，则\ExamSelection。
  choices:
  - label: A
    text: |-
      $\overline{X}$ 是 $\mu$ 的无偏估计，$S^2$ 不是 $\sigma^2$ 的无偏估计
    figures: []
  - label: B
    text: |-
      $\overline{X}$ 是 $\mu$ 的无偏估计，$S^2$ 不是 $\sigma^2$ 的一致估计
    figures: []
  - label: C
    text: |-
      $\overline{X}$ 是 $\mu$ 的一致估计，$S$ 是 $\sigma$ 的无偏估计
    figures: []
  - label: D
    text: |-
      $\overline{X}$ 是 $\mu$ 的一致估计，$S$ 是 $\sigma$ 的一致估计
    figures: []
