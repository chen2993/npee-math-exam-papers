  stem:
    text: |-
      设 $\mathbf{E}$ 为三阶单位矩阵，$\mathbf{A}=(a_{ij})$ 为三阶非零方阵，$A_{ij}$ 是 $|\mathbf{A}|$ 中元素 $a_{ij}$ 的代数余子式。若 $A_{ij}=-a_{ij}$，$i,j=1,2,3$，则\ExamSelection。
