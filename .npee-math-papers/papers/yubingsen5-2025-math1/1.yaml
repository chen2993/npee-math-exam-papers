- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      已知函数 $f(x)$ 在 $x=1$ 的某邻域内三阶可导，且 $\lim_{x\to1}\dfrac{f(x)-2}{(x-1)^2\ln x}=\dfrac{1}{3}$，则\ExamSelection。
  choices:
  - label: A
    text: $x=1$ 为函数 $f(x)$ 的极大值点
    figures: []
  - label: B
    text: 点 $(1,2)$ 为曲线 $y=f(x)$ 的拐点
    figures: []
  - label: C
    text: $x=1$ 为函数 $f(x)$ 的极小值点
    figures: []
  - label: D
    text: 点 $(1,2)$ 不为曲线 $y=f(x)$ 的拐点
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 是以 $T$ 为周期的连续函数，则下列函数中也是以 $T$ 为周期的函数是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\int_0^x f(t)\,\mathrm{d}t$
    figures: []
  - label: B
    text: |-
      $\int_0^x f(-t)\,\mathrm{d}t$
    figures: []
  - label: C
    text: |-
      $\int_0^x[f(t)-f(-t)]\,\mathrm{d}t$
    figures: []
  - label: D
    text: |-
      $\int_0^x[f(t)+f(-t)]\,\mathrm{d}t$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      已知函数 $f(x,y)=\begin{cases}\dfrac{x^2y}{x^2+y^2},&(x,y)\ne(0,0),\\0,&(x,y)=(0,0),\end{cases}$，则以下四个命题：\textcircled{1} $f(x,y)$ 在点 $(0,0)$ 处连续；\textcircled{2} $f(x,y)$ 在点 $(0,0)$ 处偏导数存在；\textcircled{3} $f(x,y)$ 在点 $(0,0)$ 处沿任意方向的方向导数存在；\textcircled{4} $f(x,y)$ 在点 $(0,0)$ 处不可微。以上正确的个数为\ExamSelection。
  choices:
  - label: A
    text: $1$
    figures: []
  - label: B
    text: $2$
    figures: []
  - label: C
    text: $3$
    figures: []
  - label: D
    text: $4$
    figures: []
