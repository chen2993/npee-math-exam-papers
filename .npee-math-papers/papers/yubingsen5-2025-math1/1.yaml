      设向量 $\boldsymbol{\alpha}=(a,0,a)^{\mathrm{T}}$，$\mathbf{A}=\mathbf{E}-\boldsymbol{\alpha}\boldsymbol{\alpha}^{\mathrm{T}}$，若 $\operatorname{tr}(\mathbf{A})=1$，则 $\mathbf{A}^{-1}=$\ExamSelection。
