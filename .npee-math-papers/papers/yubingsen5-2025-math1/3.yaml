    text: $f(x)$ 与 $g(x)$ 是等价无穷小
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      当 $x>0$ 时，$f(x)=\lim_{n\to\infty}\dfrac{(x-1)^{n+3}+x^2+|x-1|+2}{2+(x-1)^n}$，则 $f(x)\ExamSelection$。
