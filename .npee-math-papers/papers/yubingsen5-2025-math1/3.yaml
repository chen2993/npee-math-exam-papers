    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设区域 $D$ 由 $x+y=\dfrac{1}{2}$，$x+y=\sqrt{\dfrac{\pi}{2}}$ 及两坐标轴围成，记 $I_1=\iint_D\ln[1+(x+y)^2]\,\mathrm{d}x\mathrm{d}y$，$I_2=\dfrac{\pi}{2}\iint_D\sin(x+y)^2\,\mathrm{d}x\mathrm{d}y$，$I_3=\iint_D(x+y)^2\,\mathrm{d}x\mathrm{d}y$，则 $\ExamSelection$。
  choices:
  - label: A
    text: $I_2<I_3<I_1$
    figures: []
  - label: B
    text: $I_1<I_3<I_2$
    figures: []
  - label: C
    text: $I_3<I_1<I_2$
    figures: []
  - label: D
    text: $I_3<I_2<I_1$
    figures: []
