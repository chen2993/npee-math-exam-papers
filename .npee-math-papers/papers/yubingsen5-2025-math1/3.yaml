  stem:
    text: |-
      设 $\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\boldsymbol{\alpha}_3,\boldsymbol{\alpha}_4$ 是四阶方阵 $A$ 的列向量组，其中 $\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\boldsymbol{\alpha}_3$ 线性无关，$A^*$ 是 $A$ 的伴随矩阵，且 $A^*\boldsymbol{\alpha}_4=0$。若存在一个四维列向量 $\boldsymbol{\beta}$，使得 $A^*\boldsymbol{\beta}\ne0$，则 $\ExamSelection$。
