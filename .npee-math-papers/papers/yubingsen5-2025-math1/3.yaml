    text: |-
      设 $f(x)=\int_1^x\mathrm{e}^{t^2}\,\mathrm{d}t$，$x=g(y)$ 是函数 $y=f(x)$ 的反函数，则 $g''(0)=\ExamBlank$。
- number: 13
  section: fill
  points: 5
  stem:
    text: |-
      微分方程 $y''' + y'' + y'-3y=0$ 满足 $\lim_{x\to-\infty}\mathrm{e}^{-x}y=1$ 的特解为 $\ExamBlank$。
- number: 14
  section: fill
  points: 5
  stem:
    text: |-
      设函数 $F(u,v)$ 具有一阶连续偏导数，且 $F'_1+F'_2\ne0$。函数 $z=z(x,y)$ 由方程 $F(z+x,z-y)=0$ 确定，$L$ 为单位圆周 $x^2+y^2=1$，取逆时针方向，则 $I=\oint_L(z-3y)\,\mathrm{d}x+(z+x^2)\,\mathrm{d}y=\ExamBlank$。
