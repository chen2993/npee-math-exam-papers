- number: 9
  section: choice
  points: 5
  stem:
    text: |-
      设有 $A$ 和 $B$ 两类电子产品，$A$ 类产品的寿命服从 $E(1)$ 分布，$B$ 类产品的寿命服从 $E(2)$ 分布。现甲盒中有 $2$ 个 $A$ 类产品和 $4$ 个 $B$ 类产品，乙盒中有 $A$ 类和 $B$ 类电子产品各 $3$ 个，从甲盒中任取一个产品放入乙盒，再从乙盒中任取一个电子产品。以 $X$ 表示从乙盒中所取出电子产品的寿命，则当 $x\geq0$ 时，$X$ 的概率密度 $f(x)=\ExamSelection$。
  choices:
  - label: A
    text: |-
      $\dfrac{10}{21}\mathrm{e}^{-x}+\dfrac{22}{21}\mathrm{e}^{-2x}$
    figures: []
  - label: B
    text: |-
      $\dfrac{20}{21}\mathrm{e}^{-x}+\dfrac{22}{21}\mathrm{e}^{-2x}$
    figures: []
  - label: C
    text: |-
      $\dfrac{1}{3}\mathrm{e}^{-x}+\dfrac{2}{3}\mathrm{e}^{-2x}$
    figures: []
  - label: D
    text: |-
      $\dfrac{2}{3}\mathrm{e}^{-x}+\dfrac{1}{3}\mathrm{e}^{-2x}$
    figures: []
