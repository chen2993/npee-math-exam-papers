- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      已知函数 $y=f(x)$ 在区间 $[-1,1]$ 上有定义。对于区间 $(-1,1)$ 内任一点 $x$，当自变量 $x$ 取得增量 $\Delta x$（$x+\Delta x\in(-1,1)$）时，函数增量 $f(x+\Delta x)-f(x)=2(x-1)\Delta x+\alpha$，且 $\lim_{\Delta x\to0}\dfrac{\alpha}{\Delta x}=0$，极限 $\lim_{x\to0}\dfrac{f(x)-1}{x}$ 存在，则曲线 $y=f(x)$ 在点 $x=0$ 处的法线方程为\ExamSelection。
  choices:
  - label: A
    text: $y=-2x+1$
    figures: []
  - label: B
    text: $y=2x+1$
    figures: []
  - label: C
    text: |-
      $y=-\dfrac{1}{2}x+1$
    figures: []
  - label: D
    text: |-
      $y=\dfrac{1}{2}x+1$
    figures: []
