- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      函数 $f(x,y)=\sqrt{x^2+\lambda y^2}$ 在点 $O(0,0)$ 处沿着从 $O$ 到点 $P(1,1)$ 的方向的方向导数为 $1$。$\Sigma$ 为空间曲线 $\begin{cases}z=f(x,y),\\y=1\end{cases}$ 在 $xOz$ 面的投影曲线绕 $z$ 轴旋转一周所得曲面，求函数 $F(x,y,z)=x^2+y^2+\dfrac{1}{\lambda+2}z^3$ 在曲面 $\Sigma$ 上位于 $x^2+y^2\leq 1$ 部分沿 $l=\{\lambda,\lambda,2\}$ 方向的方向导数的最大值。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $x>0,0<\alpha<1,0<\beta<1$，证明：
  subparts:
  - text: |-
      函数 $f(x)=\dfrac{\ln(1+\alpha x)}{\ln(1+x)}$ 单调递增；
  - text: |-
      $(1+\alpha x)(1+\beta x)\geq (1+x)^{\alpha+\beta}$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $3$ 阶矩阵 $A=\alpha\alpha^{\mathrm{T}}+\beta\beta^{\mathrm{T}}$，其中 $\alpha,\beta$ 为正交的单位列向量，$A^*$ 为 $A$ 的伴随矩阵。
  subparts:
  - text: 证明矩阵 $A+A^*$ 既是正交矩阵又是正定矩阵；
  - text: |-
      求正交变换 $x=Qy$，将二次型 $f(x_1,x_2,x_3)=x^{\mathrm{T}}A^*x$ 化为标准形，并说明 $f=1$ 表示的空间图形；
  - text: |-
      二次型 $f(x_1,x_2,x_3)=x^{\mathrm{T}}A^*x$，求 $f=0$ 的解。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设二维随机变量 $(X,Y)$ 的概率密度为 $f(x,y)=\begin{cases}\dfrac{2}{\theta^2}e^{-\dfrac{x+y}{\theta}},&0<x<y,\\0,&\text{其他},\end{cases}$ 其中 $\theta>0$，记 $Z=Y-X$。
  subparts:
  - text: |-
      求概率 $P(Z<1\mid Y>1)$；
  - text: 求 $Z$ 的概率密度 $f_Z(z)$；
  - text: |-
      若 $\theta$ 未知，设 $Z_1,Z_2,\cdots,Z_n$ 为来自总体 $Z$ 的简单随机样本，求 $\theta$ 的最大似然估计量 $\hat{\theta}$。
