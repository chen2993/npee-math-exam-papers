    text: |-
      以下 $4$ 个结论：\n① 设 $0<P(A)<1,P(B\mid A)+P(\overline{B}\mid\overline{A})=1$，则 $\overline{A}$ 与 $\overline{B}$ 相互独立；\n② 设 $A,B$ 相互独立，$P(C)=0$，则 $\overline{A},\overline{B},\overline{C}$ 必相互独立；\n③ 若 $A,B$ 互不相容，$P(C)>0$，则 $P(\overline{AB}\mid C)=1$；\n④ 若 $A,B,C$ 相互独立，则必有 $A$ 和 $B-C$ 独立。\n正确的个数为\ExamSelection。
