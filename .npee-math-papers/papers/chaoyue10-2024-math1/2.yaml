- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      关于数列 $\{x_n\},\{y_n\}$ 有以下论断：\n① 若数列 $\{x_{2n}\}$ 和 $\{x_{2n-1}\}$ 都收敛，则数列 $\{x_n\}$ 收敛；\n② 若数列 $\{x_n+y_n\}$ 和 $\{x_n-y_n\}$ 都收敛，则数列 $\{x_n\},\{y_n\}$ 均收敛；\n③ 若数列 $\{x_n\}$ 和 $\{y_n\}$ 都发散，则数列 $\{x_n+y_n\}$ 可能收敛；\n④ 若数列 $\{x_ny_n\}$ 收敛，则数列 $\{x_n\}$ 和 $\{y_n\}$ 必有一个收敛。\n以上结论中正确的个数为\ExamSelection。
  choices:
  - label: A
    text: $1$
    figures: []
  - label: B
    text: $2$
    figures: []
  - label: C
    text: $3$
    figures: []
  - label: D
    text: $4$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x,y)$ 在全平面内具有连续偏导数，对任意的两点 $(x_1,y_1),(x_2,y_2)$，不等式 $|f(x_1,y_1)-f(x_2,y_2)|\leq |x_1-x_2|+|y_1-y_2|$ 成立的一个充分条件为\ExamSelection。
  choices:
  - label: A
    text: |-
      $\left|\dfrac{\partial f}{\partial x}\right|\geq 1,\left|\dfrac{\partial f}{\partial y}\right|\leq 1$
    figures: []
  - label: B
    text: |-
      $\left|\dfrac{\partial f}{\partial x}\right|\leq 1,\left|\dfrac{\partial f}{\partial y}\right|\geq 1$
    figures: []
  - label: C
    text: |-
      $\left|\dfrac{\partial f}{\partial x}\right|\geq 1,\left|\dfrac{\partial f}{\partial y}\right|\geq 1$
    figures: []
  - label: D
    text: |-
      $\left|\dfrac{\partial f}{\partial x}\right|\leq 1,\left|\dfrac{\partial f}{\partial y}\right|\leq 1$
    figures: []
