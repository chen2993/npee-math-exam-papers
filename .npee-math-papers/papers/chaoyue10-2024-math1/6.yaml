    text: |-
      设 $f(x)$ 在 $x_0$ 的某一邻域内有定义，且 $\lim_{x\to x_0}\dfrac{f(x)-f(x_0)}{(x-x_0)^2}=1$，则 $f(x)$ 在 $x_0$ 处\ExamSelection。
