- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x,y)=\begin{cases}(xy+\lambda\sqrt{x^2+y^2})\arctan\dfrac{1}{x^2+y^2},&(x,y)\ne(0,0),\\0,&(x,y)=(0,0).\end{cases}$ 下列说法中正确的有\ExamSelection{}个。① $f(x,y)$ 在点 $(0,0)$ 处的连续性与 $\lambda$ 的取值无关；② $f(x,y)$ 在点 $(0,0)$ 处的可偏导性与 $\lambda$ 的取值无关；③ $f(x,y)$ 在点 $(0,0)$ 处的可微性与 $\lambda$ 的取值有关；④ 若 $f(x,y)$ 在点 $(0,0)$ 处可偏导，则 $f(x,y)$ 在点 $(0,0)$ 处可微。
  choices:
  - label: A
    text: $1$
    figures: []
  - label: B
    text: $2$
    figures: []
  - label: C
    text: $3$
    figures: []
  - label: D
    text: $4$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)=\int_0^{\sqrt{\sin x}}\tan t\,\mathrm{d}t$，$g(x)=\int_0^{\sqrt{\tan x}}\sin t\,\mathrm{d}t$，则当 $x\to0^+$ 时\ExamSelection。
  choices:
  - label: A
    text: $f(x)$ 是 $g(x)$ 的高阶无穷小
    figures: []
  - label: B
    text: $f(x)$ 是 $g(x)$ 的低阶无穷小
    figures: []
  - label: C
    text: $f(x)$ 与 $g(x)$ 是同阶无穷小，但不是等价无穷小
    figures: []
  - label: D
    text: $f(x)$ 与 $g(x)$ 是等价无穷小
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      对于方程 $e^x+xyz+x+\cos x=2$，在点 $(0,1,0)$ 的某一邻域内，下列结论正确的是\ExamSelection。
  choices:
  - label: A
    text: 由方程可确定两个具有连续偏导数的隐函数 $x=x(y,z)$ 和 $y=y(x,z)$
    figures: []
  - label: B
    text: 由方程可确定两个具有连续偏导数的隐函数 $x=x(y,z)$ 和 $z=z(x,y)$
    figures: []
  - label: C
    text: 由方程可确定两个具有连续偏导数的隐函数 $y=y(x,z)$ 和 $z=z(x,y)$
    figures: []
  - label: D
    text: 由方程只可确定一个具有连续偏导数的隐函数 $z=z(x,y)$
    figures: []
