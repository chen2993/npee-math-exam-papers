  stem:
    text: |-
      设 $f(x)$ 在 $(0,+\infty)$ 内连续，$f(1)=1$，若对于任意的正数 $a,b$，积分 $\int_a^{ab}f(x)\,\mathrm{d}x$ 与 $a$ 无关，计算 $I=\int_0^{\dfrac{\pi}{2}}\dfrac{f(\sec^3x)}{\sin x+\cos x}\,\mathrm{d}x$。
