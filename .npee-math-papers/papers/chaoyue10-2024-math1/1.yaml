  stem:
    text: |-
      设 $k$ 为实数，则下列说法正确的是\ExamSelection。\n① 设正项级数 $\sum_{n=1}^{\infty}u_n$ 满足 $\dfrac{u_{n+1}}{u_n}<1$，则级数 $\sum_{n=1}^{\infty}u_n$ 收敛；\n② 设级数 $\sum_{n=1}^{\infty}u_n$ 满足 $\left|\dfrac{u_{n+1}}{u_n}\right|\geq 1$，则级数 $\sum_{n=1}^{\infty}u_n$ 一定发散；\n③ 若 $\lim_{n\to\infty}\dfrac{a_n}{b_n}=k$，级数 $\sum_{n=1}^{\infty}b_n$ 绝对收敛，则 $\sum_{n=1}^{\infty}a_n$ 也绝对收敛；\n④ 若级数 $\sum_{n=1}^{\infty}a_n,\sum_{n=1}^{\infty}b_n$（$b_n\ne0$）均绝对收敛，则 $\lim_{n\to\infty}\left|\dfrac{a_n}{b_n}\right|=k$。
  choices:
  - label: A
    text: ①③
    figures: []
  - label: B
    text: ②④
    figures: []
  - label: C
    text: ①④
    figures: []
  - label: D
    text: ②③
    figures: []
