- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设幂级数 $\sum_{n=0}^{\infty}a_nx^n$ 当 $|x|<\dfrac{1}{2}$ 时的和函数为 $y(x)$，数列 $\{a_n\}$ 满足条件 $a_0=a_1=1,a_{n+1}=\dfrac{1-2n}{1+n}a_n\ (n\geq1)$。
  subparts:
  - text: 证明 $y(x)$ 满足 $(1+2x)y''+y'=0$。
  - text: 求 $y(x)$ 的表达式。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      计算曲面积分 $I=\iint_{\Sigma}x^2\,\mathrm{d}y\,\mathrm{d}z+y^2\,\mathrm{d}z\,\mathrm{d}x+z^2\,\mathrm{d}x\,\mathrm{d}y$，其中 $\Sigma:(x-1)^2+(y-1)^2+\dfrac{z^2}{4}=1\ (y\geq1)$，取外侧。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 在 $[0,1]$ 上二阶可导，且 $\lim_{x\to0^+}\dfrac{f(x)-f(1)}{x}=-1$，证明存在 $\xi\in(0,1)$，使得 $f''(\xi)=2$。
- number: 21
  section: solution
