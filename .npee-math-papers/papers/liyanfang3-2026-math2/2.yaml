      设 $t \geqslant 0$ $,D_t = \{(x,y) \mid x^2 + y^2 \leqslant t^2\}$ $,f(t)$ 连续且恒大于零$, F(t) = \begin{cases} \dfrac{\iint_{D_t} f(x^2 + y^2) \,\mathrm{d}x\mathrm{d}y}{\int_{-t}^t f(r^2) \,\mathrm{d}r}, & t > 0, \\ 0, & t = 0. \end{cases}$ (1) 求 $F'_+(0)$； (2) 证明若 $\lim_{t\to+\infty} F(t)$ 存在且有限，则存在数 $A$ $,\int_0^{+\infty} f(r^2) \,\mathrm{d}r = A$； (3) 在第 (2) 问基础上，证明若 $\lim_{t\to+\infty} F'(t)$ 存在且有限，则 $ \lim_{t\to+\infty} f(t^2) \int_0^t (t - r)f(r^2) \,\mathrm{d}r = 0$。
