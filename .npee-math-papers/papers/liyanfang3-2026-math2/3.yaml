  stem:
    text: |-
      设 $a,b$ 为非零常数，函数 $f(x)$ 满足 $ \lim_{x\to 0}\left[1+\dfrac{1}{2}x^2+\dfrac{2f(x)}{x}\right]^{\dfrac{1}{x^2}}=e^2$ $, \lim_{x\to 0}\dfrac{e^{ax}-e^{\sin bx}}{f(x)}=\dfrac{16}{9}$，求 $a,b$。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设 \(a>0\)，曲线 \(L\) 的方程为 \(x=a(t-\sin t), \ y=a(1-\cos t)\ (0\le t\le2\pi)\)。记 \(L\) 与 \(x\) 轴所围区域绕直线 \(y=3a\) 旋转一周所得旋转体体积为 \(V\)，曲线 \(L\) 旋转所得侧面积为 \(S\)，若 \(V=S\)，求 \(a\)。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 \(f(x,y)=\cos(x+y)+\sin(x-y)-x+y\) ， \(D\) 是由直线 \(y=\pi-x, y=\pi+x\) 以及 \(x\) 轴围成的有界闭区域，求 \(f(x,y)\) 在 \(D\) 上的最值。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      计算二重积分 \( \iint_D\dfrac{x(\sqrt{x}+\sqrt{y})^4}{(x^2+y^2)^2}\,dx\,dy \)，其中 \(D\) 是由曲线 \(\sqrt{x}+\sqrt{y}=1\) ， \(\sqrt{x}+\sqrt{y}=2\) 以及坐标轴围成的平面有界区域。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设函数 \(f(x)\) 在 \([0,2]\) 上连续，\((0,2)\) 内二阶可导，\(f(0)=0\)。证明：(1) 存在 \(\xi_1, \xi_2\in(0,2), \xi_1\ne\xi_2\)，使 \(f(2)=2f'(\xi_1)+3[\xi_2f'(\xi_2)-f(\xi_2)]\)；(2) 若 \(f''(x)>0\)，则存在 \(\zeta\in(0,2)\)，使 \( f(2)-4f(\frac12)<3f''(\zeta)\xi_2^2 \)。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 \(A\) 为 3 阶矩阵，\(\beta\) 为 \(A\) 的属于特征值 1 的一个特征向量，\(\gamma\) 为 \(A\) 的属于特征值 2 的一个特征向量，且 \(A\) 的第一列是零列。(1) \(\alpha\) 是与 \(\beta, \gamma\) 线性无关的属于 \(A\) 的特征向量，求 \(\xi\) 与 \(\alpha, \beta, \gamma\) 满足什么线性关系时，方程组 \(Ax=\xi\) 有解？(2) 求所有可逆矩阵 \(P\)，使得 \( P^{-1}AP=\begin{pmatrix}\frac32&-\frac12&0\\-\frac12&\frac32&0\\0&0&0\end{pmatrix} \)，将 \(P\) 用 \(\alpha, \beta, \gamma\) 表示。
