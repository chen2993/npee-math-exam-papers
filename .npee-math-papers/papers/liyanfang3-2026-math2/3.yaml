    text: |-
      设函数 $f(x,y)=\cos(x+y)+\sin(x-y)-x+y$，$D$ 是由直线 $y=\pi-x,y=\pi+x$ 以及 $x$ 轴围成的有界闭区域，求 $f(x,y)$ 在区域 $D$ 上的最值。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      计算二重积分 $\iint_D\dfrac{x(\sqrt{x}+\sqrt{y})^4}{(x^2+y^2)^2}\,\mathrm{d}x\mathrm{d}y$，其中 $D$ 是由曲线 $\sqrt{x}+\sqrt{y}=1,\sqrt{x}+\sqrt{y}=2$ 以及坐标轴围成的平面有界区域。
- number: 21
  section: solution
  points: 12
  stem:
    text: 设函数 $f(x)$ 在 $[0,2]$ 上连续，$(0,2)$ 内二阶可导，$f(0)=0$。证明：
  subparts:
  - text: |-
      存在 $\xi_1,\xi_2\in(0,2),\xi_1\ne\xi_2$，使得 $f(2)=2f'(\xi_1)+3[\xi_2f'(\xi_2)-f(\xi_2)]$。
  - text: |-
      若 $f''(x)>0$，则存在 $\xi\in(0,2)$，使得 $f(2)-4f\left(\dfrac{1}{2}\right)<3f''(\xi)\xi^2$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $A$ 为 $3$ 阶矩阵，$\beta$ 为 $A$ 的属于特征值 $1$ 的一个特征向量，$\gamma$ 为 $A$ 的属于特征值 $2$ 的一个特征向量，且 $A$ 的第一列是零列。
  subparts:
  - text: |-
      $\alpha$ 是与 $\beta,\gamma$ 线性无关的属于 $A$ 的特征向量，求 $\xi$ 与 $\alpha,\beta,\gamma$ 满足什么线性关系时，方程组 $Ax=\xi$ 有解？
  - text: |-
      求所有可逆矩阵 $P$，使得 $P^{-1}AP=\begin{pmatrix}\dfrac{3}{2}&-\dfrac{1}{2}&0\\-\dfrac{1}{2}&\dfrac{3}{2}&0\\0&0&0\end{pmatrix}$，将 $P$ 用 $\alpha,\beta,\gamma$ 表示。
