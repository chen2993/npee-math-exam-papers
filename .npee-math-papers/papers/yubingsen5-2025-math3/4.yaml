- number: 10
  section: choice
  points: 5
  stem:
    text: |-
      设总体 $(X,Y)\sim N(\mu_1,\mu_2;\sigma^2,\sigma^2;0)$，$(X_1,Y_1),(X_2,Y_2),\cdots,(X_n,Y_n)$（$n>1$）是来自总体 $(X,Y)$ 的简单随机样本，记 $\overline{X}=\dfrac{1}{n}\sum_{i=1}^nX_i,\overline{Y}=\dfrac{1}{n}\sum_{i=1}^nY_i,S_1^2=\dfrac{1}{n-1}\sum_{i=1}^n(X_i-\overline{X})^2,S_2^2=\dfrac{1}{n-1}\sum_{i=1}^n(Y_i-\overline{Y})^2$，则 $\dfrac{\overline{X}-\overline{Y}-(\mu_1-\mu_2)}{\sqrt{\dfrac{S_1^2+S_2^2}{n}}}$ 服从的分布是\ExamSelection。
  choices:
  - label: A
    text: $N(0,1)$
    figures: []
  - label: B
    text: $t(2)$
    figures: []
  - label: C
    text: $t(2n-2)$
    figures: []
  - label: D
    text: $t(2n)$
    figures: []
