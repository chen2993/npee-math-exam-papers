  stem:
    text: 设 $D_1$ 是由抛物线 $y=2x^2$ 和直线 $x=a,x=2$ 及 $y=0$ 所围成的平面区域，$D_2$ 是由抛物线 $y=2x^2$ 和直线 $x=a$ 及 $y=0$ 所围成的平面区域，其中 $0<a<2$。
