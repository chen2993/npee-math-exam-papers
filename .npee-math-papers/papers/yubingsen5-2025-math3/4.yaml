  points: 5
  stem:
    text: |-
      设 $\boldsymbol{A},\boldsymbol{B}$ 为 $n$ 阶方阵，则\ExamSelection。
  choices:
  - label: A
    text: |-
      线性方程组 $\boldsymbol{Ax}=0$ 与 $\boldsymbol{Bx}=0$ 同解当且仅当 $r(\boldsymbol{A})=r(\boldsymbol{A},\boldsymbol{B})=r(\boldsymbol{B})$
    figures: []
  - label: B
    text: |-
      线性方程组 $\boldsymbol{Ax}=0$ 与 $\boldsymbol{Bx}=0$ 同解当且仅当 $r(\boldsymbol{A})=r\left(\begin{pmatrix}\boldsymbol{A}\\\boldsymbol{B}\end{pmatrix}\right)=r(\boldsymbol{B})$
    figures: []
