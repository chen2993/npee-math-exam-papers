      线性方程组 $\boldsymbol{Ax}=0$ 与 $\boldsymbol{Bx}=0$ 同解当且仅当存在 $n$ 阶可逆矩阵 $\boldsymbol{P},\boldsymbol{Q}$，使得 $\boldsymbol{PAQ}=\boldsymbol{B}$
