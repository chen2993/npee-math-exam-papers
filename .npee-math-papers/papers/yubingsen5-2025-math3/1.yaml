    figures: []
  - label: C
    text: |-
      $\begin{pmatrix}-1&0&0\\0&-1&0\\0&0&1\end{pmatrix}$
    figures: []
  - label: D
    text: |-
      $\begin{pmatrix}-1&0&0\\0&1&0\\0&0&1\end{pmatrix}$
    figures: []
- number: 8
  section: choice
  points: 5
  stem:
    text: |-
      若 $A$ 与 $B$ 为任意两个随机事件，则\ExamSelection。
