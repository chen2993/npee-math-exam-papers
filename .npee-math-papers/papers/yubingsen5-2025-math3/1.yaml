questions:
- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      已知函数 $f(x)$ 在 $x=1$ 的某邻域内三阶可导，且 $\lim_{x\to1}\dfrac{f(x)-2}{(x-1)^2\ln x}=\dfrac{1}{3}$，则\ExamSelection。
  choices:
  - label: A
    text: $x=1$ 为函数 $f(x)$ 的极大值点
    figures: []
  - label: B
    text: 点 $(1,2)$ 为曲线 $y=f(x)$ 的拐点
    figures: []
  - label: C
    text: $x=1$ 为函数 $f(x)$ 的极小值点
    figures: []
  - label: D
    text: 点 $(1,2)$ 不为曲线 $y=f(x)$ 的拐点
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 是以 $T$ 为周期的连续函数，则下列函数中也是以 $T$ 为周期的函数是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\int_0^x f(t)\,\mathrm{d}t$
    figures: []
  - label: B
    text: |-
      $\int_0^x f(-t)\,\mathrm{d}t$
    figures: []
  - label: C
    text: |-
      $\int_0^x[f(t)-f(-t)]\,\mathrm{d}t$
    figures: []
  - label: D
    text: |-
      $\int_0^x[f(t)+f(-t)]\,\mathrm{d}t$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      已知函数 $f(x,y)=\begin{cases}\dfrac{x^2y}{x^2+y^2},&(x,y)\ne(0,0),\\0,&(x,y)=(0,0),\end{cases}$，则以下四个命题：\n① $f(x,y)$ 在点 $(0,0)$ 处连续；\n② $f(x,y)$ 在点 $(0,0)$ 处偏导数存在；\n③ $f(x,y)$ 在点 $(0,0)$ 处沿任意方向的方向导数存在；\n④ $f(x,y)$ 在点 $(0,0)$ 处不可微。\n以上正确的个数为\ExamSelection。
  choices:
  - label: A
    text: $1$
    figures: []
  - label: B
    text: $2$
    figures: []
  - label: C
    text: $3$
    figures: []
  - label: D
    text: $4$
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设 $y(x)$ 是周期为 $\pi$ 的二阶可微的周期函数，则在下列方程中，$y(x)$ 不可能是其解的方程是\ExamSelection。
  choices:
  - label: A
    text: $y''+4y=0$
    figures: []
  - label: B
    text: $y''+y=0$
    figures: []
  - label: C
    text: |-
      $y''+4y=\sin2x$
    figures: []
  - label: D
    text: |-
      $y''+y=\cos2x$
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设向量 $\boldsymbol{\alpha}=(a,0,a)^{\mathrm{T}}$，$\boldsymbol{A}=\boldsymbol{E}-\boldsymbol{\alpha}\boldsymbol{\alpha}^{\mathrm{T}}$。若 $\operatorname{tr}(\boldsymbol{A})=1$，则 $\boldsymbol{A}^{-1}=$\ExamSelection。
  choices:
  - label: A
    text: |-
      $\boldsymbol{E}+\boldsymbol{\alpha}\boldsymbol{\alpha}^{\mathrm{T}}$
    figures: []
  - label: B
    text: |-
      $\boldsymbol{E}-\boldsymbol{\alpha}\boldsymbol{\alpha}^{\mathrm{T}}$
    figures: []
  - label: C
    text: |-
      $\boldsymbol{E}+2\boldsymbol{\alpha}\boldsymbol{\alpha}^{\mathrm{T}}$
    figures: []
  - label: D
    text: |-
      $\boldsymbol{E}-2\boldsymbol{\alpha}\boldsymbol{\alpha}^{\mathrm{T}}$
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $\boldsymbol{E}$ 为三阶单位矩阵，$\boldsymbol{A}=(a_{ij})$ 为三阶非零方阵，$A_{ij}$ 是 $|\boldsymbol{A}|$ 中元素 $a_{ij}$ 的代数余子式。若 $A_{ij}=-a_{ij},i,j=1,2,3$，则\ExamSelection。
  choices:
  - label: A
    text: |-
      齐次线性方程组 $(\boldsymbol{A}+\boldsymbol{E})\boldsymbol{x}=0$ 只有零解
    figures: []
  - label: B
    text: |-
      齐次线性方程组 $(\boldsymbol{A}-\boldsymbol{E})\boldsymbol{x}=0$ 只有零解
    figures: []
  - label: C
    text: |-
      齐次线性方程组 $(\boldsymbol{A}+\boldsymbol{E})\boldsymbol{x}=0$ 有非零解
    figures: []
  - label: D
    text: |-
      齐次线性方程组 $(\boldsymbol{A}-\boldsymbol{E})\boldsymbol{x}=0$ 有非零解
    figures: []
- number: 7
