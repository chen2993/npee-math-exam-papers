  - text: |-
      证明：存在 $\xi\in[0,1]$，使得 $\int_0^1f(x)\,\mathrm{d}x=f\left(\dfrac{1}{2}\right)+\dfrac{1}{24}f'''(\xi)$；
  - text: |-
      若 $|f'''(x)|\le1$，证明 $\left|f(1)-f(0)-f'\left(\dfrac{1}{2}\right)\right|\le\dfrac{1}{24}$。
- number: 21
  section: solution
