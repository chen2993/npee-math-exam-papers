  stem:
    text: |-
      计算二重积分 $I=\iint_Df(x,y)\,\mathrm{d}x\,\mathrm{d}y$，$D=\{(x,y)\mid0\le x\le2,|y|\le x\}$，其中 $f(x,y)=\min_{t\ge1}(t^4-4x^3t+y^3)$。
- number: 20
  section: solution
