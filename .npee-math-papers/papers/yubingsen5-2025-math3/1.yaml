  points: 5
  stem:
    text: |-
      设 $\boldsymbol{A}$ 为三阶实矩阵，且满足 $\boldsymbol{A}^2=\boldsymbol{E}$，$\boldsymbol{E}$ 为三阶单位矩阵。若 $|\boldsymbol{A}|<0$，且向量 $\begin{pmatrix}1\\1\\1\end{pmatrix}$ 不是 $\boldsymbol{A}$ 的特征向量，则 $\boldsymbol{A}$ 相似于\ExamSelection。
  choices:
  - label: A
