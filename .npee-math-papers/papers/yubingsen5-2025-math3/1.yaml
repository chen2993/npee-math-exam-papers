      已知实矩阵 $\boldsymbol{A}=\begin{pmatrix}3&2&-2\\-a&-1&a\\4&2&-3\end{pmatrix}$ 与对角矩阵相似，求：
  subparts:
  - text: 常数 $a$ 的值；
  - text: |-
      一个可逆矩阵 $\boldsymbol{P}$，使得 $\boldsymbol{P}^{-1}\boldsymbol{A}\boldsymbol{P}$ 为对角矩阵；
  - text: |-
      判断矩阵 $\boldsymbol{A}\boldsymbol{A}^{\mathrm{T}}$ 是否为正定矩阵，并说明理由。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设二维随机变量 $(X,Y)$ 的联合概率密度为 $f(x,y)=\begin{cases}2\lambda^2x^{\lambda-1}y^{\lambda-1},&0<x<1,0<y<x,\\0,&\text{其他},\end{cases}$，其中 $\lambda>0$ 为未知参数。
  subparts:
  - text: |-
      求条件概率密度 $f_{X\mid Y}(x\mid y)$；
  - text: |-
      设 $(X_1,Y_1),(X_2,Y_2),\cdots,(X_n,Y_n)$ 是来自总体 $(X,Y)$ 的简单随机样本，求参数 $\lambda$ 的最大似然估计量。
