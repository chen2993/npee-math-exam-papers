- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设总体 $X$ 为 $\left[\theta-\dfrac{1}{2},\theta+\dfrac{1}{2}\right]$ 上的均匀分布,其中 $\theta$ 是未知参数,$X_1,X_2,X_3$ 为来自总体 $X$ 的简单随机样本.记 $T_1=\max\{X_1,X_2,X_3\},T_2=\min\{X_1,X_2,X_3\}$.
  subparts:
  - text: 求总体 $X$ 的分布函数;
  - text: 求 $T_1$ 和 $T_2$ 的概率密度函数;
  - text: |-
      记 $\hat{\theta}=\dfrac{1}{2}(T_1+T_2)$,求常数 $a$ 使得 $E(a\hat{\theta})=\theta$.
