- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $y=f(x)$ 在闭区间 $[a,b]$ 上有定义，对于命题：\n①若 $y=f$ 在 $[a,b]$ 上无界，则 $y=f(x)$ 在 $[a,b]$ 上必不连续；\n②若 $y=f$ 在 $[a,b]$ 上可导，则导函数 $f'(x)$ 在 $[a,b]$ 上必有界；\n③若 $y=f$ 在 $[a,b]$ 上可积，则 $y=f(x)$ 在 $[a,b]$ 上必存在原函数。\n则以上三个命题中正确的个数是\ExamSelection。
  choices:
  - label: A
    text: $0$
    figures: []
  - label: B
    text: $1$
    figures: []
  - label: C
    text: $2$
    figures: []
  - label: D
    text: $3$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设 $p,q$ 为常数且 $0<p\leq q$，若反常积分 $\int_0^{+\infty}\dfrac{1}{x^p+x^q}\,\mathrm{d}x$ 收敛，则\ExamSelection。
