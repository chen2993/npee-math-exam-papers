  - label: B
    text: |-
      $(\mathbf A+\mathbf B)(\mathbf A-\mathbf B)$
    figures: []
  - label: C
    text: |-
      $(\mathbf B+\mathbf A)(\mathbf B-\mathbf A)$
    figures: []
  - label: D
    text: |-
      $(\mathbf B-\mathbf A)(\mathbf B+\mathbf A)$
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\cdots,\boldsymbol{\alpha}_r$ 是 $n\times r$ 矩阵 $\mathbf A$ 的列向量组，$\boldsymbol{\beta}_1,\boldsymbol{\beta}_2,\cdots,\boldsymbol{\beta}_s$ 是 $s$ 个 $n$ 维列向量. 若线性方程组 $\mathbf A\mathbf x=\boldsymbol{\beta}_i,\ i=1,2,\cdots,s$ 均有解，则下列成立的是\ExamSelection。
  choices:
