  stem:
    text: |-
      设实矩阵 $\mathbf A=\begin{pmatrix}0&-1&4\\-1&3&a\\4&a&b\end{pmatrix}$，已知二次型 $\mathbf x^{\mathsf T}\mathbf A\mathbf x$ 可以经过正交变换 $\mathbf x=\mathbf Q\mathbf y$ 化为标准形，且 $\mathbf Q$ 的第一列为 $\dfrac{1}{\sqrt6}(1,2,1)^{\mathsf T}$，求：
  subparts:
  - text: 常数 $a,b$ 的值；
  - text: |-
      一个正交矩阵 $\mathbf Q$，使得 $\mathbf Q^{-1}\mathbf A\mathbf Q$ 为对角矩阵；
  - text: |-
      判断二次型 $\mathbf x^{\mathsf T}(\mathbf A+4\mathbf E)\mathbf x$ 是否为正定二次型，并说明理由。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设总体 $X$ 的密度函数为 $f(x)=\begin{cases}ax,&0\leq x<2,\\\dfrac{b}{x},&2\leq x\leq4,\\0,&\text{其他},\end{cases}$，其中正数 $a,b$ 均未知，样本观察值为 $\dfrac32,\dfrac{12}{5},\dfrac13,\dfrac45,\dfrac83,\dfrac52,\dfrac34,\dfrac54$。
  subparts:
  - text: |-
      分别求 $a,b$ 的最大似然估计值 $\hat a,\hat b$；
  - text: |-
      令 $Y=\begin{cases}2X+1,&X\leq1,\\4-X,&1<X<3,\\2X-5,&X\geq3,\end{cases}$，求 $p=P\left\{Y\geq\dfrac14X^2+1\right\}$ 的最大似然估计值 $\hat p$。
