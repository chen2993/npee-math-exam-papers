  stem:
    text: |-
      设 $\mathbf A,\mathbf B$ 为 $n$ 阶方阵，$\mathbf E$ 为 $n$ 阶单位矩阵. 若 $\mathbf A$ 为可逆的对称矩阵，且 $(\mathbf A-\mathbf B)^2=\mathbf E$，则 $(\mathbf E+\mathbf A^{-1}\mathbf B^{\mathsf T})^{\mathsf T}(\mathbf E-\mathbf B\mathbf A^{-1})^{-1}=$\ExamSelection。
