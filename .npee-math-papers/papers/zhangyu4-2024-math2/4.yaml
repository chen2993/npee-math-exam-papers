- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设某产品当前的市场占有率为 $80\%$，经调研，正使用该产品的用户中有 $80\%$ 仍会继续购买，而未使用该产品的用户中有 $20\%$ 将会购买。设第 $n$ 年时，购买的用户比例为 $x_n$，不购买的用户比例为 $y_n$。
  subparts:
  - text: |-
      求 $\begin{pmatrix}x_n\\y_n\end{pmatrix}$ 的表达式；
  - text: 按此趋势，求该产品最终的市场占有率。
