      设 $f(x)$ 在 $[0,1]$ 上连续，在 $(0,1)$ 内可导，且 $f(0)=f(1)=0,M=\max_{0\leq x\leq1}|f(x)|>0$。证明：
  subparts:
  - text: |-
      在 $(0,1)$ 内存在不同的 $\xi$ 和 $\eta$，使得 $\dfrac{1}{|f'(\xi)|}+\dfrac{1}{|f'(\eta)|}=\dfrac{1}{M}$；
  - text: |-
      对(1)中的 $\xi,\eta$，有 $(|f'(\xi)|-2M)(|f'(\eta)|-2M)\leq0$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x,y)$ 一阶偏导数连续，$f(x,y)\,dx+xy\,dy$ 是某二元函数 $u(x,y)$ 的全微分，$u(0,0)=1$，且对于任意的 $t$，有 $1+\int_0^tf(x,1)\,dx=\int_1^0f(x,t)\,dx$。
  subparts:
  - text: 求 $du$；
  - text: 求 $u(x,y)$ 的极值点。
- number: 21
