- number: 20
  section: solution
  points: 12
  stem:
    text: 设函数 $f(x)$ 在区间 $[0,3]$ 上连续，证明：
  subparts:
  - text: |-
      若 $\int_0^1f(x)\,\mathrm{d}x=e^2\int_0^3f(x)\,\mathrm{d}x$，则存在 $c\in(1,3)$，使得 $\int_0^c f(x)\,\mathrm{d}x+f(c)=0$；
  - text: |-
      若 $\int_0^1f(x)\,\mathrm{d}x=\int_0^2f(x)\,\mathrm{d}x=1$，则存在两个不同的点 $\xi,\eta\in(1,3)$，使得 $e^\xi\left[\int_0^\xi f(x)\,\mathrm{d}x+f(\xi)\right]=e^{\eta-1}$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 满足 $f'(x)+f^2(x)=0,f(0)=1$，计算二重积分 $\iint_D f\left(\dfrac{x}{y}\right)e^{f\left(\dfrac{y}{x}\right)}\,\mathrm{d}\sigma$，其中平面区域 $D=\{(x,y)\mid 0\leq x\leq1-y,\ 0<y<1\}$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      已知 $3$ 维列向量 $\xi_1$ 是 $3$ 阶实对称矩阵 $A$ 的属于特征值 $1$ 的特征向量，$|A+E|=0,\ |A|=1,\ \eta$ 是 $3$ 维非零列向量，$[\xi_1,\eta]=0$。
  subparts:
  - text: |-
      证明 $\eta$ 是 $A$ 的特征向量；
  - text: |-
      记 $\alpha=\dfrac{\xi_1}{\|\xi_1\|}=\begin{pmatrix}a_1\\a_2\\a_3\end{pmatrix},\ \beta=\dfrac{\eta}{\|\eta\|}=\begin{pmatrix}b_1\\b_2\\b_3\end{pmatrix}$，证明二次型 $f(x_1,x_2,x_3)=(a_1x_1+a_2x_2+a_3x_3)^2-(b_1x_1+b_2x_2+b_3x_3)^2$ 在正交变换下的标准形为 $y_1^2-y_2^2$。
