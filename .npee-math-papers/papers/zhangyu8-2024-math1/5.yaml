  stem:
    text: |-
      设总体 $X$ 的概率密度为 $f(x)=\begin{cases}\alpha^{-\beta x}\ln\alpha,&x>0,\\0,&x\leqslant0,\end{cases}$ 其中参数 $\alpha>1,\beta>0$，$X_1,X_2,\cdots,X_n$ 为来自总体 $X$ 的简单随机样本。
