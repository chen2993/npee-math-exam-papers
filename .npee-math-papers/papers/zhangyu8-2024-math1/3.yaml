      设 $f(x)=\begin{cases}x\ln x,&x>0,\\x^2+x,&x\leqslant 0,\end{cases}$ 若 $\int_a^b f(x)\,\mathrm{d}x\,(a<b)$ 取得最小值，则 $(a,b)=\ExamSelection$
