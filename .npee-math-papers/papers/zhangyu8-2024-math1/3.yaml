- number: 19
  section: solution
  points: 12
  stem:
    text: 已知函数 $f(x)$ 满足 $f''(x)+f'(x)=0$ 及 $f''(x)+2f'(x)+f(x)=-1$，且 $f(0)=0$。
  subparts:
  - text: 求 $f(x)$ 的表达式；
  - text: |-
      设 $a>0$，级数 $\sum_{n=2}^{\infty}f(n^{-a}\ln n)$ 收敛，求 $a$ 的取值范围。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      计算曲面积分 $I=\iint_{\Sigma}(xyz+x)\,\mathrm{d}y\,\mathrm{d}z+(xyz+y)\,\mathrm{d}z\,\mathrm{d}x+(x^2+y^2+z)\,\mathrm{d}x\,\mathrm{d}y$，其中 $\Sigma$ 为柱面 $x^{\dfrac{2}{3}}+y^{\dfrac{2}{3}}=1\,(0\leqslant z\leqslant2)$ 的外侧。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      已知 3 维列向量 $\boldsymbol{\xi}$ 不是 $A^2\boldsymbol{x}=\boldsymbol{0}$ 的解，$A\boldsymbol{\xi}$ 是 $A^2\boldsymbol{x}=\boldsymbol{0}$ 的解。记 $P=(\boldsymbol{\xi},A\boldsymbol{\xi},A^2\boldsymbol{\xi})$。
  subparts:
  - text: 证明 $P$ 可逆；
  - text: $A$ 能否相似对角化？若能，求出一个与之相似的对角矩阵，若不能，请说明理由。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X$ 与 $Y$ 相互独立，$X$ 的分布列为 $\begin{pmatrix}-1&0&1\\p&p&1-2p\end{pmatrix}$，$Y$ 服从参数为 1 的指数分布，令 $Z=XY$，若 $Y$ 与 $Z$ 既不相关，也不独立，求：
  subparts:
  - text: $Z$ 的概率密度；
  - text: $p$ 的值。
