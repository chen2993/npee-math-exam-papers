      设 $\boldsymbol{\alpha}_1=(1,1,0,-2)^{\mathrm{T}},\boldsymbol{\alpha}_2=(1,k,-2,0)^{\mathrm{T}},\boldsymbol{\alpha}_3=(-1,-3,2,k+4)^{\mathrm{T}}$，则\ExamSelection
  choices:
