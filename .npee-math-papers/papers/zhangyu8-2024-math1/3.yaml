      设总体 $X\sim f(x;\theta)=\begin{cases}\dfrac{x}{\theta}\mathrm{e}^{-\dfrac{x^2}{2\theta}},&x>0,\\0,&x\leqslant0,\end{cases}$ $\theta>0$ 未知，$X_1,X_2,\cdots,X_n$ 为来自总体 $X$ 的简单随机样本，记 $\hat{\theta}_m$ 与 $\hat{\theta}_L$ 分别是 $\theta$ 的矩估计量和最大似然估计量，则\ExamSelection
