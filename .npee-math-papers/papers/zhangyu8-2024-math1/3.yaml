    figures: []
  - label: C
    text: $(0,1)$
    figures: []
  - label: D
    text: $(1,2)$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 是奇函数，若 $x=-1$ 是 $f(x)$ 在 $(-\infty,0)$ 上的唯一零点，且 $f'(-1)=1$，则 $\int_0^x f(t)\,\mathrm{d}t$ 的严格单调增区间为\ExamSelection
  choices:
  - label: A
    text: |-
      $(-\infty,0)$
    figures: []
  - label: B
    text: |-
      $(0,+\infty)$
    figures: []
  - label: C
    text: |-
      $(-\infty,-1),(0,1)$
    figures: []
  - label: D
    text: |-
      $(-1,0),(1,+\infty)$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设 $L$ 为曲线 $\left(x-\dfrac{1}{2}\right)^2+\left(y-\dfrac{1}{2}\right)^2=\dfrac{1}{2}$，取逆时针方向，$I=\oint_L4y\,\mathrm{d}x+(x+y)^2\,\mathrm{d}y$，$J=\oint_L4x\,\mathrm{d}x+(x+y)^2\,\mathrm{d}y$，$K=\oint_L4xy\,\mathrm{d}x+(x+y)^2\,\mathrm{d}y$，则 $I,J,K$ 的大小顺序为\ExamSelection
  choices:
  - label: A
    text: $I<K<J$
    figures: []
  - label: B
    text: $J<K<I$
    figures: []
  - label: C
    text: $I<J<K$
    figures: []
  - label: D
    text: $K<I<J$
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设 $a_n=\cos n\pi\cdot\ln\left(1+\dfrac{1}{\sqrt{n}}\right),n=1,2,\cdots$，则\ExamSelection
