- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设 $z=z(x,y)$ 是由方程 $F(xz-y,x-yz)=0$ 确定的隐函数，其中 $F(u,v)$ 具有连续偏导数，且满足 $xF_u\ne yF_v$。
  subparts:
  - text: |-
      求偏导数 $\dfrac{\partial z}{\partial x}$，$\dfrac{\partial z}{\partial y}$；
  - text: |-
      设 $G(x,y)=z^2+(xz+y)\dfrac{\partial z}{\partial x}+(x+yz)\dfrac{\partial z}{\partial y}$，计算二重积分 $\iint_{x^2+y^2<2}G(x,y)\,\mathrm{d}x\mathrm{d}y$。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设某种商品的需求函数是 $Q=a-bP$，其中 $Q$ 是该产品的销售量，$P$ 是该产品的价格，常数 $a>0,b>0$，且该产品的总成本函数为 $C=\dfrac{1}{3}Q^3-\dfrac{17}{2}Q^2+108Q+36$。已知当边际收益 $MR=56$ 以及需求价格弹性 $E=-\dfrac{41}{13}$ 时，出售该产品可获得最大利润，试确定常数 $a$ 和 $b$ 的值，并求利润最大时的产量。
- number: 20
  section: solution
  points: 12
  stem:
