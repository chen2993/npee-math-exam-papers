  stem:
    text: |-
      设平面区域 $D=\{(x,y)\mid 0\leq x\leq2,0\leq y\leq2\}$。
  subparts:
  - text: |-
      求 $I=\iint_D|xy-1|\,\mathrm{d}x\mathrm{d}y$；
  - text: |-
      设 $f(x,y)$ 在 $D$ 上连续，且 $\iint_Df(x,y)\,\mathrm{d}x\mathrm{d}y=0$，$\iint_Dxyf(x,y)\,\mathrm{d}x\mathrm{d}y=1$。证明：$\exists(\xi,\eta)\in D$，使 $|f(\xi,\eta)|\geq\dfrac{1}{I}$。
