  stem:
    text: |-
      进行独立重复试验，每次试验成功的概率为 $p\ (0<p<1)$，以 $X$ 表示第二次成功以前失败的次数，设 $X_1,X_2,\cdots,X_n$ 为来自总体 $X$ 的简单随机样本，试求未知参数 $p$ 的矩估计量和最大似然估计量。
