- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 在 $[0,1]$ 上连续，在 $(0,1)$ 内可导，且 $\int_0^1x[f(x)-2]\,\mathrm{d}x=0$。证明：存在 $\xi\in(0,1)$，使得 $\xi^2f'(\xi)+2\xi f(\xi)=1$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 是幂级数 $\sum_{n=0}^{\infty}a_nx^n$ 在 $(-\infty,+\infty)$ 上的和函数，数列 $\{a_n\}$ 满足：$a_0=0,a_1=1$，当 $n\geq1$ 时，$a_{n+1}=-\dfrac{2na_n+5a_{n-1}}{n(n+1)}$。
  subparts:
  - text: 求 $f(x)$ 的表达式；
  - text: |-
      求积分 $\int_0^{+\infty}e^{-x}f(x)\,\mathrm{d}x$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $A$ 是 3 阶矩阵，$\lambda_1,\lambda_2,\lambda_3$ 是 $A$ 的 3 个不同特征值，对应的特征向量分别为 $\alpha_1,\alpha_2,\alpha_3$，令 $\beta=\alpha_1+\alpha_2+\alpha_3$。
  subparts:
  - text: |-
      证明 $\beta=\alpha_1+\alpha_2+\alpha_3$ 不是 $A$ 的特征向量；
  - text: |-
      证明 $\beta,A\beta,A^2\beta$ 线性无关；
  - text: |-
      若 $A^3\beta=2A\beta$，求 $A$ 的特征值；
  - text: |-
      在（3）的基础上证明 $A\beta$ 和 $A^2\beta$ 是方程组 $(A^2-2E)x=0$ 的基础解系。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设总体 $X$ 的概率密度 $f(x;\theta)=\begin{cases}1,&\theta-\dfrac{1}{2}\leq x\leq\theta+\dfrac{1}{2},\\0,&\text{其他，}\end{cases}$，其中 $-\infty<\theta<+\infty$。$X_1,X_2,\cdots,X_n$ 为取自总体 $X$ 的简单随机样本，并记 $X_{(1)}=\min\{X_1,X_2,\cdots,X_n\},X_{(n)}=\max\{X_1,X_2,\cdots,X_n\}$。
  subparts:
  - text: |-
      求参数 $\theta$ 的矩估计量 $\hat{\theta}_M$ 和最大似然估计量 $\hat{\theta}_L$；
  - text: |-
      求 $E\left[\dfrac{X_{(1)}+X_{(n)}}{2}\right]$。
