      设 \(f(x)\) 有连续导数，\(f(x)\) 不恒为零，且 \( \int_0^1f(x)\, \mathrm dx=0 \)，记\( M=\max\limits_{x\in[0,1]}|f'(x)| \) 。 (1) 证明：对于 \(\forall x\in[0,1]\)，有 \( |f(x)|\le\frac12M \)； (2) 设 \(D=\{(x,y)\mid 0\le x\le1, \ 0\le y\le x\}\)，证明：\( \left|\iint_D f(y)\, \mathrm dx\, \mathrm dy\right|\le\frac18M \) 。
