      设 $f(x)$ 为连续函数，$\lim_{x\to0}\dfrac{xf(x)-\ln(1+x)}{x^2}=1$。当 $x\to0$ 时，$\int_0^x2tf(x-t)\,\mathrm{d}t-x^2$ 与 $ax^n$（$a\neq0$）为等价无穷小. 求 $f'(0)$，$a$ 及 $n$ 的值.
- number: 18
  section: solution
