- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $A=(\alpha_1,\alpha_2,\alpha_3)$ 为 $3$ 阶矩阵，交换 $A$ 的第 $1,2$ 行，再交换 $A$ 的第 $2,3$ 列得 $B$，其中 $B=\begin{pmatrix}0&-1&1\\1&1&1\\1&1&-1\end{pmatrix}$.
  subparts:
  - text: 求 $A$；
  - text: |-
      记 $\beta_1=\alpha_1$，$\beta_2=\alpha_2-k\beta_1$，$\beta_3=\alpha_3-l_1\beta_1-l_2\beta_2$，若 $\beta_1,\beta_2,\beta_3$ 两两正交，求 $k,l_1,l_2$；
  - text: 求正交矩阵 $Q$ 及上三角矩阵 $T$，使得 $A=QT$.
