      设 \( A=\begin{pmatrix}1&-1&0\\-1&1+a^2&a\\0&a&1\end{pmatrix}\quad(a\ne0), \qquad X=(x_1,x_2,x_3)^T \) 。\((1)\) 若对 \(\forall X\ne0\)，有 \(X^T(A-kE)X\le0\)，求 \(k\) 的最小值； \((2)\) 求可逆线性变换 \(X=CY\)，将二次型 \(f(x_1,x_2,x_3)=X^TAX\) 化为\( g(y_1,y_2,y_3)=y_1^2+y_2^2+y_3^2-2y_1y_2 \) 。
