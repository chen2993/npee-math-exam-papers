- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $A=\begin{pmatrix}1&-1&0\\-1&1+a^2&a\\0&a&1\end{pmatrix}(a\ne0)$，$X=(x_1,x_2,x_3)^{\mathrm{T}}$。
  subparts:
  - text: |-
      若对 $\forall X\ne0$，有 $X^{\mathrm{T}}(A-kE)X\leq0$，求 $k$ 的最小值；
  - text: |-
      求可逆线性变换 $X=CY$，将二次型 $f(x_1,x_2,x_3)=X^{\mathrm{T}}AX$ 化为 $g(y_1,y_2,y_3)=y_1^2+y_2^2+y_3^2-2y_1y_2$。
