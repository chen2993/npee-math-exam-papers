- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 在 $[a,b]$ 上二阶可导，$M=\max_{x\in[a,b]}\lvert f''(x)\rvert$。证明：对任意 $x\in(a,b)$，均有 $\left\lvert\dfrac{f(x)-f(a)}{x-a}-\dfrac{f(b)-f(a)}{b-a}\right\rvert\leq\dfrac{M}{2}(b-x)$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 3 阶实对称矩阵 $A$ 有二重特征值 1，且 $(A-4E)\alpha=0$，其中 $E$ 是单位矩阵，$\alpha=(1,1,1)^{\mathrm{T}}$。
  subparts:
  - text: 求实对称矩阵 $A$；
  - text: |-
      记 $X=(x_1,x_2,x_3)^{\mathrm{T}}$，利用正交变换将二次型 $f(x_1,x_2,x_3)=\begin{vmatrix}A&-X\\X^{\mathrm{T}}&0\end{vmatrix}$ 化为标准形。
