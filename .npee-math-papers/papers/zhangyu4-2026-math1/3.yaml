- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设某高校每年有 $\dfrac{1}{6}$ 的职工由行政岗转为教师岗，有 $\dfrac{1}{4}$ 的职工由教师岗转为行政岗。若该高校职工总数不变，记 $n$ 年后行政岗人数与教师岗人数占总职工人数的比例分别为 $x_n$ 与 $y_n$，$x_n+y_n=1$。
  subparts:
  - text: |-
      求关系式 $\begin{pmatrix}x_{n+1}\\y_{n+1}\end{pmatrix}=A\begin{pmatrix}x_n\\y_n\end{pmatrix}$ 中的矩阵 $A$；
  - text: |-
      设 $\begin{pmatrix}x_0\\y_0\end{pmatrix}=\begin{pmatrix}\dfrac{1}{2}\\\dfrac{1}{2}\end{pmatrix}$，求 $\begin{pmatrix}x_n\\y_n\end{pmatrix}$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $(X,Y)$ 服从区域 $D=\{(x,y)\mid 0\leq x\leq 1,\ 1-\sqrt{2x-x^2}\leq y\leq\sqrt{1-x^2}\}$ 上的均匀分布，记 $Z=\begin{cases}1,&X+Y>1,\\0,&X+Y\leq 1,\end{cases}$ $U=XZ$ 的分布函数为 $F_U(u)$。
  subparts:
  - text: 证明 $X$ 与 $Z$ 不相互独立；
  - text: |-
      计算 $F_U\left(\dfrac{1}{2}\right)$ 的值。
