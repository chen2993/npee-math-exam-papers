- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 $u=\dfrac{x}{y}$，$v=x$，$w=xz-y$，$z=z(x,y)$ 具有二阶连续偏导数。
  subparts:
  - text: |-
      将函数 $z=z(x,y)$ 的方程 $y\dfrac{\partial^2z}{\partial y^2}+x\dfrac{\partial^2z}{\partial x\partial y}+2\dfrac{\partial z}{\partial y}=\dfrac{1}{x}-\dfrac{x}{y}$ 化为 $w=w(u,v)$ 的方程；
  - text: 若 $w'_u(u,0)=1$，$w(1,v)=v^2$，求 $w=w(u,v)$ 的表达式。
