- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 在区间 $[0,+\infty)$ 上具有二阶连续导数，$f(0)=0$，$f'(x)>0$，$f''(x)>0$。
  subparts:
  - text: |-
      证明 $g(x)=\dfrac{f(x)}{x}$ 在 $(0,+\infty)$ 上单调递增；
  - text: |-
      设数列 $\{x_n\}$ 满足 $x_0>x_1>0$，$x_{n+1}=x_n-\dfrac{x_n-x_{n-1}}{f(x_n)-f(x_{n-1})}f(x_n)\,(n=1,2,\cdots)$，证明 $\lim_{n\to\infty}x_n$ 存在，并求之；
  - text: |-
      求极限 $\lim_{n\to\infty}\dfrac{x_{n+1}}{x_nx_{n-1}}$。
- number: 22
  section: solution
