  stem:
    text: 已知函数 $y=y(x)$ 满足微分方程 $xy''-(2x+1)y'+(x+1)y=x^2e^x$。
  subparts:
  - text: 利用代换 $y=e^xu(x)$ 将原方程转化为关于 $u(x)$ 的微分方程；
  - text: 求关于 $u(x)$ 的微分方程的通解。
- number: 18
