- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      计算 $\iint_D\left(\dfrac{\sin x}{1+y^2}+y\cos x\right)\,\mathrm{d}x\mathrm{d}y$,其中 $D$ 是由 $y=\tan x$, $y=-1$ 和 $x=\dfrac{\pi}{4}$ 围成.
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      已知方程 $\dfrac{\ln(x+1)}{x^2}-\dfrac{1}{x(x+1)}=k$ 在区间 $(0,1)$ 内有实根,确定常数 $k$ 的取值范围.
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 二阶可导, $y=y(x)$ 由参数方程 $\begin{cases}x=\ln t,\\y=tf(t)\end{cases}\ (t>0)$ 确定,满足 $\dfrac{\mathrm{d}^2y}{\mathrm{d}x^2}-(2e^x+3)\dfrac{\mathrm{d}y}{\mathrm{d}x}+\left[(e^x+1)^2+1\right]y=0$,且 $y(0)=2e$, $y'(0)=5e$.
  subparts:
  - text: 求 $f(t)$ 的表达式;
  - text: |-
      计算 $\int_0^1y(x)\,\mathrm{d}x$.
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      求 $f(x,y)=\dfrac{\ln(x+y)}{x^2+y^2}$ 在区域 $D=\{(x,y)\mid x\geq0,y\geq0,x+y\geq1\}$ 上的最值.
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 在 $[0,1]$ 上有 2 阶连续导数,且 $f'(0)=f'(1)=0$, $|f''(x)|\leq M$,证明:
  subparts:
  - text: |-
      $|f'(x)|\leq\dfrac{M}{2}$;
  - text: |-
      $|f(0)-f(1)|\leq\dfrac{M}{4}$.
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设矩阵 $A=\begin{pmatrix}2&-1&-1\\-1&2&1\\-1&1&2\end{pmatrix}$.
  subparts:
  - text: |-
      求正交矩阵 $Q$,使得 $Q^{\mathsf T}AQ$ 为对角矩阵;
  - text: |-
      设 $\mathbf{x}=(1,1,1)^{\mathsf T}$,求 $\lim_{n\to\infty}\dfrac{\mathbf{x}^{\mathsf T}A^{n+1}\mathbf{x}}{\mathbf{x}^{\mathsf T}A^n\mathbf{x}}$.
