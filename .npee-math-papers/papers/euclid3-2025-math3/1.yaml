- number: 8
  section: choice
  points: 5
  stem:
    text: |-
      已知二维随机变量 $(X,Y)$ 在区域 $D=\{(x,y)\mid |x|+|y|\leq3\}$ 上服从均匀分布，设 $U=\begin{cases}0,&Y-2X<0,\\1,&Y-2X\geq0,\end{cases}$，$V=\begin{cases}0,&2Y+X<0,\\1,&2Y+X\geq0,\end{cases}$，则\ExamSelection。
  choices:
  - label: A
    text: $X$ 与 $Y$ 独立，$U$ 与 $V$ 不独立
    figures: []
  - label: B
    text: $X$ 与 $Y$ 不独立，$U$ 与 $V$ 不独立
    figures: []
  - label: C
    text: $X$ 与 $Y$ 不独立，$U$ 与 $V$ 独立
    figures: []
  - label: D
    text: $X$ 与 $Y$ 独立，$U$ 与 $V$ 独立
    figures: []
- number: 9
  section: choice
  points: 5
  stem:
    text: |-
      设总体 $X$ 的概率密度函数为 $f(x)=\begin{cases}2\theta,&-1\leq x<0,\\1-2\theta,&0\leq x<1,\\0,&\text{其他},\end{cases}$，其中 $\theta(0<\theta<\dfrac{1}{2})$ 为未知参数，现从这个总体中抽取 $n$ 个样本，经统计有 $m$ 个样本在 $(-1,0)$ 之间，则 $\theta$ 的最大似然估计为\ExamSelection。
  choices:
  - label: A
    text: |-
      $\dfrac{m}{n}$
    figures: []
  - label: B
    text: |-
      $\dfrac{m}{2n}$
    figures: []
  - label: C
    text: |-
      $\dfrac{n-m}{n}$
    figures: []
  - label: D
    text: |-
      $\dfrac{n-m}{2n}$
    figures: []
- number: 10
  section: choice
  points: 5
  stem:
    text: |-
      设 $X_1\text{，}X_2\text{，}\cdots\text{，}X_n$ 为来自正态分布总体 $N(\mu,\sigma^2)(\sigma>0)$ 的简单随机样本，记 $\bar X=\dfrac{1}{n-1}\sum_{i=1}^nX_i$，$S=\sqrt{\dfrac{1}{n-1}\sum_{i=1}^n(X_i-\bar X)^2}$，则\ExamSelection。
  choices:
  - label: A
    text: |-
      $\dfrac{\sqrt{n-1}}{\sqrt n}\cdot\dfrac{X_n-\bar X}{S}\sim t(n-1)$
    figures: []
  - label: B
    text: |-
      $\dfrac{\sqrt{n-2}}{\sqrt n}\cdot\dfrac{X_n-\bar X}{S}\sim t(n-2)$
    figures: []
  - label: C
    text: |-
      $\dfrac{n}{n-1}\cdot\dfrac{(X_n-\bar X)^2}{S^2}\sim F(1,n-1)$
    figures: []
  - label: D
    text: |-
      $\dfrac{n}{n-2}\cdot\dfrac{(X_n-\bar X)^2}{S^2}\sim F(1,n-2)$
    figures: []
