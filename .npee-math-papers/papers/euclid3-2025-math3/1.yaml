- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      已知函数 $f(x,y)=\begin{cases}(1+x^2+y^2)^{\dfrac{xy}{x^2+y^2}},&(x,y)\ne(0,0),\\1,&(x,y)=(0,0),\end{cases}$，则 $f(x,y)$ 在 $(0,0)$ 处\ExamSelection。
