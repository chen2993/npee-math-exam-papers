- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)=\int_0^x\dfrac{\sin t}{\pi-t}\,\mathrm{d}t$，$\bar f$ 是 $f(x)$ 在 $[0,\pi]$ 上的平均值，则\ExamSelection。
  choices:
  - label: A
    text: |-
      $\dfrac{1}{2}f(\pi)<\bar f<f\left(\dfrac{\pi}{2}\right)$
    figures: []
  - label: B
    text: |-
      $f\left(\dfrac{\pi}{2}\right)<\bar f<\dfrac{1}{2}f(\pi)$
    figures: []
  - label: C
    text: |-
      $\bar f<f\left(\dfrac{\pi}{2}\right)<\dfrac{1}{2}f(\pi)$
    figures: []
  - label: D
    text: |-
      $\dfrac{1}{2}f(\pi)<f\left(\dfrac{\pi}{2}\right)<\bar f$
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设 $a_n\geq0$，则下列命题中正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      若 $\lim_{n\to\infty}na_n=0$，则 $\sum_{n=1}^{\infty}a_n$ 收敛
    figures: []
  - label: B
    text: |-
      若 $\sum_{n=1}^{\infty}a_n$ 收敛，则 $\lim_{n\to\infty}na_n=0$
    figures: []
  - label: C
    text: |-
      若 $\sum_{n=1}^{\infty}a_n$ 收敛，则 $\sum_{n=1}^{\infty}a_n^2$ 收敛
    figures: []
  - label: D
    text: |-
      若 $\sum_{n=1}^{\infty}a_n^2$ 收敛，则 $\sum_{n=1}^{\infty}a_n$ 收敛
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设有两个方程组 $\text{（I）}\begin{cases}x_1+x_2+2x_3+x_4=2,\\2x_1+3x_2+5x_3+4x_4=2b,\\x_2+x_4=b-4,\end{cases}$，$\text{（II）}\begin{cases}x_1+x_2-x_4=2,\\3x_1+4x_2+2x_3=2,\\5x_1+6x_2+(a+4)x_3+ax_4=6,\end{cases}$，若方程组（I）的解均是（II）的解，但（I）与（II）有不同解，则\ExamSelection。
  choices:
  - label: A
    text: |-
      $a=5\text{，}b=0$
    figures: []
  - label: B
    text: |-
      $a=5\text{，}b=4$
    figures: []
  - label: C
    text: |-
      $a=-2\text{，}b=0$
    figures: []
  - label: D
    text: |-
      $a=-2\text{，}b=4$
    figures: []
