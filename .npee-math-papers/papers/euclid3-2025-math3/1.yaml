- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)=e^{x^2}\int_x^{+\infty}e^{-t^2}\,\mathrm{d}t$。证明：
  subparts:
  - text: |-
      $f(x)$ 在 $[0,+\infty)$ 上有界；
  - text: |-
      方程 $f(x)=x$ 在 $(0,+\infty)$ 上有且仅有一个实根。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设幂级数 $\sum_{n=0}^{\infty}a_nx^n$ 在 $[0,+\infty)$ 内收敛，其和函数 $y(x)$ 满足 $y''-xy'-y=1\text{，}y(0)=0\text{，}y'(0)=1$。
  subparts:
  - text: |-
      证明：$a_{n+2}=\dfrac{1}{n+2}a_n\text{，}n=1\text{，}2\text{，}\cdots$；
  - text: |-
      求 $\sum_{n=1}^{\infty}(a_{2n}a_{2n+1})x^n$ 在 $[0,+\infty)$ 上的和函数 $S(x)$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $x_i$ 为三维列向量 $(i=1\text{，}2\text{，}\cdots)$，$A=\begin{bmatrix}2&a&0\\a^2&2&0\\0&0&a\end{bmatrix}$ 是二次型 $f_1(x_1)=x_1^{\mathsf{T}}Ax_1$ 的矩阵，且二次型 $f_n(x_n)$ 经可逆线性变换 $x_n=Ax_{n+1}$ 化为二次型 $f_{n+1}(x_{n+1})(n=1\text{，}2\text{，}\cdots)$。
  subparts:
  - text: 求 $a$ 的值；
  - text: 求 $A^n$；
  - text: |-
      若 $x=\begin{bmatrix}5\\-5\\10\end{bmatrix}$，求 $f_{2025}(x)$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X\text{，}Y$ 相互独立，且 $X$ 和 $Y$ 均服从标准正态分布。
  subparts:
  - text: 求 $Z=X^2+Y^2$ 的概率密度 $f_Z(z)$；
  - text: |-
      设 $Z_1\text{，}Z_2$ 是来自总体 $Z$ 的简单随机样本，求 $T=\max\{Z_1\text{，}Z_2\}-\min\{Z_1\text{，}Z_2\}$ 的概率密度 $f_T(t)$。
