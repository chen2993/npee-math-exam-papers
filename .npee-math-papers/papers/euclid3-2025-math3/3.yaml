    text: 已知函数 $z=z(x,y)$ 由方程 $e^{-xy^2+z}+x^2+y^2z=3$ 确定，求 $z=z(x,y)$ 的极值。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f_n(x)=\dfrac{2n}{e}\left[e^x-\left(1+\dfrac{x}{n}\right)^n\right]$。
  subparts:
  - text: |-
      证明：对任意的正整数 $n$，在区间 $[0,1]$ 内都有 $0\leq f_n(x)\leq x^2e^{x-1}$ 成立；
  - text: |-
      设数列 $\{a_n\}$ 满足 $a_1=1$，$a_{n+1}=\int_0^{a_n}f_n(x)\,\mathrm{d}x$。证明 $\lim_{n\to\infty}a_n$ 存在，并求此极限。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      已知二次型 $f(x_1,x_2,x_3)=\boldsymbol{x}^{\mathrm{T}}A\boldsymbol{x}$ 在正交变换 $\boldsymbol{x}=Q\boldsymbol{y}$ 下的标准形为 $4y_1^2+y_2^2+y_3^2$ 且 $Q$ 的第一列为 $\dfrac{1}{\sqrt{3}}(1,-1,-1)^{\mathrm{T}}$。
  subparts:
  - text: 求二次型矩阵 $A$；
  - text: |-
      若 $\boldsymbol{x}=(1,1,1)^{\mathrm{T}}$，求 $\lim_{n\to\infty}\dfrac{1}{4^n}\sum_{k=1}^n\boldsymbol{x}^{\mathrm{T}}A^k\boldsymbol{x}$ 的值。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $X$ 的密度函数 $f(x)=\dfrac{1}{2\lambda}e^{-\dfrac{|x|}{\lambda}}$（$-\infty<x<+\infty$），其中 $\lambda>0$，设 $Y=\begin{cases}1,&|X|\leq1,\\-1,&|X|>1\end{cases}$，$Z=XY$。
  subparts:
  - text: 求 $Z$ 的密度函数；
  - text: |-
      设 $Z_1\text{，}Z_2\text{，}\cdots\text{，}Z_n$ 为来自总体 $Z$ 的简单随机样本，求 $\lambda$ 的最大似然估计 $\hat{\lambda}$。
