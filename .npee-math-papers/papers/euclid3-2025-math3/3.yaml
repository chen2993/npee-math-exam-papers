  stem:
    text: 设 $f(x)$ 在 $[a,b]$ 上具有连续导数。
  subparts:
  - text: |-
      证明：存在 $\xi\in[a,b]$，使 $\int_a^bf(x)\,\mathrm{d}x=f(b)(b-a)-\dfrac{f'(\xi)}{2}(b-a)^2$；
  - text: |-
      若 $f(x)$ 在 $x=a$ 处二阶导存在且 $f'(a)=0$，$f''(a)\ne0$，求 $\lim_{b\to a^+}\dfrac{\xi-a}{b-a}$。
- number: 19
  section: solution
