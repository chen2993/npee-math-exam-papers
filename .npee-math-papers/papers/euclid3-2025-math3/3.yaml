    figures: []
  - label: D
    text: $f''(0)=2$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设奇函数 $f(x)$ 在 $(-\infty,+\infty)$ 上有连续导数，$f(1)=0$，且对任意的 $x$ 均有 $f(x+2)=f(x)-f(2)$，则下列说法错误的是\ExamSelection
  choices:
  - label: A
    text: |-
      $\int_0^x[\cos f(t)+f'(t+2)]\,\mathrm{d}t$ 是奇函数
    figures: []
  - label: B
    text: |-
      $\int_0^x[\sin f(t)+f(t+1)]\,\mathrm{d}t$ 是偶函数
    figures: []
  - label: C
    text: |-
      $\int_0^x f(t)\,\mathrm{d}t-\dfrac{x}{2}\int_0^2\cos f(t)\,\mathrm{d}t$ 是周期函数
    figures: []
  - label: D
    text: |-
      $\int_0^x f(t)\,\mathrm{d}t-\dfrac{x}{2}\int_0^2\sin f(t)\,\mathrm{d}t$ 是周期函数
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设区域 $D=\{(x,y)\mid |x|+|y|\leq1\}$，$D_1$ 是 $D$ 在第一象限的部分，$f(x,y)$ 在 $D$ 上连续，则等式 $\iint_Df(x,y)\,\mathrm{d}\sigma=4\iint_{D_1}f(x,y)\,\mathrm{d}\sigma$ 成立的充分条件是\ExamSelection
  choices:
  - label: A
    text: $f(-x,-y)=f(x,y)$
    figures: []
  - label: B
    text: $f(-x,-y)=-f(x,y)$
    figures: []
