  stem:
    text: |-
      设曲线方程为 $y=\sqrt{x}\mathrm{e}^{-\dfrac{x}{2}}$，现将另一曲线 $y=k\sqrt{x}\left(\dfrac{1}{\mathrm{e}}<k<1\right)$ 与该曲线围成的图形绕 $x$ 轴旋转一周所形成的旋转体体积记为 $V_1$，将曲线 $y=k\sqrt{x}$，$y=\sqrt{x}\mathrm{e}^{-\dfrac{x}{2}}$ 与直线 $x=2$ 围成的图形绕 $x$ 轴旋转一周所形成的旋转体体积记为 $V_2$，令 $V=V_1+V_2$，试求 $k$ 的值，使 $V$ 取得最小值。
