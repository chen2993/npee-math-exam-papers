  stem:
    text: |-
      已知二次型 $f(x_1,x_2,x_3)=\boldsymbol{x}^{\mathrm{T}}A\boldsymbol{x}$ 在正交变换 $\boldsymbol{x}=Q\boldsymbol{y}$ 下的标准形为 $4y_1^2+y_2^2+y_3^2$ 且 $Q$ 的第一列为 $\dfrac{1}{\sqrt{3}}(1,-1,-1)^{\mathrm{T}}$。
  subparts:
  - text: 求二次型矩阵 $A$；
  - text: |-
      求可逆矩阵 $P$，使得 $A=P^{\mathrm{T}}P$；
  - text: |-
      记 $g(x_1,x_2,x_3)=\boldsymbol{x}^{\mathrm{T}}A\boldsymbol{x}+2\boldsymbol{x}^{\mathrm{T}}\boldsymbol{b}$，其中 $\boldsymbol{b}=(0,0,1)^{\mathrm{T}}$，求 $g$ 的最小值，并写出一个最小值点。
