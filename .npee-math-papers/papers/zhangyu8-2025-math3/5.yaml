- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设 $\sum_{n=1}^{\infty}u_n$ 为任意项级数，记 $a_n=\dfrac{1}{2}(u_n+|u_n|),b_n=\dfrac{1}{2}(u_n-|u_n|)$，则当 $\sum_{n=1}^{\infty}u_n$ 条件收敛时，以下结论正确的个数为\ExamSelection。$(1)\ \sum_{n=1}^{\infty}a_n$ 与 $\sum_{n=1}^{\infty}b_n$ 均收敛；$(2)\ \sum_{n=1}^{\infty}(a_n-b_n)$ 发散；$(3)\ \lim_{n\to\infty}\dfrac{\sum_{k=1}^{n}a_k}{\sum_{k=1}^{n}b_k}=-1$。
  choices:
  - label: A
    text: $0$。
    figures: []
  - label: B
    text: $1$。
    figures: []
  - label: C
    text: $2$。
    figures: []
  - label: D
    text: $3$。
    figures: []
