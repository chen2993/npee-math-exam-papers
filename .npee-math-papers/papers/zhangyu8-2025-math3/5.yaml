- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      已知函数 $f(x),g(x)$ 分别满足 $f'(x)=2\sqrt{f(x)},f(0)=1$；$g'(x)=\dfrac{g(x)}{x-2}+\dfrac{x-2}{x},g(1)=0$。求曲线 $f(x)+g(y)=0$ 所围图形绕直线 $x=-1$ 旋转一周所成旋转体体积。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设级数 $\sum_{n=1}^{\infty}(-1)^{n-1}a_n$（$a_n>0$）满足 $a_{n+1}<a_n,n=1,2,\cdots$，且 $\lim_{n\to\infty}a_n=0$。
  subparts:
  - text: |-
      证明 $\sum_{n=1}^{\infty}(-1)^{n-1}a_n$ 收敛；
  - text: |-
      判别 $\sum_{n=2}^{\infty}\dfrac{(-1)^n}{\sqrt{n}+(-1)^n}$ 的敛散性，并说明理由。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设平面区域 $D=\{(x,y)\mid x^2+y^2\leq1,|y|\leq|x|\}$，计算 $I=\iint_D\dfrac{\sqrt{x^2y^2}}{\sqrt{x^2+y^2}+x^2-y^2}\,\mathrm{d}\sigma$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $\boldsymbol{\alpha}_1=\begin{pmatrix}1-a\\a\\a+1\end{pmatrix},\boldsymbol{\alpha}_2=\begin{pmatrix}1\\1\\a+1\end{pmatrix},\boldsymbol{\alpha}_3=\begin{pmatrix}1\\0\\1\end{pmatrix},\boldsymbol{\beta}=\begin{pmatrix}0\\1\\2(a-1)\end{pmatrix},\boldsymbol{\gamma}=k_1\boldsymbol{\alpha}_1+k_2\boldsymbol{\alpha}_2+k_3\boldsymbol{\alpha}_3$，若 $\boldsymbol{\beta}$ 不能由 $\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\boldsymbol{\alpha}_3$ 线性表示，且 $\boldsymbol{\beta}^{\mathrm T}\boldsymbol{\alpha}_i=\boldsymbol{\gamma}^{\mathrm T}\boldsymbol{\alpha}_i,i=1,2$，求：
  subparts:
  - text: $a$ 的值；
  - text: |-
      $\boldsymbol{\gamma}$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设两台秤的随机误差分别服从 $N(0,\sigma_1^2)$ 和 $N(0,\sigma_2^2)$，$\sigma_1,\sigma_2$ 均为大于 $0$ 的未知参数。将重量为 $1$ 的物体放于第一台秤上独立称两次，得 $X_1,X_2$；再放于第二台秤上独立称两次，得 $X_3,X_4$。
  subparts:
  - text: 求 $D(|X_1-X_2|)$；
  - text: |-
      在第一台秤上再称一次，得 $X_5$，求 $\sigma_1^2$ 的最大似然估计量 $\hat{\sigma}_1^2$，并计算 $D(\hat{\sigma}_1^2)$。
