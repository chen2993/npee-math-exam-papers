  stem:
    text: |-
      设函数 $f(x)$ 在区间 $(-1,1)$ 内有定义，且在点 $x=0$ 处连续，则以下结论：$(1)$ 当 $\lim_{x\to0}\dfrac{f(x)}{\sqrt[3]{x}}=0$ 时，$f(x)$ 在点 $x=0$ 处可导；$(2)$ 当 $\lim_{x\to0}\dfrac{f(x)}{x^2}=0$ 时，$f(x)$ 在点 $x=0$ 处可导；$(3)$ 当 $f(x)$ 在点 $x=0$ 处可导时，$\lim_{x\to0}\dfrac{f(x)}{\sqrt[3]{x}}=0$。所有正确结论的序号为\ExamSelection。
  choices:
  - label: A
    text: $(1)$
    figures: []
  - label: B
    text: $(2)$
    figures: []
  - label: C
    text: $(2)(3)$
    figures: []
  - label: D
    text: $(1)(2)$
    figures: []
