- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)$ 是 $[0,1]$ 上的连续函数，$\int_0^1f(x)\,\mathrm{d}x=0,\int_0^1xf(x)\,\mathrm{d}x=1$。记 $M=\max_{x\in[0,1]}|f(x)|$，证明：
  subparts:
  - text: |-
      $\left|\int_0^1\left(x-\dfrac{1}{2}\right)f(x)\,\mathrm{d}x\right|\leq\dfrac{M}{4}$
  - text: $M>4$
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设平面有界区域 $D$ 是由曲线 $2x^2+y^2=2\sqrt{x^2+y^2}$ 与坐标轴围成的第一象限的部分，计算 $\iint_D\dfrac{1}{\sqrt{1-x^2}}\,\mathrm{d}\sigma$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设矩阵 $A=\begin{pmatrix}a&0&-2\\1&a&-1\\-1&-1&a\end{pmatrix},B=\begin{pmatrix}a-1&1&0\\0&a-1&0\\0&0&a+2\end{pmatrix}$。
  subparts:
  - text: $A$ 能否相似对角化？说明理由；
  - text: 是否存在可逆矩阵 $P$，使得 $P^{-1}AP=B$？若存在，求出所有的 $P$，若不存在，说明理由。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设随机变量 $X$ 满足 $P\{X>x\}=\left(\dfrac{a}{x}\right)^k$，其中 $a$ 为 $x$ 的最小值，且 $a>0,k$ 为大于 $0$ 的常数。
  subparts:
  - text: 求 $X$ 的概率密度；
  - text: $X$ 的数学期望、方差是否存在？说明理由。
