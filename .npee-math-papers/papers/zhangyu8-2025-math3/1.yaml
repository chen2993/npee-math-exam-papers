      设总体 $X\sim U(a,b),a,b$ 为未知参数。$X_1,X_2,\cdots,X_n(n>1)$ 为来自总体 $X$ 的简单随机样本，$X_{(1)}=\min\{X_1,X_2,\cdots,X_n\},X_{(n)}=\max\{X_1,X_2,\cdots,X_n\},\overline{X}=\dfrac{1}{n}\sum_{i=1}^nX_i,S_1^2=\dfrac{1}{n}\sum_{i=1}^n(X_i-\overline{X})^2$，令 $L=b-a$，则 $L$ 的矩估计量与最大似然估计量分别为\ExamSelection。
