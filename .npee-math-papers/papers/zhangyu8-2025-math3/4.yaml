  stem:
    text: |-
      设 $f(x)$ 在 $(-1,1)$ 内有 $f''(x)<0$，且 $\lim_{x\to0}\dfrac{f(x)-\sin x}{x}=a\ne0$，则以下结论：$(1)\lim_{x\to0}f(x)=0$；$(2)\lim_{x\to0}f'(x)=a+1$；$(3)f(x)\leq ax$；$(4)f'(0)>a$。所有正确结论的序号为\ExamSelection。
  choices:
  - label: A
    text: $(1)(4)$
    figures: []
  - label: B
    text: $(2)(3)$
    figures: []
  - label: C
    text: $(1)(2)(4)$
    figures: []
  - label: D
    text: $(3)$
    figures: []
