  stem:
    text: |-
      设数列 $\{a_n\},\{b_n\}$ 满足 $\mathrm{e}^{a_n}-\mathrm{e}^{-a_n}=a_n(\mathrm{e}^{b_n}+\mathrm{e}^{-b_n})$，$0<a_n<1$，$0<b_n<1$，$n=1,2,\cdots$，且 $\sum_{n=1}^{\infty}b_n$ 收敛。证明：
  subparts:
  - text: |-
      $a_n>b_n$，$n=1,2,\cdots$；
  - text: |-
      $\sum_{n=1}^{\infty}(b_n-a_n)$ 收敛。
