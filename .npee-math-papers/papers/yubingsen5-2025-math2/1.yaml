questions:
- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      已知函数 $f(x)$ 在 $x=1$ 的某邻域内三阶可导，且 $\lim_{x\to1}\dfrac{f(x)-2}{(x-1)^2\ln x}=\dfrac13$，则\ExamSelection。
  choices:
  - label: A
    text: $x=1$ 为函数 $f(x)$ 的极大值点
    figures: []
  - label: B
    text: 点 $(1,2)$ 为曲线 $y=f(x)$ 的拐点
    figures: []
  - label: C
    text: $x=1$ 为函数 $f(x)$ 的极小值点
    figures: []
  - label: D
    text: 点 $(1,2)$ 不为曲线 $y=f(x)$ 的拐点
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 是以 $T$ 为周期的连续函数，则下列函数中也是以 $T$ 为周期的函数是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\displaystyle\int_0^x f(t)\,\mathrm{d}t$
    figures: []
  - label: B
    text: |-
      $\displaystyle\int_0^x f(-t)\,\mathrm{d}t$
    figures: []
  - label: C
    text: |-
      $\displaystyle\int_0^x[f(t)-f(-t)]\,\mathrm{d}t$
    figures: []
  - label: D
    text: |-
      $\displaystyle\int_0^x[f(t)+f(-t)]\,\mathrm{d}t$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      已知函数 $f(x,y)=\begin{cases}\dfrac{x^2y}{x^2+y^2},&(x,y)\ne(0,0),\\0,&(x,y)=(0,0),\end{cases}$ 则以下四个命题：\n① $f(x,y)$ 在点 $(0,0)$ 处连续；\n② $f(x,y)$ 在点 $(0,0)$ 处偏导数存在；\n③ $f(x,y)$ 在点 $(0,0)$ 处沿任意方向的方向导数存在；\n④ $f(x,y)$ 在点 $(0,0)$ 处不可微。\n以上正确的个数为\ExamSelection。
  choices:
  - label: A
    text: '1'
    figures: []
  - label: B
    text: '2'
    figures: []
  - label: C
    text: '3'
    figures: []
  - label: D
    text: '4'
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $y=f(x)$ 是由 $\begin{cases}x=2t+\ln(1+t^2),\\y=\displaystyle\int_0^t(e^{u^3}-1)\,\mathrm{d}u\end{cases}$ 确定，则当 $x\to0$ 时，$f(x)\sim$\ExamSelection。
  choices:
  - label: A
    text: |-
      $\dfrac18x^2$
    figures: []
  - label: B
    text: |-
      $\dfrac1{24}x^3$
    figures: []
  - label: C
    text: |-
      $\dfrac1{64}x^4$
    figures: []
  - label: D
    text: |-
      $\dfrac1{160}x^5$
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      积分 $\displaystyle\int_{\sin^2\alpha}^{\sin^2\alpha+2\cos^2\alpha}(x-1)e^{x(x-2)}\,\mathrm{d}x$ 的值等于\ExamSelection。
  choices:
  - label: A
    text: $0$
    figures: []
  - label: B
    text: $1$
    figures: []
  - label: C
    text: |-
      $e^{\sin^4\alpha}$
    figures: []
  - label: D
    text: |-
      $e^{\cos^4\alpha}$
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $y(x)$ 是周期为 $\pi$ 的二阶可微的周期函数，则在下列方程中，$y(x)$ 不可能是其解的方程是\ExamSelection。
  choices:
  - label: A
    text: $y''+4y=0$
    figures: []
  - label: B
    text: $y''+y=0$
    figures: []
  - label: C
    text: |-
      $y''+4y=\sin 2x$
    figures: []
  - label: D
    text: |-
      $y''+y=\cos 2x$
    figures: []
- number: 7
  section: choice
  points: 5
  stem:
    text: |-
      设 $D=\{(x,y)\mid 0\le x\le\sqrt{\dfrac{\pi}{2}},\,0\le y\le\sqrt{\dfrac{\pi}{2}}\}$，$I_1=\iint_D\sin(\max\{x^2,y^2\})\,\mathrm{d}x\mathrm{d}y$，$I_2=\iint_D\sin(\min\{x^2,y^2\})\,\mathrm{d}x\mathrm{d}y$，$I_3=\dfrac12\iint_D(\sin x^2+\sin y^2)\,\mathrm{d}x\mathrm{d}y$，则有\ExamSelection。
  choices:
  - label: A
    text: $I_1=I_2=I_3$
    figures: []
  - label: B
    text: $I_1=I_3>I_2$
    figures: []
  - label: C
    text: $I_1>I_2=I_3$
    figures: []
  - label: D
    text: $I_1>I_3>I_2$
    figures: []
- number: 8
  section: choice
  points: 5
  stem:
    text: |-
      设向量 $\boldsymbol{\alpha}=(a,0,a)^{\mathrm T}$，$A=E-\boldsymbol{\alpha}\boldsymbol{\alpha}^{\mathrm T}$。若 $\operatorname{tr}(A)=1$，则 $A^{-1}=$\ExamSelection。
  choices:
  - label: A
    text: |-
      $E+\boldsymbol{\alpha}\boldsymbol{\alpha}^{\mathrm T}$
    figures: []
  - label: B
    text: |-
      $E-\boldsymbol{\alpha}\boldsymbol{\alpha}^{\mathrm T}$
    figures: []
  - label: C
    text: |-
      $E+2\boldsymbol{\alpha}\boldsymbol{\alpha}^{\mathrm T}$
    figures: []
  - label: D
    text: |-
      $E-2\boldsymbol{\alpha}\boldsymbol{\alpha}^{\mathrm T}$
    figures: []
- number: 9
  section: choice
  points: 5
  stem:
    text: |-
      设 $E$ 为三阶单位矩阵，$A=(a_{ij})$ 为三阶非零方阵，$A_{ij}$ 是 $|A|$ 中元素 $a_{ij}$ 的代数余子式。若 $A_{ij}=-a_{ij}$，$i,j=1,2,3$，则\ExamSelection。
  choices:
  - label: A
    text: |-
      齐次线性方程组 $(A+E)\boldsymbol{x}=0$ 只有零解
    figures: []
  - label: B
    text: |-
      齐次线性方程组 $(A-E)\boldsymbol{x}=0$ 只有零解
    figures: []
  - label: C
    text: |-
      齐次线性方程组 $(A+E)\boldsymbol{x}=0$ 有非零解
    figures: []
  - label: D
    text: |-
      齐次线性方程组 $(A-E)\boldsymbol{x}=0$ 有非零解
    figures: []
