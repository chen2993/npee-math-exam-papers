  points: 12
  stem:
    text: |-
      已知实矩阵 $A=\begin{pmatrix}3&2&-2\\-a&-1&a\\4&2&-3\end{pmatrix}$ 与对角矩阵相似，求：
  subparts:
  - text: 常数 $a$ 的值；
  - text: 一个可逆矩阵 $P$，使得 $P^{-1}AP$ 为对角矩阵；
  - text: |-
      判断矩阵 $AA^{\mathrm T}$ 是否为正定矩阵，并说明理由。
