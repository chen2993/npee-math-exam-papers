- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      求极限 $\displaystyle\lim_{x\to0}\dfrac{\int_0^x\left(\int_0^{u^2}\arctan(1+t)\,\mathrm{d}t\right)\mathrm{d}u}{\sin x\int_0^1\tan(xt)^2\,\mathrm{d}t}$。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(u)$ 在 $(0,+\infty)$ 内可导，$z=xf\left(\dfrac yx\right)+y$ 满足关系式 $x\dfrac{\partial z}{\partial x}-y\dfrac{\partial z}{\partial y}=2z$，且 $f(1)=1$，求曲线 $y=f(x)$ 的渐近线。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      计算二重积分 $I=\iint_D f(x,y)\,\mathrm{d}x\mathrm{d}y$，其中 $D=\{(x,y)\mid 0\le x\le2,\,|y|\le x\}$，$f(x,y)=\min_{t\ge1}(t^4-4x^3t+y^3)$。
- number: 20
  section: solution
  points: 12
  stem:
    text: 设函数 $f(x)$ 在 $[0,1]$ 上具有三阶连续导数。
  subparts:
  - text: |-
      证明：存在 $\xi\in[0,1]$，使得 $\displaystyle\int_0^1f(x)\,\mathrm{d}x=f\left(\dfrac12\right)+\dfrac1{24}f''(\xi)$；
  - text: |-
      若 $|f'''(x)|\le1$，证明 $\displaystyle\left|f(1)-f(0)-f'\left(\dfrac12\right)\right|\le\dfrac1{24}$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)$ 是单调可导函数，$f\left(-\dfrac\pi2\right)=-f\left(\dfrac\pi2\right)$，$g(x)$ 是 $f(x)$ 的反函数，且 $f(x)$ 满足 $\displaystyle\int_{-\pi/2}^{f(x)}g(t)\,\mathrm{d}t=\int_{-\pi/2}^{x}\left(\dfrac1{1+e^{-|t|}}+\dfrac{\sin t}{1+e^{-t/2}}\right)\sin t\,\mathrm{d}t$，求积分 $\displaystyle\int_{-\pi/2}^{\pi/2}f(x)\,\mathrm{d}x$ 的值。
- number: 22
