- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设实矩阵 $A=\begin{pmatrix}0&-1&4\\-1&3&a\\4&a&b\end{pmatrix}$，已知二次型 $\boldsymbol{x}^{\mathrm T}A\boldsymbol{x}$ 可以经过正交变换 $\boldsymbol{x}=Q\boldsymbol{y}$ 化为标准形，且 $Q$ 的第一列为 $\dfrac{1}{\sqrt{6}}(1,2,1)^{\mathrm T}$，求：
  subparts:
  - text: 常数 $a,b$ 的值；
  - text: 一个正交矩阵 $Q$，使得 $Q^{-1}AQ$ 为对角矩阵；
  - text: |-
      判断二次型 $\boldsymbol{x}^{\mathrm T}(A+4E)\boldsymbol{x}$ 是否为正定二次型，并说明理由。
