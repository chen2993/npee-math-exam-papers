    text: $k=1,l=e^4$
    figures: []
  - label: B
    text: $k=1,l=2e^4$
    figures: []
  - label: C
    text: $k=4,l=e^4$
    figures: []
  - label: D
    text: $k=4,l=2e^4$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $f(x)$ 在 $x=0$ 处存在二阶导数，$f(0)=0$ 且 $\lim_{x\to 0}\dfrac{f(x)+f'(x)}{x}=2$，则\ExamSelection。
  choices:
  - label: A
    text: $f(0)$ 是 $f(x)$ 的极大值
    figures: []
  - label: B
    text: $f(0)$ 是 $f(x)$ 的极小值
    figures: []
  - label: C
    text: $(0,f(0))$ 是曲线 $y=f(x)$ 的拐点
    figures: []
  - label: D
    text: 以上都不正确
    figures: []
