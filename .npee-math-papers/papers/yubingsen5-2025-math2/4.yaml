  stem:
    text: |-
      设 $k\geq 1$ 为自然数，$l$ 为实数，若极限 $\lim_{x\to 0}\dfrac{e^4-(1+x)^{\dfrac{4}{x}}}{x^k}=l$，则\ExamSelection。
