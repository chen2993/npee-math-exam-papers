- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      设 $C$ 为某产品的成本，$Q$ 为需求量（即产量），$p$ 为单价，已知该产品的成本函数为 $C(Q)=Q^2+10Q+5$（元），需求函数为 $Q(p)=50-\dfrac{p}{2}$（件）。
  subparts:
  - text: |-
      求需求对价格的弹性 $\varepsilon_p$（$\varepsilon_p>0$）以及收益最大时的需求弹性；
  - text: 求收益最大时的产量及最大收益；
  - text: 求利润最大时的产量及最大利润。
- number: 18
