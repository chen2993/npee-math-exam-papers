- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $X_1,X_2,\cdots,X_n$ 是来自均值为 0、方差为 $\sigma^2$ 的正态分布总体 $X$ 的简单随机样本，$Y_1,Y_2,\cdots,Y_n$ 是来自均值为 0、方差为 $2\sigma^2$ 的正态分布总体 $Y$ 的简单随机样本，且两样本相互独立，其中 $\sigma$（$\sigma>0$）是未知参数。
  subparts:
  - text: |-
      利用样本 $X_1,X_2,\cdots,X_n,Y_1,Y_2,\cdots,Y_n$，求 $\sigma^2$ 的最大似然估计量 $\hat{\sigma}^2$；
  - text: |-
      求 $E\left((\hat{\sigma}^2)^2\right)$。
