- number: 1
  section: choice
  points: 5
  stem:
    text: |-
      微分方程 $y''+y=2x\cos^2 x$ 的特解可设为 $y^*=$\ExamSelection。
  choices:
  - label: A
    text: |-
      $(Ax+B)\cos^2 x$。
    figures: []
  - label: B
    text: |-
      $Ax+B+(Cx+D)\cos^2 x$。
    figures: []
  - label: C
    text: |-
      $(Ax+B)\cos 2x+(Cx+D)\sin 2x$。
    figures: []
  - label: D
    text: |-
      $Ax+B+(Cx+D)\cos 2x+(Ex+F)\sin 2x$。
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设 $n$ 为正整数，函数 $f(x)=(x-1)^{2n+1}g(x)$，其中 $g(x)$ 连续且 $g(1)\ne 0$，则下列说法中，正确的是\ExamSelection。
  choices:
  - label: A
    text: $x=1$ 是 $f(x)$ 的极小值点。
    figures: []
  - label: B
    text: $x=1$ 是 $f(x)$ 的极大值点。
    figures: []
  - label: C
    text: $x=1$ 不是 $f(x)$ 的极值点。
    figures: []
  - label: D
    text: $x=1$ 是否为 $f(x)$ 的极值点与 $g(x)$ 的表达式有关。
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $f(x)$ 在 $(0,+\infty)$ 内连续，且 $\int_1^{+\infty}f(x)\,\mathrm{d}x$ 发散，且 $\lim_{x\to+\infty}xf(x)$ 存在，定义在 $[0,+\infty)$ 上的函数 $g(x)=\begin{cases}\dfrac{f\left(\dfrac{1}{x}\right)}{x},&x>0,\\0,&x=0,\end{cases}$，则\ExamSelection。
  choices:
  - label: A
    text: $x=0$ 必是 $g(x)$ 的第一类间断点。
    figures: []
  - label: B
    text: $x=0$ 必是 $g(x)$ 的第二类间断点。
    figures: []
  - label: C
    text: $x=0$ 必是 $g(x)$ 的连续点。
    figures: []
  - label: D
    text: 由已知条件无法判定 $g(x)$ 在 $x=0$ 处的连续性。
    figures: []
- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设 $I_1=\int_0^{\dfrac{\pi}{2}}\sqrt{1+\sin^2 x}\,\mathrm{d}x$，$I_2=\int_0^{\dfrac{\pi}{2}}\sqrt{1-\sin^6 x}\,\mathrm{d}x$，则\ExamSelection。
  choices:
  - label: A
    text: $1<I_2<I_1<2$。
    figures: []
  - label: B
    text: $1<I_2<2<I_1$。
    figures: []
  - label: C
    text: $I_2<1<I_1<2$。
    figures: []
  - label: D
    text: $1<I_1<2<I_2$。
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设 $A$ 为 $m\times n$ 矩阵，$m>n$，且非齐次线性方程组 $Ax=b$ 有唯一一解 $x_0$，则\ExamSelection。
  choices:
  - label: A
    text: $x_0=A^{-1}b$。
    figures: []
  - label: B
    text: |-
      $x_0=A^{\mathrm T}b$。
    figures: []
  - label: C
    text: |-
      $A^{\mathrm T}A$ 可逆。
    figures: []
  - label: D
    text: |-
      $AA^{\mathrm T}$ 可逆。
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $\boldsymbol{\alpha}$ 为 3 维非零列向量，已知矩阵 $A=\begin{pmatrix}a&a&b\\a&b&a\\b&a&a\end{pmatrix}$（$ab\ne 0$）与 $\boldsymbol{\alpha}\boldsymbol{\alpha}^{\mathrm T}$ 合同，则下列矩阵中，与 $A$ 相似的是\ExamSelection。
  choices:
  - label: A
    text: |-
      $\begin{pmatrix}a&0&0\\0&0&0\\0&0&0\end{pmatrix}$。
    figures: []
  - label: B
    text: |-
      $\begin{pmatrix}2a&0&0\\0&0&0\\0&0&0\end{pmatrix}$。
    figures: []
  - label: C
    text: |-
      $\begin{pmatrix}3a&0&0\\0&0&0\\0&0&0\end{pmatrix}$。
    figures: []
  - label: D
    text: |-
      $\begin{pmatrix}4a&0&0\\0&0&0\\0&0&0\end{pmatrix}$。
    figures: []
- number: 7
  section: choice
  points: 5
  stem:
    text: |-
      设 3 阶矩阵 $A$ 满足 $A=A^{-1}$，则下列关于矩阵 $A$ 的说法中，正确的是\ExamSelection。
  choices:
  - label: A
    text: $A$ 必须有特征值 1。
    figures: []
  - label: B
    text: $A$ 必须有特征值 $-1$。
    figures: []
  - label: C
    text: $A$ 必相似于对角矩阵。
    figures: []
  - label: D
    text: 以上说法均不正确。
    figures: []
- number: 8
  section: choice
  points: 5
  stem:
    text: |-
      设随机变量 $X$ 与 $Y$ 相互独立，其中 $X$ 为连续型随机变量，其分布函数为 $F_X(x)$，$Y$ 为离散型随机变量，其分布函数 $F_Y(y)$ 共有 4 个间断点。记 $F_Z(z)$ 为随机变量 $Z=XY$ 的分布函数，则函数 $F_Z(z)$ 的间断点个数至多为\ExamSelection。
  choices:
  - label: A
    text: $1$。
    figures: []
  - label: B
    text: $2$。
    figures: []
  - label: C
    text: $3$。
    figures: []
  - label: D
    text: $4$。
    figures: []
- number: 9
  section: choice
  points: 5
  stem:
    text: |-
      设 $X,Y$ 为相互独立的随机变量，$0<p,q<1$，且 $p+q=1$，$P\{X=0\}=p$，$P\{X=1\}=q$，$P\{Y=0\}=q$，$P\{Y=-1\}=p$，则\ExamSelection。
  choices:
  - label: A
    text: $X+Y$ 与 $X-Y$ 的相关性与 $p,q$ 的取值有关。
    figures: []
  - label: B
    text: $X+Y$ 与 $X-Y$ 的独立性与 $p,q$ 的取值有关。
    figures: []
  - label: C
    text: $X+Y$ 与 $X-Y$ 的相关性、独立性与 $p,q$ 的取值均无关，且 $X+Y$ 与 $X-Y$ 相关，不独立。
    figures: []
  - label: D
    text: $X+Y$ 与 $X-Y$ 的相关性、独立性与 $p,q$ 的取值均无关，且 $X+Y$ 与 $X-Y$ 不相关，不独立。
    figures: []
- number: 10
  section: choice
  points: 5
  stem:
    text: |-
      设总体 $X\sim N(\mu,\sigma^2)$，$X_1,X_2,\cdots,X_n$ 是来自总体 $X$ 的简单随机样本，样本均值 $\overline{X}=\dfrac{1}{n}\sum_{i=1}^{n}X_i$，样本方差 $S^2=\dfrac{1}{n-1}\sum_{i=1}^{n}(X_i-\overline{X})^2$，则 $\dfrac{n(\overline{X}-\mu)^2}{S^2}$ 服从的分布为\ExamSelection。
  choices:
  - label: A
    text: $F(n-1,1)$。
    figures: []
  - label: B
    text: $F(1,n-1)$。
    figures: []
  - label: C
    text: $F(n,1)$。
    figures: []
  - label: D
    text: $F(1,n)$。
    figures: []
