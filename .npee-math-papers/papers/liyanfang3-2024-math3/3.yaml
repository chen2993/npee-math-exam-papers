      记幂级数 $\sum_{n=1}^{\infty}\dfrac{\left(\dfrac{1}{2}-x\right)^n}{n}$ 的和函数为 $f(x)$，则 $f(x)$ 在 $x=0$ 处的幂级数展开式为\ExamBlank（请指出该幂级数的收敛区间）。
- number: 15
