- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设数列 $\{a_n\}$ 满足 $a_0=1$，且当 $n\geq 1$ 时，$2na_n=\left(n+\dfrac{3}{2}\right)a_{n-1}$。
  subparts:
  - text: |-
      求幂级数 $\sum_{n=0}^{\infty}a_nx^n$ 的收敛半径 $R$；
  - text: |-
      求幂级数 $\sum_{n=0}^{\infty}a_nx^n$ 在 $(-R,R)$ 上的和函数。
