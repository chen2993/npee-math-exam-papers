- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设矩阵 $A=\begin{pmatrix}1&-1&0\\0&1&-1\\1&a&-1\end{pmatrix}$，且二次型 $f(x_1,x_2,x_3)=\boldsymbol{x}^{\mathrm T}A^{\mathrm T}A\boldsymbol{x}$ 不是正定二次型。
  subparts:
  - text: 求 $a$；
