  - text: |-
      求可逆线性变换 $x=Pz$，使二次型 $f(x_1,x_2,x_3,x_4)=x^{\mathrm T}A^2x$ 化为规范形 $z_1^2+z_2^2-z_3^2-z_4^2$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $(X,Y)$ 是二维随机变量，$X$ 的边缘概率密度为 $f_X(x)=\begin{cases}\dfrac{3}{2}x^2-\dfrac{3}{4}x^3,&0<x<2,\\0,&\text{其他}\end{cases}$，在给定 $X=x(0<x<2)$ 的条件下 $Y$ 的条件概率密度为 $f_{Y\mid X}(y\mid x)=\begin{cases}\dfrac{2y}{2x-x^2},&x<y<\sqrt{2x},\\0,&\text{其他}\end{cases}$。
  subparts:
  - text: 求 $(X,Y)$ 的联合概率密度 $f(x,y)$。
  - text: 求 $Y$ 的边缘概率密度 $f_Y(y)$。
  - text: |-
      求 $P\{\max\{X,Y\}\ge1\}$。
