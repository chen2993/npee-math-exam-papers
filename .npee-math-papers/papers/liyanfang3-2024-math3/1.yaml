- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设有两个数列 $\{a_n\}$，$\{b_n\}$，则下列命题中，错误的是\ExamSelection。
  choices:
  - label: A
    text: |-
      若 $\sum_{n=1}^{\infty}a_n$，$\sum_{n=1}^{\infty}b_n$ 均条件收敛，则 $\sum_{n=1}^{\infty}\min\{a_n,b_n\}$ 可能条件收敛。
    figures: []
  - label: B
    text: |-
      若 $\sum_{n=1}^{\infty}a_n$，$\sum_{n=1}^{\infty}b_n$ 均条件收敛，则 $\sum_{n=1}^{\infty}\max\{a_n,b_n\}$ 可能发散。
    figures: []
  - label: C
    text: |-
      若 $\sum_{n=1}^{\infty}a_n$，$\sum_{n=1}^{\infty}b_n$ 均绝对收敛，则 $\sum_{n=1}^{\infty}\min\{a_n,b_n\}$ 可能绝对收敛。
    figures: []
  - label: D
    text: |-
      若 $\sum_{n=1}^{\infty}a_n$，$\sum_{n=1}^{\infty}b_n$ 均绝对收敛，则 $\sum_{n=1}^{\infty}\max\{a_n,b_n\}$ 可能条件收敛。
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设 $n\ge2$，向量组 I：$\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\cdots,\boldsymbol{\alpha}_n$，向量组 II：$\boldsymbol{\beta}_1,\boldsymbol{\beta}_2,\cdots,\boldsymbol{\beta}_n$，向量组 III：$\boldsymbol{\alpha}_1+\boldsymbol{\beta}_1,\boldsymbol{\alpha}_2+2\boldsymbol{\beta}_2,\cdots,\boldsymbol{\alpha}_n+n\boldsymbol{\beta}_n$ 的秩分别为 $r_1,r_2,r_3$，其中 $r_1=r_2=r$，则\ExamSelection。
  choices:
  - label: A
    text: |-
      $r_3\ge r$。
    figures: []
  - label: B
    text: |-
      $r_3\le 2r$。
    figures: []
  - label: C
    text: 向量组 I 和 II 等价。
    figures: []
  - label: D
    text: |-
      向量组 $\boldsymbol{\alpha}_1,\boldsymbol{\alpha}_2,\cdots,\boldsymbol{\alpha}_n,\boldsymbol{\beta}_1,\boldsymbol{\beta}_2,\cdots,\boldsymbol{\beta}_n$ 与向量组 III 等价。
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设 $A,B$ 为 $n$ 阶矩阵，$E$ 为 $n$ 阶单位矩阵，则下列说法中，正确的是\ExamSelection。
  choices:
  - label: A
    text: |-
      若 $Ax=0$ 与 $Bx=0$ 只有零解，则 $\begin{pmatrix}A&B\\B&A\end{pmatrix}y=0$ 只有零解。
    figures: []
  - label: B
    text: |-
      若 $Ax=0$ 与 $Bx=0$ 没有非零公共解，则 $\begin{pmatrix}A&B\\B&A\end{pmatrix}y=0$ 只有零解。
    figures: []
  - label: C
    text: |-
      若 $Ax=0$ 与 $Bx=0$ 同解，则 $\begin{pmatrix}A^{\mathrm T}A&O\\E&B\end{pmatrix}y=0$ 只有零解。
    figures: []
  - label: D
    text: |-
      若 $Ax=0$ 与 $Bx=0$ 同解，则 $\begin{pmatrix}A^{\mathrm T}A&A^{\mathrm T}B\\O&B\end{pmatrix}y=0$ 与 $\begin{pmatrix}B^{\mathrm T}B&B^{\mathrm T}A\\O&A\end{pmatrix}y=0$ 同解。
    figures: []
- number: 7
