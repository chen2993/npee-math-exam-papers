      解答应写出文字说明、证明过程或演算步骤。设函数 $f(x)=\dfrac{x}{1+2x}$，$x\in[0,1]$。定义函数列：$f_1(x)=f(x)$，$f_2(x)=f(f_1(x))$，$\cdots$，$f_n(x)=f(f_{n-1}(x))$，$\cdots$。记 $S_n$ 是由曲线 $y=f_n(x)$、直线 $x=1$ 及 $x$ 轴所围平面图形的面积。
