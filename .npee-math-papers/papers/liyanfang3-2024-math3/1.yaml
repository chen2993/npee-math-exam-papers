- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设矩阵 $A=\begin{pmatrix}0&1&0&0\\-4&0&0&0\\0&0&1&a\\0&0&a&-2\end{pmatrix}$，其中 $a>0$。
  subparts:
