- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      解答应写出文字说明、证明过程或演算步骤。设 $\lim_{x\to 0}\dfrac{a x-\dfrac{\tan x}{\cos bx}}{a\tan x-\dfrac{x}{1+b x^2}}=-1$，其中 $a,b$ 为参数，且 $b\ne 0$，求 $a,b$。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x)=\begin{cases}x,&-1\leq x\leq 1,\\0,&\text{其他},\end{cases}$，而 $D$ 表示全平面，计算二重积分 $I=\iint_D f(x)f(\sqrt{y}-x)\,\mathrm{d}x\,\mathrm{d}y$。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      已知函数 $f(u,v)$ 可微，$g(x,y)=f(x+y,x-y)$，$\dfrac{\partial g(x,y)}{\partial x}=2x^2+2y^2-8x$，$\dfrac{\partial g(x,y)}{\partial y}=4xy$，且 $f(0,0)=1$。
  subparts:
  - text: 求 $f(u,v)$；
  - text: 求 $f(u,v)$ 的极值。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(s,x)=\int_x^s\dfrac{t^n}{1+t^n}\,\mathrm{d}t$，函数 $F_n(x)=\int_0^x\dfrac{s^{n-2}}{n-2}f(s,x)\,\mathrm{d}s$（$x\geq 0,n\geq 3$）。当 $x\to 0^+$ 时，$k_n$ 满足 $x^{k_n}$ 是 $F_n(x)$ 的同阶无穷小，记 $a_n=\lim_{x\to 0^+}\dfrac{F_n(x)}{x^{k_n}}$。
  subparts:
  - text: |-
      证明：$a_n=-\dfrac{1}{4}\left[\dfrac{1}{(n-2)(n-1)}-\dfrac{1}{(n-1)n}\right]$；
  - text: |-
      求 $\displaystyle\sum_{n=3}^{\infty}a_n$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 3 阶实对称矩阵 $A$ 只有两个不同的特征值，$|A|=-4$，$\operatorname{tr}(A)>0$，向量 $(2,0,1)^{\mathrm T}$ 为方程组 $(A^2-E)x=0$ 的一个解，其中 $E$ 为 3 阶单位矩阵。
  subparts:
  - text: 求 $A$ 的全部特征值；
  - text: |-
      求 $A^n\begin{pmatrix}-3\\1\\1\end{pmatrix}$。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设 $0<\theta<1$，随机变量 $X$ 服从 $[0,\theta]$ 上的均匀分布，随机变量 $Y$ 服从 $[\theta,1]$ 上的均匀分布，$X$ 与 $Y$ 相互独立。令 $Z=Y-X$。
  subparts:
  - text: |-
      若当 $\theta=\theta_0$ 时，$D(Z)$ 最小，求 $\theta_0$，并求此时 $Z$ 的概率密度；
  - text: |-
      在第（I）问的基础上，求 $\operatorname{Cov}(Z,Z^2)$。
