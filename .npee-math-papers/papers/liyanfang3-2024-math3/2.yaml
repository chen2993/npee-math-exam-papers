  stem:
    text: |-
      下列每题给出的四个选项中，只有一个选项是最符合题目要求的。设当 $\Delta x\to 0$ 时，$\alpha$ 是 $\Delta x$ 的高阶无穷小，正值函数 $y(x)$ 在 $[1,+\infty)$ 上有定义，且在任意点 $x$ 处的增量 $\Delta y=\dfrac{x^2+y^2}{xy}\Delta x+\alpha$，$y(1)=1$，则 $y(e)=$\ExamSelection。
  choices:
  - label: A
    text: $1$
    figures: []
  - label: B
    text: $e$
    figures: []
  - label: C
    text: |-
      $\sqrt{2}e$
    figures: []
  - label: D
    text: |-
      $\sqrt{3}e$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      幂级数 $\sum_{n=1}^{\infty}\left[\ln\left(1+\dfrac{1}{n}\right)\right]^{n^2}x^n$ 的收敛区间为 $\ExamSelection$。
