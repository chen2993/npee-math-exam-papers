- number: 4
  section: choice
  points: 5
  stem:
    text: |-
      设数列 $\{x_n\}$ 和 $\{y_n\}$ 满足 $\begin{cases}x_1=1,\\y_1=0\end{cases}$ 和 $\begin{cases}x_{n+1}=\dfrac{1}{2}x_n+ay_n,\\y_{n+1}=ax_n-\dfrac{1}{2}y_n\end{cases}$，则下列 $a$ 的取值中，能使得 $\lim_{n\to\infty}(|x_n|+|y_n|)=0$ 的个数为 $\ExamSelection$。① $-1$；② $-\dfrac{1}{2}$；③ $\dfrac{2}{3}$；④ $1$。
  choices:
  - label: A
    text: $1$
    figures: []
  - label: B
    text: $2$
    figures: []
  - label: C
    text: $3$
    figures: []
  - label: D
    text: $4$
    figures: []
- number: 5
  section: choice
  points: 5
  stem:
    text: |-
      设 $n\geq 3$，且为奇数，$n$ 阶非零矩阵 $A$ 满足 $A=A^*$，则下列说法中，正确的是 $\ExamSelection$。
  choices:
  - label: A
    text: $A=A^{-1}$
    figures: []
  - label: B
    text: $A=A^2$
    figures: []
  - label: C
    text: |-
      $A^{\mathrm T}=A^*$
    figures: []
  - label: D
    text: $|A|=-1$
    figures: []
- number: 6
  section: choice
  points: 5
  stem:
    text: |-
      设矩阵 $A=\begin{pmatrix}2&0&a\\0&1&0\\b&a&0\end{pmatrix}$ 只有一个线性无关的特征向量 $\begin{pmatrix}b\\0\\a\end{pmatrix}$，则 $\ExamSelection$。
  choices:
  - label: A
    text: $a=1,b=1$
    figures: []
  - label: B
    text: $a=1,b=-1$
    figures: []
  - label: C
    text: $a=-1,b=1$
    figures: []
  - label: D
    text: $a=-1,b=-1$
    figures: []
- number: 7
  section: choice
  points: 5
  stem:
    text: |-
      设矩阵 $A=\begin{pmatrix}1&1&1&1\\a&b&c&d\\a^2&b^2&c^2&d^2\end{pmatrix}$，其中 $a,b,c,d$ 互不相同，$M_i(i=1,2,3,4)$ 为 $A$ 删掉第 $i$ 列后所得 3 阶矩阵的行列式，$b=(1,a,a^2)^{\mathrm T}$。若 $\xi_1,\xi_2$ 是 $Ax=b$ 的两个不同的解，则 $\ExamSelection$。
  choices:
  - label: A
    text: |-
      存在非零常数 $k$，使得 $\xi_1-\xi_2=k(M_1,M_2,M_3,M_4)^{\mathrm T}$
    figures: []
  - label: B
    text: |-
      存在非零常数 $k$，使得 $\xi_1-\xi_2=k(-M_1,M_2,-M_3,M_4)^{\mathrm T}$
    figures: []
  - label: C
    text: |-
      存在非零常数 $k$，使得 $\xi_1+\xi_2=k(-M_1,-M_2,M_3,M_4)^{\mathrm T}+(2,0,0,0)^{\mathrm T}$
    figures: []
  - label: D
    text: |-
      存在非零常数 $k$，使得 $\xi_1+\xi_2=k(-M_1,M_2,-M_3,M_4)^{\mathrm T}+(1,0,0,0)^{\mathrm T}$
    figures: []
- number: 8
  section: choice
  points: 5
  stem:
    text: |-
      将 S,T,A,T,I,S,T,I,C,S 等十个字母随机地排成一行，记恰好排成 $\mathrm{STATISTICS}$ 的概率为 $p_1$，从这十个字母中随机抽取六个排成一行，记恰好排成 $\mathrm{STATIC}$ 的概率为 $p_2$，则 $\dfrac{p_1}{p_2}$ 等于 $\ExamSelection$。
  choices:
  - label: A
    text: |-
      $\dfrac{1}{3}$
    figures: []
  - label: B
    text: |-
      $\dfrac{1}{6}$
    figures: []
  - label: C
    text: |-
      $\dfrac{1}{12}$
    figures: []
  - label: D
    text: |-
      $\dfrac{1}{24}$
    figures: []
- number: 9
  section: choice
  points: 5
  stem:
    text: |-
      设总体 $X\sim N(0,\sigma^2)$，$X_1,X_2,\cdots,X_n(n\geq 2)$ 为来自总体 $X$ 的简单随机样本，$\varepsilon_\alpha$ 与 $\delta_\alpha$ 满足 $\alpha=P\left\{|X|\geq\varepsilon_\alpha\right\}=P\left\{\left|\dfrac{1}{n}\sum_{i=1}^{n}X_i\right|\geq\delta_\alpha\right\}$，则 $\ExamSelection$。
  choices:
  - label: A
    text: |-
      $\varepsilon_\alpha=\sqrt{n}\delta_\alpha$
    figures: []
  - label: B
    text: |-
      $\sqrt{n}\varepsilon_\alpha=\delta_\alpha$
    figures: []
  - label: C
    text: |-
      $\varepsilon_\alpha=n\delta_\alpha$
    figures: []
  - label: D
    text: |-
      $n\varepsilon_\alpha=\delta_\alpha$
    figures: []
- number: 10
  section: choice
  points: 5
  stem:
    text: |-
      设总体 $X$ 的分布律为 $P\left\{X=(-1)^n n+p\right\}=\dfrac{1}{n(n+1)}$，$n=1,2,\cdots$，其中 $p$ 为未知参数，$X_1,X_2,\cdots,X_n$ 为来自总体 $X$ 的简单随机样本，$\overline{X}$ 为样本均值，则 $p$ 的矩估计量 $\hat{p}=$ $\ExamSelection$。
  choices:
  - label: A
    text: |-
      $\overline{X}-\ln 2$
    figures: []
  - label: B
    text: |-
      $\overline{X}+\ln 2$
    figures: []
  - label: C
    text: |-
      $\overline{X}-\ln 2+1$
    figures: []
  - label: D
    text: |-
      $\overline{X}+\ln 2-1$
    figures: []
- number: 11
  section: fill
  points: 5
  stem:
    text: |-
      设函数 $y=y(x)$ 由 $\begin{cases}x=\int_0^t f(u^2)\,\mathrm{d}u,\\y=[f(t)]^2\end{cases}$ 确定，其中 $f(t)$ 具有二阶导数，满足 $f(1)=f'(1)=f''(1)\ne 0$，则 $\left.\dfrac{\mathrm{d}^2y}{\mathrm{d}x^2}\right|_{t=1}=$ \ExamBlank。
