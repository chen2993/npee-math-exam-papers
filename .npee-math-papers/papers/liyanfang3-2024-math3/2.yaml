  - label: A
    text: |-
      $\left(-\dfrac{1}{e},\dfrac{1}{e}\right)$
    figures: []
  - label: B
    text: $(-1,1)$
    figures: []
  - label: C
    text: $(-e,e)$
    figures: []
  - label: D
    text: |-
      $(-\infty,+\infty)$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
