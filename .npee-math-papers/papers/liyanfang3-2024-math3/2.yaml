- number: 15
  section: fill
  points: 5
  stem:
    text: |-
      设 $\boldsymbol{\alpha}=(1,2,1)^{\mathrm T},\boldsymbol{\beta}=(t,0,1)^{\mathrm T}$，$E$ 为 3 阶单位矩阵，则 $f(x_1,x_2,x_3)=x^{\mathrm T}(E+\boldsymbol{\alpha}\boldsymbol{\alpha}^{\mathrm T}+\boldsymbol{\alpha}\boldsymbol{\beta}^{\mathrm T})x$ 为正定二次型且仅当 $t$ 的取值范围是 \ExamBlank。
