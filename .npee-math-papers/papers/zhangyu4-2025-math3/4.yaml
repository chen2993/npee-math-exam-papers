  stem:
    text: |-
      求曲线 $y=\dfrac{1+\int_0^{\dfrac{1}{x}}e^{t^2}\,\mathrm{d}t}{1-e^{\dfrac{1}{x}}}$（$x>0$）的斜渐近线。
- number: 18
  section: solution
  points: 12
  stem:
    text: |-
      过点 $(0,1)$ 的曲线 $y=f(x)$ 满足 $yy'+y^2=\cos x$，求 $y=f(x)$ 与 $x=0$，$x=\dfrac{\pi}{2}$ 及 $x$ 轴所围成的平面有界区域 $D$ 绕 $x$ 轴旋转一周所得旋转体的体积。
- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(x)=\sum_{n=0}^{\infty}a_nx^n$，且满足 $\int_x^{2x}f(t)\,\mathrm{d}t=e^x-1$，计算 $\lim_{n\to\infty}(n!a_n)^{\dfrac{1}{n}}$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设函数 $f(x,y)$ 具有二阶连续偏导数，$D=\{(x,y)\mid0\leq x\leq1,0\leq y\leq1\}$，$f(x,1)=f(1,y)=a$，$\iint_Df(x,y)\,\mathrm{d}x\mathrm{d}y=b$，其中 $a,b$ 为常数，计算 $\iint_Dxyf_{yx}^{\prime\prime}(x,y)\,\mathrm{d}x\mathrm{d}y$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设 $f(\mathbf x)=(\boldsymbol\alpha^{\mathrm T}\mathbf x)^2+2(\boldsymbol\beta^{\mathrm T}\mathbf x)^2$，其中 $\boldsymbol\alpha=\left(\dfrac{1}{\sqrt2},0,-\dfrac{1}{\sqrt2}\right)^{\mathrm T}$，$\boldsymbol\beta=\left(\dfrac{1}{\sqrt3},\dfrac{1}{\sqrt3},\dfrac{1}{\sqrt3}\right)^{\mathrm T}$，$\mathbf x=(x_1,x_2,x_3)^{\mathrm T}$。
  subparts:
  - text: |-
      求正交矩阵 $\mathbf Q$，将 $f(\mathbf x)$ 化为标准形；
  - text: |-
      求一个实对称矩阵 $\mathbf P$，使 $f(\mathbf x)=(\mathbf P\mathbf x)^{\mathrm T}(\mathbf P\mathbf x)$。
- number: 22
  section: solution
  points: 12
  stem:
    text: 在区间 $(0,2)$ 上随机取一点，将该区间分成两段，较短一段的长度记为 $X$，令 $Y=|3X-1|$，求：
  subparts:
  - text: $X$ 的概率密度；
  - text: $E(Y)$。
