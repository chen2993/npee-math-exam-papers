  - label: B
    text: |-
      $\sum_{n=1}^{\infty}c_n$ 发散
    figures: []
  - label: C
    text: |-
      $\sum_{n=1}^{\infty}a_nc_n$ 收敛
    figures: []
  - label: D
    text: |-
