    text: $a>3$
    figures: []
- number: 2
  section: choice
  points: 5
  stem:
    text: |-
      设函数 $u(x,y)=f(x+y)+f(x-y)+\int_{x-y}^{x+y}g(t)\,\mathrm{d}t$，其中函数 $f,g$ 具有二阶导数，则\ExamSelection。
  choices:
  - label: A
    text: |-
      $\dfrac{\partial^2u}{\partial x^2}=-\dfrac{\partial^2u}{\partial y^2}$
    figures: []
  - label: B
    text: |-
      $\dfrac{\partial^2u}{\partial x^2}=\dfrac{\partial^2u}{\partial y^2}$
    figures: []
  - label: C
    text: |-
      $\dfrac{\partial^2u}{\partial x\partial y}=\dfrac{\partial^2u}{\partial y^2}$
    figures: []
  - label: D
    text: |-
      $\dfrac{\partial^2u}{\partial x\partial y}=\dfrac{\partial^2u}{\partial x^2}$
    figures: []
- number: 3
  section: choice
  points: 5
  stem:
    text: |-
      设级数 $\sum_{n=1}^{\infty}a_n,\sum_{n=1}^{\infty}b_n$ 均收敛，$a_n\leq c_n\leq b_n$，$n=1,2,\cdots$，则\ExamSelection。
