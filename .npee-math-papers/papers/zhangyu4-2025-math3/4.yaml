  points: 5
  stem:
    text: |-
      设随机变量 $X$ 与 $Y$ 相互独立，且 $X$ 服从标准正态分布 $N(0,1)$，$Y$ 的概率分布为 $P\{Y=0\}=P\{Y=1\}=\dfrac{1}{2}$，记 $F_Z(z)$ 为随机变量 $Z=XY$ 的分布函数，则 $F_Z(z)$\ExamSelection。
