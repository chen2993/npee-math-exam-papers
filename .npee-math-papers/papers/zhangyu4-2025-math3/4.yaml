    text: |-
      已知函数 $f(x)=\dfrac{\int_0^x\ln(1+t^2)\,\mathrm{d}t}{x^\alpha}$ 在 $(0,+\infty)$ 上有界，则 $\alpha$ 的取值范围是\ExamSelection。
