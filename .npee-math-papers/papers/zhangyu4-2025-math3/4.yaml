- number: 9
  section: choice
  points: 5
  stem:
    text: |-
      设总体 $X$ 和 $Y$ 相互独立，且都服从正态分布 $N(0,2)$，$X_1,X_2,\cdots,X_n$ 和 $Y_1,Y_2,\cdots,Y_n$ 分别是来自总体 $X$ 和 $Y$ 且容量都为 $n$（$n\geq2$）的两个简单随机样本，样本均值、样本方差分别为 $\overline X,S_X^2$ 和 $\overline Y,S_Y^2$，则下列选项中不正确的是\ExamSelection。
