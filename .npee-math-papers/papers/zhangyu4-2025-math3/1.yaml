      当 $x\to 0$ 时，$\alpha(x),\beta(x)$ 是非零无穷小量，则下列命题：\n①若 $\alpha(x)\sim\beta(x)$，则 $\lim_{x\to0}[1+\alpha(x)]^{\dfrac{1}{\beta(x)}}=e$；\n②若 $\lim_{x\to0}[1+\alpha(x)]^{\dfrac{1}{\beta(x)}}=e$，则 $\alpha(x)\sim\beta(x)$；\n③若 $\alpha(x)-\beta(x)=o(\alpha(x))$，则 $\lim_{x\to0}\dfrac{1-\cos\alpha(x)}{\alpha(x)\beta(x)}=\dfrac{1}{2}$；\n④若 $\lim_{x\to0}\dfrac{1-\cos\alpha(x)}{\beta^2(x)}=\dfrac{1}{2}$，则 $\alpha(x)-\beta(x)=o(\beta(x))$。\n所有有真命题的序号为\ExamSelection
