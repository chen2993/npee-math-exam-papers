      设 \(\Sigma\) 为曲面 \(x^2+y^2+z^2=2\ (z\ge0)\) 的上侧，连续函数 \(f(x,y)\) 满足\( f(x,y)=x^2+y^2+x\iint_{\Sigma}xy^2\, \mathrm dy\, \mathrm dz+x^2y\, \mathrm dz\, \mathrm dx-\left[(x+3y)^2-z^2+zf(x,y)\right]\, \mathrm dx\, \mathrm dy, \)求 \(f(x,y)\)。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      方阵 \( A=\begin{pmatrix}1&0&a\\0&1-a&-2\\-1&0&2\end{pmatrix}\) 的特征值为实数，\(x=(x_1,x_2,x_3)^T\)。 (1) 若 \(A\) 可对角化，求参数 \(a\) 的取值范围。 (2) 当 \(a<0\) 且 \(A\) 不可对角化时，判断二次型 \(f(x_1,x_2,x_3)=x^TAx\) 的正定性。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设有三个编号分别为 \(1,2,3\) 的盒子和三只球，现将每个球随机地放入三个盒子，记 \(X\) 为所有非空盒子的最小号码。 (1) 求 \(X\) 的分布律； (2) 若当 \(X=i\) 时，随机变量 \(Y\) 在 \([0,i]\) 上服从均匀分布，\(i=1,2,3\)，令 \( Z=\dfrac{Y}{X}\)，证明 \(Z\sim U[0,1]\)。
