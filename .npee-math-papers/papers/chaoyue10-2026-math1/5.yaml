  stem:
    text: |-
      (1) 设 \(f(x),g(x)\) 均是 \([0,a]\) 上的连续函数，且对任意 \(x\in[0,a]\)，恒有 \(f(x)=f(a-x)\)， \(g(x)+g(a-x)=k\)，其中 \(k\) 为常数。证明 \( \int_0^a f(x)g(x)\, \mathrm dx=\dfrac{k}{2}\int_0^a f(x)\, \mathrm dx\)。 (2) 计算 \( \int_0^{\dfrac{\pi}{4}}\sin^4 4x\cdot\ln(1+\tan x)\, \mathrm dx\)。
- number: 19
  section: solution
