- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设某电子元件的使用寿命 \(T\) 的分布函数 \(F(t)\) 满足微分方程 \( \dfrac{F'(t)}{1-F(t)}=\dfrac{t^2}{\theta}\)，其中 \(t\ge0\)， \(F(0)=0\)， \(\theta\) 为大于 \(0\) 的未知参数。 任取 \(n\) 个此电子元件做寿命试验，测得它们的寿命分别为 \(T_1,T_2, \cdots,T_n\)。 (1) 求 \(F(t)\)； (2) 求 \(\theta\) 的最大似然估计量 \(\widehat\theta\)，并求 \(E\widehat\theta\)。
