- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设总体 $X$ 的概率密度为 $f(x)=\begin{cases}\alpha^{-\beta x}\beta\ln\alpha,&x>0,\\0,&x\leq 0,\end{cases}$ 其中参数 $\alpha>1$，$\beta>0$，$X_1,X_2,\cdots,X_n$ 为来自总体 $X$ 的简单随机样本。
  subparts:
  - text: |-
      当 $\beta=1$ 时，求 $\alpha$ 的矩估计量；
  - text: |-
      当 $\alpha=2$ 时，求 $\beta$ 的最大似然估计量。
