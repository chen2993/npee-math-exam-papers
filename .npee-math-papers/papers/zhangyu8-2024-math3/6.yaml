- number: 19
  section: solution
  points: 12
  stem:
    text: |-
      设平面区域 $D=\{(x,y)\mid 2x^2+y^2\leq 2\sqrt{x^2+y^2},y\geq x\geq 0\}$，若 $\iint_D\dfrac{f(x,y)}{\sqrt{1-x^2}}\,\mathrm{d}\sigma=a>0$，$f(x,y)$ 是 $D$ 上的连续函数。
  subparts:
  - text: |-
      计算 $\iint_D\dfrac{1}{\sqrt{1-x^2}}\,\mathrm{d}\sigma$；
  - text: |-
      证明：存在 $(\xi,\eta)\in D$，使得 $|f(\xi,\eta)|\geq\dfrac{\sqrt{2}}{\pi}a$。
- number: 20
  section: solution
  points: 12
  stem:
    text: |-
      设 $a_n=\int_0^{+\infty}e^{-n^2x^2}\,\mathrm{d}x$，$n=1,2,\cdots$，求 $\sum_{n=1}^{\infty}(-1)^na_na_{n+2}$。
- number: 21
  section: solution
  points: 12
  stem:
    text: |-
      设实矩阵 $A=\begin{pmatrix}4&2\\a&-3\end{pmatrix}$，$B=\begin{pmatrix}2&2\\2&b\end{pmatrix}$，其中 $b$ 为正整数。
  subparts:
  - text: |-
      若存在可逆矩阵 $P$，使得 $P^{\mathrm{T}}AP=B$，求出 $a,b$ 的值与矩阵 $P$；
  - text: |-
      对于（1）中的 $a,b$，是否存在正交矩阵 $Q$，使得 $Q^{\mathrm{T}}AQ=B$，若存在，求出 $Q$，若不存在，说明理由。
- number: 22
  section: solution
  points: 12
  stem:
    text: |-
      设某元件的使用寿命 $T$ 的分布函数 $F(t)$ 满足微分方程 $F'(t)+\dfrac{2t}{\theta^2}[F(t)-1]=0$，$t\geq 0$，$\theta$ 为大于 0 的常数，$F(0)=0$，且该元件性能 $Q(\theta)=\theta^2\left(\dfrac{\ln\theta}{2}-\dfrac{3}{4}\right)+\theta$。任取 $n$ 个此种元件做寿命试验，测得值分别为 $t_1,t_2,\cdots,t_n$。
  subparts:
  - text: |-
      求 $\theta$ 的最大似然估计值 $\hat{\theta}$；
  - text: |-
      求该元件性能 $Q$ 的最大似然估计值 $\hat{Q}$。
