- number: 17
  section: solution
  points: 10
  stem:
    text: |-
      对于任意二阶连续可导的函数 $f(u)$，$z=\int_0^y e^{t^2}\,\mathrm{d}t+f(x+ay)$ 均是方程 $\dfrac{\partial^2z}{\partial x\partial y}+\dfrac{\partial^2z}{\partial y^2}=2ye^{y^2}$ 的解，求 $a$ 的值。
- number: 18
